<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B0A18">
<title>Starlyn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600&display=swap">
<style>
:root{
  color-scheme:dark;
  --ground:#07060F;
  --bg:#0B0A18;--bg-elev:#120F22;--surface:#17142A;--surface-2:#211D3A;--border:#322C52;
  --t1:#F5F2EA;--t2:#ADA5C7;--t3:#7A7296;
  --accent:#E9C26B;--accent-dim:#E9C26B29;--btn-text:#221A08;
  --love:#E9A0BE;--career:#86AAEB;--family:#E9C26B;--health:#7FD1A8;--negative:#E8907F;--positive:#7FD1A8;
  --serif:"Fraunces",Georgia,"Times New Roman",serif;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--t1);font:15px/1.45 var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{position:relative;width:100%;max-width:480px;height:100vh;height:100dvh;margin:0 auto;overflow:hidden;isolation:isolate;background:radial-gradient(ellipse 120% 60% at 50% 0%,#141233 0%,var(--bg) 60%)}
@media (min-width:520px){.app{border-inline:1px solid #1E1A38}}
#stars{position:absolute;inset:0;width:100%;height:100%;z-index:0;display:block}
.stage3d{position:absolute;inset:0;z-index:1;perspective:1100px;perspective-origin:50% 45%;overflow:hidden}
.view{position:absolute;inset:0;padding-top:calc(env(safe-area-inset-top,0px) + 10px);display:flex;flex-direction:column;backface-visibility:hidden;-webkit-backface-visibility:hidden;transform-origin:50% 50%;will-change:transform}
.view::after{content:"";position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;z-index:60}

/* simple screen change */
.view.out{animation:vout .22s ease forwards;pointer-events:none}
.view.in{animation:vin .38s ease both}
@keyframes vout{to{opacity:0}}
@keyframes vin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
/* 3D chart wheel */
.orb{position:relative;perspective:900px;perspective-origin:50% 38%;margin:0 auto;max-width:100%}
.oscene{position:absolute;inset:0;transform-style:preserve-3d;will-change:transform}
.oscene>*{position:absolute;left:50%;top:50%}
.ol{border-radius:50%}
.ol.disc{background:radial-gradient(circle,#2A2350d9 0%,#17142Ab3 58%,#0B0A1880 71%,transparent 72%);box-shadow:inset 0 0 50px #6B4FD833}
.ol.ring{border:1px solid var(--border)}
.ol.ring.outer{border-color:#4A4275;box-shadow:0 0 28px #6B4FD82e}
.ol.ring.faint{border:1px dashed #4A427599}
.ol.ring.gold{border:1.5px solid var(--accent);box-shadow:0 0 20px #E9C26B66,inset 0 0 20px #E9C26B33}
.ol.ring.gold2{border:1px solid var(--accent)}
.ofloor{transform:translate(-50%,-50%) translateZ(-38px);border-radius:50%;background:radial-gradient(circle,#000000a6,transparent 64%);filter:blur(6px)}
.oticks,.omotes{width:0;height:0;transform-style:preserve-3d}
.oticks i{position:absolute;left:0;top:0;width:1px;background:#5A5288}
.osh{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle,#000000b3,transparent 70%)}
.ost{width:1.5px;transform-origin:50% 100%;background:linear-gradient(to top,#ADA5C700,#ADA5C780)}
.ost.beam{width:2px;background:linear-gradient(to top,#E9C26B00,#E9C26Bdd)}
.op{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#3A3360,#1B1733);border:1px solid #4A4275;color:var(--t3);box-shadow:0 6px 14px #0009}
.op.lit{border-color:var(--accent);color:var(--accent);background:radial-gradient(circle at 35% 30%,#51462E,#221B30);box-shadow:0 0 18px #E9C26B70,0 6px 14px #0009}
.op .dot{width:6px;height:6px;border-radius:50%;border:1.5px solid currentColor}
.op span{display:grid;place-items:center}
.ocore{filter:drop-shadow(0 0 14px #E9C26Bcc)}
.ocore svg{display:block;animation:pulse 2.4s ease-in-out infinite}
.omotes b{position:absolute;left:-1.5px;top:-1.5px;width:3px;height:3px;border-radius:50%;background:#FFE7A8;box-shadow:0 0 6px #E9C26B;animation:mote 14s linear infinite}
@keyframes mote{from{transform:rotate(var(--a)) translateY(var(--d))}to{transform:rotate(calc(var(--a) + 360deg)) translateY(var(--d))}}
/* constellation */
.const{width:280px;height:210px;max-width:100%;overflow:visible}
.const path{fill:none;stroke:var(--accent);stroke-width:1.2;stroke-linecap:round;opacity:.75;stroke-dasharray:1;stroke-dashoffset:1;animation:cdraw 2.4s ease .6s forwards;filter:drop-shadow(0 0 4px #E9C26B90)}
.const circle{fill:#FFF6DC;transform-box:fill-box;transform-origin:center;opacity:0;animation:starpop .6s ease forwards,twinkle 3s ease-in-out infinite;filter:drop-shadow(0 0 6px #E9C26B)}
@keyframes cdraw{to{stroke-dashoffset:0}}
@keyframes starpop{from{opacity:0;transform:scale(0)}to{opacity:1;transform:scale(1)}}
@keyframes twinkle{50%{r:1.6}}
.constwrap{perspective:700px;display:grid;place-items:center}
.constwrap .const{animation:float 9s ease-in-out infinite}
/* tarot flip */
.card3d{width:46px;height:66px;perspective:500px;flex:none}
.flip{position:relative;display:block;width:100%;height:100%;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.3,1.3,.5,1)}
.flip.on{transform:rotateY(180deg)}
.flip .card{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.flip .card.rev{transform:rotateY(180deg)}
.nav{height:44px;flex:none;display:flex;align-items:center;gap:12px;padding:0 16px;position:relative;z-index:3}
.iconbtn{width:36px;height:36px;border-radius:50%;border:none;background:transparent;display:grid;place-items:center;color:var(--t2)}
.iconbtn:hover{background:var(--surface)}
.prog{flex:1;height:4px;border-radius:2px;background:var(--surface-2);overflow:hidden}
.prog span{display:block;height:100%;background:var(--accent);border-radius:2px;transition:width .35s ease}
.navspacer{width:36px}

.scr{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 20px 12px;display:flex;flex-direction:column;gap:20px;position:relative}
.scr.center{justify-content:center}
.foot{flex:none;padding:12px 20px max(24px,calc(env(safe-area-inset-bottom,0px) + 14px));display:flex;flex-direction:column;gap:12px;position:relative;z-index:2}
.foot .note{font-size:12px;color:var(--t3);text-align:center;text-wrap:balance}

.sky{position:absolute;inset:0 0 auto 0;height:340px;z-index:0;pointer-events:none;background:radial-gradient(ellipse 80% 70% at 50% 0%,#2A3A6A55 0%,#2A1F5A33 45%,transparent 100%)}
.btn:not([disabled]):not(.ghost):not(.light){position:relative;overflow:hidden;box-shadow:0 8px 28px -10px #E9C26B99}
.btn:not([disabled]):not(.ghost):not(.light)::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:0;background:linear-gradient(100deg,transparent,#ffffff66,transparent);transform:translateX(-150%) skewX(-20deg);animation:sheen 4.5s ease-in-out 1.2s infinite}
@keyframes sheen{0%{transform:translateX(-150%) skewX(-20deg)}28%,100%{transform:translateX(320%) skewX(-20deg)}}
.z{position:relative;z-index:1}

.display{font:600 32px/1.12 var(--serif);letter-spacing:-.01em;margin:0;text-wrap:balance}
.display.xl{font-size:38px}
.lead{color:var(--t2);margin:0;font-size:15px;text-wrap:pretty}
.eyebrow{font:600 12px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.badge{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:var(--accent-dim);color:var(--accent);font:500 13px/1 var(--sans)}

.btn{height:54px;border-radius:999px;border:none;background:var(--accent);color:var(--btn-text);font:600 16px/1 var(--sans);width:100%;display:flex;align-items:center;justify-content:center;gap:10px;transition:transform .12s ease,opacity .2s}
.btn:active{transform:scale(.98)}
.btn[disabled]{background:var(--surface-2);color:var(--t3);cursor:not-allowed}
.btn.ghost{background:var(--surface);color:var(--t1);border:1px solid var(--border)}
.btn.light{background:var(--t1);color:#0B0A18}
.link{background:none;border:none;color:var(--t2);font-size:14px;padding:6px;text-align:center;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--border)}
.link:hover{color:var(--t1)}

.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:18px;background:var(--surface);border:1px solid var(--border);text-align:left;width:100%;transition:border-color .15s,background .15s}
.opt:hover{border-color:#4a4275}
.opt .well{width:38px;height:38px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;flex:none}
.opt .lbl{flex:1;font-weight:500;font-size:16px}
.opt .chk{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--border);display:grid;place-items:center;flex:none;color:var(--btn-text)}
.opt.on{border-color:var(--accent);background:linear-gradient(0deg,var(--accent-dim),var(--accent-dim)),var(--surface)}
.opt.on .chk{background:var(--accent);border-color:var(--accent)}
.otherin{margin-top:-2px}

.field{display:flex;flex-direction:column;gap:7px}
.field label{font:500 13px/1 var(--sans);color:var(--t2)}
.box{height:54px;border-radius:14px;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;padding:0 14px;gap:10px;color:var(--t3)}
.box:focus-within{border-color:var(--accent)}
.box input,.box select{flex:1;min-width:0;height:100%;background:transparent;border:none;outline:none;color:var(--t1);font:400 16px var(--sans)}
.box select{appearance:none;cursor:pointer}
.box select option{background:var(--surface);color:var(--t1)}
.row3{display:grid;grid-template-columns:1.4fr 1fr 1.2fr;gap:8px}
.err{font-size:13px;color:var(--negative)}
.hint{font-size:13px;color:var(--t3)}
.results{border-radius:14px;background:var(--surface);border:1px solid var(--border);overflow:hidden}
.results button{display:flex;gap:10px;align-items:center;width:100%;padding:12px 14px;background:none;border:none;border-top:1px solid var(--border);text-align:left;color:var(--t1)}
.results button:first-child{border-top:none}
.results button:hover{background:var(--surface-2)}
.results small{color:var(--t3)}

.wheelwrap{display:grid;place-items:center;margin-top:4px}
.wheel{width:260px;height:260px;max-width:100%}
.wheel .ring{fill:none;stroke:var(--border);stroke-width:1}
.wheel .ring.gold{stroke:var(--accent);stroke-width:1.5}
.wheel .pl circle{fill:var(--surface-2);stroke:var(--border)}
.wheel .pl.lit circle{stroke:var(--accent);fill:#2A2338}
.wheel .pl path,.wheel .pl circle.g{stroke:var(--t3)}
.wheel .pl.lit path,.wheel .pl.lit circle.g{stroke:var(--accent)}
.wheel.dim .pl:not(.lit){opacity:.35}
.wheel.draw .ring{stroke-dasharray:1000;stroke-dashoffset:1000;animation:draw 2.2s ease forwards}
.wheel.draw .ring:nth-of-type(2){animation-delay:.3s}
.wheel.draw .ring:nth-of-type(3){animation-delay:.6s}
.wheel.draw .pl{opacity:0;animation:pop .5s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
.wheel .pl{transform-box:fill-box;transform-origin:center}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.55}}

.place{display:flex;gap:14px;align-items:center;padding:14px;border-radius:18px;background:var(--surface);border:1px solid var(--border)}
.place .well{width:40px;height:40px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;color:var(--accent);flex:none}
.place b{display:block;font-weight:600;font-size:16px}
.place span{color:var(--t2);font-size:13px}
.place.muted b{color:var(--t2)}
.stack{display:flex;flex-direction:column;gap:10px}

.steps{display:flex;flex-direction:column;gap:14px}
.step .top{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--t2);margin-bottom:7px;gap:10px}
.step .top .pct{font-variant-numeric:tabular-nums;color:var(--t3);display:flex;gap:6px;align-items:center}
.step.done .top{color:var(--t1)}
.step.done .pct{color:var(--accent)}
.bar{height:4px;border-radius:2px;background:var(--surface-2);overflow:hidden}
.bar span{display:block;height:100%;background:var(--accent);width:0}

.promise{display:flex;gap:14px;align-items:center;padding:14px 0;border-top:1px solid var(--border)}
.promise:first-child{border-top:none}
.promise .well{width:36px;height:36px;border-radius:50%;background:var(--accent-dim);color:var(--accent);display:grid;place-items:center;flex:none}
.bigwell{width:84px;height:84px;border-radius:50%;background:radial-gradient(circle,#E9C26B33,transparent 70%),var(--surface);border:1px solid var(--border);display:grid;place-items:center;color:var(--accent);align-self:center}

.dim{position:absolute;inset:0;background:#05040CCC;z-index:4}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:5;background:var(--bg-elev);border-radius:28px 28px 0 0;border-top:1px solid var(--border);padding:10px 20px 30px;display:flex;flex-direction:column;gap:16px;animation:up .35s cubic-bezier(.2,.8,.2,1)}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--border);align-self:center}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.push{display:flex;gap:10px;padding:12px;border-radius:18px;background:#ffffff14;backdrop-filter:blur(10px);border:1px solid #ffffff1a}
.push .app{width:34px;height:34px;border-radius:9px;background:var(--bg);border:1px solid var(--border);display:grid;place-items:center;color:var(--accent);flex:none}
.push small{color:var(--t2);display:block;font-size:12px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;background:var(--surface-2);border:1px solid var(--border);font-weight:500}

.avatars{display:flex;justify-content:center;margin:6px 0}
.av{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;font:600 24px var(--serif);border:2px solid var(--bg)}
.av.me{background:#3A2F55;color:var(--t1)}
.av.them{background:var(--surface-2);color:var(--t3);margin-left:-14px;border-style:dashed;border-color:var(--border)}
.av.them.set{background:#223A52;color:var(--t1);border-style:solid;border-color:var(--bg)}

.score{display:flex;align-items:baseline;gap:4px;justify-content:center}
.score b{font:600 64px/1 var(--serif);color:var(--accent);font-variant-numeric:tabular-nums}
.score span{color:var(--t3);font-size:18px}
.area{padding:14px;border-radius:18px;background:var(--surface);border:1px solid var(--border)}
.area h4{margin:0 0 2px;font-size:15px;font-weight:600}
.area .sub{font-size:12px;color:var(--t3);margin-bottom:8px}
.area p{margin:0;color:var(--t2);font-size:14px}
.locked{position:relative;overflow:hidden}
.locked .blur{filter:blur(5px);opacity:.6;user-select:none}
.locked .lk{position:absolute;inset:0;display:grid;place-items:center;color:var(--accent)}
.areas{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.areas .area{padding:12px}
.periods{display:flex;background:var(--surface);border-radius:999px;padding:4px;border:1px solid var(--border)}
.periods span{flex:1;text-align:center;padding:8px 0;border-radius:999px;font-size:13px;color:var(--t3);display:flex;align-items:center;justify-content:center;gap:4px}
.periods span.on{background:var(--surface-2);color:var(--t1)}

.pwhero{height:150px;border-radius:22px;margin-top:4px;flex:none;background:radial-gradient(ellipse 60% 80% at 70% 30%,#E9C26B40,transparent 60%),radial-gradient(1px 1px at 20% 30%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 40% 60%,#fffa 50%,transparent 51%),radial-gradient(1.5px 1.5px at 80% 20%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 60% 80%,#fff8 50%,transparent 51%),linear-gradient(160deg,#2B2656,#141230 60%,#0E1A2E);position:relative;overflow:hidden}
.pwhero::after{content:"";position:absolute;left:-10%;right:-10%;bottom:-40px;height:90px;border-radius:50%;background:#0B0A18;opacity:.85}
.checks{display:flex;flex-direction:column;gap:9px;font-size:14px;color:var(--t1)}
.checks div{display:flex;gap:10px;align-items:flex-start}
.checks svg{color:var(--accent);flex:none;margin-top:2px}
.plan{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:18px;border:1px solid var(--border);background:var(--surface);text-align:left;width:100%}
.plan .radio{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--border);display:grid;place-items:center;flex:none;color:var(--btn-text)}
.plan.on{border-color:var(--accent);background:linear-gradient(0deg,var(--accent-dim),var(--accent-dim)),var(--surface)}
.plan.on .radio{background:var(--accent);border-color:var(--accent)}
.plan .pn{font-weight:600;display:flex;gap:8px;align-items:center}
.plan .pp{font-size:13px;color:var(--t2);font-variant-numeric:tabular-nums}
.save{font:600 11px/1 var(--sans);letter-spacing:.04em;background:var(--accent);color:var(--btn-text);padding:4px 7px;border-radius:6px}
.legal{display:flex;justify-content:center;gap:14px;font-size:12px;color:var(--t3)}
.closex{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);left:16px;z-index:3;width:34px;height:34px;border-radius:50%;background:#0B0A18AA;border:1px solid var(--border);display:grid;place-items:center;color:var(--t2)}

.bigchips{display:flex;gap:6px;flex-wrap:wrap}
.bigchips span{font-size:12px;padding:5px 9px;border-radius:999px;background:var(--surface);border:1px solid var(--border);color:var(--t2);display:inline-flex;gap:5px;align-items:center}
.glance{padding:18px;border-radius:22px;background:linear-gradient(180deg,#1C1834,var(--surface));border:1px solid var(--border);display:flex;flex-direction:column;gap:12px}
.glance q{font:600 21px/1.3 var(--serif);quotes:none;text-wrap:pretty}
.dd{display:grid;grid-template-columns:1fr 1fr;gap:12px;font-size:13px}
.dd h5{margin:0 0 6px;font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.dd ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:5px;color:var(--t2)}
.scores{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.sc{padding:12px 6px;border-radius:16px;background:var(--surface);border:1px solid var(--border);text-align:center}
.sc b{display:block;font:600 22px/1 var(--serif);font-variant-numeric:tabular-nums}
.sc span{font-size:12px;color:var(--t2)}
.sc.first{border-color:#4a4275}
.coach{font-size:12px;color:var(--btn-text);background:var(--accent);padding:8px 10px;border-radius:10px;position:relative}
.coach::before{content:"";position:absolute;top:-5px;left:24px;width:10px;height:10px;background:var(--accent);transform:rotate(45deg)}
.tarot{display:flex;gap:14px;align-items:center;padding:12px;border-radius:18px;background:var(--surface);border:1px solid var(--border);width:100%;text-align:left}
.card{width:46px;height:66px;border-radius:8px;flex:none;background:repeating-linear-gradient(45deg,#2A2350 0 6px,#221D42 6px 12px);border:1px solid var(--accent);display:grid;place-items:center;color:var(--accent)}
.card.rev{background:linear-gradient(180deg,#F5F2EA,#E3D9C2);color:#221A08;font:600 11px/1.1 var(--serif);text-align:center;padding:4px}
.tabbar{flex:none;min-height:64px;display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--border);background:var(--bg-elev);padding-bottom:max(12px,env(safe-area-inset-bottom,0px))}
.tabbar button{background:none;border:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:var(--t3)}
.tabbar button.on{color:var(--accent)}
.bubble{padding:12px 14px;border-radius:18px;max-width:88%;font-size:14px}
.bubble.q{align-self:flex-end;background:var(--surface-2);border-bottom-right-radius:6px}
.bubble.a{align-self:flex-start;background:var(--surface);border:1px solid var(--border);border-bottom-left-radius:6px;color:var(--t2)}
.bubble.a b{color:var(--t1);font-weight:500}
.typing{display:inline-flex;gap:4px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--t3);animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{50%{opacity:.3}}
.sugg{display:flex;flex-wrap:wrap;gap:8px}
.sugg button{padding:9px 13px;border-radius:999px;background:var(--surface);border:1px solid var(--border);font-size:13px;text-align:left}
.sugg button:hover{border-color:var(--accent)}
.composer{display:flex;gap:8px;align-items:center}
.composer .box{flex:1;height:48px}
.send{width:48px;height:48px;border-radius:50%;border:none;background:var(--accent);color:var(--btn-text);display:grid;place-items:center;flex:none}
.send[disabled]{background:var(--surface-2);color:var(--t3)}
.packs{display:flex;flex-direction:column;gap:8px}
.toast{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 14px);transform:translateX(-50%);z-index:9;background:var(--t1);color:#0B0A18;font-size:13px;font-weight:500;padding:9px 14px;border-radius:999px;white-space:nowrap;animation:fade 2.6s ease forwards}
@keyframes fade{0%{opacity:0;transform:translate(-50%,-6px)}10%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
.fadein{animation:fi .35s ease}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}
}

function wheel({lit='all',draw=false,dim=false,size=260}={}){

function runLoading(){
  let row=0,pct=0;
  timer=setInterval(()=>{
    pct+=3;const el=document.getElementById('st'+row);if(!el){clearInterval(timer);return}
    el.querySelector('.bar span').style.width=Math.min(pct,100)+'%';
    el.querySelector('.pct span').textContent=Math.min(pct,100)+'%';
    if(pct>=100){el.classList.add('done');el.querySelector('.pct').innerHTML=`${ic('check',14,'currentColor',2.5)}<span>100%</span>`;row++;pct=0;if(row>3){clearInterval(timer);{const ob=cur().querySelector('.orb');if(ob&&ob._orb)ob._orb.flatT=performance.now()}SKY.boost=1.6;timer=setTimeout(()=>go(15),1300)}}
  },45);
}

function render(dir){
  const n=S.i;const html=nav()+V[n]();
  const old=cur();
  if(dir&&old&&!RM){
    old.classList.remove('cur');old.setAttribute('inert','');
    old.querySelectorAll('[id]').forEach(e=>e.removeAttribute('id'));
    old.classList.add('out');
    const nv=document.createElement('div');nv.className='view cur in';nv.innerHTML=html;stage.appendChild(nv);
    setTimeout(()=>old.remove(),260);
    setTimeout(()=>nv.classList.remove('in'),420);
  }else if(!old){const nv=document.createElement('div');nv.className='view cur';nv.innerHTML=html;stage.appendChild(nv)}
  else old.innerHTML=html;
  const v=cur();
  v.querySelectorAll('.orb').forEach(mountOrb);
  SKY.base=n===14?0.00032:0.00004;
  if(n===14)runLoading();
  const f=v.querySelector('input:not([disabled])');
  if(f&&[6,10].includes(n)){setTimeout(()=>{if(cur()!==v)return;f.focus({preventScroll:true});const x=f.value;f.value='';f.value=x},dir?300:0)}
  renderPanel();
}

/* 3D chart wheel: layered rings + floating planets, billboarded toward the camera */
const ORBS=new Set();
const PLANETS=[['sun',0],['moon',140],['rise',250],['spark',45],['star',95],['heart',190],['brief',300],['leaf',330]];
const ease=t=>1-Math.pow(1-t,3);
function mountOrb(el){
  if(el._orb)return;
  const size=parseFloat(el.dataset.size)||240,mode=el.dataset.mode||'float',lit=el.dataset.lit||'big';
  const R=size/2;
  const layer=(cls,d,z,extra='')=>`<div class="ol ${cls}" style="width:${d}px;height:${d}px;transform:translate(-50%,-50%) translateZ(${z}px);${extra}"></div>`;
  let ticks='';for(let i=0;i<24;i++){const a=i*15;ticks+=`<i style="transform:translate(-50%,-50%) rotate(${a}deg) translateY(${-R*.93}px);height:${i%2?4:8}px"></i>`}
  let pl='',sh='';
  PLANETS.forEach(([k,a],i)=>{
    const on=lit==='big'?i<3:lit==='sun'?i===0:false;
    const pr=R*.74,rad=Math.PI*(a-90)/180,x=pr*Math.cos(rad),y=pr*Math.sin(rad),z=22+(i%3)*9;
    const g=['sun','moon','rise'].includes(k)?ic(k,14,'currentColor',1.8):'<i class="dot"></i>';
    pl+=`<div class="op ${on?'lit':''}" data-x="${x}" data-y="${y}" data-z="${z}" data-i="${i}"><span>${g}</span></div>`;
    sh+=`<div class="osh" style="transform:translate(-50%,-50%) translate3d(${x}px,${y}px,1px)"></div><div class="ost" style="height:${z}px;margin:${-z}px 0 0 -.75px;transform:translate3d(${x}px,${y}px,0) rotateX(-90deg)"></div>`;
  });
  let motes='';for(let i=0;i<10;i++)motes+=`<b style="--a:${i*36}deg;--d:${R*(.46+(i%3)*.06)}px"></b>`;
  el.innerHTML=`<div class="oscene">
    <div class="ofloor" style="width:${size*1.15}px;height:${size*1.15}px"></div>
    ${layer('disc',size*.98,-2)}
    ${layer('ring outer',size*.98,0)}
    <div class="oticks" style="transform:translateZ(1px)">${ticks}</div>
    ${layer('ring',size*.74,6)}
    ${layer('ring faint',size*.6,12)}
    ${sh}
    ${layer('ring gold',size*.4,30)}
    ${layer('ring gold2',size*.4,18,'opacity:.35')}
    <div class="omotes" style="transform:translateZ(30px)">${motes}</div>
    <div class="ost beam" style="height:44px;margin:-44px 0 0 -1px;transform:rotateX(-90deg)"></div>
    ${pl}
    <div class="ocore" data-z="46"><svg viewBox="0 0 40 40" width="${Math.round(size*.15)}" height="${Math.round(size*.15)}"><path d="M20 2l4.5 13.5L38 20l-13.5 4.5L20 38l-4.5-13.5L2 20l13.5-4.5z" fill="var(--accent)"/></svg></div>
  </div>`;
  el.style.width=el.style.height=size+'px';
  const o={el,mode,scene:el.firstElementChild,bills:[...el.querySelectorAll('.op,.ocore')],t0:performance.now(),spin:Math.random()*360,px:0,py:0,tx:0,ty:0,flatT:null,size};
  if(mode==='spin')o.bills.forEach(b=>{if(b.classList.contains('op'))b.style.opacity=0});
  el._orb=o;ORBS.add(o);
  el.addEventListener('pointermove',e=>{const r=el.getBoundingClientRect();o.tx=((e.clientX-r.left)/r.width-.5);o.ty=((e.clientY-r.top)/r.height-.5)});
  el.addEventListener('pointerleave',()=>{o.tx=0;o.ty=0});
  if(!ORBS.loop){ORBS.loop=true;requestAnimationFrame(orbFrame)}
  if(RM)drawOrb(o,performance.now(),0);
}
function drawOrb(o,now,dt){
  const t=(now-o.t0)/1000;let tilt,spd,scale=1,yaw=0;
  o.px+=(o.tx-o.px)*.08;o.py+=(o.ty-o.py)*.08;
  if(o.mode==='spin'){
    tilt=66;spd=34;
    if(o.flatT!==null){const k=ease(Math.min(1,(now-o.flatT)/1300));tilt=66-44*k;spd=34-26*k}
    o.bills.forEach(b=>{if(b.dataset.i!==undefined){const k=Math.min(1,Math.max(0,(t-.4-b.dataset.i*.45)/.5));b.style.opacity=k}});
  }else if(o.mode==='land'){
    const k=ease(Math.min(1,t/1.8));tilt=84-(84-(40+Math.sin(t*.6)*6))*k;spd=8+90*(1-k);scale=.55+.45*k;
    o.el.style.opacity=Math.min(1,t/.5);
  }else if(o.mode==='static'){tilt=42;spd=4}
  else{tilt=50+Math.sin(t*.55)*9;spd=9;yaw=Math.sin(t*.4)*6}
  o.spin+=spd*dt/1000;
  tilt+=o.py*-28;yaw+=o.px*34;
  o.scene.style.transform=`scale(${scale}) rotateX(${tilt}deg) rotateY(${yaw}deg) rotateZ(${o.spin}deg)`;
  const inv=`rotateZ(${-o.spin}deg) rotateY(${-yaw}deg) rotateX(${-tilt}deg)`;
  for(const b of o.bills){
    const x=+b.dataset.x||0,y=+b.dataset.y||0,z=+b.dataset.z||0;
    const bob=b.dataset.i!==undefined?Math.sin(t*1.4+ +b.dataset.i)*3:Math.sin(t*1.2)*2;
    b.style.transform=`translate(-50%,-50%) translate3d(${x}px,${y}px,${z+bob}px) ${inv}`;
  }
}
function orbFrame(now){
  const dt=Math.min(50,now-(ORBS.last||now));ORBS.last=now;
  for(const o of ORBS){if(!o.el.isConnected){ORBS.delete(o);continue}drawOrb(o,now,dt)}
  if(!RM&&ORBS.size)requestAnimationFrame(orbFrame);else ORBS.loop=false;
}
/* 3D starfield */
const SKY={base:0.00004,boost:0,mx:0,my:0,tx:0,ty:0};
(function(){
  const cv=document.getElementById('stars'),cx=cv.getContext('2d');
  let w=0,h=0;const stars=[];const shoot=[];let nextShoot=performance.now()+2500;
  const tint=()=>{const r=Math.random();return r<.78?'245,242,234':r<.9?'233,194,107':'170,190,255'};
  const spawn=(s,far)=>{s.x=(Math.random()*2-1)*1.1;s.y=(Math.random()*2-1)*1.1;s.z=far?1:0.08+Math.random()*.92;s.c=tint();s.p=Math.random()*6.28;s.f=.6+Math.random()*1.8;return s};
  for(let i=0;i<260;i++)stars.push(spawn({},false));
  function size(){const r=phone.getBoundingClientRect();const d=Math.min(2,devicePixelRatio||1);w=r.width;h=r.height;cv.width=w*d;cv.height=h*d;cx.setTransform(d,0,0,d,0,0);phone.style.setProperty('--h',(w/2)+'px')}
  size();addEventListener('resize',size);
  const proj=(s,z)=>[w/2+(s.x/z)*w*.42+SKY.mx*(1-z)*26,h*.42+(s.y/z)*h*.42+SKY.my*(1-z)*26];
  let last=performance.now();
  function frame(now){
    const dt=Math.min(50,now-last);last=now;
    SKY.mx+=(SKY.tx-SKY.mx)*.05;SKY.my+=(SKY.ty-SKY.my)*.05;
    SKY.boost*=Math.pow(.94,dt/16);
    const sp=(SKY.base+SKY.boost*0.0011)*dt;
    cx.clearRect(0,0,w,h);
    const t=now/1000;
    const neb=(x,y,r,col)=>{const g=cx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,col);g.addColorStop(1,'rgba(0,0,0,0)');cx.fillStyle=g;cx.fillRect(0,0,w,h)};
    neb(w*(.25+.06*Math.sin(t*.07)),h*(.22+.04*Math.cos(t*.05)),w*.75,'rgba(96,70,200,.16)');
    neb(w*(.8+.05*Math.cos(t*.06)),h*(.55+.05*Math.sin(t*.04)),w*.7,'rgba(40,90,170,.12)');
    neb(w*.5,h*.05,w*.6,'rgba(233,194,107,.05)');
    for(const s of stars){
      const pz=s.z;s.z-=sp;
      if(s.z<.04){spawn(s,true);continue}
      const [x,y]=proj(s,s.z);
      if(x<-20||x>w+20||y<-20||y>h+20){spawn(s,true);continue}
      const depth=1-s.z;const tw=.55+.45*Math.sin(t*s.f+s.p);
      const a=Math.min(1,depth*1.25)*tw;const r=.35+depth*1.9;
      if(sp>0.004){const [px,py]=proj(s,Math.min(1,pz+sp*5));cx.strokeStyle=`rgba(${s.c},${a*.8})`;cx.lineWidth=r;cx.beginPath();cx.moveTo(px,py);cx.lineTo(x,y);cx.stroke()}
      cx.fillStyle=`rgba(${s.c},${a})`;cx.beginPath();cx.arc(x,y,r,0,6.283);cx.fill();
      if(r>1.7&&tw>.9){cx.strokeStyle=`rgba(${s.c},${a*.35})`;cx.lineWidth=.6;cx.beginPath();cx.moveTo(x-r*3,y);cx.lineTo(x+r*3,y);cx.moveTo(x,y-r*3);cx.lineTo(x,y+r*3);cx.stroke()}
    }
    if(now>nextShoot){const a=Math.PI*(.72+Math.random()*.12);shoot.push({x:w*(.3+Math.random()*.7),y:h*Math.random()*.35,vx:Math.cos(a)*.55,vy:Math.sin(a)*.55,l:0});nextShoot=now+4000+Math.random()*5000}
    for(let i=shoot.length-1;i>=0;i--){const m=shoot[i];m.l+=dt;m.x+=m.vx*dt;m.y+=m.vy*dt;const k=1-m.l/1100;if(k<=0){shoot.splice(i,1);continue}
      const g=cx.createLinearGradient(m.x,m.y,m.x-m.vx*160,m.y-m.vy*160);g.addColorStop(0,`rgba(255,246,220,${k})`);g.addColorStop(1,'rgba(255,246,220,0)');
      cx.strokeStyle=g;cx.lineWidth=1.6;cx.beginPath();cx.moveTo(m.x,m.y);cx.lineTo(m.x-m.vx*160,m.y-m.vy*160);cx.stroke()}
    if(!RM)requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  phone.addEventListener('pointermove',e=>{const r=phone.getBoundingClientRect();SKY.tx=((e.clientX-r.left)/r.width-.5)*2;SKY.ty=((e.clientY-r.top)/r.height-.5)*2});
  phone.addEventListener('pointerleave',()=>{SKY.tx=0;SKY.ty=0});
})();


function renderPanel(){}

phone.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b||b.disabled)return;
  const a=b.dataset.a,v=b.dataset.v;
  switch(a){
    case 'next':next();break;
    case 'back':back();break;
    case 'go':go(+v);break;
    case 'soon':break;
    case 'focus':if(v==='other'){S.showOther=!S.showOther}else{S.focus=S.focus.includes(v)?S.focus.filter(x=>x!==v):[...S.focus,v]}render();if(v==='other'&&S.showOther)document.getElementById('fo')?.focus();break;
    case 'exp':S.exp=v;render();setTimeout(()=>{if(S.i===5)next()},280);break;
    case 'name':if(!S.name.trim()){S.err='Add a name to continue';render()}else{S.name=S.name.trim();next()}break;
    case 'dob':if(!dobOk(S.dob)){S.err='Pick a full date to continue';render()}else next();break;
    case 'unknown':S.timeUnknown=!S.timeUnknown;if(S.timeUnknown)S.time='';render();break;
    case 'place':S.place=v;S.placeQ='';render();break;
    case 'clearplace':S.place='';S.placeQ='';render();break;
    case 'person':S.person=v;render();break;
    case 'person2':if(!S.pname.trim()||!dobOk(S.pdob)){S.err='Add their name and birthday';render()}else next();break;
    case 'skipperson':S.person='me';S.pname='';next();break;
    case 'ntime':{const o=['7:00 AM','8:00 AM','9:00 AM'];S.notifTime=o[(o.indexOf(S.notifTime)+1)%3];render();break}
    case 'notif':S.notif=true;emit('notifications',{enabled:true,time:S.notifTime});try{if('Notification' in window&&Notification.permission==='default')Notification.requestPermission()}catch(e){}next();break;
    case 'nonotif':S.notif=false;emit('notifications',{enabled:false});next();break;
    case 'acct':S.account=v;emit('signin',{provider:v});next();break;
    case 'guest':S.account='Guest';emit('signin',{provider:'guest'});next();break;
    case 'plan':S.plan=v;render();break;
    case 'buy':emit('purchase',{plan:S.plan,trial:S.plan==='weekly'});if(!window.StarlynFunnel||!window.StarlynFunnel.handlesPurchase){S.premium=true;S.trial=S.plan==='weekly';go(20)}break;
    case 'close':if(!S.fallback){S.fallback=true;S.sheet='fallback';render()}else go(20);break;
    case 'trial':S.sheet=null;emit('purchase',{plan:'weekly',trial:true,fallback:true});if(!window.StarlynFunnel||!window.StarlynFunnel.handlesPurchase){S.premium=true;S.trial=true;go(20)}break;
    case 'notnow':S.sheet=null;emit('paywall_dismissed');go(20);break;
    case 'more':S.readMore=!S.readMore;render();break;
    case 'tarot':if(!S.tarot){S.tarot=true;b.querySelector('.flip').classList.add('on');setTimeout(()=>{const h=b.querySelector('.hint');if(h)h.textContent='Hope, quietly. Keep the promise you made in private.'},450)}break;
    case 'sugg':ask(v);break;
    case 'ask':{const q=document.getElementById('q');if(q&&q.value.trim())ask(q.value.trim());else q?.focus();break}
    case 'pack':emit('question_pack');break;
  }
});
function ask(q){
  if(S.questions<1)return;
  S.questions--;const item={q,a:''};S.chat.push(item);render();
  emit('ask',{question:q});const done=a=>{item.a=a;if(S.i===21)render()};const fb=`<b>Short version: yes, but slowly.</b> With your Sun in ${sun()} and Moon in ${moon()}, you decide fast and trust slowly. This week, say the plain version first and let the other person catch up.`;const h=window.StarlynFunnel&&window.StarlynFunnel.answer;if(h){Promise.resolve(h(q,snapshot())).then(a=>done(a?esc(a):fb),()=>done(fb))}else setTimeout(()=>done(fb),1400);
}
phone.addEventListener('input',e=>{
  const f=e.target.dataset.f;if(!f)return;
  if(f.includes('.')){const[o,k]=f.split('.');S[o][k]=e.target.value}else S[f]=e.target.value;
  if(f==='placeQ'){S.place='';const q=S.placeQ.trim().toLowerCase();const res=q?CITIES.filter(c=>c.toLowerCase().includes(q)).slice(0,5):[];
    document.getElementById('res').innerHTML=res.length?`<div class="results">${res.map(c=>`<button data-a="place" data-v="${esc(c)}">${ic('pin',16,'var(--t3)')}<span>${esc(c.split(',')[0])}<br><small>${esc(c.split(',').slice(1).join(',').trim())}</small></span></button>`).join('')}</div>`:q?`<div class="err">We couldn't find that place. Try a nearby city.</div>`:'<div class="hint">Try "Austin", "London" or "Hanoi". We never share these.</div>';
    cur().querySelector('.foot .btn').disabled=true;return}
  if(f==='pname'){const av=document.getElementById('pav');if(av){av.textContent=S.pname?S.pname[0].toUpperCase():'?';av.classList.toggle('set',!!S.pname)}}
  if(f==='time'){cur().querySelector('.foot .btn').disabled=!S.time}
  if(f==='focusOther'){cur().querySelector('.foot .btn').disabled=!(S.focus.length||S.focusOther.trim())}
  if(f==='q')return;
  renderPanel();
});
phone.addEventListener('change',e=>{if(e.target.tagName==='SELECT'){S.err='';renderPanel()}});
phone.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.tagName==='INPUT'){const b=e.target.id==='q'?cur().querySelector('[data-a="ask"]'):cur().querySelector('.foot .btn');b&&!b.disabled&&b.click()}});

window.StarlynFunnel=Object.assign(window.StarlynFunnel||{},{go:n=>{fillTo(n);S.sheet=null;go(n)},data:snapshot,completePurchase:(plan,trial)=>{S.premium=true;S.trial=!!trial;if(plan)S.plan=plan;S.sheet=null;go(20)}});
{const m=location.hash.match(/s=([0-9]+)/);if(m&&V[+m[1]]){fillTo(+m[1]);S.i=+m[1]}}
render();
