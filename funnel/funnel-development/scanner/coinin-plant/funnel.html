<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#151412">
<meta name="robots" content="noindex">
<title>CoinIdentify: Coin Scanner &middot; Plant Funnel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600&display=swap">
<style>
:root{
  color-scheme:dark;
  --ground:#0C0B09;
  --bg:#151412;--bg-elev:#1A1916;--surface:#1F1D19;--surface-2:#2A2722;--border:#353129;
  --t1:#F2EEE6;--t2:#B7AFA2;--t3:#81796C;
  --acc:#8FCB8B;--acc-dim:#8FCB8B2E;--btn-text:#151412;--gold-lm:#2F6B3B;
  --grad:linear-gradient(100deg,#B9E6AE 0%,#8FCB8B 50%,#5FA86A 100%);
  --neg:#F29A8A;--pos:#7FD1A8;
  /* palm line colours (on the user's photo) */
  --l-heart:#F29A8A;--l-head:#8FB8FF;--l-life:#7FD1A8;--l-fate:#8FCB8B;--l-marriage:#D9A8FF;
  --serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--t1);font:15px/1.45 var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
a{color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.app{position:relative;width:100%;max-width:480px;height:100vh;height:100dvh;margin:0 auto;overflow:hidden;isolation:isolate;background:radial-gradient(ellipse 120% 60% at 50% 0%,#241F16 0%,var(--bg) 60%)}
@media (min-width:520px){.app{border-inline:1px solid #2B2822}}
#stars{position:absolute;inset:0;width:100%;height:100%;z-index:0;display:block}
.view{position:absolute;inset:0;z-index:1;padding-top:calc(var(--sat) + 6px);display:flex;flex-direction:column}
.view.in{animation:vin .32s ease both}
@keyframes vin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.nav{height:48px;flex:none;display:flex;align-items:center;gap:10px;padding:0 12px;position:relative;z-index:3}
.iconbtn{width:44px;height:44px;border-radius:50%;border:none;background:transparent;display:grid;place-items:center;color:var(--t2);flex:none}
.prog{flex:1;height:4px;border-radius:2px;background:var(--surface-2);overflow:hidden}
.prog span{display:block;height:100%;background:var(--grad);border-radius:2px;transition:width .35s ease}
.navspacer{width:44px}
.stepn{width:44px;text-align:right;font:600 12px var(--sans);color:var(--t3);font-variant-numeric:tabular-nums}
.brand{display:flex;align-items:center;justify-content:center;gap:7px;font:600 15px var(--serif);letter-spacing:.02em;color:var(--t1)}
.brand svg{color:var(--acc)}
.scr{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 20px 12px;display:flex;flex-direction:column;gap:18px;position:relative;scrollbar-width:none;overscroll-behavior:contain}
.scr::-webkit-scrollbar{display:none}
.scr>*{flex-shrink:0}   /* items must not squash on short screens; the .scr scrolls instead */
.scr.center{justify-content:flex-start}.scr.center>:first-child{margin-top:auto}.scr.center>:last-child{margin-bottom:auto}   /* safe centring: tall content scrolls instead of being cut off at the top */
.foot{flex:none;padding:10px 20px max(20px,calc(var(--sab) + 12px));display:flex;flex-direction:column;gap:8px;position:relative;z-index:2}
.note{font-size:12px;color:var(--t3);text-align:center;text-wrap:balance}
.note a{color:inherit;text-decoration:underline;text-underline-offset:2px;display:inline-block;padding:14px 0;margin:-14px 0}
.display{font:700 32px/1.1 var(--serif);letter-spacing:-.01em;margin:0;text-wrap:balance}
.display.sm{font-size:26px}
.display em{font-style:normal;color:var(--acc)}
.lead{color:var(--t2);margin:0;font-size:15px;text-wrap:pretty}
.gold{color:var(--acc)}
.tc{text-align:center}
.badge{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:var(--acc-dim);color:var(--acc);font:500 13px/1 var(--sans)}
.tc .badge{align-self:center}
.btn{height:54px;border-radius:999px;border:none;background:var(--grad);color:var(--btn-text);font:600 16px/1 var(--sans);width:100%;display:flex;align-items:center;justify-content:center;gap:10px;transition:transform .12s ease;flex:none;position:relative;overflow:hidden;box-shadow:0 8px 28px -10px #5FA86Aaa}
.btn:active{transform:scale(.98)}
.btn[disabled]{background:var(--surface-2);color:var(--t3);box-shadow:none}
.btn:not([disabled]):not(.ghost)::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:0;background:linear-gradient(100deg,transparent,#ffffff55,transparent);transform:translateX(-150%) skewX(-20deg);animation:sheen 4.5s ease-in-out 1.2s infinite}
@keyframes sheen{0%{transform:translateX(-150%) skewX(-20deg)}28%,100%{transform:translateX(320%) skewX(-20deg)}}
.btn.ghost{background:var(--surface);color:var(--t1);border:1px solid var(--border);box-shadow:none}
.link{background:none;border:none;color:var(--t2);font-size:14px;padding:6px 10px;min-height:44px;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--border)}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:14px;padding:11px 14px;min-height:58px;border-radius:18px;background:linear-gradient(180deg,#26231E,var(--surface));border:1px solid var(--border);text-align:left;width:100%;transition:border-color .15s,background .15s,transform .12s;box-shadow:0 6px 18px -12px #000}
.opt:hover{border-color:#4E8A58}
.opt:active{transform:scale(.99)}
.opt::after{content:"";width:20px;height:20px;border-radius:50%;border:1.5px solid var(--border);flex:none;margin-left:auto}
.opt.on::after{border-color:var(--btn-text);background:radial-gradient(circle,var(--btn-text) 38%,transparent 42%)}
.opt .well{width:36px;height:36px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;flex:none;font-size:18px}
.opt .lbl{flex:1;font-weight:500;font-size:15.5px}
.opt.on{border-color:transparent;background:var(--grad);color:var(--btn-text)}
.opt.on .well{background:#ffffff40}
.box{height:54px;border-radius:14px;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;padding:0 12px;gap:10px;color:var(--t3);min-width:0}
.box:focus-within{border-color:var(--acc)}
.box.white{background:#F7F4EC;border-color:#F7F4EC;color:var(--gold-lm)}
.box.white input{color:#151412}
.box.white input::placeholder{color:#9C8A5E}
.box input,.box select{flex:1;min-width:0;width:100%;height:100%;background:transparent;border:none;outline:none;color:var(--t1);font:400 16px var(--sans)}
.box select{appearance:none;-webkit-appearance:none;cursor:pointer}
.box select option{background:var(--surface);color:var(--t1)}
.row3{display:grid;grid-template-columns:1.4fr 1fr 1.2fr;gap:8px}
.err{font-size:13px;color:var(--neg)}
.hint{font-size:13px;color:var(--t3)}
.card{padding:14px;border-radius:18px;background:var(--surface);border:1px solid var(--border)}
.card h4{margin:0 0 4px;font-size:15px;font-weight:600;display:flex;gap:8px;align-items:center}
.card p{margin:0;color:var(--t2);font-size:14px}
.stack{display:flex;flex-direction:column;gap:10px}
.lockrow{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--border);color:var(--t2);font-size:14px}
.lockrow .l{margin-left:auto;color:var(--acc)}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.blurred{filter:blur(5px);user-select:none}
.bigwell{width:84px;height:84px;border-radius:50%;background:radial-gradient(circle,#8FCB8B55,transparent 70%),var(--surface);border:1px solid var(--border);display:grid;place-items:center;color:var(--acc);align-self:center;box-shadow:0 0 40px #8FCB8B55}
.checks{display:flex;flex-direction:column;gap:8px;font-size:14px}
.checks div{display:flex;gap:10px;align-items:flex-start}
.checks svg{color:var(--acc);flex:none;margin-top:2px}
.fadein{animation:fi .35s ease both}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.toast{position:absolute;left:50%;top:calc(var(--sat) + 12px);transform:translateX(-50%);z-index:20;background:var(--t1);color:#0C0B09;font-size:13px;font-weight:500;padding:9px 14px;border-radius:999px;max-width:calc(100% - 32px);width:max-content;animation:fade 2.6s ease forwards}
@keyframes fade{0%{opacity:0}10%,80%{opacity:1}100%{opacity:0}}

/* hook */
.hero{position:relative;height:300px;margin:0 -20px;flex:none;overflow:hidden}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 30%;-webkit-mask-image:linear-gradient(#000 60%,#0000);mask-image:linear-gradient(#000 60%,#0000)}
.proof{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.proof span{font-size:12px;padding:6px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--border);color:var(--t2)}
.trio{display:flex;justify-content:center;gap:14px;font-size:12.5px;color:var(--t2)}
.trio span{display:flex;gap:5px;align-items:center}
.trio svg{color:var(--acc)}
.rot{height:24px;overflow:hidden;font:600 20px/24px var(--serif);color:var(--acc)}
.rot div{animation:rot 12s steps(1) infinite}
@keyframes rot{0%{transform:translateY(0)}16.6%{transform:translateY(-24px)}33.3%{transform:translateY(-48px)}50%{transform:translateY(-72px)}66.6%{transform:translateY(-96px)}83.3%{transform:translateY(-120px)}}

/* line chart legend (education) */
.palmsvg path{fill:none;stroke-linecap:round;stroke-linejoin:round}
.palmsvg .out{stroke:#8FCB8B;stroke-width:1.5;opacity:.85}
.palmsvg .ln{stroke-width:2.6}
.palmsvg .dr{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.1s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;font-size:13px;color:var(--t2)}
.legend div{display:flex;gap:8px;align-items:center}

/* loaders */
.ring{width:150px;height:150px;border-radius:50%;background:conic-gradient(var(--acc) calc(var(--p)*1%),var(--surface-2) 0);display:grid;place-items:center;align-self:center;position:relative;flex:none}
.ring::before{content:"";position:absolute;inset:9px;border-radius:50%;background:var(--bg)}
.ring b{position:relative;font:600 34px var(--serif)}
.tasks{display:flex;flex-direction:column;gap:9px}
.task{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--border);color:var(--t3);font-size:14px;transition:all .3s}
.task i{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--border);display:grid;place-items:center;flex:none;font-style:normal}
.task.on{color:var(--t1);border-color:#4E8A58}
.task.done{color:var(--t1)}
.task.done i{background:var(--grad);border-color:transparent;color:var(--btn-text)}
.iq{position:absolute;inset:0;z-index:6;background:#0A0908CC;display:grid;place-items:center;padding:24px;animation:fi .25s ease}
.iq .in{width:100%;padding:22px 18px 18px;border-radius:22px;background:var(--bg-elev);border:1px solid var(--border);display:flex;flex-direction:column;gap:16px;text-align:center;box-shadow:0 20px 50px #000a}
.iq b{font:600 21px/1.25 var(--serif)}
.iq .row{display:flex;gap:10px}
.iq .row .btn{height:48px;flex:1;min-width:0;width:auto}

/* scan guide */
.guide{display:grid;grid-template-columns:1fr;gap:10px}
.gok{position:relative;border-radius:18px;border:1.5px solid var(--pos);background:#7FD1A812;padding:14px;display:flex;gap:14px;align-items:center}
.gok .ph{width:92px;height:122px;border-radius:14px;overflow:hidden;flex:none;position:relative;background:#0C0B09}
.gok .ph img{width:100%;height:100%;object-fit:cover}
.gok b{color:var(--pos);display:flex;gap:6px;align-items:center}
.gbad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.gbad div{border-radius:14px;border:1.5px solid #F29A8A66;background:#F29A8A10;padding:10px 6px;text-align:center;font-size:11.5px;color:var(--t2);display:flex;flex-direction:column;gap:6px;align-items:center}
.gbad svg{color:var(--neg)}
.privacy{display:flex;gap:10px;font-size:12px;color:var(--t3);align-items:flex-start;text-align:left}
.privacy svg{color:var(--pos);flex:none;margin-top:1px}

/* upload */
.drop{border-radius:22px;border:1.5px dashed #4E8A58;background:radial-gradient(ellipse at 50% 30%,#8FCB8B14,transparent 70%),var(--surface);min-height:300px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px;text-align:center;position:relative;overflow:hidden;flex:none}
.drop.over{border-style:solid;background:#8FCB8B22}
.drop .palmsvg{opacity:.8}
.preview{position:relative;border-radius:22px;overflow:hidden;background:#0C0B09;flex:none;aspect-ratio:3/4;max-height:52vh;align-self:center;width:100%;border:1px solid var(--border)}
.preview img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.preview svg.ov{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.preview .tag{position:absolute;left:12px;top:12px;font-size:11.5px;padding:5px 9px;border-radius:999px;background:#0A0908cc;color:var(--t1);z-index:2;display:flex;gap:6px;align-items:center}
.preview .scan{position:absolute;left:0;right:0;height:3px;background:linear-gradient(90deg,#0000,#B9E6AE,#0000);box-shadow:0 0 18px #8FCB8B;animation:scanl 2.2s ease-in-out infinite}
@keyframes scanl{0%{top:6%}50%{top:92%}100%{top:6%}}
.ov .fd{fill:#8FCB8B;stroke:#fff;stroke-width:.4}
.ov .fd.pop{animation:pop .45s cubic-bezier(.3,1.6,.5,1) both}
@keyframes pop{from{r:0}}
.ov .ln{fill:none;stroke-width:1.1;stroke-linecap:round;filter:drop-shadow(0 0 1.2px #000)}
.ov .ln.dr{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1s ease forwards}
.anl{text-align:center}
.anl .what{font:600 22px var(--serif);color:var(--acc);min-height:28px}
.anl .bar{height:5px;border-radius:3px;background:var(--surface-2);overflow:hidden;margin:10px 30px 0}
.anl .bar span{display:block;height:100%;background:var(--grad);width:0;transition:width .4s ease}

/* paywall */
.closex{position:absolute;top:calc(var(--sat) + 6px);right:10px;z-index:3;width:44px;height:44px;border-radius:50%;background:#0C0B09AA;border:1px solid var(--border);display:grid;place-items:center;color:var(--t2)}
.plan{display:flex;align-items:center;gap:12px;padding:12px 14px;min-height:62px;border-radius:18px;border:1px solid var(--border);background:var(--surface);text-align:left;width:100%;position:relative}
.plan .radio{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--border);display:grid;place-items:center;flex:none}
.plan.on{border:1.5px solid #8FCB8B;background:linear-gradient(0deg,var(--acc-dim),var(--acc-dim)),var(--surface)}
.plan.on .radio{background:var(--grad);border-color:transparent;color:var(--btn-text)}
.plan .pn{font-weight:600;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.plan .pp{font-size:13px;color:var(--t1);display:block;margin-top:2px}
.plan .ps{font-size:11.5px;color:var(--t3);display:block;margin-top:2px}
.save{font:600 10px/1 var(--sans);letter-spacing:.05em;background:var(--grad);color:var(--btn-text);padding:4px 7px;border-radius:6px}
.tok{font-family:ui-monospace,Consolas,monospace;font-size:.85em;font-weight:600;padding:1px 5px;border-radius:6px;border:1px dashed var(--acc);color:var(--acc);white-space:nowrap}
.legal{display:flex;justify-content:center;gap:4px 14px;font-size:12px;color:var(--t3);flex-wrap:wrap}
.legal a{display:inline-flex;align-items:center;min-height:44px;padding:0 4px}
.thumbrow{display:flex;gap:12px;align-items:center;padding:10px;border-radius:18px;background:var(--surface);border:1px solid var(--border)}
.thumbrow .th{width:62px;height:78px;border-radius:12px;overflow:hidden;position:relative;flex:none;background:#0C0B09}
.thumbrow .th img{width:100%;height:100%;object-fit:cover}
.thumbrow .th svg{position:absolute;inset:0;width:100%;height:100%}
.stores{display:flex;gap:8px;justify-content:center}
.store{display:flex;align-items:center;gap:8px;height:44px;padding:0 12px 0 10px;border-radius:8px;background:#000;border:1px solid #A6A6A6;line-height:1.05;text-align:left;color:#fff}
.store svg{flex:none}
.store small{display:block;font-size:9.5px;letter-spacing:.02em}
.store b{display:block;font-size:15px;font-weight:600;letter-spacing:-.01em}
/* ===== web paywall: long-scroll landing page, not an app sheet ===== */
.wp{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;scroll-behavior:smooth;background:var(--bg)}
.wp::-webkit-scrollbar{display:none}
.wbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:calc(var(--sat) + 8px) 16px 10px;background:#151412f5;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid #ffffff10}
.wbar .brand{flex:1;justify-content:flex-start}
.wbar .mini{height:40px;padding:0 14px;border-radius:999px;border:none;background:var(--grad);color:var(--btn-text);font:600 13px var(--sans);opacity:0;transform:translateY(-4px);transition:.25s;pointer-events:none}
.wp.scrolled .wbar .mini{opacity:1;transform:none;pointer-events:auto}
.wbar .x{width:36px;height:36px;border-radius:50%;border:1px solid var(--border);background:transparent;color:var(--t3);display:grid;place-items:center}
.wsec{padding:28px 18px 0}
.wsec.tight{padding-top:16px}
.wh2{font:700 27px/1.15 var(--serif);margin:0 0 6px;text-wrap:balance}
.wh2+.lead{margin-bottom:16px}
.eyebrow{font:600 11.5px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--acc);margin-bottom:10px;display:block}
.whero{display:grid;grid-template-columns:1fr 1.05fr;gap:14px;align-items:center}
.whero .pv{border-radius:20px;overflow:hidden;position:relative;aspect-ratio:3/4;border:1px solid #8FCB8B55;box-shadow:0 20px 50px -20px #000,0 0 40px -10px #8FCB8B55}
.whero .pv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.whero .pv svg{position:absolute;inset:0;width:100%;height:100%}
.facts{display:flex;flex-direction:column;gap:8px}
.fact{padding:9px 11px;border-radius:12px;background:var(--surface);border:1px solid var(--border);font-size:12px;color:var(--t3)}
.fact b{display:block;color:var(--t1);font-size:13.5px;font-weight:600;margin-top:2px}
.pick{border-radius:24px;padding:18px 14px 16px;background:linear-gradient(180deg,#25221C,#181714);border:1px solid #8FCB8B40;box-shadow:0 30px 60px -30px #000}
.pick .plans{display:flex;flex-direction:column;gap:10px}
.wplan{position:relative;display:grid;grid-template-columns:24px 1fr auto;gap:2px 12px;align-items:center;padding:16px 14px;border-radius:16px;border:1.5px solid var(--border);background:var(--bg-elev);text-align:left;width:100%}
.wplan .rd{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--border);grid-row:1/3;display:grid;place-items:center}
.wplan .nm{font:600 16px var(--sans)}
.wplan .sub{font-size:12px;color:var(--t3);grid-column:2}
.wplan .pr{grid-row:1/3;grid-column:3;text-align:right;font:600 15px var(--sans)}
.wplan .pr small{display:block;font:400 11.5px var(--sans);color:var(--t3);margin-top:3px}
.wplan .rib{position:absolute;top:-11px;left:14px;font:700 10.5px/1 var(--sans);letter-spacing:.08em;padding:5px 9px;border-radius:999px;background:var(--grad);color:var(--btn-text)}
.wplan.on{border-color:var(--acc);background:linear-gradient(0deg,#8FCB8B1c,#8FCB8B1c),var(--bg-elev);box-shadow:0 0 0 3px #8FCB8B22}
.wplan.on .rd{background:var(--grad);border-color:transparent;color:var(--btn-text)}
.today{display:flex;justify-content:space-between;font-size:13.5px;padding:12px 4px 0;color:var(--t2)}
.today b{color:var(--t1)}
.pay{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.pay span{height:26px;min-width:44px;padding:0 8px;border-radius:6px;background:#F2EEE6;color:#151412;font:700 10.5px/26px var(--sans);text-align:center;letter-spacing:.02em}
.secure{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:12px;color:var(--t2)}
.secure span{display:flex;gap:5px;align-items:center}
.secure svg{color:var(--pos)}
.fine{font-size:11.5px;color:var(--t3);text-align:center;margin:12px 4px 0;line-height:1.5}
.toc{display:flex;flex-direction:column;border-radius:20px;overflow:hidden;border:1px solid var(--border)}
.toc div{display:flex;gap:12px;align-items:center;padding:14px;background:var(--surface);border-top:1px solid var(--border);font-size:14px}
.toc div:first-child{border-top:none}
.toc .n{width:26px;height:26px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font:600 12px var(--sans);color:var(--acc);flex:none}
.toc .l{margin-left:auto;color:var(--t3)}
.toc .open .l{color:var(--pos)}
.rate{display:flex;align-items:center;gap:14px;padding:16px;border-radius:20px;background:var(--surface);border:1px solid var(--border)}
.rate .sc{font:600 38px/1 var(--serif);color:var(--acc)}
.rate .sc .tok{font-size:13px}
.stars{color:var(--acc);letter-spacing:2px;font-size:15px}
.rev{padding:16px;border-radius:18px;background:var(--surface);border:1px solid var(--border);display:flex;flex-direction:column;gap:8px;font-size:14px;color:var(--t2)}
.rev .who{display:flex;gap:10px;align-items:center;color:var(--t1);font-weight:600}
.rev .who i{width:34px;height:34px;border-radius:50%;background:var(--grad);display:grid;place-items:center;color:var(--btn-text);font:600 12px var(--sans);font-style:normal}
.rev .who small{display:block;font-weight:400;color:var(--t3);font-size:11.5px}
.how{display:flex;flex-direction:column;gap:0}
.how>div{display:grid;grid-template-columns:34px 1fr;gap:12px;padding-bottom:18px;position:relative}
.how>div:not(:last-child)::before{content:"";position:absolute;left:16px;top:34px;bottom:0;width:2px;background:var(--border)}
.how i{width:34px;height:34px;border-radius:50%;background:var(--acc-dim);color:var(--acc);display:grid;place-items:center;font:600 14px var(--sans);font-style:normal;border:1px solid #8FCB8B55}
.how b{display:block;margin-top:6px}
.how span{font-size:13.5px;color:var(--t2)}
.faq details{border-top:1px solid var(--border);padding:4px 0}
.faq details:last-child{border-bottom:1px solid var(--border)}
.faq summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;gap:12px;padding:14px 2px;font-weight:600;font-size:15px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";color:var(--acc);font-size:20px;line-height:1;transition:transform .2s}
.faq details[open] summary::after{transform:rotate(45deg)}
.faq p{margin:0 2px 14px;color:var(--t2);font-size:14px}
.guar{display:flex;gap:14px;align-items:center;padding:18px;border-radius:20px;border:1px solid #8FCB8B55;background:radial-gradient(ellipse at 0% 0%,#8FCB8B22,transparent 60%),var(--surface)}
.guar .seal{width:62px;height:62px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--grad);color:var(--btn-text);font:700 11px/1.1 var(--sans);text-align:center;box-shadow:0 0 0 4px #8FCB8B33}
.wfoot{padding:28px 18px calc(var(--sab) + 124px);font-size:11.5px;color:var(--t3);text-align:center;line-height:1.6}
.ocard{position:relative;padding:18px 16px;border-radius:24px;border:1.5px solid var(--acc);background:radial-gradient(ellipse at 50% 0%,#8FCB8B24,transparent 60%),linear-gradient(180deg,#25221C,#181714);box-shadow:0 0 0 4px #8FCB8B18,0 30px 60px -30px #000}
.obadge{position:absolute;top:-12px;left:50%;transform:translateX(-50%);padding:6px 12px;border-radius:999px;background:var(--grad);color:var(--btn-text);font:700 11px/1 var(--sans);letter-spacing:.08em;white-space:nowrap}
.obadge .tok{color:var(--btn-text);border-color:var(--btn-text)}
.orow{display:flex;gap:12px;align-items:center}
.orow .th{width:58px;height:74px;border-radius:12px;overflow:hidden;position:relative;flex:none}
.orow .th img{width:100%;height:100%;object-fit:cover}.orow .th svg{position:absolute;inset:0;width:100%;height:100%}
.oprice{display:flex;align-items:baseline;justify-content:center;gap:10px;margin-top:16px;padding:14px;border-radius:16px;background:var(--bg-elev);border:1px solid var(--border)}
.oprice s{color:var(--t3);font-size:14px}.oprice b{font:600 30px var(--serif);color:var(--acc)}.oprice>span{color:var(--t2);font-size:13px;white-space:nowrap}
.otimer{display:inline-flex;gap:8px;margin-top:12px;padding:8px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--border);font-size:13px;color:var(--t2)}
.otimer b{color:var(--acc);font-variant-numeric:tabular-nums}
.sticky{position:absolute;left:0;right:0;bottom:0;z-index:6;padding:12px 16px max(14px,calc(var(--sab) + 10px));background:#151412f5;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid #ffffff10;transform:translateY(110%);transition:transform .3s ease}
.sticky.show{transform:none}
.sticky .sum{display:flex;justify-content:space-between;font-size:12.5px;color:var(--t2);margin-bottom:8px;padding:0 4px}
.sticky .sum b{color:var(--t1)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition:none!important}}
/* ---- plant funnel additions ---- */
.vtog{position:absolute;top:0;left:50%;transform:translateX(-50%);z-index:30;font:600 10px/1 var(--sans);padding:4px 10px;border-radius:0 0 8px 8px;border:1px solid var(--border);border-top:none;background:#0A0908cc;color:var(--t3);min-height:0}
.ed{display:flex;gap:10px;align-items:flex-end}
.ed .av{width:58px;height:58px;border-radius:50%;flex:none;background:var(--surface-2);border:1px solid #8FCB8B66;overflow:hidden;display:block}
.ed .bb{position:relative;flex:1;min-width:0;background:var(--surface);border:1px solid var(--border);border-radius:16px 16px 16px 4px;padding:9px 12px;font-size:14px;line-height:1.4;color:var(--t1)}
.ed .who{font:600 11px var(--sans);color:var(--acc);letter-spacing:.05em;display:block;margin-bottom:2px}
.chipd{display:inline-flex;align-items:center;gap:6px;font:500 11.5px/1 var(--sans);padding:6px 10px;border-radius:999px;border:1px dashed #8FCB8Baa;color:var(--acc);align-self:flex-start}
.tc .chipd{align-self:center}
.plantwrap{display:grid;place-items:center}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.gc{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 8px 12px;border-radius:20px;background:var(--surface);border:1.5px solid var(--border);position:relative;transition:border-color .2s,opacity .2s}
.gc b{font:600 14px var(--sans)}
.gc.win{border-color:var(--acc);box-shadow:0 0 0 3px #8FCB8B22}
.gc.dim{opacity:.45}
.gc .loupe{position:absolute;top:8px;right:10px;color:var(--t3)}
.edge{height:10px;width:100px;border-radius:5px;display:flex;overflow:hidden;opacity:0;transition:opacity .4s}
.edge i{display:block;flex:1}
.revealed .edge{opacity:1}
.reveal{padding:12px 14px;border-radius:16px;background:var(--surface);border:1px solid #8FCB8B66;font-size:14px;color:var(--t2)}
.reveal b{color:var(--t1);display:block;margin-bottom:2px}
.roundph{width:150px;height:150px;border-radius:50%;overflow:hidden;position:relative;background:#0C0B09;border:2px solid var(--acc);flex:none;display:grid;place-items:center;align-self:center}
.roundph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.roundph svg{position:absolute;inset:0;width:100%;height:100%}
.roundph.lg{width:190px;height:190px}
.spin3d{perspective:700px;display:grid;place-items:center;align-self:center}
.spin3d .roundph{animation:tilt 5s ease-in-out infinite;transform-style:preserve-3d}
@keyframes tilt{0%,100%{transform:rotateY(-24deg) rotateX(6deg)}50%{transform:rotateY(24deg) rotateX(-4deg)}}
.ringscan{position:absolute;inset:-8px;border-radius:50%;border:2px solid transparent;border-top-color:var(--acc);border-right-color:#8FCB8B88;animation:rs 1.6s linear infinite}
@keyframes rs{to{transform:rotate(360deg)}}
.dropc{border-radius:24px;border:1.5px dashed #4E8A58;background:radial-gradient(ellipse at 50% 30%,#8FCB8B14,transparent 70%),var(--surface);min-height:250px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px;text-align:center;flex:none}
.dropc.over{border-style:solid;background:#8FCB8B22}
.chips4{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chips4 div{display:flex;gap:8px;align-items:center;padding:10px 12px;border-radius:14px;background:var(--surface);border:1px solid var(--border);font-size:13px;color:var(--t2)}
.chips4 svg{color:var(--acc);flex:none}
.cardid{padding:14px;border-radius:22px;background:linear-gradient(180deg,#25221C,#181714);border:1px solid #8FCB8B55;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 50px -24px #000}
.faces{display:flex;gap:12px;justify-content:center}
.faces .roundph{width:104px;height:104px;border-width:1.5px}
.cname{font:700 26px/1.1 var(--serif);text-align:center;margin:0}
.frow{display:flex;justify-content:space-between;gap:12px;font-size:14px;padding:8px 2px;border-top:1px solid var(--border)}
.frow span{color:var(--t3)}
.frow b{font-weight:500;text-align:right}
.medal{width:150px;height:150px;border-radius:50%;align-self:center;background:radial-gradient(circle at 35% 28%,#CFEFC4,#8FCB8B 55%,#3E7348);display:grid;place-items:center;text-align:center;color:#0F2A14;box-shadow:0 0 0 6px #8FCB8B26,0 20px 40px -14px #000;position:relative;flex:none}
.medal .st{font-size:15px;letter-spacing:3px}
.medal b{font:700 19px/1.05 var(--serif);display:block;padding:0 14px}
.gridc{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.gridc div{aspect-ratio:1;border-radius:14px;border:1.5px dashed var(--border);display:grid;place-items:center;overflow:hidden;position:relative}
.gridc div.f{border:1.5px solid var(--acc);background:#0C0B09}
.gridc div.f img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.rbar{height:12px;border-radius:6px;background:linear-gradient(90deg,#4A4338,#4E8A58,#8FCB8B);position:relative;margin:26px 0 6px}
.rbar i{position:absolute;top:-22px;transform:translateX(-50%);font:600 10.5px var(--sans);font-style:normal;color:var(--acc);white-space:nowrap}
.rbar i::after{content:"";position:absolute;left:50%;top:15px;width:2px;height:20px;background:var(--t1);transform:translateX(-50%)}
.rlab{display:flex;justify-content:space-between;font-size:11px;color:var(--t3)}
.hint.warn{color:#B9E6AE}
.noim{display:flex;gap:10px;align-items:flex-start;padding:12px;border-radius:14px;background:#F29A8A12;border:1px solid #F29A8A55;font-size:14px}

/* CoinIdentify add-on (post-purchase upsell) + demo checkout sheet */
.upok{align-self:center;display:inline-flex;gap:6px;align-items:center;font-size:12.5px;color:var(--pos);background:#7FD1A81a;border:1px solid #7FD1A855;border-radius:99px;padding:6px 12px}
.upcard{background:var(--surface);border:1px solid #8FCB8B55;border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:12px;box-shadow:0 0 40px #5FA86A22}
.upcov{position:relative;height:140px;border-radius:14px;overflow:hidden;background:#0C0B09;border:1px solid #8FCB8B66;display:flex;align-items:flex-end;padding:12px}
.upcov .upph{position:absolute;right:12px;top:12px;width:96px;height:96px;border-width:1.5px}
.upcov::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,#0C0B09f0 35%,transparent)}
.upcov div.upt{position:relative;z-index:1}.upcov small{display:block;font:600 10.5px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--acc);margin-bottom:6px}
.upcov b{font:700 22px/1.15 var(--serif);color:var(--t1)}
.upl{list-style:none;margin:0;padding:0;display:grid;gap:8px}.upl li{display:flex;gap:8px;align-items:flex-start;font-size:14px;color:var(--t1);text-align:left}.upl li svg{color:var(--acc);flex:none;margin-top:2px}
.upr{display:flex;align-items:baseline;justify-content:space-between;border-top:1px solid var(--border);padding-top:10px}.upr b{font:700 24px var(--serif);color:var(--t1)}.upr span{font-size:12.5px;color:var(--t2)}
.upadd{align-self:center;display:flex;gap:8px;align-items:center;font-size:13.5px;color:var(--pos);text-align:left;background:#7FD1A812;border:1px solid #7FD1A844;border-radius:14px;padding:9px 12px;text-wrap:balance}
#demock{position:absolute;inset:0;z-index:1000;background:#000000b3;display:flex;flex-direction:column;justify-content:flex-end;animation:ckF .2s ease}
#demock .iqc{background:var(--bg-elev);border-top:1px solid var(--border);border-radius:22px 22px 0 0;padding:20px 16px max(20px,calc(var(--sab) + 12px));animation:ckU .3s cubic-bezier(.2,.8,.2,1)}
#demock .iqc b{font:700 21px/1.25 var(--serif);color:var(--t1)}#demock .iqc p{margin:6px 0 0;color:var(--t2);font-size:14px}#demock .iqc .ckf{font-size:12.5px;margin-bottom:14px}#demock .ckb{display:flex;flex-direction:column;gap:8px}
@keyframes ckF{from{opacity:0}}@keyframes ckU{from{transform:translateY(100%)}}
</style>

/* ---------- photo handling: validate, decode, dark check, preview ---------- */
function dropPhoto(side){const p=S[side];if(p&&p.url)try{URL.revokeObjectURL(p.url)}catch(e){}S[side]=null}
async function takeFile(side,f){
  if(!f)return;
  S.photoErr='';S.photoWarn='';
  if(!/^image\//.test(f.type)&&!/\.(heic|heif|jpe?g|png|webp)$/i.test(f.name)){S.photoErr="That file isn't a photo. Try a JPG or PNG.";render();return}
  if(f.size>CONFIG.maxUploadMB*1024*1024){S.photoErr=`That photo is over ${CONFIG.maxUploadMB} MB. Try a smaller one.`;render();return}
  const url=URL.createObjectURL(f),img=new Image();img.decoding='async';
  img.onerror=()=>{URL.revokeObjectURL(url);S.photoErr="We couldn't open that photo. Try another.";emit('upload_error',{side,reason:'decode'});render()};
  img.onload=()=>{dropPhoto(side);S[side]={url,file:f};S.sample=false;
    let lum=128;try{const c=document.createElement('canvas');c.width=40;c.height=40;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(img,0,0,40,40);const d=x.getImageData(0,0,40,40).data;lum=0;for(let k=0;k<d.length;k+=4)lum+=.299*d[k]+.587*d[k+1]+.114*d[k+2];lum/=1600}catch(e){}
    if(lum<45)S.photoWarn='It looks dark. Plants read best in bright light.';
    emit('upload',{side,ok:!S.photoWarn,dark:lum<45});render()};
  img.src=url;
}

/* ---------- animated screens ---------- */
function run14(){let p=0;const total=RM?10:100,step=RM?5:50;
  window.__iv=setInterval(()=>{p=Math.min(100,p+1);
    for(let i=0;i<4;i++){const a=i*25,b=a+25,e=document.getElementById('tk'+i);if(!e)return clearInterval(window.__iv);
      const v=Math.max(0,Math.min(100,Math.round((p-a)/25*100)));e.classList.toggle('on',p>=a&&p<b);e.classList.toggle('done',p>=b);e.querySelector('i').innerHTML=p>=b?ic('check',12,3):'';document.getElementById('pc'+i).textContent=v+'%'}
    if(p>=100){clearInterval(window.__iv);later(next,500)}},step)}   /* ~5 s minimum; the real app advances when the API result is back */

/* ---------- render ---------- */
function render(anim){
  const v=document.createElement('div');v.className='view'+(anim&&!RM?' in':'');v.innerHTML=nav()+V[S.i]();
  const old=app.querySelector('.view');if(old)old.replaceWith(v);else app.appendChild(v);
  if(!app.querySelector('.vtog')){const b=document.createElement('button');b.className='vtog';b.dataset.a='ab';app.appendChild(b)}
  const tg=app.querySelector('.vtog');tg.textContent='Copy '+S.v;tg.setAttribute('aria-label','Switch copy A/B');tg.hidden=S.i===PAYWALL||S.i===IK_GET;
  if(S.i===12||S.i===13)bindUpload(v);
  if(S.i===14)run14();
  if(S.i===PAYWALL)bindPaywall(v);
}
function bindPaywall(v){
  const wp=v.querySelector('#wp'),st=v.querySelector('#sticky'),blocks=[...v.querySelectorAll('.pick .btn')];
  if(!wp||!('IntersectionObserver' in window)){st&&st.classList.add('show');return}
  const vis=new Set();   /* sticky bar shows from first view whenever no plan-block CTA is fully on screen */
  const io=new IntersectionObserver(es=>{es.forEach(e=>e.isIntersecting?vis.add(e.target):vis.delete(e.target));st.classList.toggle('show',!vis.size)},{root:wp,threshold:.9,rootMargin:'-60px 0px 0px 0px'});
  blocks.forEach(b=>io.observe(b));
  wp.addEventListener('scroll',()=>{wp.classList.toggle('scrolled',wp.scrollTop>260)},{passive:true});
}
function bindUpload(v){
  v.querySelectorAll('input[type=file]').forEach(fi=>fi.addEventListener('change',()=>{const f=fi.files&&fi.files[0];emit('upload_pick',{side:fi.dataset.side,source:fi.id==='pc'?'camera':'gallery'});takeFile(fi.dataset.side,f);fi.value=''}));
  const d=v.querySelector('#drop');if(!d)return;
  ['dragenter','dragover'].forEach(e=>d.addEventListener(e,ev=>{ev.preventDefault();d.classList.add('over')}));
  ['dragleave','drop'].forEach(e=>d.addEventListener(e,ev=>{ev.preventDefault();d.classList.remove('over')}));
  d.addEventListener('drop',ev=>{const f=ev.dataTransfer.files&&ev.dataTransfer.files[0];emit('upload_pick',{side:S.i===12?'front':'back',source:'drop'});takeFile(S.i===12?'front':'back',f)});
}
function startSample(){dropPhoto('front');dropPhoto('back');S.sample=true;S.backSkipped=false;S.photoErr='';S.photoWarn='';emit('sample_plant');go(14)}

app.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b||b.disabled)return;const a=b.dataset.a,v=b.dataset.v;
  switch(a){
    case 'ab':S.v=S.v==='B'?'A':'B';render(false);break;
    case 'next':if(S.i===1)emit('start');if(!valid())break;next();break;
    case 'back':back();break;
    case 'skipname':S.name='';next();break;
    case 'pick':{const f=b.dataset.f;S[f]=v;answer(f,v);
      if(v==='other'){render();app.querySelector('[data-f="'+f+'Other"]')?.focus();break}
      app.querySelectorAll(`[data-f="${f}"]`).forEach(x=>x.classList.toggle('on',x.dataset.v===v));later(next,RM?0:280);break}
    case 'tog':{const f=b.dataset.f,arr=S[f],k=arr.indexOf(v);if(k<0)arr.push(v);else arr.splice(k,1);answer(f,arr.join(','));render();if(v==='other'&&k<0)app.querySelector('[data-f="'+f+'Other"]')?.focus();break}
    case 'guess':{const g=COLLECT.games.find(x=>x.id===b.dataset.g);if(S[g.id])break;S[g.id]=v;answer(g.id,v+(v===g.right?':right':':wrong'));render();break}
    case 'usephoto':{const side=S.i===12?'front':'back',p=S[side];
      if(CONFIG.onPlantPhoto&&p)try{Promise.resolve(CONFIG.onPlantPhoto(p.file,{side})).catch(()=>{})}catch(e){}
      emit('photo_confirm',{side,warned:!!S.photoWarn});S.photoWarn='';next();break}
    case 'retake':dropPhoto(b.dataset.side);S.photoWarn='';S.photoErr='';render();break;
    case 'retake12':dropPhoto('front');dropPhoto('back');S.sample=false;S.backSkipped=false;S.photoWarn='';S.photoErr='';go(12);break;
    case 'sample':startSample();break;
    case 'skipback':S.backSkipped=true;dropPhoto('back');emit('skip_back');go(14);break;
    case 'sharebadge':toast('Demo only. Sharing is off.');break;
    case 'consent':S.consent=!S.consent;render();break;
    case 'email':{const x=(S.email||'').trim();if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(x)){S.emailErr='Enter a valid email address.';render();document.getElementById('em')?.focus();break}S.email=x;S.emailErr='';emit('lead',{method:'email',marketingConsent:S.consent});next();break}
    case 'plan':{S.plan=v;emit('plan_select',{plan:v});
      app.querySelectorAll('.wplan').forEach(x=>{const on=x.dataset.v===v;x.classList.toggle('on',on);x.setAttribute('aria-pressed',on);x.querySelector('.rd').innerHTML=on?ic('check',12,3):''});
      app.querySelectorAll('[data-renew]').forEach(x=>x.innerHTML=renewText(v));app.querySelectorAll('[data-today]').forEach(x=>x.innerHTML=todayLine());
      const sl=document.getElementById('sumline');if(sl){sl.innerHTML=todayLine();document.getElementById('sumname').textContent=planOf(v).name}break}
    case 'toplans':document.getElementById('plans1')?.scrollIntoView({block:'start'});break;
    case 'pay':checkout(S.plan);break;
    case 'ckpay':{document.getElementById('demock')?.remove();window.IkFunnel.completePurchase(S.ckPlan);break}
    case 'ckclose':{document.getElementById('demock')?.remove();checkoutDeclined(S.ckPlan);break}
    case 'closepw':break;   /* hard paywall: no exit without purchase */
    case 'upskip':emit('upsell_decline',{id:CONFIG.upsell.id});go(IK_GET);break;
    case 'upbuy':emit('upsell_accept',{id:CONFIG.upsell.id,price:CONFIG.upsell.price});checkout('addon');break;
    case 'app':{const st=b.dataset.store,u=(st==='ios'&&CONFIG.appStoreUrl)||(st==='android'&&CONFIG.playStoreUrl)||appLink();emit('app_handoff',{url:u});if(u)navTop(u);else toast('App link coming soon');break}
  }
});
app.addEventListener('input',e=>{const f=e.target.dataset.f;if(!f)return;
  if(f==='email'){S.email=e.target.value;if(S.emailErr){S.emailErr='';e.target.closest('.box').classList.remove('bad');app.querySelector('.err')?.remove()}return}
  S[f]=e.target.value;
  const cb=app.querySelector('.foot [data-a="next"]');if(cb)cb.disabled=!valid();
  const h=app.querySelector('[data-hint]');if(h)h.hidden=!!e.target.value.trim()});
app.addEventListener('keydown',e=>{if(e.key!=='Enter')return;if(e.target.id==='em')app.querySelector('[data-a="email"]')?.click();else if(e.target.dataset&&e.target.dataset.f&&e.target.id!=='em')app.querySelector('.foot [data-a="next"]:not([disabled])')?.click()});

/* host API */
window.IkFunnel=Object.assign(window.IkFunnel||{},{config:CONFIG,data:snapshot,
  /* completePurchase runs after ANY checkout success (FunnelFox: the plan key that was opened): main plan -> add-on screen, addon -> get_app */
  completePurchase:plan=>{plan=plan||S.plan;
    if(plan!=='addon'){S.plan=S.mainPlan=plan;S.paid=true;emit('purchase_complete',{plan});go(S.upsold?IK_GET:IK_UP);return}
    S.plan=S.mainPlan||CONFIG.defaultPlan;S.upsold=true;emit('purchase_complete',{plan:'addon',id:CONFIG.upsell.id,price:CONFIG.upsell.price});go(IK_GET)}});
/* ?paid=<plan> (or 1): return from an external checkout -> add-on screen */
if(QS.get('paid')){const k=QS.get('paid');S.paid=true;S.plan=S.mainPlan=(CONFIG.plans[k]&&!CONFIG.plans[k].hidden)?k:CONFIG.defaultPlan;S.i=IK_UP}
if(DEBUG){window.IkFunnel.go=n=>{clearT();Object.assign(S,{name:S.name||'Maya',src:S.src||'leafy',water:S.water||'often',types:S.types.length?S.types:['yellow','pests'],light:S.light||'bright',g1:S.g1||'a',g2:S.g2||'a',email:S.email||'demo@example.com'});go(n)};window.IkFunnel.takeFile=takeFile}
emit('funnel_start',{referrer:(()=>{try{return document.referrer?new URL(document.referrer).hostname:''}catch(e){return ''}})()});
render();viewed();
</script>
</body>
</html>
