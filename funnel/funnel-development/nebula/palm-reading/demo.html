<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#161A27">
<meta name="robots" content="noindex">
<title>Starlyn: Daily Astrology &middot; Palm Reading</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600&display=swap">
<style>
:root{
  color-scheme:dark;
  --ground:#0E111A;
  --bg:#161A27;--bg-elev:#1C2131;--surface:#212739;--surface-2:#2A3147;--border:#3A4260;
  --t1:#F6F3EA;--t2:#B5B9C9;--t3:#7C8298;
  --acc:#E9C26B;--acc-dim:#E9C26B2E;--btn-text:#161A27;--gold-lm:#8A6410;
  --grad:linear-gradient(100deg,#F4DA96 0%,#E9C26B 50%,#C99A3A 100%);
  --neg:#F29A8A;--pos:#7FD1A8;
  /* palm line colours (on the user's photo) */
  --l-heart:#F29A8A;--l-head:#8FB8FF;--l-life:#7FD1A8;--l-fate:#E9C26B;--l-marriage:#D9A8FF;
  --serif:"Fraunces",Georgia,"Times New Roman",serif;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--t1);font:15px/1.45 var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
a{color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.app{position:relative;width:100%;max-width:480px;height:100vh;height:100dvh;margin:0 auto;overflow:hidden;isolation:isolate;background:radial-gradient(ellipse 120% 60% at 50% 0%,#1D2235 0%,var(--bg) 60%)}
@media (min-width:520px){.app{border-inline:1px solid #2B334F}}
#stars{position:absolute;inset:0;width:100%;height:100%;z-index:0;display:block}
.view{position:absolute;inset:0;z-index:1;padding-top:calc(var(--sat) + 6px);display:flex;flex-direction:column}
.view.in{animation:vin .32s ease both}
@keyframes vin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.nav{height:48px;flex:none;display:flex;align-items:center;gap:10px;padding:0 12px;position:relative;z-index:3}
.iconbtn{width:44px;height:44px;border-radius:50%;border:none;background:transparent;display:grid;place-items:center;color:var(--t2);flex:none}
.prog{flex:1;height:4px;border-radius:2px;background:var(--surface-2);overflow:hidden}
.prog span{display:block;height:100%;background:var(--grad);border-radius:2px;transition:width .35s ease}
.navspacer{width:44px}
.stepn{width:44px;text-align:right;font:600 12px var(--sans);color:var(--t3);font-variant-numeric:tabular-nums}
.brand{display:flex;align-items:center;justify-content:center;gap:7px;font:600 15px var(--serif);letter-spacing:.02em;color:var(--t1)}
.brand svg{color:var(--acc)}
.scr{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 20px 12px;display:flex;flex-direction:column;gap:18px;position:relative;scrollbar-width:none;overscroll-behavior:contain}
.scr::-webkit-scrollbar{display:none}
.scr.center{justify-content:center}
.foot{flex:none;padding:10px 20px max(20px,calc(var(--sab) + 12px));display:flex;flex-direction:column;gap:8px;position:relative;z-index:2}
.note{font-size:12px;color:var(--t3);text-align:center;text-wrap:balance}
.note a{color:var(--t2)}
.display{font:600 30px/1.12 var(--serif);letter-spacing:-.01em;margin:0;text-wrap:balance}
.display.sm{font-size:26px}
.display em{font-style:normal;color:var(--acc)}
.lead{color:var(--t2);margin:0;font-size:15px;text-wrap:pretty}
.gold{color:var(--acc)}
.tc{text-align:center}
.badge{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:var(--acc-dim);color:var(--acc);font:500 13px/1 var(--sans)}
.tc .badge{align-self:center}
.btn{height:54px;border-radius:999px;border:none;background:var(--grad);color:var(--btn-text);font:600 16px/1 var(--sans);width:100%;display:flex;align-items:center;justify-content:center;gap:10px;transition:transform .12s ease;flex:none;position:relative;overflow:hidden;box-shadow:0 8px 28px -10px #DFA620aa}
.btn:active{transform:scale(.98)}
.btn[disabled]{background:var(--surface-2);color:var(--t3);box-shadow:none}
.btn:not([disabled]):not(.ghost)::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:0;background:linear-gradient(100deg,transparent,#ffffff55,transparent);transform:translateX(-150%) skewX(-20deg);animation:sheen 4.5s ease-in-out 1.2s infinite}
@keyframes sheen{0%{transform:translateX(-150%) skewX(-20deg)}28%,100%{transform:translateX(320%) skewX(-20deg)}}
.btn.ghost{background:var(--surface);color:var(--t1);border:1px solid var(--border);box-shadow:none}
.link{background:none;border:none;color:var(--t2);font-size:14px;padding:6px 10px;min-height:44px;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--border)}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:14px;padding:11px 14px;min-height:58px;border-radius:18px;background:linear-gradient(180deg,#262D42,var(--surface));border:1px solid var(--border);text-align:left;width:100%;transition:border-color .15s,background .15s,transform .12s;box-shadow:0 6px 18px -12px #000}
.opt:hover{border-color:#8C7236}
.opt:active{transform:scale(.99)}
.opt::after{content:"";width:20px;height:20px;border-radius:50%;border:1.5px solid var(--border);flex:none;margin-left:auto}
.opt.on::after{border-color:var(--btn-text);background:radial-gradient(circle,var(--btn-text) 38%,transparent 42%)}
.opt .well{width:36px;height:36px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;flex:none;font-size:18px}
.opt .lbl{flex:1;font-weight:500;font-size:15.5px}
.opt.on{border-color:transparent;background:var(--grad);color:var(--btn-text)}
.opt.on .well{background:#ffffff40}
.box{height:54px;border-radius:14px;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;padding:0 12px;gap:10px;color:var(--t3);min-width:0}
.box:focus-within{border-color:var(--acc)}
.box.white{background:#F7F4EC;border-color:#F7F4EC;color:var(--gold-lm)}
.box.white input{color:#161A28}
.box.white input::placeholder{color:#9C8A5E}
.box input,.box select{flex:1;min-width:0;width:100%;height:100%;background:transparent;border:none;outline:none;color:var(--t1);font:400 16px var(--sans)}
.box select{appearance:none;-webkit-appearance:none;cursor:pointer}
.box select option{background:var(--surface);color:var(--t1)}
.row3{display:grid;grid-template-columns:1.4fr 1fr 1.2fr;gap:8px}
.err{font-size:13px;color:var(--neg)}
.hint{font-size:13px;color:var(--t3)}
.card{padding:14px;border-radius:18px;background:var(--surface);border:1px solid var(--border)}
.card h4{margin:0 0 4px;font-size:15px;font-weight:600;display:flex;gap:8px;align-items:center}
.card p{margin:0;color:var(--t2);font-size:14px}
.stack{display:flex;flex-direction:column;gap:10px}
.lockrow{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--border);color:var(--t2);font-size:14px}
.lockrow .l{margin-left:auto;color:var(--acc)}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.blurred{filter:blur(5px);user-select:none}
.bigwell{width:84px;height:84px;border-radius:50%;background:radial-gradient(circle,#E3B03A55,transparent 70%),var(--surface);border:1px solid var(--border);display:grid;place-items:center;color:var(--acc);align-self:center;box-shadow:0 0 40px #E3B03A55}
.checks{display:flex;flex-direction:column;gap:8px;font-size:14px}
.checks div{display:flex;gap:10px;align-items:flex-start}
.checks svg{color:var(--acc);flex:none;margin-top:2px}
.fadein{animation:fi .35s ease both}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.toast{position:absolute;left:50%;top:calc(var(--sat) + 12px);transform:translateX(-50%);z-index:20;background:var(--t1);color:#0E111B;font-size:13px;font-weight:500;padding:9px 14px;border-radius:999px;max-width:calc(100% - 32px);width:max-content;animation:fade 2.6s ease forwards}
@keyframes fade{0%{opacity:0}10%,80%{opacity:1}100%{opacity:0}}

/* hook */
.hero{position:relative;height:300px;margin:0 -20px;flex:none;overflow:hidden}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 30%;-webkit-mask-image:linear-gradient(#000 60%,#0000);mask-image:linear-gradient(#000 60%,#0000)}
.proof{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.proof span{font-size:12px;padding:6px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--border);color:var(--t2)}
.trio{display:flex;justify-content:center;gap:14px;font-size:12.5px;color:var(--t2)}
.trio span{display:flex;gap:5px;align-items:center}
.trio svg{color:var(--acc)}
.rot{height:24px;overflow:hidden;font:600 20px/24px var(--serif);color:var(--acc)}
.rot div{animation:rot 12s steps(1) infinite}
@keyframes rot{0%{transform:translateY(0)}16.6%{transform:translateY(-24px)}33.3%{transform:translateY(-48px)}50%{transform:translateY(-72px)}66.6%{transform:translateY(-96px)}83.3%{transform:translateY(-120px)}}

/* line chart legend (education) */
.palmsvg path{fill:none;stroke-linecap:round;stroke-linejoin:round}
.palmsvg .out{stroke:#E9C26B;stroke-width:1.5;opacity:.85}
.palmsvg .ln{stroke-width:2.6}
.palmsvg .dr{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.1s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;font-size:13px;color:var(--t2)}
.legend div{display:flex;gap:8px;align-items:center}

/* loaders */
.ring{width:150px;height:150px;border-radius:50%;background:conic-gradient(var(--acc) calc(var(--p)*1%),var(--surface-2) 0);display:grid;place-items:center;align-self:center;position:relative;flex:none}
.ring::before{content:"";position:absolute;inset:9px;border-radius:50%;background:var(--bg)}
.ring b{position:relative;font:600 34px var(--serif)}
.tasks{display:flex;flex-direction:column;gap:9px}
.task{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--border);color:var(--t3);font-size:14px;transition:all .3s}
.task i{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--border);display:grid;place-items:center;flex:none;font-style:normal}
.task.on{color:var(--t1);border-color:#B8923A}
.task.done{color:var(--t1)}
.task.done i{background:var(--grad);border-color:transparent;color:var(--btn-text)}
.iq{position:absolute;inset:0;z-index:6;background:#0B0E16CC;display:grid;place-items:center;padding:24px;animation:fi .25s ease}
.iq .in{width:100%;padding:22px 18px 18px;border-radius:22px;background:var(--bg-elev);border:1px solid var(--border);display:flex;flex-direction:column;gap:16px;text-align:center;box-shadow:0 20px 50px #000a}
.iq b{font:600 21px/1.25 var(--serif)}
.iq .row{display:flex;gap:10px}
.iq .row .btn{height:48px;flex:1;min-width:0;width:auto}

/* scan guide */
.guide{display:grid;grid-template-columns:1fr;gap:10px}
.gok{position:relative;border-radius:18px;border:1.5px solid var(--pos);background:#7FD1A812;padding:14px;display:flex;gap:14px;align-items:center}
.gok .ph{width:92px;height:122px;border-radius:14px;overflow:hidden;flex:none;position:relative;background:#0E111A}
.gok .ph img{width:100%;height:100%;object-fit:cover}
.gok b{color:var(--pos);display:flex;gap:6px;align-items:center}
.gbad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.gbad div{border-radius:14px;border:1.5px solid #F29A8A66;background:#F29A8A10;padding:10px 6px;text-align:center;font-size:11.5px;color:var(--t2);display:flex;flex-direction:column;gap:6px;align-items:center}
.gbad svg{color:var(--neg)}
.privacy{display:flex;gap:10px;font-size:12px;color:var(--t3);align-items:flex-start;text-align:left}
.privacy svg{color:var(--pos);flex:none;margin-top:1px}

/* upload */
.drop{border-radius:22px;border:1.5px dashed #B8923A;background:radial-gradient(ellipse at 50% 30%,#E9C26B14,transparent 70%),var(--surface);min-height:300px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px;text-align:center;position:relative;overflow:hidden;flex:none}
.drop.over{border-style:solid;background:#E9C26B22}
.drop .palmsvg{opacity:.8}
.preview{position:relative;border-radius:22px;overflow:hidden;background:#0E111A;flex:none;aspect-ratio:3/4;max-height:52vh;align-self:center;width:100%;border:1px solid var(--border)}
.preview img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.preview svg.ov{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.preview .tag{position:absolute;left:12px;top:12px;font-size:11.5px;padding:5px 9px;border-radius:999px;background:#0B0E16cc;color:var(--t1);z-index:2;display:flex;gap:6px;align-items:center}
.preview .scan{position:absolute;left:0;right:0;height:3px;background:linear-gradient(90deg,#0000,#F4DA96,#0000);box-shadow:0 0 18px #E9C26B;animation:scanl 2.2s ease-in-out infinite}
@keyframes scanl{0%{top:6%}50%{top:92%}100%{top:6%}}
.ov .fd{fill:#E9C26B;stroke:#fff;stroke-width:.4}
.ov .fd.pop{animation:pop .45s cubic-bezier(.3,1.6,.5,1) both}
@keyframes pop{from{r:0}}
.ov .ln{fill:none;stroke-width:1.1;stroke-linecap:round;filter:drop-shadow(0 0 1.2px #000)}
.ov .ln.dr{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1s ease forwards}
.anl{text-align:center}
.anl .what{font:600 22px var(--serif);color:var(--acc);min-height:28px}
.anl .bar{height:5px;border-radius:3px;background:var(--surface-2);overflow:hidden;margin:10px 30px 0}
.anl .bar span{display:block;height:100%;background:var(--grad);width:0;transition:width .4s ease}

/* paywall */
.closex{position:absolute;top:calc(var(--sat) + 6px);right:10px;z-index:3;width:44px;height:44px;border-radius:50%;background:#0E111BAA;border:1px solid var(--border);display:grid;place-items:center;color:var(--t2)}
.plan{display:flex;align-items:center;gap:12px;padding:12px 14px;min-height:62px;border-radius:18px;border:1px solid var(--border);background:var(--surface);text-align:left;width:100%;position:relative}
.plan .radio{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--border);display:grid;place-items:center;flex:none}
.plan.on{border:1.5px solid #E6B951;background:linear-gradient(0deg,var(--acc-dim),var(--acc-dim)),var(--surface)}
.plan.on .radio{background:var(--grad);border-color:transparent;color:var(--btn-text)}
.plan .pn{font-weight:600;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.plan .pp{font-size:13px;color:var(--t1);display:block;margin-top:2px}
.plan .ps{font-size:11.5px;color:var(--t3);display:block;margin-top:2px}
.save{font:600 10px/1 var(--sans);letter-spacing:.05em;background:var(--grad);color:var(--btn-text);padding:4px 7px;border-radius:6px}
.tok{font-family:ui-monospace,Consolas,monospace;font-size:.85em;font-weight:600;padding:1px 5px;border-radius:6px;border:1px dashed var(--acc);color:var(--acc);white-space:nowrap}
.legal{display:flex;justify-content:center;gap:4px 14px;font-size:12px;color:var(--t3);flex-wrap:wrap}
.legal a{display:inline-flex;align-items:center;min-height:44px;padding:0 4px}
.thumbrow{display:flex;gap:12px;align-items:center;padding:10px;border-radius:18px;background:var(--surface);border:1px solid var(--border)}
.thumbrow .th{width:62px;height:78px;border-radius:12px;overflow:hidden;position:relative;flex:none;background:#0E111A}
.thumbrow .th img{width:100%;height:100%;object-fit:cover}
.thumbrow .th svg{position:absolute;inset:0;width:100%;height:100%}
.stores{display:flex;gap:8px;justify-content:center}
.store{display:flex;align-items:center;gap:7px;height:46px;padding:0 12px;border-radius:10px;background:#000;border:1px solid #444;font-size:11px;line-height:1.1;text-align:left;color:#fff}
.store b{display:block;font-size:13px}
/* ===== web paywall: long-scroll landing page, not an app sheet ===== */
.wp{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;scroll-behavior:smooth;background:var(--bg)}
.wp::-webkit-scrollbar{display:none}
.wbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:calc(var(--sat) + 8px) 16px 10px;background:#161A27e6;backdrop-filter:blur(10px);border-bottom:1px solid #ffffff10}
.wbar .brand{flex:1;justify-content:flex-start}
.wbar .mini{height:36px;padding:0 14px;border-radius:999px;border:none;background:var(--grad);color:var(--btn-text);font:600 13px var(--sans);opacity:0;transform:translateY(-4px);transition:.25s;pointer-events:none}
.wp.scrolled .wbar .mini{opacity:1;transform:none;pointer-events:auto}
.wbar .x{width:36px;height:36px;border-radius:50%;border:1px solid var(--border);background:transparent;color:var(--t3);display:grid;place-items:center}
.wsec{padding:28px 18px 0}
.wsec.tight{padding-top:16px}
.wh2{font:600 25px/1.18 var(--serif);margin:0 0 6px;text-wrap:balance}
.wh2+.lead{margin-bottom:16px}
.eyebrow{font:600 11.5px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--acc);margin-bottom:10px;display:block}
.whero{display:grid;grid-template-columns:1fr 1.05fr;gap:14px;align-items:center}
.whero .pv{border-radius:20px;overflow:hidden;position:relative;aspect-ratio:3/4;border:1px solid #E9C26B55;box-shadow:0 20px 50px -20px #000,0 0 40px -10px #E9C26B55}
.whero .pv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.whero .pv svg{position:absolute;inset:0;width:100%;height:100%}
.facts{display:flex;flex-direction:column;gap:8px}
.fact{padding:9px 11px;border-radius:12px;background:var(--surface);border:1px solid var(--border);font-size:12px;color:var(--t3)}
.fact b{display:block;color:var(--t1);font-size:13.5px;font-weight:600;margin-top:2px}
.pick{border-radius:24px;padding:18px 14px 16px;background:linear-gradient(180deg,#232A40,#1A1F2F);border:1px solid #E9C26B40;box-shadow:0 30px 60px -30px #000}
.pick .plans{display:flex;flex-direction:column;gap:10px}
.wplan{position:relative;display:grid;grid-template-columns:24px 1fr auto;gap:2px 12px;align-items:center;padding:16px 14px;border-radius:16px;border:1.5px solid var(--border);background:var(--bg-elev);text-align:left;width:100%}
.wplan .rd{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--border);grid-row:1/3;display:grid;place-items:center}
.wplan .nm{font:600 16px var(--sans)}
.wplan .sub{font-size:12px;color:var(--t3);grid-column:2}
.wplan .pr{grid-row:1/3;grid-column:3;text-align:right;font:600 15px var(--sans)}
.wplan .pr small{display:block;font:400 11.5px var(--sans);color:var(--t3);margin-top:3px}
.wplan .rib{position:absolute;top:-11px;left:14px;font:700 10.5px/1 var(--sans);letter-spacing:.08em;padding:5px 9px;border-radius:999px;background:var(--grad);color:var(--btn-text)}
.wplan.on{border-color:var(--acc);background:linear-gradient(0deg,#E9C26B1c,#E9C26B1c),var(--bg-elev);box-shadow:0 0 0 3px #E9C26B22}
.wplan.on .rd{background:var(--grad);border-color:transparent;color:var(--btn-text)}
.today{display:flex;justify-content:space-between;font-size:13.5px;padding:12px 4px 0;color:var(--t2)}
.today b{color:var(--t1)}
.pay{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.pay span{height:26px;min-width:44px;padding:0 8px;border-radius:6px;background:#F6F3EA;color:#161A27;font:700 10.5px/26px var(--sans);text-align:center;letter-spacing:.02em}
.secure{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:12px;color:var(--t2)}
.secure span{display:flex;gap:5px;align-items:center}
.secure svg{color:var(--pos)}
.fine{font-size:11.5px;color:var(--t3);text-align:center;margin:12px 4px 0;line-height:1.5}
.toc{display:flex;flex-direction:column;border-radius:20px;overflow:hidden;border:1px solid var(--border)}
.toc div{display:flex;gap:12px;align-items:center;padding:14px;background:var(--surface);border-top:1px solid var(--border);font-size:14px}
.toc div:first-child{border-top:none}
.toc .n{width:26px;height:26px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font:600 12px var(--sans);color:var(--acc);flex:none}
.toc .l{margin-left:auto;color:var(--t3)}
.toc .open .l{color:var(--pos)}
.rate{display:flex;align-items:center;gap:14px;padding:16px;border-radius:20px;background:var(--surface);border:1px solid var(--border)}
.rate .sc{font:600 38px/1 var(--serif);color:var(--acc)}
.rate .sc .tok{font-size:13px}
.stars{color:var(--acc);letter-spacing:2px;font-size:15px}
.rev{padding:16px;border-radius:18px;background:var(--surface);border:1px solid var(--border);display:flex;flex-direction:column;gap:8px;font-size:14px;color:var(--t2)}
.rev .who{display:flex;gap:10px;align-items:center;color:var(--t1);font-weight:600}
.rev .who i{width:34px;height:34px;border-radius:50%;background:var(--grad);display:grid;place-items:center;color:var(--btn-text);font:600 12px var(--sans);font-style:normal}
.rev .who small{display:block;font-weight:400;color:var(--t3);font-size:11.5px}
.how{display:flex;flex-direction:column;gap:0}
.how>div{display:grid;grid-template-columns:34px 1fr;gap:12px;padding-bottom:18px;position:relative}
.how>div:not(:last-child)::before{content:"";position:absolute;left:16px;top:34px;bottom:0;width:2px;background:var(--border)}
.how i{width:34px;height:34px;border-radius:50%;background:var(--acc-dim);color:var(--acc);display:grid;place-items:center;font:600 14px var(--sans);font-style:normal;border:1px solid #E9C26B55}
.how b{display:block;margin-top:6px}
.how span{font-size:13.5px;color:var(--t2)}
.faq details{border-top:1px solid var(--border);padding:4px 0}
.faq details:last-child{border-bottom:1px solid var(--border)}
.faq summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;gap:12px;padding:14px 2px;font-weight:600;font-size:15px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";color:var(--acc);font-size:20px;line-height:1;transition:transform .2s}
.faq details[open] summary::after{transform:rotate(45deg)}
.faq p{margin:0 2px 14px;color:var(--t2);font-size:14px}
.guar{display:flex;gap:14px;align-items:center;padding:18px;border-radius:20px;border:1px solid #E9C26B55;background:radial-gradient(ellipse at 0% 0%,#E9C26B22,transparent 60%),var(--surface)}
.guar .seal{width:62px;height:62px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--grad);color:var(--btn-text);font:700 11px/1.1 var(--sans);text-align:center;box-shadow:0 0 0 4px #E9C26B33}
.wfoot{padding:28px 18px calc(var(--sab) + 110px);font-size:11.5px;color:var(--t3);text-align:center;line-height:1.6}
.ocard{position:relative;padding:18px 16px;border-radius:24px;border:1.5px solid var(--acc);background:radial-gradient(ellipse at 50% 0%,#E9C26B24,transparent 60%),linear-gradient(180deg,#232A40,#1A1F2F);box-shadow:0 0 0 4px #E9C26B18,0 30px 60px -30px #000}
.obadge{position:absolute;top:-12px;left:50%;transform:translateX(-50%);padding:6px 12px;border-radius:999px;background:var(--grad);color:var(--btn-text);font:700 11px/1 var(--sans);letter-spacing:.08em;white-space:nowrap}
.obadge .tok{color:var(--btn-text);border-color:var(--btn-text)}
.orow{display:flex;gap:12px;align-items:center}
.orow .th{width:58px;height:74px;border-radius:12px;overflow:hidden;position:relative;flex:none}
.orow .th img{width:100%;height:100%;object-fit:cover}.orow .th svg{position:absolute;inset:0;width:100%;height:100%}
.oprice{display:flex;align-items:baseline;justify-content:center;gap:10px;margin-top:16px;padding:14px;border-radius:16px;background:var(--bg-elev);border:1px solid var(--border)}
.oprice s{color:var(--t3);font-size:14px}.oprice b{font:600 30px var(--serif);color:var(--acc)}.oprice>span{color:var(--t2);font-size:13px}
.otimer{display:inline-flex;gap:8px;margin-top:12px;padding:8px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--border);font-size:13px;color:var(--t2)}
.otimer b{color:var(--acc);font-variant-numeric:tabular-nums}
.sticky{position:absolute;left:0;right:0;bottom:0;z-index:6;padding:12px 16px max(14px,calc(var(--sab) + 10px));background:linear-gradient(180deg,transparent,#161A27 28%);transform:translateY(110%);transition:transform .3s ease}
.sticky.show{transform:none}
.sticky .sum{display:flex;justify-content:space-between;font-size:12.5px;color:var(--t2);margin-bottom:8px;padding:0 4px}
.sticky .sum b{color:var(--t1)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition:none!important}}

<script>
const QS=new URLSearchParams(location.search);
const DEBUG=QS.get('debug')==='1';
const IMG=/*IMG-START*/{}/*IMG-END*/;
const im=p=>IMG[p]||p;
const PASS=['utm_source','utm_medium','utm_campaign','utm_term','utm_content','utm_id','fbclid','ttclid','gclid'];
const IC={
  back:'<path d="m15 18-6-6 6-6"/>',x:'<path d="M18 6 6 18M6 6l12 12"/>',check:'<path d="M20 6 9 17l-5-5"/>',

  spark:'<path d="M12 3l1.9 5.8L20 11l-6.1 2.2L12 19l-1.9-5.8L4 11l6.1-2.2z"/>',
  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',

  fist:'<path d="M7 11V8a2 2 0 0 1 4 0v3M11 10V7a2 2 0 0 1 4 0v4M15 10a2 2 0 0 1 4 0v4a7 7 0 0 1-14 0v-2a2 2 0 0 1 2-2"/>',
  crop:'<path d="M6 2v14a2 2 0 0 0 2 2h14M18 22V8a2 2 0 0 0-2-2H2"/>',
  mail:'<rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 5L2 7"/>',
  apple:'<path d="M12 20.94c1.5 0 2.75 1.06 4 1.06 3 0 6-8 6-12.22A4.91 4.91 0 0 0 17 5c-2.22 0-4 1.44-5 2-1-.56-2.78-2-5-2a4.9 4.9 0 0 0-5 4.78C2 14 5 22 8 22c1.25 0 2.5-1.06 4-1.06Z"/>',
  play:'<path d="m5 3 14 9-14 9z"/>'
};
const ic=(n,s=20,w=1.9)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[n]}</svg>`;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tok=s=>/\{\{/.test(s)?`<span class="tok">${esc(s)}</span>`:esc(s);
const hash=s=>{let h=7;for(const ch of s)h=(h*31+ch.charCodeAt(0))>>>0;return h};

/* ---------- quiz data (modeled on appnebula.co/palmistry, 2026-09-30) ---------- */
const GENDER={m:['👨','Male'],f:['👩','Female'],x:['✨','Non-binary']};
const HAND={right:['✋','Right'],left:['🤚','Left'],both:['🙌','Both']};
const GOAL={love:['❤️','Love & emotions'],mind:['🧠','Mind & decisions'],health:['🌿','Health & vitality'],career:['💼','Career & destiny'],curious:['🔮','Just curious']};
const LINES={deep:['〰️','Deep and clear'],faint:['🌫️','Faint'],broken:['⛓️','Broken or chained'],mix:['🌀','A mix of these']};
const FINGERS={long:['☝️','They seem long'],short:['👌','They seem short'],avg:['🖐️','About average']};
const TEXTURE={soft:['🪶','Soft and smooth'],rough:['🪨','Rough and dry'],firm:['💪','Firm and elastic']};
const EXP={self:['📖','Yes, on my own'],pro:['🧙','Yes, with a reader'],never:['🌱','Never tried']};
const FEEL={opt:['😊','Optimistic'],cautious:['🤞','Cautious but hopeful'],anx:['😬','A little anxious']};
const MAINLINE={heart:['❤️','Heart line'],head:['🧠','Head line'],life:['🌿','Life line'],fate:['💰','Fate & money line'],marriage:['💍','Marriage line']};
const INLINE=['Are you an adventurous person?','Do you enjoy time spent alone?','Have you tried rituals or remedies before?'];
const SIGNS=[['Capricorn',1,19],['Aquarius',2,18],['Pisces',3,20],['Aries',4,19],['Taurus',5,20],['Gemini',6,20],['Cancer',7,22],['Leo',8,22],['Virgo',9,22],['Libra',10,22],['Scorpio',11,21],['Sagittarius',12,21],['Capricorn',12,31]];
const sun=()=>{const m=+S.dob.m,d=+S.dob.d;if(!m||!d)return '';for(const[s,mm,dd]of SIGNS)if(m<mm||(m===mm&&d<=dd))return s;return 'Capricorn'};
/* reading copy: one variant per line, keyed off the answers (deterministic, not a real vision read — see brief) */
const READ={
 heart:[['Curved and long','You love openly and remember every kindness. You need a partner who says it out loud.'],['Straight and steady','You love through loyalty and actions, not words. Slow to open, hard to shake.'],['Forked at the end','You balance heart and head in love. Two paths are open to you this year.']],
 head:[['Long and gently sloping','Imaginative thinker. Your best decisions come after you sleep on them.'],['Straight across the palm','Clear, practical mind. You spot the flaw in a plan before anyone else.']],
 life:[['Wide arc around the thumb','Strong reserves of energy. You recover fast when life knocks you down.'],['Close to the thumb','You guard your energy. Rest is your superpower, not a weakness.']],
 fate:[['Rising from the wrist','You build your own path. A career turn is visible in your late thirties.'],['Starting mid-palm','Your direction arrives later and lands strongly. Success follows a decision, not luck.']],
 marriage:[['One clear line','One deep, lasting bond is written in your hand.'],['Two short lines','Two meaningful relationships shape how you love.']]
};
const LINEMETA={heart:['Heart line','var(--l-heart)','#F29A8A'],head:['Head line','var(--l-head)','#8FB8FF'],life:['Life line','var(--l-life)','#7FD1A8'],fate:['Fate & money line','var(--l-fate)','#E9C26B'],marriage:['Marriage line','var(--l-marriage)','#D9A8FF']};
const readFor=k=>{const v=READ[k];return v[hash(k+S.dob.y+S.dob.m+S.dob.d+S.lines+S.fingers)%v.length]};

/* palm template in a 100x130 box: outline, finger tips, and the five lines */
const HANDP='M31 125 C29 107 25 95 24 80 L22 52 C21.5 47 28 46 29 51 L32 73 L31 36 C30.5 30 38 30 38.5 36 L41 69 L42 28 C42 22 50 22 50 28 L51 68 L54 33 C54.5 27 62 28 61.5 34 L60 73 C64 66 69 59 75 56 C80 54 83 59 79 64 C72 73 68 84 66 95 C64 106 64 116 65 125';
const TIPS=[[25,50,'Thumb'],[34.5,33,'Index finger'],[46,25,'Middle finger'],[57.8,31,'Ring finger'],[77,58,'Little finger']];
const PATHS={heart:'M26 76 C35 73.5 46 70.5 59 64.5',head:'M63 80 C53 82 41 86 29 92',life:'M62 79 C54 90 52 105 55 122',fate:'M46 122 C46 107 47 95 48 84',marriage:'M58.5 67 C60.5 66.4 62 66.2 63.5 66.5'};
function palmSVG(w=150,{draw=false,only=null}={}){
  const ks=only||Object.keys(PATHS);
  return `<svg class="palmsvg" viewBox="0 0 100 130" width="${w}" height="${w*1.3}" aria-hidden="true"><path class="out" d="${HANDP}"/>${ks.map((k,i)=>`<path class="ln ${draw?'dr':''}" d="${PATHS[k]}" stroke="${LINEMETA[k][2]}" pathLength="1" style="animation-delay:${i*.35}s"/>`).join('')}</svg>`}

const INIT=()=>({i:1,hist:[],v:QS.get('v')==='B'?'B':'A',gender:'',hand:'',goal:'',dob:{m:'',d:'',y:''},lines:'',fingers:'',texture:'',exp:'',feel:'',main:'',inline:{},photo:null,photoErr:'',photoWarn:'',box:null,email:'',emailErr:'',consent:false,plan:CONFIG.defaultPlan,paid:false,completed:false});
let S=INIT();
const t=(a,b)=>S.v==='B'?b:a;
const SCREENS={1:'hook',2:'gender',3:'hand',4:'goal',5:'goal_set',6:'dob',7:'line_depth',8:'palm_intro',9:'fingers',10:'texture',11:'experience',12:'feeling',13:'sign_bridge',14:'main_line',15:'scan_guide',16:'upload',17:'analysis',18:'line_trace',19:'report_teaser',20:'email',21:'paywall',22:'get_app'};
const QN=[2,3,4,6,7,9,10,11,12,14];

const app=document.getElementById('app');
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
let timers=[];const later=(f,ms)=>{const id=setTimeout(f,ms);timers.push(id);return id};
const clearT=()=>{timers.forEach(clearTimeout);timers=[];clearInterval(window.__iv)};

/* ---------- tracking (never the photo, email or typed text) ---------- */
function snapshot(){return {screen:S.i,screenName:SCREENS[S.i],variant:S.v,gender:S.gender||null,hand:S.hand||null,goal:S.goal||null,sunSign:sun()||null,lineDepth:S.lines||null,fingers:S.fingers||null,texture:S.texture||null,experience:S.exp||null,feeling:S.feel||null,mainLine:S.main||null,inline:Object.assign({},S.inline),hasPhoto:!!S.photo,handFound:!!S.box,plan:S.plan,paid:S.paid}}
function emit(name,detail){
  let data={};try{data=snapshot()}catch(e){}
  const d=Object.assign({},detail||{},{data});
  try{window.dispatchEvent(new CustomEvent('ikfunnel:'+name,{detail:d}))}catch(e){}
  try{window.parent.postMessage({source:'ikame-funnel',funnel:CONFIG.funnel,event:name,detail:d},'*')}catch(e){}
  const f=Object.assign({funnel:CONFIG.funnel},data,detail||{});
  try{if(typeof window.fbq==='function')window.fbq('trackCustom',name,f)}catch(e){}
  try{if(window.ttq&&typeof window.ttq.track==='function')window.ttq.track(name,f)}catch(e){}
  if(DEBUG)try{console.log('[ikfunnel]',name,JSON.stringify(detail||{}))}catch(e){}
}
const answer=(k,v)=>emit('answer',{key:k,value:v});
function navTop(h){try{window.top.location.href=h}catch(e){location.href=h}}
function checkout(){
  const url=CONFIG.checkoutUrl[S.plan]||'';emit('checkout_click',{plan:S.plan,url});
  if(!url)return;let u;try{u=new URL(url,location.href)}catch(e){return}
  u.searchParams.set('plan',S.plan);if(S.email)u.searchParams.set('email',S.email);PASS.forEach(k=>{const v=QS.get(k);if(v&&!u.searchParams.has(k))u.searchParams.set(k,v)});navTop(u.toString());
}
function appLink(){const ua=navigator.userAgent||'';return CONFIG.appUrl||(/android/i.test(ua)?CONFIG.playStoreUrl:CONFIG.appStoreUrl)}
const legal=()=>`<div class="legal"><a ${CONFIG.termsUrl?`href="${esc(CONFIG.termsUrl)}" target="_blank" rel="noopener"`:''}>Terms of Use</a><a ${CONFIG.privacyUrl?`href="${esc(CONFIG.privacyUrl)}" target="_blank" rel="noopener"`:''}>Privacy Policy</a>${CONFIG.subscriptionTermsUrl?`<a href="${esc(CONFIG.subscriptionTermsUrl)}" target="_blank" rel="noopener">Subscription terms</a>`:''}</div>`;

function viewed(){emit('screen_view',{index:S.i,name:SCREENS[S.i]});if(S.i===21)emit('paywall_view');if(S.i===IK_GET&&!S.completed){S.completed=true;emit('complete',{paid:S.paid})}}
function go(n,push=true){if(S.i===IK_DOB&&n>S.i&&!S.u18&&S.dob&&S.dob.m&&S.dob.d&&S.dob.y&&ikAge(S.dob)<18){ikBlock();return}clearT();if(push&&S.i!==n)S.hist.push(S.i);S.i=n;render(true);viewed()}
const next=()=>go(S.i+1);
function back(){clearT();const p=S.hist.pop();if(p){S.i=p;render(true);viewed()}}

/* ---------- blocks ---------- */
function nav(){
  if(S.i===1||S.i===13||S.i>=17)return '';
  const k=QN.indexOf(S.i),p=k<0?Math.round(QN.filter(x=>x<S.i).length/QN.length*100):Math.round((k+1)/QN.length*100);

}
const cta=(l,ok=true,a='next')=>`<button class="btn" data-a="${a}" ${ok?'':'disabled'}>${l}</button>`;
const opts=(f,o)=>`<div class="opts">${Object.entries(o).map(([k,[e,l]])=>`<button class="opt ${S[f]===k?'on':''}" data-a="pick" data-f="${f}" data-v="${k}" aria-pressed="${S[f]===k}"><span class="well">${e}</span><span class="lbl">${l}</span></button>`).join('')}</div>`;
const q=(h,b)=>`<div><h1 class="display sm">${h}</h1>${b?`<p class="lead" style="margin-top:8px">${b}</p>`:''}</div>`;
const photoImg=(cls='')=>S.photo?`<img class="${cls}" src="${S.photo.url}" alt="Your palm photo">`:`<img class="${cls}" src="${im('img/scan-hand.jpg')}" alt="">`;
/* overlay mapped onto the detected hand box (or the centre of the frame) of a 3:4 preview */
function overlay({tips=0,lines=[],draw=true}={}){
  const b=S.box||{x:.14,y:.08,w:.72,h:.86};
  const sx=b.w*300/100,sy=b.h*400/130,tx=b.x*300,ty=b.y*400;
  const mir=S.hand==='left';   /* a left palm facing the camera has the thumb on the right */
  return `<svg class="ov" viewBox="0 0 300 400" preserveAspectRatio="xMidYMid slice"><g transform="translate(${mir?tx+b.w*300:tx} ${ty}) scale(${mir?-sx:sx} ${sy})">
   ${TIPS.slice(0,tips).map(([x,y],i)=>`<circle class="fd ${i===tips-1?'pop':''}" cx="${x}" cy="${y}" r="1.6"/>`).join('')}
   ${lines.map((k,i)=>`<path class="ln ${draw&&i===lines.length-1?'dr':''}" d="${PATHS[k]}" stroke="${LINEMETA[k][2]}" pathLength="1"/>`).join('')}
  </g></svg>`;
}

/* ---------- web paywall blocks ---------- */
const todayLine=()=>{const P=CONFIG.plans;return `${tok(P['1w'].intro)} today`};
function planBlock(id){const P=CONFIG.plans;

/* ---------- photo handling: validate → detect hand box → preview ---------- */
async function takeFile(f){
  if(!f)return;
  S.photoErr='';S.photoWarn='';
  if(!/^image\//.test(f.type)&&!/\.(heic|heif|jpe?g|png|webp)$/i.test(f.name)){S.photoErr="That file isn't a photo. Try a JPG or PNG.";render();return}
  if(f.size>CONFIG.maxUploadMB*1024*1024){S.photoErr=`That photo is over ${CONFIG.maxUploadMB} MB. Try a smaller one.`;render();return}
  const url=URL.createObjectURL(f);
  const img=new Image();img.decoding='async';
  img.onerror=()=>{URL.revokeObjectURL(url);S.photoErr="We couldn't open that photo. Try a JPG or PNG (HEIC may not open in every browser).";emit('upload_error',{reason:'decode'});render()};
  img.onload=()=>{
    dropPhoto();S.photo={url,file:f,w:img.naturalWidth,h:img.naturalHeight};
    const r=analyse(img);S.box=r.box;
    if(r.lum<45)S.photoWarn="It looks dark. Lines read best in bright, even light.";
    else if(!r.box)S.photoWarn="We can't clearly see a palm. Make sure your whole open hand is in the photo.";
    emit('upload',{ok:!S.photoWarn,handFound:!!r.box,dark:r.lum<45});render();
  };
  img.src=url;
}
/* rough skin-tone mask on a small canvas → bounding box of the hand in the 3:4 cover-cropped preview */
function analyse(img){
  const W=90,H=120,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d',{willReadFrequently:true});
  const s=Math.max(W/img.naturalWidth,H/img.naturalHeight),dw=img.naturalWidth*s,dh=img.naturalHeight*s;
  x.drawImage(img,(W-dw)/2,(H-dh)/2,dw,dh);
  let d;try{d=x.getImageData(0,0,W,H).data}catch(e){return {lum:128,box:null}}
  let lum=0,n=0,x0=W,y0=H,x1=0,y1=0;
  for(let j=0;j<H;j++)for(let i=0;i<W;i++){const k=(j*W+i)*4,r=d[k],g=d[k+1],b=d[k+2];lum+=.299*r+.587*g+.114*b;
    const mx=Math.max(r,g,b),mn=Math.min(r,g,b);
    if(r>60&&g>30&&b>15&&r>g&&r>b&&mx-mn>12&&Math.abs(r-g)>8){n++;if(i<x0)x0=i;if(i>x1)x1=i;if(j<y0)y0=j;if(j>y1)y1=j}}
  lum/=W*H;
  const frac=n/(W*H);
  if(frac<.08||x1-x0<W*.3||y1-y0<H*.35)return {lum,box:null};
  /* the mask runs down the wrist/arm: keep a hand-shaped box (template is 100x130 in a 300x400 frame) from the fingertips down */
  const bw=(x1-x0)/W,bh=Math.min((y1-y0)/H,bw*.975);
  return {lum,box:{x:x0/W,y:y0/H,w:bw,h:bh}};
}
function dropPhoto(){if(S.photo&&S.photo.url)try{URL.revokeObjectURL(S.photo.url)}catch(e){}S.photo=null;S.box=null}

    if(ask<3&&p>=stops[ask]){clearInterval(window.__iv);const k=ask;app.querySelector('.view').insertAdjacentHTML('beforeend',`<div class="iq" id="iq"><div class="in"><div class="bigwell" style="width:64px;height:64px">${ic('spark',28)}</div><b>${INLINE[k]}</b><div class="row"><button class="btn ghost" data-a="iq" data-k="${k}" data-v="no">No</button><button class="btn" data-a="iq" data-k="${k}" data-v="yes">Yes</button></div></div></div>`);ask++;return}
    if(p>=100){clearInterval(window.__iv);later(next,600)}};
  window.__resume=()=>{clearInterval(window.__iv);window.__iv=setInterval(tick,RM?5:70)};window.__resume()}
function run18(){const steps=[...TIPS.map((t,i)=>['tip',i,t[2]]),...['life','head','heart','marriage','fate'].map(k=>['line',k,LINEMETA[k][0]])];let k=0,tips=0,lines=[];
  const el=document.getElementById('trace');
  const step=()=>{if(!document.getElementById('trace'))return;if(k>=steps.length){later(next,900);return}
    const [ty,v,l]=steps[k++];if(ty==='tip')tips=v+1;else lines.push(v);
    document.getElementById('what').textContent=l;document.getElementById('abar').style.width=Math.round(k/steps.length*100)+'%';
    el.querySelector('svg.ov').outerHTML=overlay({tips,lines});later(step,ty==='tip'?650:1100)};
  later(step,500)}

function render(anim){
  const v=document.createElement('div');v.className='view'+(anim&&!RM?' in':'');v.innerHTML=S.u18?u18View():nav()+V[S.i]();
  const old=app.querySelector('.view');if(old)old.replaceWith(v);else app.appendChild(v);
  if(S.i===13)run13();if(S.i===17)run17();if(S.i===18)run18();
  if(S.i===16)bindUpload(v);
  if(S.i===21)bindPaywall(v);
  
}
function bindPaywall(v){
  const wp=v.querySelector('#wp'),st=v.querySelector('#sticky'),blocks=[...v.querySelectorAll('.pick')];
  if(!wp||!('IntersectionObserver' in window)){st&&st.classList.add('show');return}
  const vis=new Set();
  const io=new IntersectionObserver(es=>{es.forEach(e=>e.isIntersecting?vis.add(e.target):vis.delete(e.target));st.classList.toggle('show',!vis.size&&wp.scrollTop>40)},{root:wp,threshold:.25});
  blocks.forEach(b=>io.observe(b));
  wp.addEventListener('scroll',()=>{wp.classList.toggle('scrolled',wp.scrollTop>260);st.classList.toggle('show',!vis.size&&wp.scrollTop>40)},{passive:true});
}
function bindUpload(v){
  v.querySelectorAll('input[type=file]').forEach(fi=>fi.addEventListener('change',()=>{const f=fi.files&&fi.files[0];emit('upload_pick',{source:fi.id==='pc'?'camera':'gallery'});takeFile(f);fi.value=''}));
  const d=v.querySelector('#drop');if(!d)return;
  ['dragenter','dragover'].forEach(e=>d.addEventListener(e,ev=>{ev.preventDefault();d.classList.add('over')}));
  ['dragleave','drop'].forEach(e=>d.addEventListener(e,ev=>{ev.preventDefault();d.classList.remove('over')}));
  d.addEventListener('drop',ev=>{const f=ev.dataTransfer.files&&ev.dataTransfer.files[0];emit('upload_pick',{source:'drop'});takeFile(f)});
}

    case 'plan':{S.plan=v;emit('plan_select',{plan:v});

    case 'toplans':document.getElementById('plans1')?.scrollIntoView({block:'start'});break;
    case 'pay':checkout();break;
    case 'closepw':break;   /* hard paywall: no exit without purchase */
    case 'offerbuy':S.offerSeen=true;{const u=CONFIG.offer.checkoutUrl||'';emit('offer_accept',{price:CONFIG.offer.price,url:u});emit('checkout_click',{plan:'offer',url:u});if(u)try{const x=new URL(u,location.href);x.searchParams.set('plan','offer');if(S.email)x.searchParams.set('email',S.email);PASS.forEach(k=>{const v=QS.get(k);if(v&&!x.searchParams.has(k))x.searchParams.set(k,v)});navTop(x.toString())}catch(e){}}break;
    case 'offerno':S.offerSeen=true;emit('offer_decline');go(23);break;
    case 'topw':go(21);break;
    case 'app':{const u=appLink();emit('app_handoff',{url:u});if(u)navTop(u);else toast('App link coming soon');break}
  }
});

/* stars */
(function(){const cv=document.getElementById('stars'),cx=cv.getContext('2d');let w,h;const P=[];
  function size(){const r=app.getBoundingClientRect(),d=Math.min(2,devicePixelRatio||1);w=r.width;h=r.height;cv.width=w*d;cv.height=h*d;cx.setTransform(d,0,0,d,0,0)}
  size();addEventListener('resize',size);for(let i=0;i<70;i++)P.push({x:Math.random(),y:Math.random(),r:Math.random()*1.2+.2,p:Math.random()*6});
  (function f(now){cx.clearRect(0,0,w,h);for(const s of P){cx.globalAlpha=.25+.5*(.5+.5*Math.sin(now/1400+s.p));cx.fillStyle=s.r>1.1?'#E9C26B':'#F6F3EA';cx.beginPath();cx.arc(s.x*w,s.y*h,s.r,0,6.28);cx.fill()}if(!RM)requestAnimationFrame(f)})(0);
})();
