<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Soulmate Sketch Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600&family=Caveat:wght@600&display=swap">
<style>
:root{
  color-scheme:dark;
  --ground:#0E111A;
  --bg:#161A27;--bg-elev:#1C2131;--surface:#212739;--surface-2:#2A3147;--border:#3A4260;
  --t1:#F6F3EA;--t2:#B5B9C9;--t3:#7C8298;
  --acc:#E9C26B;--acc-dim:#E9C26B2E;--btn-text:#161A27;--gold-lm:#8A6410;
  --grad:linear-gradient(100deg,#F4DA96 0%,#E9C26B 50%,#C99A3A 100%);
  --gold:#E9C26B;--rose:#E8BF5F;--neg:#F29A8A;--pos:#7FD1A8;
  --serif:"Fraunces",Georgia,"Times New Roman",serif;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--ground);background-image:radial-gradient(ellipse 60% 40% at 30% 0%,#1E2539 0%,transparent 70%);color:var(--t1);font:15px/1.45 var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.wrap{display:flex;gap:48px;justify-content:center;align-items:flex-start;padding-block:32px 48px;padding-inline:16px}
.phonebox{--k:1;width:calc(412px*var(--k));height:calc(834px*var(--k));position:relative;flex:none}
.phone{position:absolute;left:calc(11px*var(--k));top:calc(11px*var(--k));width:390px;height:812px;transform:scale(var(--k));transform-origin:0 0;border-radius:52px;background:radial-gradient(ellipse 120% 60% at 50% 0%,#1D2235 0%,var(--bg) 60%);border:1px solid #2B334F;box-shadow:0 0 0 10px #0E111B,0 0 0 11px #2B334F,0 40px 80px -20px #000;overflow:hidden;isolation:isolate}
#stars{position:absolute;inset:0;width:100%;height:100%;z-index:0;display:block}
.stage{position:absolute;inset:0;z-index:1;overflow:hidden}
.view{position:absolute;inset:0;padding-top:50px;display:flex;flex-direction:column}
.view.out{animation:vout .22s ease forwards;pointer-events:none}
.view.in{animation:vin .32s ease both}
@keyframes vout{to{opacity:0}}
@keyframes vin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.status{height:50px;display:flex;align-items:center;justify-content:space-between;padding:6px 30px 0;font-weight:600;font-size:15px;position:absolute;top:0;left:0;right:0;z-index:10;pointer-events:none}
.status .dots{display:flex;gap:5px;align-items:center}
.status .dots i{display:block;width:17px;height:10px;border-radius:3px;border:1.5px solid var(--t1)}
.status .dots b{display:block;width:4px;height:10px;background:var(--t1);border-radius:1px}
.nav{height:44px;flex:none;display:flex;align-items:center;gap:12px;padding:0 16px;position:relative;z-index:3}
.iconbtn{width:36px;height:36px;border-radius:50%;border:none;background:transparent;display:grid;place-items:center;color:var(--t2);flex:none}
.iconbtn:hover{background:var(--surface)}
.prog{flex:1;height:4px;border-radius:2px;background:var(--surface-2);overflow:hidden}
.prog span{display:block;height:100%;background:var(--grad);border-radius:2px;transition:width .35s ease}
.navspacer{width:36px}
.scr{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 20px 12px;display:flex;flex-direction:column;gap:18px;position:relative;scrollbar-width:none}
.scr::-webkit-scrollbar{display:none}
.scr.center{justify-content:center}
.foot{flex:none;padding:10px 20px 28px;display:flex;flex-direction:column;gap:10px;position:relative;z-index:2}
.note{font-size:12px;color:var(--t3);text-align:center;text-wrap:balance}
.sky{position:absolute;inset:0 0 auto 0;height:340px;z-index:0;pointer-events:none;background:radial-gradient(ellipse 80% 70% at 50% 0%,#97701655 0%,#2A334F33 45%,transparent 100%)}
.z{position:relative;z-index:1}
.display{font:600 30px/1.12 var(--serif);letter-spacing:-.01em;margin:0;text-wrap:balance}
.display.xl{font-size:36px}
.display.sm{font-size:26px}
.lead{color:var(--t2);margin:0;font-size:15px;text-wrap:pretty}
.eyebrow{font:600 12px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--acc)}
.badge{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:var(--acc-dim);color:var(--acc);font:500 13px/1 var(--sans)}
.tc{text-align:center}.tc .badge{align-self:center}
.btn{height:54px;border-radius:999px;border:none;background:var(--grad);color:var(--btn-text);font:600 16px/1 var(--sans);width:100%;display:flex;align-items:center;justify-content:center;gap:10px;transition:transform .12s ease,opacity .2s;flex:none}
.btn:active{transform:scale(.98)}
.btn[disabled]{background:var(--surface-2);color:var(--t3);cursor:not-allowed}
.btn.ghost{background:var(--surface);color:var(--t1);border:1px solid var(--border)}
.btn.light{background:var(--t1);color:#0E111B}
.btn.black{background:#000;color:#fff;border:1px solid #3a3a3a}
.btn:not([disabled]):not(.ghost):not(.light):not(.black){position:relative;overflow:hidden;box-shadow:0 8px 28px -10px #DFA620aa}
.btn:not([disabled]):not(.ghost):not(.light):not(.black)::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:0;background:linear-gradient(100deg,transparent,#ffffff55,transparent);transform:translateX(-150%) skewX(-20deg);animation:sheen 4.5s ease-in-out 1.2s infinite}
@keyframes sheen{0%{transform:translateX(-150%) skewX(-20deg)}28%,100%{transform:translateX(320%) skewX(-20deg)}}
.link{background:none;border:none;color:var(--t2);font-size:14px;padding:6px;text-align:center;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--border)}
.link:hover{color:var(--t1)}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:14px;padding:11px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--border);text-align:left;width:100%;transition:border-color .15s,background .15s}
.opt:hover{border-color:#A97E18}
.opt .well{width:36px;height:36px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;flex:none;font-size:18px;line-height:1}
.opt .lbl{flex:1;font-weight:500;font-size:16px}
.opt .chk{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--border);display:grid;place-items:center;flex:none;color:#fff}
.opt.on{border-color:transparent;background:var(--grad)}
.opt.on .well{background:#ffffff2e}
.opt.on .chk{background:#fff;border-color:#fff;color:var(--gold-lm)}
.opts.cards .opt{border-radius:18px;padding:14px}
.opts.cards .opt .well{box-shadow:0 0 16px #E3B03A55;background:radial-gradient(circle,#E3B03A40,var(--surface-2))}
.opts.cards .opt.on{background:linear-gradient(0deg,var(--acc-dim),var(--acc-dim)),var(--surface);border:1.5px solid #E5B649}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{display:flex;flex-direction:column;gap:7px}
.field label{font:500 13px/1 var(--sans);color:var(--t2)}
.box{height:54px;border-radius:14px;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;padding:0 14px;gap:10px;color:var(--t3)}
.box.white{background:#F7F4EC;border-color:#F7F4EC;color:var(--gold-lm)}
.box.white input{color:#161A28}
.box.white input::placeholder{color:#DFA722}
.box:focus-within{border-color:var(--acc)}
.box.bad{border-color:var(--neg)}
.box input,.box select{flex:1;min-width:0;height:100%;background:transparent;border:none;outline:none;color:var(--t1);font:400 16px var(--sans)}
.box select{appearance:none;cursor:pointer}
.box select option{background:var(--surface);color:var(--t1)}
.row3{display:grid;grid-template-columns:1.4fr 1fr 1.2fr;gap:8px}
.err{font-size:13px;color:var(--neg)}
.err button{color:var(--t1)}
.hint{font-size:13px;color:var(--t3)}
.results{border-radius:14px;background:var(--surface);border:1px solid var(--border);overflow:hidden}
.results button{display:flex;gap:10px;align-items:center;width:100%;padding:11px 14px;background:none;border:none;border-top:1px solid var(--border);text-align:left;color:var(--t1)}
.results button:first-child{border-top:none}
.results button:hover{background:var(--surface-2)}
.results small{color:var(--t3)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border-radius:999px;background:var(--surface);border:1px solid var(--border);font-weight:500;font-size:14px}
.chip.on{background:var(--grad);border-color:transparent;color:var(--btn-text)}
.chip.sm{font-size:12px;padding:5px 10px;color:var(--t2)}
.card{padding:14px;border-radius:18px;background:var(--surface);border:1px solid var(--border)}
.card h4{margin:0 0 3px;font-size:15px;font-weight:600}
.card p{margin:0;color:var(--t2);font-size:14px}
.card .sub{font-size:12px;color:var(--t3)}
.card.dash{border-style:dashed}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:12px;align-items:center}
.lockrow{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--border);color:var(--t2);font-size:14px}
.lockrow .l{margin-left:auto;color:var(--acc)}
.promise{display:flex;gap:14px;align-items:center;padding:13px 0;border-top:1px solid var(--border)}
.promise:first-child{border-top:none}
.promise .well,.iw{width:36px;height:36px;border-radius:50%;background:var(--acc-dim);color:var(--acc);display:grid;place-items:center;flex:none;font-size:17px}
.bigwell{width:84px;height:84px;border-radius:50%;background:radial-gradient(circle,#E3B03A55,transparent 70%),var(--surface);border:1px solid var(--border);display:grid;place-items:center;color:var(--acc);align-self:center;box-shadow:0 0 40px #E3B03A55}
.steps{display:flex;flex-direction:column;gap:13px}
.step .top{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--t2);margin-bottom:6px;gap:10px}
.step .top .pct{font-variant-numeric:tabular-nums;color:var(--t3);display:flex;gap:6px;align-items:center}
.step.done .top{color:var(--t1)}
.step.done .pct{color:var(--acc)}
.bar{height:4px;border-radius:2px;background:var(--surface-2);overflow:hidden}
.bar span{display:block;height:100%;background:var(--grad);width:0}
.dim{position:absolute;inset:0;background:#06070ACC;z-index:4}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:5;background:var(--bg-elev);border-radius:28px 28px 0 0;border-top:1px solid var(--border);padding:10px 20px 30px;display:flex;flex-direction:column;gap:14px;animation:up .35s cubic-bezier(.2,.8,.2,1)}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--border);align-self:center}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.closex{position:absolute;top:54px;right:16px;z-index:3;width:34px;height:34px;border-radius:50%;background:#0E111BAA;border:1px solid var(--border);display:grid;place-items:center;color:var(--t2)}
.checks{display:flex;flex-direction:column;gap:8px;font-size:14px;color:var(--t1)}
.checks div{display:flex;gap:10px;align-items:flex-start}
.checks svg{color:var(--acc);flex:none;margin-top:2px}
.plan{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:18px;border:1px solid var(--border);background:var(--surface);text-align:left;width:100%;position:relative}
.plan .radio{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--border);display:grid;place-items:center;flex:none;color:#fff}
.plan.on{border:1.5px solid #E6B951;background:linear-gradient(0deg,var(--acc-dim),var(--acc-dim)),var(--surface)}
.plan.on .radio{background:var(--grad);border-color:transparent}
.plan .pn{font-weight:600;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.plan .pp{font-size:13px;color:var(--t1);font-variant-numeric:tabular-nums;display:block;margin-top:2px}
.plan .ps{font-size:11px;color:var(--t3);display:block;margin-top:2px}
.save{font:600 10px/1 var(--sans);letter-spacing:.05em;background:var(--grad);color:var(--btn-text);padding:4px 7px;border-radius:6px}
.tok{font-family:ui-monospace,Consolas,monospace;font-size:.86em;color:var(--gold);background:#E9C26B14;border:1px dashed #E9C26B77;border-radius:5px;padding:0 4px;white-space:nowrap}
.legal{display:flex;justify-content:center;gap:14px;font-size:12px;color:var(--t3);flex-wrap:wrap}
.legal button{background:none;border:none;color:inherit;padding:0;font-size:12px;text-decoration:underline;text-decoration-color:var(--border)}
.trust{font-size:12px;color:var(--t2);text-align:center;line-height:1.5}
.cardform{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cardform .box{height:46px;font-size:14px}
.cardform .box:first-child{grid-column:1/-1}
.paybtns{display:flex;flex-direction:column;gap:8px}
.or{display:flex;align-items:center;gap:10px;color:var(--t3);font-size:12px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--border)}
.checkbox{display:flex;gap:10px;align-items:flex-start;background:none;border:none;text-align:left;color:var(--t2);font-size:13px;padding:0}
.checkbox .cb{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--border);flex:none;display:grid;place-items:center;color:#fff}
.checkbox.on .cb{background:var(--grad);border-color:transparent}
.toast{position:absolute;left:50%;top:60px;transform:translateX(-50%);z-index:20;background:var(--t1);color:#0E111B;font-size:13px;font-weight:500;padding:9px 14px;border-radius:999px;white-space:nowrap;animation:fade 2.6s ease forwards;box-shadow:0 8px 24px #0008}
@keyframes fade{0%{opacity:0;transform:translate(-50%,-6px)}10%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
.fadein{animation:fi .35s ease both}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.fseq>*{animation:fi .45s ease both}
.fseq>*:nth-child(2){animation-delay:.35s}.fseq>*:nth-child(3){animation-delay:.7s}.fseq>*:nth-child(4){animation-delay:1.05s}.fseq>*:nth-child(5){animation-delay:1.4s}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.55}}
.blurred{filter:blur(6px);user-select:none}
.mock{width:210px;height:380px;border-radius:30px;border:6px solid #22283E;background:var(--bg);align-self:center;overflow:hidden;position:relative;box-shadow:0 20px 50px -10px #000,0 0 40px #E3B03A33;display:flex;flex-direction:column;gap:8px;padding:22px 10px 10px;flex:none}
.mock .mrow{padding:9px 10px;border-radius:12px;background:var(--surface);border:1px solid var(--border);font-size:11px;color:var(--t2)}
.mock .mrow b{display:block;color:var(--t1);font-size:12px;margin-bottom:2px}
.stores{display:flex;gap:8px;justify-content:center}
.store{display:flex;align-items:center;gap:7px;height:40px;padding:0 12px;border-radius:10px;background:#000;border:1px solid #444;font-size:11px;line-height:1.1;text-align:left;color:#fff}
.store b{display:block;font-size:13px}
.qr{display:flex;gap:10px;align-items:center;justify-content:center;font-size:11px;color:var(--t3)}
.qr svg{background:#fff;border-radius:6px;padding:3px}
.tips{position:absolute;z-index:6;left:12px;right:12px;padding:12px 14px;border-radius:14px;background:var(--t1);color:#161A28;font-size:13px;box-shadow:0 10px 30px #000a;animation:fi .25s ease}
.demo-chips{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.demo-chips button{font-size:11px;padding:4px 9px;border-radius:999px;background:none;border:1px dashed var(--border);color:var(--t3)}
/* flat map */
.map{display:block;width:100%;height:auto;border-radius:16px;background:radial-gradient(ellipse at 50% 40%,#20263B,#111520);border:1px solid var(--border)}
.map .land{fill:#B8881A}
.map .ln{fill:none;stroke-width:2;stroke-linecap:round}
.map .ln.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:mdraw 1.6s ease forwards}
@keyframes mdraw{to{stroke-dashoffset:0}}
.map .pin{fill:#fff}
.map .ping{fill:none;stroke:#fff;transform-box:fill-box;transform-origin:center;animation:ping 2s ease-out infinite}
@keyframes ping{from{opacity:.9;transform:scale(.4)}to{opacity:0;transform:scale(2.4)}}
/* panel */
.panel{width:340px;max-width:100%;display:flex;flex-direction:column;gap:24px;padding-top:8px}
.panel h1{font:600 28px/1.1 var(--serif);margin:0 0 8px}
.panel .intro{color:var(--t2);margin:0;font-size:14px}
.panel code{font-size:12px;color:var(--acc)}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:999px;padding:3px;background:var(--surface)}
.seg button{border:none;background:none;padding:7px 14px;border-radius:999px;font-size:13px;color:var(--t2);font-weight:500}
.seg button.on{background:var(--grad);color:#fff}
.ctrls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ctrls .restart{border:1px solid var(--border);background:none;border-radius:999px;padding:8px 14px;font-size:13px;color:var(--t2)}
.ctrls .restart:hover{color:var(--t1);border-color:#A97E18}
.plabel{font:600 11px/1 var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--t3);margin-bottom:10px}
.flow{display:flex;flex-direction:column;gap:12px}
.flow .grp{display:flex;flex-direction:column;gap:1px}
.flow .gname{font-size:12px;color:var(--acc);margin-bottom:4px;font-weight:500}
.flow button{display:flex;gap:10px;align-items:baseline;background:none;border:none;text-align:left;padding:4px 8px;border-radius:8px;color:var(--t2);font-size:13px;width:100%}
.flow button:hover{background:var(--surface);color:var(--t1)}
.flow button.on{background:var(--surface-2);color:var(--t1)}
.flow button .n{font-variant-numeric:tabular-nums;color:var(--t3);width:18px;flex:none;text-align:right}
.flow button .tag{margin-left:auto;font-size:10px;color:var(--t3);border:1px solid var(--border);border-radius:4px;padding:1px 5px;flex:none}
.flow button.skip{opacity:.4}
.data{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px;margin:0}
.data dt{color:var(--t3)}
.data dd{margin:0;color:var(--t1);overflow-wrap:anywhere}
.foot-note{font-size:12px;color:var(--t3);margin:0}
@media (max-width:820px){
  .wrap{flex-direction:column;align-items:center;gap:32px;padding-block:20px 40px}
  .panel{width:390px}
}
/* last-chance offer (fallback / "upsell on decline"): shown once when the paywall is left without paying */
.wp{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;position:relative;z-index:1;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.wp::-webkit-scrollbar{display:none}
.wbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:8px 16px 10px;background:#161A27e6;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid #ffffff10}
.wbar .brand{flex:1;display:flex;align-items:center;gap:7px;font:600 15px var(--serif);letter-spacing:.02em;color:var(--t1)}
.wbar .brand svg{color:var(--acc)}
.wbar .x{width:40px;height:40px;border-radius:50%;border:1px solid var(--border);background:transparent;color:var(--t3);display:grid;place-items:center}
.wsec{padding:28px 18px 0}.wsec.tight{padding-top:16px}
.wp .eyebrow{display:block;margin-bottom:10px;font-size:11.5px;letter-spacing:.12em}
.wp .display em{font-style:normal;color:var(--acc)}
.ocard{position:relative;padding:18px 16px;border-radius:24px;border:1.5px solid var(--acc);background:radial-gradient(ellipse at 50% 0%,#E9C26B24,transparent 60%),linear-gradient(180deg,#232A40,#1A1F2F);box-shadow:0 0 0 4px #E9C26B18,0 30px 60px -30px #000}
.obadge{position:absolute;top:-12px;left:50%;transform:translateX(-50%);padding:6px 12px;border-radius:999px;background:var(--grad);color:var(--btn-text);font:700 11px/1 var(--sans);letter-spacing:.08em;white-space:nowrap}
.obadge .tok{color:var(--btn-text)}
.orow{display:flex;gap:12px;align-items:center}
.orow .th{width:58px;height:74px;border-radius:12px;overflow:hidden;position:relative;flex:none;background:#111520;border:1px solid var(--border);display:grid;place-items:center}
.orow .th.wide{width:84px;height:60px}
.orow .th img{width:100%;height:100%;object-fit:cover}.orow .th>svg{position:absolute;inset:0;width:100%;height:100%;border:0;border-radius:0}

function landCells(step,b=[-180,180,-60,80]){const k=step+':'+b.join(',');if(LC[k])return LC[k];const out=[];
  for(let lat=Math.floor(b[3]/step)*step;lat>=b[2];lat-=step)for(let lon=Math.ceil(b[0]/step)*step;lon<=b[1];lon+=step)if(isLand(lon,lat))out.push([lon,lat]);return LC[k]=out}

function mapSVG({vb=[0,0,720,280],step=4,lines='',pins='',extra='',cls='',land=''}={}){
  const b=[vb[0]/2-180-step,(vb[0]+vb[2])/2-180+step,80-(vb[1]+vb[3])/2-step,80-vb[1]/2+step];
  const r=step*.62;let d='';for(const[lon,lat]of landCells(step,b)){const x=MX(lon),y=MY(lat);d+=`M${(x-r).toFixed(1)} ${y}a${r} ${r} 0 1 0 ${2*r} 0a${r} ${r} 0 1 0 ${-2*r} 0`}
  return `<svg class="map ${cls}" viewBox="${vb.join(' ')}" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><path class="land" d="${d}" ${land}/>${lines}${pins}${extra}</svg>`;

   <rect width="350" height="330" fill="#06070A" opacity=".55" mask="url(#cut)"/><path class="guide" d="${HAND}" transform="translate(75 30) scale(1.05)"/></svg>
   <span class="camtag">${S.cam==='live'?(ok?'Aligned — hold still':'Line up your palm'):S.cam==='blocked'?'Camera blocked':'Camera'}</span>
   ${S.cam==='ask'?`<div class="perm" role="dialog"><b>nebula.app wants to use your camera</b><div class="row"><button data-a="camblock">Block</button><button class="pr" data-a="camallow">Allow</button></div></div>`:''}</div>
  <p class="hint tc" style="margin:0">Used only for your reading, then deleted.</p>
  ${S.cam==='blocked'?`<div class="err tc">Camera blocked — upload a photo instead</div>`:S.camErr?`<div class="err tc fadein">${S.camErr}</div>`:''}
  ${S.cam==='live'?`<div class="demo-chips"><button data-a="camerr" data-v="We can't see your lines — try brighter light">Demo: dim light</button><button data-a="camerr" data-v="Please show your whole palm">Demo: half a palm</button></div>`:''}</div>
  <div class="foot" style="gap:6px">${S.cam==='blocked'?`<button class="btn main" data-a="upload">${ic('upload',18)} Upload a photo instead</button>`:`${cta('Take photo',S.cam==='live','shoot')}<button class="link" data-a="upload">Upload a photo instead</button>`}<button class="link" data-a="palmskip">Skip palm reading</button></div>`},
18:()=>{const cap=S.palm==='captured';return `<div class="scr center tc" style="align-items:center"><div style="position:relative">${cap?`<div class="pimg read" style="width:150px">${palmSVG({w:150,mode:'read'})}<img src="img/palm.jpg" alt="" onerror="this.parentNode.classList.add('noimg');this.remove()"></div>`:`<div class="bigwell" style="width:130px;height:130px;font-size:56px;color:var(--rose)">♀︎</div>`}
  <span class="okpop" style="position:absolute;right:-6px;bottom:8px;width:40px;height:40px;border-radius:50%;background:var(--grad);display:grid;place-items:center">${ic('check',20,'#fff',3)}</span></div>
  <h1 class="display">${cap?t('Heart line read, photo deleted','Your heart line is in'):'Your heart line is in'}</h1>
  <p class="lead">${cap?'We kept the lines, not the picture.':'No palm? Your chart covers the heart side.'}</p>
  ${cap?`<span class="badge" style="align-self:center">${ic('trash',14)} Photo deleted</span>`:`<span class="hint">Heart side read from Venus in ${venus()}</span>`}</div><div class="foot">${cta('Continue')}</div>`},
19:()=>`<div class="sky"></div><div class="scr z" style="gap:14px"><div style="margin-top:2px">${paper(portrait({w:150,mode:'draw',sig:nm()}),'draw')}</div>
  <h1 class="display sm tc" id="lh">${APP.loadH()}</h1>${stepsHTML(['Reading your Venus and Descendant…','Shaping the face you described…','Adding the look in their eyes…','Almost done — signing it for you…'])}</div>
  <div class="foot"><div class="note">AI illustration · For entertainment</div></div>`,
20:()=>`<div class="scr"><h1 class="display sm">${t(`${nm()}, your sketch is ready`,'Meet them, almost')}</h1><p class="lead" style="margin-top:-8px">Your partner sign is free. Their face is next.</p>
  ${frostCard(130)}
  <div class="ptcard"><span class="gl">${gly(partner())}</span><div><b>Partner sign: ${partner()}</b><div class="hint" style="color:var(--t2)">${partner()} — ${PTRAIT[partner()]}</div></div></div>
  ${S.palm==='captured'?`<span class="badge">${ic('heart',13)} ${heartType().split(' — ')[0]}</span>`:''}
  ${lockrows(['Full HD sketch','Their nature','Where and when you may meet','Your pattern, and how to break it'])}
  <p class="hint tc" style="margin:0">Sketch is an AI illustration for entertainment.</p></div><div class="foot">${cta('Unlock my sketch')}</div>`,
21:()=>emailGate({h:t('Where should we send it?',`Save your sketch, ${nm()}`),b:t('Your sketch and app login go here.','One email. Your sketch waits inside.'),card:`<div style="display:flex;justify-content:center">${frostCard(70)}</div>`,taken:'This email already has a sketch — log in instead?',optin:'Email me love forecasts and news (optional)'}),
22:()=>paywall({facts:[['Sun',(()=>{try{return sun()}catch(e){return ''}})()],['Name',nm()],['Sketch','Ready to reveal']],toc:['Your partner sign','Your soulmate sketch','Their traits and what draws you','Where and how you may meet','Your love guidance in the app'],faqX:[['Is the sketch a real person?','No. It is an AI illustration built from your answers, for entertainment.']],top:`<div style="display:flex;justify-content:center;margin-top:6px">${frostCard(80)}</div>`,h:t('Unlock your soulmate sketch',`${nm()}, see their face`),b:t('One plan. You see the price first.','Your sketch and full reading, in the app.'),
  plans:[{k:'weekly',name:'1 week, then monthly',pl:`${tok('price_1w')} first week, then ${tok('price_month')}/month, renews monthly`}],
  lines:{weekly:`${tok('price_1w')} today for your first week, then ${tok('price_month')} every month until you cancel.`},
  legal:'For entertainment. Your sketch is an AI illustration, not a real person.',ctaLabel:'Unlock my sketch'}),
23:()=>getApp()
};
function NEXT(n){return n+1}
function PREV(n){if(n===18&&S.palm==='skip')return 16;return n-1}
function fillTo(n){
  if(n>1&&!S.who)S.who='w';if(n>3&&!S.love)S.love='single';if(n>4&&!S.age)S.age='30-40';if(n>5&&!S.name)S.name='Maya';
  if(n>6&&!S.dob.m)S.dob={m:'5',d:'4',y:'1994'};if(n>8&&!S.time&&!S.timeUnknown)S.time='07:40';if(n>9&&!S.place)S.place=CITIES[0][0];
  if(n>12&&!S.must.length)S.must=['kind','humor'];if(n>13&&!S.pattern)S.pattern='timing';if(n>14&&!S.lang)S.lang='time';
  if(n===17){S.palm='';S.cam='ask';S.aligned=false;S.camErr=''}if(n>17&&!S.palm)S.palm='captured';
  if(n>21&&!S.email)S.email='maya.r@gmail.com';if(n>22&&!S.paid)S.paid='weekly'}
const OK={8:()=>!!(S.time||S.timeUnknown),9:()=>!!S.place,12:()=>S.must.length>0,13:()=>!!S.patternOther.trim()};
function capture(){if(S.i!==17)return;const c=document.getElementById('cam');if(c)c.insertAdjacentHTML('beforeend','<div class="flash"></div>');S.palm='captured';later(()=>go(18),450)}
function ACT(a,v,b){switch(a){
  case 'hair':case 'eyes':S[a]=v;render();return true;
  case 'scan':S.cam='ask';S.aligned=false;S.camErr='';go(17);return true;
  case 'palmskip':S.palm='skip';go(18);return true;
  case 'camallow':toast('Demo only — camera permission simulated');S.cam='live';S.aligned=false;S.camErr='';render();return true;
  case 'camblock':S.cam='blocked';render();return true;
  case 'camerr':clearT();S.camErr=v;S.aligned=false;render();return true;
  case 'shoot':if(S.aligned)capture();else{S.camErr='Please show your whole palm';clearT();render()}return true;
  case 'upload':toast('Demo only — photo picker would open');S.palm='captured';clearT();later(()=>go(18),500);return true;
  case 'hot':{const w=document.getElementById('revealwrap');w.querySelector('.tips')?.remove();
    const txt=v==='eyes'?'Their eyes: warm and watchful — they notice everything.':(S.must.includes('humor')?`Their smile: quick and a little crooked — ${pron()}'ll make you laugh first.`:`Their smile: slow and sure — it comes when ${pron()} mean${pron()==='they'?'':'s'} it.`);
    w.insertAdjacentHTML('beforeend',`<div class="tips" style="top:${v==='eyes'?'30%':'70%'}" role="status">${txt}</div>`);return true}
  case 'save':toast('Demo only — image would download');return true;
  case 'share':toast('Demo only — share sheet would open');return true;
  }
  return false}
function INPUT(f,e){if(f==='name'){const s=document.getElementById('sgn');if(s){s.textContent=S.name.trim()||'your name';s.classList.toggle('blank',!S.name.trim())}}}
function AFTER(n,v){
  if(n===4)v.querySelectorAll('[data-age]').forEach(b=>{b.addEventListener('pointerenter',()=>{const p=document.getElementById('agept');if(p)p.innerHTML=portrait({w:96,mode:'full',age:b.dataset.age,img:false})});b.addEventListener('pointerleave',()=>{const p=document.getElementById('agept');if(p)p.innerHTML=portrait({w:96,mode:'full',img:false})})});
  if(n===17&&S.cam==='live'&&!S.aligned){later(()=>{if(S.i!==17)return;const h=document.getElementById('hand');if(h)h.style.transform='none'},120);
    later(()=>{if(S.i!==17)return;S.aligned=true;const c=document.getElementById('cam');if(c){c.classList.add('ok');c.querySelector('.camtag').textContent='Aligned — hold still'}const b=cur().querySelector('.foot .btn.main');if(b)b.disabled=false},1900);
    later(capture,3300)}
  if(n===19)runLoading(7600,null,()=>go(20))}
function DATA(){return [['Sketching',S.who?WHO[S.who][0]:''],['Love life',S.love?LOVE[S.love][0]:''],['Their age',S.age],['Name',S.name],['Born',S.dob.m?fmtDate(S.dob):''],['Venus',S.dob.m?venus():''],
  ['Time',S.timeUnknown?'Unknown (partner sign from Venus)':S.time],['Place',S.place],['Partner sign',S.dob.m&&(S.time||S.timeUnknown)?partner()+(S.timeUnknown?' (from Venus)':' (Descendant)'):''],
  ['Look',S.i>11?`Hair: ${HAIR.find(x=>x[0]===S.hair)[2]} · Eyes: ${EYES.find(x=>x[0]===S.eyes)[2]}`:''],['Must have',S.must.map(k=>k==='other'?(S.mustOther||'Other'):MUST[k][0]).join(', ')],
  ['Pattern',S.pattern?(S.pattern==='other'?S.patternOther||'Other':PATT[S.pattern][0]):''],['Love language',S.lang?LANG[S.lang][0]:''],
  ['Palm',S.palm==='captured'?'Scanned · photo deleted':S.palm==='skip'?'Skipped':''],['Email',S.email?S.email+(S.optin?' (opted in)':' (no marketing)'):''],['Plan',S.paid?'1 week, then monthly (demo)':S.i>=22?'Not purchased':'']]}
boot();
</script>
