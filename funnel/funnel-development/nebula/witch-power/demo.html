<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#161A27">
<meta name="robots" content="noindex">
<title>Starlyn: Daily Astrology &middot; Witch Power</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600&display=swap">
<style>
:root{
  color-scheme:dark;
  --ground:#0E111A;
  --bg:#161A27;--bg-elev:#1C2131;--surface:#212739;--surface-2:#2A3147;--border:#3A4260;
  --t1:#F6F3EA;--t2:#B5B9C9;--t3:#7C8298;
  --acc:#E9C26B;--acc-dim:#E9C26B2E;--btn-text:#161A27;--gold-lm:#8A6410;
  --grad:linear-gradient(100deg,#F4DA96 0%,#E9C26B 50%,#C99A3A 100%);
  --neg:#F29A8A;--pos:#7FD1A8;
  /* palm line colours (on the user's photo) */
  --l-heart:#F29A8A;--l-head:#8FB8FF;--l-life:#7FD1A8;--l-fate:#E9C26B;--l-marriage:#D9A8FF;
  --serif:"Fraunces",Georgia,"Times New Roman",serif;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--t1);font:15px/1.45 var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
a{color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.app{position:relative;width:100%;max-width:480px;height:100vh;height:100dvh;margin:0 auto;overflow:hidden;isolation:isolate;background:radial-gradient(ellipse 120% 60% at 50% 0%,#1D2235 0%,var(--bg) 60%)}
@media (min-width:520px){.app{border-inline:1px solid #2B334F}}
#stars{position:absolute;inset:0;width:100%;height:100%;z-index:0;display:block}
.view{position:absolute;inset:0;z-index:1;padding-top:calc(var(--sat) + 6px);display:flex;flex-direction:column}
.view.in{animation:vin .32s ease both}
@keyframes vin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.nav{height:48px;flex:none;display:flex;align-items:center;gap:10px;padding:0 12px;position:relative;z-index:3}
.iconbtn{width:44px;height:44px;border-radius:50%;border:none;background:transparent;display:grid;place-items:center;color:var(--t2);flex:none}
.prog{flex:1;height:4px;border-radius:2px;background:var(--surface-2);overflow:hidden}
.prog span{display:block;height:100%;background:var(--grad);border-radius:2px;transition:width .35s ease}
.navspacer{width:44px}
.stepn{width:44px;text-align:right;font:600 12px var(--sans);color:var(--t3);font-variant-numeric:tabular-nums}
.brand{display:flex;align-items:center;justify-content:center;gap:7px;font:600 15px var(--serif);letter-spacing:.02em;color:var(--t1)}
.brand svg{color:var(--acc)}
.scr{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 20px 12px;display:flex;flex-direction:column;gap:18px;position:relative;scrollbar-width:none;overscroll-behavior:contain}
.scr::-webkit-scrollbar{display:none}
.scr>*{flex-shrink:0}   /* QA 2026-10-06: items must not squash on short screens (input/well/notes clipped at 360x640); the .scr scrolls instead */
.scr.center{justify-content:flex-start}.scr.center>:first-child{margin-top:auto}.scr.center>:last-child{margin-bottom:auto}   /* safe centring: tall content scrolls instead of being cut off at the top */
.foot{flex:none;padding:10px 20px max(20px,calc(var(--sab) + 12px));display:flex;flex-direction:column;gap:8px;position:relative;z-index:2}
.note{font-size:12px;color:var(--t3);text-align:center;text-wrap:balance}
.note a{color:inherit;text-decoration:underline;text-underline-offset:2px;padding:15px 0;white-space:nowrap}
.display{font:600 30px/1.12 var(--serif);letter-spacing:-.01em;margin:0;text-wrap:balance}
.display.sm{font-size:26px}
.display em{font-style:normal;color:var(--acc)}
.lead{color:var(--t2);margin:0;font-size:15px;text-wrap:pretty}
.gold{color:var(--acc)}
.tc{text-align:center}
.badge{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:var(--acc-dim);color:var(--acc);font:500 13px/1 var(--sans)}
.tc .badge{align-self:center}
.btn{height:54px;border-radius:999px;border:none;background:var(--grad);color:var(--btn-text);font:600 16px/1 var(--sans);width:100%;display:flex;align-items:center;justify-content:center;gap:10px;transition:transform .12s ease;flex:none;position:relative;overflow:hidden;box-shadow:0 8px 28px -10px #DFA620aa}
.btn:active{transform:scale(.98)}
.btn[disabled]{background:var(--surface-2);color:var(--t3);box-shadow:none}
.btn:not([disabled]):not(.ghost)::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:0;background:linear-gradient(100deg,transparent,#ffffff55,transparent);transform:translateX(-150%) skewX(-20deg);animation:sheen 4.5s ease-in-out 1.2s infinite}
@keyframes sheen{0%{transform:translateX(-150%) skewX(-20deg)}28%,100%{transform:translateX(320%) skewX(-20deg)}}
.btn.ghost{background:var(--surface);color:var(--t1);border:1px solid var(--border);box-shadow:none}
.link{background:none;border:none;color:var(--t2);font-size:14px;padding:6px 10px;min-height:44px;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--border)}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:14px;padding:11px 14px;min-height:58px;border-radius:18px;background:linear-gradient(180deg,#262D42,var(--surface));border:1px solid var(--border);text-align:left;width:100%;transition:border-color .15s,background .15s,transform .12s;box-shadow:0 6px 18px -12px #000}
.opt:hover{border-color:#8C7236}
.opt:active{transform:scale(.99)}
.opt::after{content:"";width:20px;height:20px;border-radius:50%;border:1.5px solid var(--border);flex:none;margin-left:auto}
.opt.on::after{border-color:var(--btn-text);background:radial-gradient(circle,var(--btn-text) 38%,transparent 42%)}
.opt .well{width:36px;height:36px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;flex:none;font-size:18px}
.opt .lbl{flex:1;font-weight:500;font-size:15.5px}
.opt.on{border-color:transparent;background:var(--grad);color:var(--btn-text)}
.opt.on .well{background:#ffffff40}
.box{height:54px;border-radius:14px;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;padding:0 12px;gap:10px;color:var(--t3);min-width:0}
.box:focus-within{border-color:var(--acc)}
.box.white{background:#F7F4EC;border-color:#F7F4EC;color:var(--gold-lm)}
.box.white input{color:#161A28}
.box.white input::placeholder{color:#9C8A5E}
.box input,.box select{flex:1;min-width:0;width:100%;height:100%;background:transparent;border:none;outline:none;color:var(--t1);font:400 16px var(--sans)}
.box select{appearance:none;-webkit-appearance:none;cursor:pointer}
.box select option{background:var(--surface);color:var(--t1)}
.row3{display:grid;grid-template-columns:1.4fr 1fr 1.2fr;gap:8px}
.err{font-size:13px;color:var(--neg)}
.hint{font-size:13px;color:var(--t3)}
.card{padding:14px;border-radius:18px;background:var(--surface);border:1px solid var(--border)}
.card h4{margin:0 0 4px;font-size:15px;font-weight:600;display:flex;gap:8px;align-items:center}
.card p{margin:0;color:var(--t2);font-size:14px}
.stack{display:flex;flex-direction:column;gap:10px}
.lockrow{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--border);color:var(--t2);font-size:14px}
.lockrow .l{margin-left:auto;color:var(--acc)}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.blurred{filter:blur(5px);user-select:none}
.bigwell{width:84px;height:84px;border-radius:50%;background:radial-gradient(circle,#E3B03A55,transparent 70%),var(--surface);border:1px solid var(--border);display:grid;place-items:center;color:var(--acc);align-self:center;box-shadow:0 0 40px #E3B03A55}
.checks{display:flex;flex-direction:column;gap:8px;font-size:14px}
.checks div{display:flex;gap:10px;align-items:flex-start}
.checks svg{color:var(--acc);flex:none;margin-top:2px}
.fadein{animation:fi .35s ease both}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.toast{position:absolute;left:50%;top:calc(var(--sat) + 12px);transform:translateX(-50%);z-index:20;background:var(--t1);color:#0E111B;font-size:13px;font-weight:500;padding:9px 14px;border-radius:999px;max-width:calc(100% - 32px);width:max-content;animation:fade 2.6s ease forwards}
@keyframes fade{0%{opacity:0}10%,80%{opacity:1}100%{opacity:0}}

/* hook */
.hero{position:relative;height:300px;margin:0 -20px;flex:none;overflow:hidden}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 30%;-webkit-mask-image:linear-gradient(#000 60%,#0000);mask-image:linear-gradient(#000 60%,#0000)}
.proof{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.proof span{font-size:12px;padding:6px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--border);color:var(--t2)}
.trio{display:flex;justify-content:center;gap:14px;font-size:12.5px;color:var(--t2)}
.trio span{display:flex;gap:5px;align-items:center}
.trio svg{color:var(--acc)}
.rot{height:24px;overflow:hidden;font:600 20px/24px var(--serif);color:var(--acc)}
.rot div{animation:rot 12s steps(1) infinite}
@keyframes rot{0%{transform:translateY(0)}16.6%{transform:translateY(-24px)}33.3%{transform:translateY(-48px)}50%{transform:translateY(-72px)}66.6%{transform:translateY(-96px)}83.3%{transform:translateY(-120px)}}

/* line chart legend (education) */
.palmsvg path{fill:none;stroke-linecap:round;stroke-linejoin:round}
.palmsvg .out{stroke:#E9C26B;stroke-width:1.5;opacity:.85}
.palmsvg .ln{stroke-width:2.6}
.palmsvg .dr{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.1s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;font-size:13px;color:var(--t2)}
.legend div{display:flex;gap:8px;align-items:center}

/* loaders */
.ring{width:150px;height:150px;border-radius:50%;background:conic-gradient(var(--acc) calc(var(--p)*1%),var(--surface-2) 0);display:grid;place-items:center;align-self:center;position:relative;flex:none}
.ring::before{content:"";position:absolute;inset:9px;border-radius:50%;background:var(--bg)}
.ring b{position:relative;font:600 34px var(--serif)}
.tasks{display:flex;flex-direction:column;gap:9px}
.task{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--border);color:var(--t3);font-size:14px;transition:all .3s}
.task i{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--border);display:grid;place-items:center;flex:none;font-style:normal}
.task.on{color:var(--t1);border-color:#B8923A}
.task.done{color:var(--t1)}
.task.done i{background:var(--grad);border-color:transparent;color:var(--btn-text)}
.iq{position:absolute;inset:0;z-index:6;background:#0B0E16CC;display:grid;place-items:center;padding:24px;animation:fi .25s ease}
.iq .in{width:100%;padding:22px 18px 18px;border-radius:22px;background:var(--bg-elev);border:1px solid var(--border);display:flex;flex-direction:column;gap:16px;text-align:center;box-shadow:0 20px 50px #000a}
.iq b{font:600 21px/1.25 var(--serif)}
.iq .row{display:flex;gap:10px}
.iq .row .btn{height:48px;flex:1;min-width:0;width:auto}

/* scan guide */
.guide{display:grid;grid-template-columns:1fr;gap:10px}
.gok{position:relative;border-radius:18px;border:1.5px solid var(--pos);background:#7FD1A812;padding:14px;display:flex;gap:14px;align-items:center}
.gok .ph{width:92px;height:122px;border-radius:14px;overflow:hidden;flex:none;position:relative;background:#0E111A}
.gok .ph img{width:100%;height:100%;object-fit:cover}
.gok b{color:var(--pos);display:flex;gap:6px;align-items:center}
.gbad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.gbad div{border-radius:14px;border:1.5px solid #F29A8A66;background:#F29A8A10;padding:10px 6px;text-align:center;font-size:11.5px;color:var(--t2);display:flex;flex-direction:column;gap:6px;align-items:center}
.gbad svg{color:var(--neg)}
.privacy{display:flex;gap:10px;font-size:12px;color:var(--t3);align-items:flex-start;text-align:left}
.privacy svg{color:var(--pos);flex:none;margin-top:1px}

/* upload */
.drop{border-radius:22px;border:1.5px dashed #B8923A;background:radial-gradient(ellipse at 50% 30%,#E9C26B14,transparent 70%),var(--surface);min-height:300px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px;text-align:center;position:relative;overflow:hidden;flex:none}
.drop.over{border-style:solid;background:#E9C26B22}
.drop .palmsvg{opacity:.8}
.preview{position:relative;border-radius:22px;overflow:hidden;background:#0E111A;flex:none;aspect-ratio:3/4;max-height:52vh;align-self:center;width:100%;border:1px solid var(--border)}
.preview img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.preview svg.ov{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.preview .tag{position:absolute;left:12px;top:12px;font-size:11.5px;padding:5px 9px;border-radius:999px;background:#0B0E16cc;color:var(--t1);z-index:2;display:flex;gap:6px;align-items:center}
.preview .scan{position:absolute;left:0;right:0;height:3px;background:linear-gradient(90deg,#0000,#F4DA96,#0000);box-shadow:0 0 18px #E9C26B;animation:scanl 2.2s ease-in-out infinite}
@keyframes scanl{0%{top:6%}50%{top:92%}100%{top:6%}}
.ov .fd{fill:#E9C26B;stroke:#fff;stroke-width:.4}
.ov .fd.pop{animation:pop .45s cubic-bezier(.3,1.6,.5,1) both}
@keyframes pop{from{r:0}}
.ov .ln{fill:none;stroke-width:1.1;stroke-linecap:round;filter:drop-shadow(0 0 1.2px #000)}
.ov .ln.dr{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1s ease forwards}
.anl{text-align:center}
.anl .what{font:600 22px var(--serif);color:var(--acc);min-height:28px}
.anl .bar{height:5px;border-radius:3px;background:var(--surface-2);overflow:hidden;margin:10px 30px 0}
.anl .bar span{display:block;height:100%;background:var(--grad);width:0;transition:width .4s ease}

/* paywall */
.closex{position:absolute;top:calc(var(--sat) + 6px);right:10px;z-index:3;width:44px;height:44px;border-radius:50%;background:#0E111BAA;border:1px solid var(--border);display:grid;place-items:center;color:var(--t2)}
.plan{display:flex;align-items:center;gap:12px;padding:12px 14px;min-height:62px;border-radius:18px;border:1px solid var(--border);background:var(--surface);text-align:left;width:100%;position:relative}
.plan .radio{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--border);display:grid;place-items:center;flex:none}
.plan.on{border:1.5px solid #E6B951;background:linear-gradient(0deg,var(--acc-dim),var(--acc-dim)),var(--surface)}
.plan.on .radio{background:var(--grad);border-color:transparent;color:var(--btn-text)}
.plan .pn{font-weight:600;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.plan .pp{font-size:13px;color:var(--t1);display:block;margin-top:2px}
.plan .ps{font-size:11.5px;color:var(--t3);display:block;margin-top:2px}
.save{font:600 10px/1 var(--sans);letter-spacing:.05em;background:var(--grad);color:var(--btn-text);padding:4px 7px;border-radius:6px}
.tok{font-family:ui-monospace,Consolas,monospace;font-size:.85em;font-weight:600;padding:1px 5px;border-radius:6px;border:1px dashed var(--acc);color:var(--acc);white-space:nowrap}
.legal{display:flex;justify-content:center;gap:4px 14px;font-size:12px;color:var(--t3);flex-wrap:wrap}
.legal a{display:inline-flex;align-items:center;min-height:44px;padding:0 4px}
.thumbrow{display:flex;gap:12px;align-items:center;padding:10px;border-radius:18px;background:var(--surface);border:1px solid var(--border)}
.thumbrow .th{width:62px;height:78px;border-radius:12px;overflow:hidden;position:relative;flex:none;background:#0E111A}
.thumbrow .th img{width:100%;height:100%;object-fit:cover}
.thumbrow .th svg{position:absolute;inset:0;width:100%;height:100%}
.stores{display:flex;gap:8px;justify-content:center}
.store{display:flex;align-items:center;gap:7px;height:44px;padding:0 12px;border-radius:8px;background:#000;border:1px solid #A6A6A6;font-size:10px;line-height:1.1;text-align:left;color:#fff}
.store svg{flex:none}
.store small{display:block;font-size:10px;letter-spacing:.02em}
.store b{display:block;font-size:15px;font-weight:600;letter-spacing:-.01em}
/* ===== web paywall: long-scroll landing page, not an app sheet ===== */
.wp{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;scroll-behavior:smooth;background:var(--bg)}
.wp::-webkit-scrollbar{display:none}
.wbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:calc(var(--sat) + 8px) 16px 10px;background:#161A27e6;backdrop-filter:blur(10px);border-bottom:1px solid #ffffff10}
.wbar .brand{flex:1;justify-content:flex-start}
.wbar .mini{height:40px;padding:0 14px;border-radius:999px;border:none;background:var(--grad);color:var(--btn-text);font:600 13px var(--sans);opacity:0;transform:translateY(-4px);transition:.25s;pointer-events:none}
.wp.scrolled .wbar .mini{opacity:1;transform:none;pointer-events:auto}
.wbar .x{width:36px;height:36px;border-radius:50%;border:1px solid var(--border);background:transparent;color:var(--t3);display:grid;place-items:center}
.wsec{padding:28px 18px 0}
.wsec.tight{padding-top:16px}
.wh2{font:600 25px/1.18 var(--serif);margin:0 0 6px;text-wrap:balance}
.wh2+.lead{margin-bottom:16px}
.eyebrow{font:600 11.5px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--acc);margin-bottom:10px;display:block}
.whero{display:grid;grid-template-columns:1fr 1.05fr;gap:14px;align-items:center}
.whero .pv{border-radius:20px;overflow:hidden;position:relative;aspect-ratio:3/4;border:1px solid #E9C26B55;box-shadow:0 20px 50px -20px #000,0 0 40px -10px #E9C26B55}
.whero .pv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.whero .pv svg{position:absolute;inset:0;width:100%;height:100%}
.facts{display:flex;flex-direction:column;gap:8px}
.fact{padding:9px 11px;border-radius:12px;background:var(--surface);border:1px solid var(--border);font-size:12px;color:var(--t3)}
.fact b{display:block;color:var(--t1);font-size:13.5px;font-weight:600;margin-top:2px}
.pick{border-radius:24px;padding:18px 14px 16px;background:linear-gradient(180deg,#232A40,#1A1F2F);border:1px solid #E9C26B40;box-shadow:0 30px 60px -30px #000}
.pick .plans{display:flex;flex-direction:column;gap:10px}
.wplan{position:relative;display:grid;grid-template-columns:24px 1fr auto;gap:2px 12px;align-items:center;padding:16px 14px;border-radius:16px;border:1.5px solid var(--border);background:var(--bg-elev);text-align:left;width:100%}
.wplan .rd{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--border);grid-row:1/3;display:grid;place-items:center}
.wplan .nm{font:600 16px var(--sans)}
.wplan .sub{font-size:12px;color:var(--t3);grid-column:2}
.wplan .pr{grid-row:1/3;grid-column:3;text-align:right;font:600 15px var(--sans)}
.wplan .pr small{display:block;font:400 11.5px var(--sans);color:var(--t3);margin-top:3px}
.wplan .rib{position:absolute;top:-11px;left:14px;font:700 10.5px/1 var(--sans);letter-spacing:.08em;padding:5px 9px;border-radius:999px;background:var(--grad);color:var(--btn-text)}
.wplan.on{border-color:var(--acc);background:linear-gradient(0deg,#E9C26B1c,#E9C26B1c),var(--bg-elev);box-shadow:0 0 0 3px #E9C26B22}
.wplan.on .rd{background:var(--grad);border-color:transparent;color:var(--btn-text)}
.today{display:flex;justify-content:space-between;font-size:13.5px;padding:12px 4px 0;color:var(--t2)}
.today b{color:var(--t1)}
.pay{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.pay span{height:26px;min-width:44px;padding:0 8px;border-radius:6px;background:#F6F3EA;color:#161A27;font:700 10.5px/26px var(--sans);text-align:center;letter-spacing:.02em}

  const wp=v.querySelector('#wp'),st=v.querySelector('#sticky'),blocks=[...v.querySelectorAll('.pick')];

  blocks.forEach(b=>io.observe(b));
