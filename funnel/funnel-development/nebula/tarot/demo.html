<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#161A27">
<meta name="robots" content="noindex">
<title>Starlyn: Daily Astrology &middot; Tarot Reading</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600&display=swap">
<style>
:root{
  color-scheme:dark;
  --ground:#0E111A;
  --bg:#161A27;--bg-elev:#1C2131;--surface:#212739;--surface-2:#2A3147;--border:#3A4260;
  --t1:#F6F3EA;--t2:#B5B9C9;--t3:#7C8298;
  --acc:#E9C26B;--acc-dim:#E9C26B2E;--btn-text:#161A27;--gold-lm:#8A6410;
  --grad:linear-gradient(100deg,#F4DA96 0%,#E9C26B 50%,#C99A3A 100%);
  --neg:#F29A8A;--pos:#7FD1A8;
  /* palm line colours (on the user's photo) */
  --l-heart:#F29A8A;--l-head:#8FB8FF;--l-life:#7FD1A8;--l-fate:#E9C26B;--l-marriage:#D9A8FF;
  --serif:"Fraunces",Georgia,"Times New Roman",serif;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--t1);font:15px/1.45 var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
a{color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.app{position:relative;width:100%;max-width:480px;height:100vh;height:100dvh;margin:0 auto;overflow:hidden;isolation:isolate;background:radial-gradient(ellipse 120% 60% at 50% 0%,#1D2235 0%,var(--bg) 60%)}
@media (min-width:520px){.app{border-inline:1px solid #2B334F}}
#stars{position:absolute;inset:0;width:100%;height:100%;z-index:0;display:block}
.view{position:absolute;inset:0;z-index:1;padding-top:calc(var(--sat) + 6px);display:flex;flex-direction:column}
.view.in{animation:vin .32s ease both}
@keyframes vin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.nav{height:48px;flex:none;display:flex;align-items:center;gap:10px;padding:0 12px;position:relative;z-index:3}
.iconbtn{width:44px;height:44px;border-radius:50%;border:none;background:transparent;display:grid;place-items:center;color:var(--t2);flex:none}
.prog{flex:1;height:4px;border-radius:2px;background:var(--surface-2);overflow:hidden}
.prog span{display:block;height:100%;background:var(--grad);border-radius:2px;transition:width .35s ease}
.navspacer{width:44px}
.stepn{width:44px;text-align:right;font:600 12px var(--sans);color:var(--t3);font-variant-numeric:tabular-nums}
.brand{display:flex;align-items:center;justify-content:center;gap:7px;font:600 15px var(--serif);letter-spacing:.02em;color:var(--t1)}
.brand svg{color:var(--acc)}
.scr{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 20px 12px;display:flex;flex-direction:column;gap:18px;position:relative;scrollbar-width:none;overscroll-behavior:contain}
.scr::-webkit-scrollbar{display:none}
.scr.center{justify-content:center}
.foot{flex:none;padding:10px 20px max(20px,calc(var(--sab) + 12px));display:flex;flex-direction:column;gap:8px;position:relative;z-index:2}
.note{font-size:12px;color:var(--t3);text-align:center;text-wrap:balance}
.note a{color:var(--t2)}
.display{font:600 30px/1.12 var(--serif);letter-spacing:-.01em;margin:0;text-wrap:balance}
.display.sm{font-size:26px}
.display em{font-style:normal;color:var(--acc)}
.lead{color:var(--t2);margin:0;font-size:15px;text-wrap:pretty}
.gold{color:var(--acc)}
.tc{text-align:center}
.badge{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:var(--acc-dim);color:var(--acc);font:500 13px/1 var(--sans)}
.tc .badge{align-self:center}
.btn{height:54px;border-radius:999px;border:none;background:var(--grad);color:var(--btn-text);font:600 16px/1 var(--sans);width:100%;display:flex;align-items:center;justify-content:center;gap:10px;transition:transform .12s ease;flex:none;position:relative;overflow:hidden;box-shadow:0 8px 28px -10px #DFA620aa}
.btn:active{transform:scale(.98)}
.btn[disabled]{background:var(--surface-2);color:var(--t3);box-shadow:none}
.btn:not([disabled]):not(.ghost)::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:0;background:linear-gradient(100deg,transparent,#ffffff55,transparent);transform:translateX(-150%) skewX(-20deg);animation:sheen 4.5s ease-in-out 1.2s infinite}
@keyframes sheen{0%{transform:translateX(-150%) skewX(-20deg)}28%,100%{transform:translateX(320%) skewX(-20deg)}}
.btn.ghost{background:var(--surface);color:var(--t1);border:1px solid var(--border);box-shadow:none}
.link{background:none;border:none;color:var(--t2);font-size:14px;padding:6px 10px;min-height:44px;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--border)}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:14px;padding:11px 14px;min-height:58px;border-radius:18px;background:linear-gradient(180deg,#262D42,var(--surface));border:1px solid var(--border);text-align:left;width:100%;transition:border-color .15s,background .15s,transform .12s;box-shadow:0 6px 18px -12px #000}
.opt:hover{border-color:#8C7236}
.opt:active{transform:scale(.99)}
.opt::after{content:"";width:20px;height:20px;border-radius:50%;border:1.5px solid var(--border);flex:none;margin-left:auto}
.opt.on::after{border-color:var(--btn-text);background:radial-gradient(circle,var(--btn-text) 38%,transparent 42%)}
.opt .well{width:36px;height:36px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;flex:none;font-size:18px}
.opt .lbl{flex:1;font-weight:500;font-size:15.5px}
.opt.on{border-color:transparent;background:var(--grad);color:var(--btn-text)}
.opt.on .well{background:#ffffff40}
.box{height:54px;border-radius:14px;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;padding:0 12px;gap:10px;color:var(--t3);min-width:0}
.box:focus-within{border-color:var(--acc)}
.box.white{background:#F7F4EC;border-color:#F7F4EC;color:var(--gold-lm)}
.box.white input{color:#161A28}
.box.white input::placeholder{color:#9C8A5E}
.box input,.box select{flex:1;min-width:0;width:100%;height:100%;background:transparent;border:none;outline:none;color:var(--t1);font:400 16px var(--sans)}
.box select{appearance:none;-webkit-appearance:none;cursor:pointer}
.box select option{background:var(--surface);color:var(--t1)}
.row3{display:grid;grid-template-columns:1.4fr 1fr 1.2fr;gap:8px}
.err{font-size:13px;color:var(--neg)}
.hint{font-size:13px;color:var(--t3)}
.card{padding:14px;border-radius:18px;background:var(--surface);border:1px solid var(--border)}
.card h4{margin:0 0 4px;font-size:15px;font-weight:600;display:flex;gap:8px;align-items:center}
.card p{margin:0;color:var(--t2);font-size:14px}
.stack{display:flex;flex-direction:column;gap:10px}
.lockrow{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--border);color:var(--t2);font-size:14px}
.lockrow .l{margin-left:auto;color:var(--acc)}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.blurred{filter:blur(5px);user-select:none}
.bigwell{width:84px;height:84px;border-radius:50%;background:radial-gradient(circle,#E3B03A55,transparent 70%),var(--surface);border:1px solid var(--border);display:grid;place-items:center;color:var(--acc);align-self:center;box-shadow:0 0 40px #E3B03A55}
.checks{display:flex;flex-direction:column;gap:8px;font-size:14px}
.checks div{display:flex;gap:10px;align-items:flex-start}
.checks svg{color:var(--acc);flex:none;margin-top:2px}
.fadein{animation:fi .35s ease both}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.toast{position:absolute;left:50%;top:calc(var(--sat) + 12px);transform:translateX(-50%);z-index:20;background:var(--t1);color:#0E111B;font-size:13px;font-weight:500;padding:9px 14px;border-radius:999px;max-width:calc(100% - 32px);width:max-content;animation:fade 2.6s ease forwards}
@keyframes fade{0%{opacity:0}10%,80%{opacity:1}100%{opacity:0}}

/* hook */
.hero{position:relative;height:300px;margin:0 -20px;flex:none;overflow:hidden}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 30%;-webkit-mask-image:linear-gradient(#000 60%,#0000);mask-image:linear-gradient(#000 60%,#0000)}
.proof{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.proof span{font-size:12px;padding:6px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--border);color:var(--t2)}
.trio{display:flex;justify-content:center;gap:14px;font-size:12.5px;color:var(--t2)}
.trio span{display:flex;gap:5px;align-items:center}
.trio svg{color:var(--acc)}
.rot{height:24px;overflow:hidden;font:600 20px/24px var(--serif);color:var(--acc)}
.rot div{animation:rot 12s steps(1) infinite}
@keyframes rot{0%{transform:translateY(0)}16.6%{transform:translateY(-24px)}33.3%{transform:translateY(-48px)}50%{transform:translateY(-72px)}66.6%{transform:translateY(-96px)}83.3%{transform:translateY(-120px)}}

/* line chart legend (education) */
.palmsvg path{fill:none;stroke-linecap:round;stroke-linejoin:round}
.palmsvg .out{stroke:#E9C26B;stroke-width:1.5;opacity:.85}
.palmsvg .ln{stroke-width:2.6}
.palmsvg .dr{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.1s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;font-size:13px;color:var(--t2)}
.legend div{display:flex;gap:8px;align-items:center}

/* loaders */
.ring{width:150px;height:150px;border-radius:50%;background:conic-gradient(var(--acc) calc(var(--p)*1%),var(--surface-2) 0);display:grid;place-items:center;align-self:center;position:relative;flex:none}
.ring::before{content:"";position:absolute;inset:9px;border-radius:50%;background:var(--bg)}
.ring b{position:relative;font:600 34px var(--serif)}
.tasks{display:flex;flex-direction:column;gap:9px}
.task{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--border);color:var(--t3);font-size:14px;transition:all .3s}
.task i{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--border);display:grid;place-items:center;flex:none;font-style:normal}
.task.on{color:var(--t1);border-color:#B8923A}
.task.done{color:var(--t1)}
.task.done i{background:var(--grad);border-color:transparent;color:var(--btn-text)}
.iq{position:absolute;inset:0;z-index:6;background:#0B0E16CC;display:grid;place-items:center;padding:24px;animation:fi .25s ease}
.iq .in{width:100%;padding:22px 18px 18px;border-radius:22px;background:var(--bg-elev);border:1px solid var(--border);display:flex;flex-direction:column;gap:16px;text-align:center;box-shadow:0 20px 50px #000a}
.iq b{font:600 21px/1.25 var(--serif)}
.iq .row{display:flex;gap:10px}
.iq .row .btn{height:48px;flex:1;min-width:0;width:auto}

/* scan guide */
.guide{display:grid;grid-template-columns:1fr;gap:10px}
.gok{position:relative;border-radius:18px;border:1.5px solid var(--pos);background:#7FD1A812;padding:14px;display:flex;gap:14px;align-items:center}
.gok .ph{width:92px;height:122px;border-radius:14px;overflow:hidden;flex:none;position:relative;background:#0E111A}
.gok .ph img{width:100%;height:100%;object-fit:cover}
.gok b{color:var(--pos);display:flex;gap:6px;align-items:center}
.gbad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.gbad div{border-radius:14px;border:1.5px solid #F29A8A66;background:#F29A8A10;padding:10px 6px;text-align:center;font-size:11.5px;color:var(--t2);display:flex;flex-direction:column;gap:6px;align-items:center}
.gbad svg{color:var(--neg)}
.privacy{display:flex;gap:10px;font-size:12px;color:var(--t3);align-items:flex-start;text-align:left}
.privacy svg{color:var(--pos);flex:none;margin-top:1px}

/* upload */
.drop{border-radius:22px;border:1.5px dashed #B8923A;background:radial-gradient(ellipse at 50% 30%,#E9C26B14,transparent 70%),var(--surface);min-height:300px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px;text-align:center;position:relative;overflow:hidden;flex:none}
.drop.over{border-style:solid;background:#E9C26B22}
.drop .palmsvg{opacity:.8}
.preview{position:relative;border-radius:22px;overflow:hidden;background:#0E111A;flex:none;aspect-ratio:3/4;max-height:52vh;align-self:center;width:100%;border:1px solid var(--border)}
.preview img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.preview svg.ov{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.preview .tag{position:absolute;left:12px;top:12px;font-size:11.5px;padding:5px 9px;border-radius:999px;background:#0B0E16cc;color:var(--t1);z-index:2;display:flex;gap:6px;align-items:center}
.preview .scan{position:absolute;left:0;right:0;height:3px;background:linear-gradient(90deg,#0000,#F4DA96,#0000);box-shadow:0 0 18px #E9C26B;animation:scanl 2.2s ease-in-out infinite}
@keyframes scanl{0%{top:6%}50%{top:92%}100%{top:6%}}
.ov .fd{fill:#E9C26B;stroke:#fff;stroke-width:.4}
.ov .fd.pop{animation:pop .45s cubic-bezier(.3,1.6,.5,1) both}
@keyframes pop{from{r:0}}
.ov .ln{fill:none;stroke-width:1.1;stroke-linecap:round;filter:drop-shadow(0 0 1.2px #000)}
.ov .ln.dr{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1s ease forwards}
.anl{text-align:center}
.anl .what{font:600 22px var(--serif);color:var(--acc);min-height:28px}
.anl .bar{height:5px;border-radius:3px;background:var(--surface-2);overflow:hidden;margin:10px 30px 0}
.anl .bar span{display:block;height:100%;background:var(--grad);width:0;transition:width .4s ease}

/* paywall */
.closex{position:absolute;top:calc(var(--sat) + 6px);right:10px;z-index:3;width:44px;height:44px;border-radius:50%;background:#0E111BAA;border:1px solid var(--border);display:grid;place-items:center;color:var(--t2)}
.plan{display:flex;align-items:center;gap:12px;padding:12px 14px;min-height:62px;border-radius:18px;border:1px solid var(--border);background:var(--surface);text-align:left;width:100%;position:relative}
.plan .radio{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--border);display:grid;place-items:center;flex:none}
.plan.on{border:1.5px solid #E6B951;background:linear-gradient(0deg,var(--acc-dim),var(--acc-dim)),var(--surface)}
.plan.on .radio{background:var(--grad);border-color:transparent;color:var(--btn-text)}
.plan .pn{font-weight:600;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.plan .pp{font-size:13px;color:var(--t1);display:block;margin-top:2px}
.plan .ps{font-size:11.5px;color:var(--t3);display:block;margin-top:2px}
.save{font:600 10px/1 var(--sans);letter-spacing:.05em;background:var(--grad);color:var(--btn-text);padding:4px 7px;border-radius:6px}
.tok{font-family:ui-monospace,Consolas,monospace;font-size:.85em;font-weight:600;padding:1px 5px;border-radius:6px;border:1px dashed var(--acc);color:var(--acc);white-space:nowrap}
.legal{display:flex;justify-content:center;gap:4px 14px;font-size:12px;color:var(--t3);flex-wrap:wrap}
.legal a{display:inline-flex;align-items:center;min-height:44px;padding:0 4px}
.thumbrow{display:flex;gap:12px;align-items:center;padding:10px;border-radius:18px;background:var(--surface);border:1px solid var(--border)}
.thumbrow .th{width:62px;height:78px;border-radius:12px;overflow:hidden;position:relative;flex:none;background:#0E111A}
.thumbrow .th img{width:100%;height:100%;object-fit:cover}
.thumbrow .th svg{position:absolute;inset:0;width:100%;height:100%}
.stores{display:flex;gap:8px;justify-content:center}
.store{display:flex;align-items:center;gap:7px;height:46px;padding:0 12px;border-radius:10px;background:#000;border:1px solid #444;font-size:11px;line-height:1.1;text-align:left;color:#fff}
.store b{display:block;font-size:13px}
/* ===== web paywall: long-scroll landing page, not an app sheet ===== */
.wp{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;scroll-behavior:smooth;background:var(--bg)}
.wp::-webkit-scrollbar{display:none}
.wbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:calc(var(--sat) + 8px) 16px 10px;background:#161A27e6;backdrop-filter:blur(10px);border-bottom:1px solid #ffffff10}
.wbar .brand{flex:1;justify-content:flex-start}
.wbar .mini{height:36px;padding:0 14px;border-radius:999px;border:none;background:var(--grad);color:var(--btn-text);font:600 13px var(--sans);opacity:0;transform:translateY(-4px);transition:.25s;pointer-events:none}
.wp.scrolled .wbar .mini{opacity:1;transform:none;pointer-events:auto}
.wbar .x{width:36px;height:36px;border-radius:50%;border:1px solid var(--border);background:transparent;color:var(--t3);display:grid;place-items:center}
.wsec{padding:28px 18px 0}
.wsec.tight{padding-top:16px}
.wh2{font:600 25px/1.18 var(--serif);margin:0 0 6px;text-wrap:balance}
.wh2+.lead{margin-bottom:16px}
.eyebrow{font:600 11.5px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--acc);margin-bottom:10px;display:block}
.whero{display:grid;grid-template-columns:1fr 1.05fr;gap:14px;align-items:center}
.whero .pv{border-radius:20px;overflow:hidden;position:relative;aspect-ratio:3/4;border:1px solid #E9C26B55;box-shadow:0 20px 50px -20px #000,0 0 40px -10px #E9C26B55}
.whero .pv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.whero .pv svg{position:absolute;inset:0;width:100%;height:100%}
.facts{display:flex;flex-direction:column;gap:8px}
.fact{padding:9px 11px;border-radius:12px;background:var(--surface);border:1px solid var(--border);font-size:12px;color:var(--t3)}
.fact b{display:block;color:var(--t1);font-size:13.5px;font-weight:600;margin-top:2px}
.pick{border-radius:24px;padding:18px 14px 16px;background:linear-gradient(180deg,#232A40,#1A1F2F);border:1px solid #E9C26B40;box-shadow:0 30px 60px -30px #000}
.pick .plans{display:flex;flex-direction:column;gap:10px}
.wplan{position:relative;display:grid;grid-template-columns:24px 1fr auto;gap:2px 12px;align-items:center;padding:16px 14px;border-radius:16px;border:1.5px solid var(--border);background:var(--bg-elev);text-align:left;width:100%}
.wplan .rd{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--border);grid-row:1/3;display:grid;place-items:center}
.wplan .nm{font:600 16px var(--sans)}
.wplan .sub{font-size:12px;color:var(--t3);grid-column:2}
.wplan .pr{grid-row:1/3;grid-column:3;text-align:right;font:600 15px var(--sans)}
.wplan .pr small{display:block;font:400 11.5px var(--sans);color:var(--t3);margin-top:3px}
.wplan .rib{position:absolute;top:-11px;left:14px;font:700 10.5px/1 var(--sans);letter-spacing:.08em;padding:5px 9px;border-radius:999px;background:var(--grad);color:var(--btn-text)}
.wplan.on{border-color:var(--acc);background:linear-gradient(0deg,#E9C26B1c,#E9C26B1c),var(--bg-elev);box-shadow:0 0 0 3px #E9C26B22}
.wplan.on .rd{background:var(--grad);border-color:transparent;color:var(--btn-text)}
.today{display:flex;justify-content:space-between;font-size:13.5px;padding:12px 4px 0;color:var(--t2)}
.today b{color:var(--t1)}
.pay{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.pay span{height:26px;min-width:44px;padding:0 8px;border-radius:6px;background:#F6F3EA;color:#161A27;font:700 10.5px/26px var(--sans);text-align:center;letter-spacing:.02em}
.secure{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:12px;color:var(--t2)}
.secure span{display:flex;gap:5px;align-items:center}
.secure svg{color:var(--pos)}
.fine{font-size:11.5px;color:var(--t3);text-align:center;margin:12px 4px 0;line-height:1.5}
.toc{display:flex;flex-direction:column;border-radius:20px;overflow:hidden;border:1px solid var(--border)}
.toc div{display:flex;gap:12px;align-items:center;padding:14px;background:var(--surface);border-top:1px solid var(--border);font-size:14px}
.toc div:first-child{border-top:none}
.toc .n{width:26px;height:26px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font:600 12px var(--sans);color:var(--acc);flex:none}
.toc .l{margin-left:auto;color:var(--t3)}
.toc .open .l{color:var(--pos)}
.rate{display:flex;align-items:center;gap:14px;padding:16px;border-radius:20px;background:var(--surface);border:1px solid var(--border)}
.rate .sc{font:600 38px/1 var(--serif);color:var(--acc)}
.rate .sc .tok{font-size:13px}
.stars{color:var(--acc);letter-spacing:2px;font-size:15px}
.rev{padding:16px;border-radius:18px;background:var(--surface);border:1px solid var(--border);display:flex;flex-direction:column;gap:8px;font-size:14px;color:var(--t2)}
.rev .who{display:flex;gap:10px;align-items:center;color:var(--t1);font-weight:600}
.rev .who i{width:34px;height:34px;border-radius:50%;background:var(--grad);display:grid;place-items:center;color:var(--btn-text);font:600 12px var(--sans);font-style:normal}
.rev .who small{display:block;font-weight:400;color:var(--t3);font-size:11.5px}
.how{display:flex;flex-direction:column;gap:0}
.how>div{display:grid;grid-template-columns:34px 1fr;gap:12px;padding-bottom:18px;position:relative}
.how>div:not(:last-child)::before{content:"";position:absolute;left:16px;top:34px;bottom:0;width:2px;background:var(--border)}
.how i{width:34px;height:34px;border-radius:50%;background:var(--acc-dim);color:var(--acc);display:grid;place-items:center;font:600 14px var(--sans);font-style:normal;border:1px solid #E9C26B55}
.how b{display:block;margin-top:6px}
.how span{font-size:13.5px;color:var(--t2)}
.faq details{border-top:1px solid var(--border);padding:4px 0}
.faq details:last-child{border-bottom:1px solid var(--border)}
.faq summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;gap:12px;padding:14px 2px;font-weight:600;font-size:15px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";color:var(--acc);font-size:20px;line-height:1;transition:transform .2s}
.faq details[open] summary::after{transform:rotate(45deg)}
.faq p{margin:0 2px 14px;color:var(--t2);font-size:14px}
.guar{display:flex;gap:14px;align-items:center;padding:18px;border-radius:20px;border:1px solid #E9C26B55;background:radial-gradient(ellipse at 0% 0%,#E9C26B22,transparent 60%),var(--surface)}
.guar .seal{width:62px;height:62px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--grad);color:var(--btn-text);font:700 11px/1.1 var(--sans);text-align:center;box-shadow:0 0 0 4px #E9C26B33}
.wfoot{padding:28px 18px calc(var(--sab) + 110px);font-size:11.5px;color:var(--t3);text-align:center;line-height:1.6}
.ocard{position:relative;padding:18px 16px;border-radius:24px;border:1.5px solid var(--acc);background:radial-gradient(ellipse at 50% 0%,#E9C26B24,transparent 60%),linear-gradient(180deg,#232A40,#1A1F2F);box-shadow:0 0 0 4px #E9C26B18,0 30px 60px -30px #000}
.obadge{position:absolute;top:-12px;left:50%;transform:translateX(-50%);padding:6px 12px;border-radius:999px;background:var(--grad);color:var(--btn-text);font:700 11px/1 var(--sans);letter-spacing:.08em;white-space:nowrap}
.obadge .tok{color:var(--btn-text);border-color:var(--btn-text)}
.orow{display:flex;gap:12px;align-items:center}
.orow .th{width:58px;height:74px;border-radius:12px;overflow:hidden;position:relative;flex:none}
.orow .th img{width:100%;height:100%;object-fit:cover}.orow .th svg{position:absolute;inset:0;width:100%;height:100%}
.oprice{display:flex;align-items:baseline;justify-content:center;gap:10px;margin-top:16px;padding:14px;border-radius:16px;background:var(--bg-elev);border:1px solid var(--border)}
.oprice s{color:var(--t3);font-size:14px}.oprice b{font:600 30px var(--serif);color:var(--acc)}.oprice>span{color:var(--t2);font-size:13px}
.otimer{display:inline-flex;gap:8px;margin-top:12px;padding:8px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--border);font-size:13px;color:var(--t2)}
.otimer b{color:var(--acc);font-variant-numeric:tabular-nums}
.sticky{position:absolute;left:0;right:0;bottom:0;z-index:6;padding:12px 16px max(14px,calc(var(--sab) + 10px));background:linear-gradient(180deg,transparent,#161A27 28%);transform:translateY(110%);transition:transform .3s ease}
.sticky.show{transform:none}
.sticky .sum{display:flex;justify-content:space-between;font-size:12.5px;color:var(--t2);margin-bottom:8px;padding:0 4px}
.sticky .sum b{color:var(--t1)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition:none!important}}
/* ===== ex-compatibility additions ===== */
.rot3{height:24px;overflow:hidden;font:600 20px/24px var(--serif);color:var(--acc)}
.rot3 div{animation:rot3 9s steps(1) infinite}
@keyframes rot3{0%{transform:translateY(0)}25%{transform:translateY(-24px)}50%{transform:translateY(-48px)}75%{transform:translateY(-72px)}100%{transform:translateY(-72px)}}
.art{position:relative;margin:0 -20px;height:230px;flex:none;overflow:hidden;display:grid;place-items:center;background:radial-gradient(ellipse 70% 60% at 50% 50%,#E9C26B1c,transparent 70%)}
.art.sm{height:170px}
.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;-webkit-mask-image:linear-gradient(#000 60%,#0000);mask-image:linear-gradient(#000 60%,#0000)}
.wh{width:100%;max-width:340px;height:auto;display:block}
.wh .ra{fill:none;stroke:#E9C26B;stroke-width:1.1}
.wh .rb{fill:none;stroke:#8FB8FF;stroke-width:1.1}
.wh .ti{fill:none;stroke-width:5;stroke-dasharray:.6 3.34;opacity:.55}
.wh .pl{fill:#F6F3EA}
.wh .lens{fill:#E9C26B33}
.wh .thr{stroke:#F4DA96;stroke-width:1;stroke-dasharray:2 3;opacity:.8}
.wh .ga{animation:toA 3.4s cubic-bezier(.3,.7,.3,1) both}
.wh .gb{animation:toB 3.4s cubic-bezier(.3,.7,.3,1) both}
@keyframes toA{from{transform:translateX(-26px)}to{transform:none}}
@keyframes toB{from{transform:translateX(26px)}to{transform:none}}
.wh.spin .sp{transform-origin:100px 60px;animation:spn 14s linear infinite}
@keyframes spn{to{transform:rotate(360deg)}}
.signs{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.signs .badge{align-self:center}
.vchip{display:inline-flex;gap:8px;align-items:center;padding:7px 12px;border-radius:999px;font:600 13px var(--sans);background:var(--acc-dim);color:var(--acc);border:1px solid #E9C26B55}
.vchip.closure{background:#F29A8A22;color:var(--neg);border-color:#F29A8A66}
.vchip.new{background:#7FD1A822;color:var(--pos);border-color:#7FD1A866}
.gauge{width:128px;height:128px;margin:0 auto}
.gauge b{font-size:30px}
.bxrow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.bxrow .box{padding:0 8px}
.otherbox{margin-top:-2px}
.photo{aspect-ratio:3/4;max-height:42vh}
.tc .vchip{align-self:center}
.oprice{flex-wrap:wrap}.oprice .tok{font-size:13px;white-space:normal;word-break:break-all}.oprice b{font-size:24px}
.who2{display:flex;gap:10px;align-items:center;justify-content:center;font-size:12.5px;color:var(--t2)}

/* ===== witch-power additions ===== */
.stag{align-self:flex-start;font:600 11.5px/1 var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--acc)}
.sky{width:100%;max-width:340px;height:auto;display:block}
.art .sky{width:auto;max-width:100%;height:100%;max-height:100%}
.sky .rg{fill:none;stroke:#E9C26B;stroke-width:1.1}
.sky .tk{fill:none;stroke:#E9C26B;stroke-width:5;stroke-dasharray:.6 3.1;opacity:.55}
.sky .pl{fill:#F6F3EA}
.sky .cr{fill:#F4DA96;filter:drop-shadow(0 0 6px #E9C26Bcc)}
.sky.spin .sp{transform-origin:100px 66px;animation:spn 16s linear infinite}
.sky .ig{animation:ign 2.4s ease both}
@keyframes ign{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
.disc{width:112px;height:112px;border-radius:50%;display:grid;place-items:center;font-size:52px;align-self:center;background:radial-gradient(circle,var(--pc,#E9C26B)44,transparent 70%),var(--surface);border:1px solid var(--pc,#E9C26B);box-shadow:0 0 44px -6px var(--pc,#E9C26B)}
.pname{font:600 34px/1.1 var(--serif);color:var(--pc,var(--acc))}
.b3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.b3 .c{position:relative;padding:14px 6px 12px;border-radius:18px;background:linear-gradient(180deg,#262D42,var(--surface));border:1px solid #E9C26B55;text-align:center;animation:fi .5s ease both}
.b3 .c:nth-child(2){animation-delay:.25s}.b3 .c:nth-child(3){animation-delay:.5s}
.b3 .g{font-size:30px;color:var(--acc);line-height:1}
.b3 .k{font:600 10.5px/1 var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--t3);margin-top:8px;display:block}
.b3 b{display:block;font:600 16px var(--serif);margin-top:4px}
.b3 .est{position:absolute;top:-8px;left:50%;transform:translateX(-50%);font:700 9px/1 var(--sans);letter-spacing:.08em;padding:4px 7px;border-radius:999px;background:var(--surface-2);color:var(--t2);border:1px solid var(--border)}
.blot{width:100%;max-width:220px;height:auto;align-self:center;display:block;filter:drop-shadow(0 0 14px #E9C26B66)}
.cityl{display:flex;flex-wrap:wrap;gap:8px}
.cityl button{padding:9px 12px;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--t2);font-size:13.5px;min-height:40px}
.cityl button:hover{border-color:var(--acc);color:var(--t1)}
.oprice{flex-wrap:wrap}.oprice .tok{font-size:13px;white-space:normal;word-break:break-all}.oprice b{font-size:24px}

/* ===== aura-tarot additions ===== */
.halo{position:relative;width:210px;height:210px;margin:0 auto;display:grid;place-items:center;flex:none}
.halo i{position:absolute;border-radius:50%;background:radial-gradient(circle,var(--hc) 0%,transparent 68%);filter:blur(10px);animation:breathe 4s ease-in-out infinite}
.halo .h1{inset:28px;opacity:.9}.halo .h2{inset:8px;opacity:.55;animation-delay:.6s}.halo .h3{inset:-16px;opacity:.3;animation-delay:1.2s}
@keyframes breathe{50%{transform:scale(1.07);opacity:.6}}
.halo .sil{position:relative;width:60%;height:60%}
.halo .sil *{fill:#0F1320;stroke:var(--hc);stroke-width:1.4}
.halo.cyc{animation:hue 7s linear infinite}
@keyframes hue{to{filter:hue-rotate(360deg)}}
.halo.sm{width:120px;height:120px}
.art .halo{position:relative}
.aname{font:600 36px/1.1 var(--serif);color:var(--hc,var(--acc))}
.trait{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:16px;background:var(--surface);border:1px solid var(--border);font-size:14px;color:var(--t2)}
.trait i{width:8px;align-self:stretch;border-radius:4px;background:var(--hc,var(--acc));flex:none;font-style:normal}
.trait b{display:block;color:var(--t1);font-size:12px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:2px}
.orbs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 8px;padding-top:6px}
.orb{display:flex;flex-direction:column;align-items:center;gap:8px;background:none;border:none;padding:6px 0;color:var(--t2);font-size:14px;font-weight:500;min-height:44px}
.orb b{width:76px;height:76px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffffff88 0%,var(--oc) 38%,#0000 78%),radial-gradient(circle,var(--oc)55,transparent 72%);box-shadow:0 0 30px -4px var(--oc);border:2px solid transparent;transition:transform .15s,border-color .15s}
.orb:hover b{transform:scale(1.05)}
.orb.on b{border-color:var(--acc);transform:scale(1.08)}
.orb.on{color:var(--t1)}
.deck{position:relative;width:96px;height:150px;margin:6px auto 0;flex:none}
.deck .bk{position:absolute;inset:0}
.deck .bk:nth-child(2){transform:translate(3px,-3px) rotate(2deg)}.deck .bk:nth-child(3){transform:translate(6px,-6px) rotate(4deg)}
.deck.rif .bk:nth-child(2){animation:rifA .7s ease both}.deck.rif .bk:nth-child(3){animation:rifB .7s ease both}
@keyframes rifA{50%{transform:translate(-46px,-4px) rotate(-14deg)}}
@keyframes rifB{50%{transform:translate(46px,-6px) rotate(14deg)}}
.bk{border-radius:12px;background:linear-gradient(145deg,#2D3550,#171C2C);border:1px solid #E9C26B99;box-shadow:0 8px 20px -10px #000;overflow:hidden}
.bk::before{content:"";position:absolute;inset:6px;border-radius:8px;border:1px solid #E9C26B55}
.bk::after{content:"";position:absolute;left:50%;top:50%;width:26%;aspect-ratio:1;transform:translate(-50%,-50%) rotate(45deg);border:1.5px solid #E9C26B;background:#E9C26B22}
.bk img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.slotw{display:flex;flex-direction:column;gap:6px;align-items:stretch}
.slotw>span{font:600 11px/1 var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--t3);text-align:center}
.slot{aspect-ratio:3/4.4;border-radius:12px;border:1.5px dashed var(--border);display:grid;place-items:center;color:var(--t3);font-size:20px;position:relative}
.slot .tcard{position:absolute;inset:-1.5px;animation:flipin .5s ease both}
@keyframes flipin{from{transform:rotateY(90deg) scale(.9);opacity:0}to{transform:none;opacity:1}}
.tcard{border-radius:12px;background:linear-gradient(180deg,#2A3147,#1B2030);border:1.5px solid var(--acc);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:8px 4px 10px;text-align:center;box-shadow:0 0 22px -8px var(--acc)}
.tcard .rn{font:600 11px/1 var(--serif);color:var(--acc);letter-spacing:.08em}
.tcard .gl{font-size:34px;line-height:1}
.tcard b{font:600 12.5px/1.15 var(--serif);color:var(--t1)}
.fan{display:flex;justify-content:center;height:150px;padding-top:26px;flex:none}
.fc{width:54px;height:90px;margin-left:-14px;border:none;padding:0;background:none;position:relative;transform-origin:50% 140%;transform:rotate(var(--r)) translateY(var(--y));transition:transform .3s,opacity .3s;flex:none;touch-action:manipulation}
.fc:first-child{margin-left:0}
.fc .bk{position:absolute;inset:0}
.fc:not(.used):hover{transform:rotate(var(--r)) translateY(calc(var(--y) - 12px))}
.fc.used{opacity:.12;pointer-events:none;transform:rotate(var(--r)) translateY(calc(var(--y) + 18px))}
.cards3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;align-items:start}
.cards3 .cw{display:flex;flex-direction:column;gap:8px;align-items:stretch;font-size:12.5px;color:var(--t2);text-align:center}
.cards3 .tcard{aspect-ratio:3/4.4;animation:fi .5s ease both}
.cards3 .cw:nth-child(2) .tcard{animation-delay:.2s}.cards3 .cw:nth-child(3) .tcard{animation-delay:.4s}
.cards3 .pos{font:600 11px/1 var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--acc)}
.backs{display:flex;justify-content:center;gap:8px}
.backs .bk{position:relative;width:34px;height:52px;border-radius:7px}
.tinyh{display:flex;align-items:center;justify-content:center;gap:10px}


/* ===== tarot additions ===== */
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tpick{position:relative;aspect-ratio:3/3.6;border-radius:18px;overflow:hidden;border:1.5px solid var(--border);background:radial-gradient(ellipse at 50% 30%,#E9C26B22,transparent 70%),linear-gradient(180deg,#262D42,var(--surface));padding:0;text-align:left;transition:border-color .15s,transform .12s}
.tpick:active{transform:scale(.98)}
.tpick img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tpick .em{position:absolute;inset:0;display:grid;place-items:center;font-size:44px}
.tpick .lb{position:absolute;left:0;right:0;bottom:0;padding:10px 12px;background:linear-gradient(180deg,transparent,#0E111Ae6 45%);font:600 16px var(--serif);color:var(--t1)}
.tpick.on{border-color:var(--acc);box-shadow:0 0 0 3px #E9C26B33,0 0 30px -8px #E9C26B}
.tpick.wide{grid-column:1/-1;aspect-ratio:auto;min-height:58px;display:flex;align-items:center;gap:12px;padding:0 14px}
.tpick.wide .em{position:static;font-size:20px;display:inline}
.tpick.wide .lb{position:static;background:none;padding:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{padding:9px 12px;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--t2);font-size:13.5px;min-height:40px;text-align:left}
.chips button:hover,.chips button.on{border-color:var(--acc);color:var(--t1)}
.qbox{border-radius:18px;background:linear-gradient(180deg,#262D42,var(--surface));border:1px solid var(--border);padding:14px 14px 10px;box-shadow:0 0 50px -20px #E9C26B66}
.qbox:focus-within{border-color:var(--acc)}
.qbox textarea{width:100%;min-height:66px;resize:none;background:transparent;border:none;outline:none;color:var(--t1);font:600 19px/1.3 var(--serif)}
.qbox textarea::placeholder{color:var(--t3);font-weight:400}
.qbox .cnt{font-size:11.5px;color:var(--t3);text-align:right}
.quote{font:600 16px/1.35 var(--serif);color:var(--t1);text-align:center;padding:10px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--border)}
.quote::before{content:"“";color:var(--acc)}.quote::after{content:"”";color:var(--acc)}
.steps3{display:flex;flex-direction:column;gap:10px}
.steps3 div{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:16px;background:var(--surface);border:1px solid var(--border);font-size:14.5px}
.steps3 i{width:30px;height:30px;border-radius:50%;background:var(--grad);color:var(--btn-text);display:grid;place-items:center;font:600 13px var(--sans);font-style:normal;flex:none}
/* cards */
.tcard{position:relative;overflow:hidden}
.tcard>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}
.tcard.hasimg .gl,.tcard.hasimg .rn{opacity:0}
.tcard.hasimg b{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:16px 4px 7px;background:linear-gradient(180deg,transparent,#0E111Ae0 55%)}
.tcard.rev>img{transform:rotate(180deg)}
.tcard .rvt{position:absolute;top:6px;left:50%;transform:translateX(-50%);z-index:3;font:700 9px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;padding:4px 7px;border-radius:999px;background:#0E111Acc;color:var(--acc);border:1px solid #E9C26B66;font-style:normal;white-space:nowrap}
.bigcard{width:150px;aspect-ratio:3/4.6;margin:0 auto;animation:flipin .7s ease both;flex:none}
.bigcard .tcard{width:100%;height:100%}
.bigcard .tcard b{font-size:14px}
/* spread chooser */
.spr{display:flex;flex-direction:column;gap:10px}
.spr button{display:flex;align-items:center;gap:14px;padding:14px;border-radius:18px;border:1.5px solid var(--border);background:var(--surface);text-align:left;position:relative}
.spr button.on{border-color:var(--acc);background:linear-gradient(0deg,#E9C26B1c,#E9C26B1c),var(--surface)}
.spr .mini{display:flex;gap:3px;width:62px;justify-content:center;flex:none}
.spr .mini i{width:13px;height:20px;border-radius:3px;background:linear-gradient(145deg,#2D3550,#171C2C);border:1px solid #E9C26B99}
.spr b{display:block;font-size:15.5px}.spr small{color:var(--t3);font-size:12.5px}
.spr .rib{position:absolute;top:-10px;right:14px;font:700 10px/1 var(--sans);letter-spacing:.08em;padding:5px 8px;border-radius:999px;background:var(--grad);color:var(--btn-text)}
/* shuffle + cut */
.deckwrap{position:relative;height:210px;display:grid;place-items:center;flex:none}
.deckwrap .deck{width:110px;height:170px;margin:0}
.deck.rifl .bk:nth-child(1){animation:rifA .5s ease infinite}.deck.rifl .bk:nth-child(2){animation:rifB .5s ease .12s infinite}
.hold{position:relative;width:120px;height:120px;border-radius:50%;border:none;margin:0 auto;display:grid;place-items:center;background:conic-gradient(var(--acc) calc(var(--p,0)*1%),var(--surface-2) 0);color:var(--t1);font:600 14px var(--sans);touch-action:none;user-select:none;-webkit-user-select:none;flex:none}
.hold::before{content:"";position:absolute;inset:7px;border-radius:50%;background:radial-gradient(circle,#2A3147,#1B2030)}
.hold span{position:relative;line-height:1.25;text-align:center}
.hold.go{box-shadow:0 0 40px -6px #E9C26B}
.piles{display:flex;justify-content:center;gap:16px;height:170px;align-items:center}
.pile{position:relative;width:84px;height:130px;border:none;background:none;padding:0;animation:fi .4s ease both}
.pile:nth-child(2){animation-delay:.1s}.pile:nth-child(3){animation-delay:.2s}
.pile .bk{position:absolute;inset:0}
.pile .bk:nth-child(2){transform:translate(3px,-3px)}.pile .bk:nth-child(3){transform:translate(6px,-6px)}
.pile:hover{transform:translateY(-6px)}
.pile.on{transform:translateY(-14px);filter:drop-shadow(0 0 16px #E9C26Baa)}
/* fan of 22 */
.fan22{position:relative;height:170px;flex:none;margin:0 -20px}
.fan22 .fc{position:absolute;bottom:0;left:50%;width:52px;height:84px;margin:0;transform-origin:50% 260%;transform:translateX(-50%) rotate(var(--r));transition:transform .25s,opacity .25s}
.fan22 .fc:not(.used):hover{transform:translateX(-50%) rotate(var(--r)) translateY(-14px)}
.fan22 .fc.used{opacity:.1;pointer-events:none;transform:translateX(-50%) rotate(var(--r)) translateY(16px)}
.slotsN{display:grid;grid-template-columns:repeat(var(--cols,3),1fr);gap:10px;justify-content:center}
.slotsN.c1{max-width:150px;margin:0 auto;width:100%}
.slotsN.c5{grid-template-columns:repeat(5,1fr);gap:6px}
.slotsN.c5 .slotw>span{font-size:9.5px;letter-spacing:.04em}
.slotsN.c5 .tcard b{font-size:10px}
.cardsN{display:grid;grid-template-columns:repeat(var(--cols,3),1fr);gap:10px;align-items:start}
.cardsN.c1{grid-template-columns:1fr;max-width:170px;margin:0 auto}
.cardsN.c5{grid-template-columns:repeat(3,1fr)}
.cardsN .cw{display:flex;flex-direction:column;gap:7px;font-size:12.5px;color:var(--t2);text-align:center}
.cardsN .tcard{aspect-ratio:3/4.6;animation:flipin .6s ease both}
.cardsN .pos{font:600 11px/1 var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--acc)}
.lockscr{border-radius:24px;padding:18px 14px;background:linear-gradient(180deg,#232A40,#141826);border:1px solid var(--border);text-align:center}
.lockscr .clock{font:600 46px/1 var(--sans);letter-spacing:-.02em}
.lockscr .dt{font-size:13px;color:var(--t2);margin-top:4px}
.lockscr .push{display:flex;gap:10px;align-items:center;text-align:left;margin-top:16px;padding:10px 12px;border-radius:16px;background:#ffffff14;font-size:13px}
.lockscr .push img,.lockscr .push .pi{width:30px;height:44px;border-radius:6px;object-fit:cover;flex:none}
.lockscr .push small{display:block;color:var(--t3);font-size:10.5px;letter-spacing:.06em}
.minispread{display:flex;justify-content:center;gap:6px}
.minispread .tcard{width:46px;aspect-ratio:3/4.6;padding:4px 2px}
.minispread .tcard b{font-size:8px;padding:10px 2px 4px}
.minispread .tcard .gl{font-size:18px}
.blocked{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:12px;padding:30px;text-align:center}
.minispread .tcard .rvt{display:none}
.minispread .tcard.rev{box-shadow:0 0 0 1px #F29A8A88}

<script>
const QS=new URLSearchParams(location.search);
const DEBUG=QS.get('debug')==='1';
const IMG=/*IMG-START*/{'img/hook-tarot.jpg':'img/hook-tarot.jpg','img/card-back.jpg':'img/card-back.jpg','img/topic-love.jpg':'img/topic-love.jpg','img/topic-work.jpg':'img/topic-work.jpg','img/topic-money.jpg':'img/topic-money.jpg','img/topic-self.jpg':'img/topic-self.jpg'}/*IMG-END*/;
const im=p=>IMG[p]||p;
const cardImg=i=>im('img/card-'+String(i).padStart(2,'0')+'.jpg');
const PASS=['utm_source','utm_medium','utm_campaign','utm_term','utm_content','utm_id','fbclid','ttclid','gclid'];
const IC={
  back:'<path d="m15 18-6-6 6-6"/>',x:'<path d="M18 6 6 18M6 6l12 12"/>',check:'<path d="M20 6 9 17l-5-5"/>',
  lock:'<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
  shield:'<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10"/><path d="m9 12 2 2 4-4"/>',
  clock:'<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
  spark:'<path d="M12 3l1.9 5.8L20 11l-6.1 2.2L12 19l-1.9-5.8L4 11l6.1-2.2z"/>',
  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  mail:'<rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 5L2 7"/>',
  apple:'<path d="M12 20.94c1.5 0 2.75 1.06 4 1.06 3 0 6-8 6-12.22A4.91 4.91 0 0 0 17 5c-2.22 0-4 1.44-5 2-1-.56-2.78-2-5-2a4.9 4.9 0 0 0-5 4.78C2 14 5 22 8 22c1.25 0 2.5-1.06 4-1.06Z"/>',
  play:'<path d="m5 3 14 9-14 9z"/>',
  moon:'<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9z"/>',
  hand:'<path d="M18 11V6a2 2 0 0 0-4 0v5M14 10V4a2 2 0 0 0-4 0v6M10 10.5V6a2 2 0 0 0-4 0v8a8 8 0 0 0 16 0v-3a2 2 0 0 0-4 0"/>'
};
const ic=(n,s=20,w=1.9)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[n]}</svg>`;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tok=s=>/\{\{/.test(s)?`<span class="tok">${esc(s)}</span>`:esc(s);
const isTok=s=>/\{\{/.test(s||'');

/* ---------- question data ---------- */
const TOPICS={love:['💞','Love'],work:['💼','Work'],money:['💰','Money'],self:['🌱','Myself']};
const SIT={
 love:{single:['🙋','Single'],seeing:['💬','Seeing someone'],rel:['💍','In a relationship'],over:['💔','It\'s over'],other:['✏️','Other']},
 work:{change:['🚀','Want a change'],stuck:['😮‍💨','Stuck'],start:['🌱','Starting out'],decide:['🤔','A decision'],other:['✏️','Other']},
 money:{tight:['📉','Tight right now'],grow:['📈','Growing'],choice:['🧾','A big choice'],change:['🔄','Changing'],other:['✏️','Other']},
 self:{lost:['🧭','Lost'],rest:['🌙','Restless'],change:['✨','Changing'],heal:['🌿','Healing'],other:['✏️','Other']}
};
const QCHIPS={
 love:['What should I know about us?','How do I move on?','What is blocking love for me?'],
 work:['What should I focus on at work?','Is it time for a change?','What is holding my career back?'],
 money:['How can I feel steadier about money?','What should I weigh before this choice?','What habit should I change?'],
 self:['What do I need right now?','What am I not seeing?','How do I find my direction?'],
 other:['What do I need to know right now?','What is my next step?','What am I not seeing?']
};
const GENQ={love:'What do I need to know about love right now?',work:'What do I need to know about my work right now?',money:'What do I need to know about money right now?',self:'What do I need to know about myself right now?',other:'What do I need to know right now?'};
const FEEL={hope:['🌤','Hopeful'],anx:['😟','Anxious'],stuck:['🧱','Stuck'],cur:['🔎','Curious']};
const SPREADS={
 '1':{name:'1 card',sub:'Clear answer',pos:[['Answer','the heart of it']]},
 '3':{name:'3 cards',sub:'Past, now, next',pos:[['Past','what shaped this'],['Now','where you stand'],['Next','where it leans']]},
 '5':{name:'5 cards',sub:'The full picture',pos:[['Now','the situation'],['Block','what is in the way'],['Root','what is under it'],['Help','what helps'],['Next','where it leans']]}
};
/* 22 Major Arcana: [glyph, name, upright line, upright depth, reversed line] */
const RN=['0','I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII','XIII','XIV','XV','XVI','XVII','XVIII','XIX','XX','XXI'];
const CARDS=[
 ['🃏','The Fool','A fresh start, with open eyes.','A new step is on the table. Go light and stay curious.','Slow down before you leap.'],
 ['🪄','The Magician','You have the tools already.','Skill and focus are yours to use. Start with what is in hand.','Scattered effort, unclear aim.'],
 ['🌙','The High Priestess','Quiet knowing, not yet spoken.','Listen before you decide. The answer is mostly inside.','You are ignoring a quiet hunch.'],
 ['🌹','The Empress','Care that makes things grow.','Nourish what matters, yourself included.','Giving more than you receive.'],
 ['👑','The Emperor','Structure gives you freedom.','A clear rule or boundary steadies things.','Control is tighter than it needs to be.'],
 ['🗝️','The Hierophant','Learn from a trusted guide.','A mentor or tradition has something to teach you.','Old rules may not fit you now.'],
 ['💞','The Lovers','A choice that matches your values.','Choose what fits who you are, not what is easy.','Values and wants pull apart.'],
 ['🏇','The Chariot','Direction beats speed.','Pull your competing wants into one clear course.','Pulled in two directions at once.'],
 ['🦁','Strength','Gentle courage wins.','Patience and warmth work better than force.','Self-doubt is louder than it should be.'],
 ['🏮','The Hermit','Step back to see clearly.','Time alone helps you find your own light.','Too much time alone, not enough help.'],
 ['🎡','Wheel of Fortune','Cycles turn, and so will this.','Change is part of the pattern. Adapt, don\'t clutch.','Resisting a change that is coming.'],
 ['⚖️','Justice','Honest weighing, fair outcome.','Look at the facts, and own your part.','Something feels unfair. Check the facts.'],
 ['🙃','The Hanged Man','A pause shows a new angle.','Ease off the push and look from another side.','Waiting has turned into stalling.'],
 ['🦋','Death','An ending that clears space.','Something has run its course. Make room for what is next.','Holding on to what has ended.'],
 ['🏺','Temperance','Blend, don\'t swing.','Moderation and patience bring balance.','Swinging between extremes.'],
 ['⛓️','The Devil','Notice what you feel stuck to.','A habit or tie holds more than you admit. You can loosen it.','You are starting to break free.'],
 ['⚡','The Tower','A shake-up shows what is solid.','What was fragile falls away. Build on what stays.','Avoiding a change you know is due.'],
 ['⭐','The Star','Hope returns, quietly.','Rest and trust. A gentle, steady light is on.','Hope is low. Start very small.'],
 ['🌕','The Moon','Not everything is clear yet.','Feelings and doubts run loud. Move slowly and check the facts.','The fog is starting to lift.'],
 ['☀️','The Sun','Plain, warm clarity.','Joy and confidence are close. Enjoy what is working.','Joy is there, just a little muted.'],
 ['📯','Judgement','A call to answer honestly.','Review the past, forgive, and step into the next chapter.','Being too hard on yourself.'],
 ['🌍','The World','A cycle completes.','You have come far. Mark it, then begin again.','Almost done. Finish one loose end.']
].map((c,i)=>({i,n:RN[i],g:c[0],name:c[1],line:c[2],txt:c[3],rline:c[4]}));
const TFRAME={love:'For love',work:'At work',money:'With money',self:'For you',other:'Here'};
const SIGNS=[['Capricorn',1,19],['Aquarius',2,18],['Pisces',3,20],['Aries',4,19],['Taurus',5,20],['Gemini',6,20],['Cancer',7,22],['Leo',8,22],['Virgo',9,22],['Libra',10,22],['Scorpio',11,21],['Sagittarius',12,21],['Capricorn',12,31]];
const signOf=d=>{const m=+d.m,dd=+d.d;if(!m||!dd)return '';for(const[s,mm,x]of SIGNS)if(m<mm||(m===mm&&dd<=x))return s;return 'Capricorn'};
const sun=()=>signOf(S.dob);
/* birth card: month + day + year, digits summed until 0-21 (22 = The Fool) */
const birthIdx=()=>{const d=S.dob;if(!full(d))return 17;let n=+d.m + +d.d + +d.y;while(n>22)n=String(n).split('').reduce((a,b)=>a+ +b,0);return n===22?0:n};
const BC=()=>CARDS[birthIdx()];

const INIT=()=>({i:1,hist:[],v:QS.get('v')==='B'?'B':'A',topic:'',topicOther:'',sit:'',sitOther:'',q:'',qSrc:'',feel:'',dob:{m:'',d:'',y:''},dobErr:'',blocked:false,name:'',spread:'3',deck:[],piles:false,cut:-1,picks:[],held:false,ntime:'8',email:'',emailErr:'',consent:false,plan:CONFIG.defaultPlan,paid:false,pack:false,completed:false,offerSeen:false});
let S=INIT();
try{if(sessionStorage.getItem('ikf_age_block'))S.blocked=true}catch(e){}
const t=(a,b)=>S.v==='B'?b:a;
const SCREENS={1:'hook',2:'topic',3:'situation',4:'question',5:'feeling',6:'bridge',7:'birth_date',8:'birth_card',9:'name',10:'spread',11:'trust',12:'shuffle_cut',13:'pull',14:'cards_reveal',15:'daily_card',16:'email',17:'teaser',18:'paywall',19:'get_app'};
const QN=[2,3,4,5,7,9,10];
const SKIPBACK=[12,18,19];
const nm=()=>(S.name||'').trim();
const N=()=>+S.spread||3;
const POS=()=>SPREADS[S.spread||'3'].pos;
const qText=()=>(S.q||'').trim()||GENQ[S.topic||'other'];
const qShort=()=>{const x=qText();return x.length>34?x.slice(0,32).trim()+'…':x};
const topicL=()=>S.topic==='other'?(S.topicOther.trim()||'Other'):(TOPICS[S.topic]||['','Your question'])[1];
const drawn=()=>S.picks.map(p=>Object.assign({},CARDS[S.deck[p.i]],{rev:p.rev}));
const sampleDraw=()=>{const k=N();return [17,19,9,3,21].slice(0,k).map((ci,j)=>Object.assign({},CARDS[ci],{rev:j===1}))};
const cardsNow=()=>S.picks.length===N()?drawn():sampleDraw();

const app=document.getElementById('app');
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
let timers=[];const later=(f,ms)=>{const id=setTimeout(f,ms);timers.push(id);return id};
const clearT=()=>{timers.forEach(clearTimeout);timers=[];clearInterval(window.__iv)};

/* ---------- tracking (never the email or the typed question) ---------- */
function snapshot(){return {screen:S.i,screenName:SCREENS[S.i],variant:S.v,topic:S.topic||null,situation:S.sit||null,feeling:S.feel||null,spread:S.spread,birthCard:full(S.dob)?BC().name:null,sunSign:sun()||null,cards:S.picks.length===N()?drawn().map(c=>c.name+(c.rev?' (R)':'')):null,plan:S.plan,paid:S.paid}}
function emit(name,detail){
  let data={};try{data=snapshot()}catch(e){}
  const d=Object.assign({},detail||{},{data});
  try{window.dispatchEvent(new CustomEvent('ikfunnel:'+name,{detail:d}))}catch(e){}
  try{window.parent.postMessage({source:'ikame-funnel',funnel:CONFIG.funnel,event:name,detail:d},'*')}catch(e){}
  const f=Object.assign({funnel:CONFIG.funnel},data,detail||{});
  try{if(typeof window.fbq==='function')window.fbq('trackCustom',name,f)}catch(e){}
  try{if(window.ttq&&typeof window.ttq.track==='function')window.ttq.track(name,f)}catch(e){}
  if(DEBUG)try{console.log('[ikfunnel]',name,JSON.stringify(detail||{}))}catch(e){}
}
const answer=(k,v)=>emit('answer',{key:k,value:v});
function navTop(h){try{window.top.location.href=h}catch(e){location.href=h}}
function checkout(){
  const url=CONFIG.checkoutUrl[S.plan]||'';emit('checkout_click',{plan:S.plan,url});
  if(!url)return;let u;try{u=new URL(url,location.href)}catch(e){return}
  u.searchParams.set('plan',S.plan);PASS.forEach(k=>{const v=QS.get(k);if(v&&!u.searchParams.has(k))u.searchParams.set(k,v)});navTop(u.toString());
}
function appLink(){const ua=navigator.userAgent||'';return CONFIG.appUrl||(/android/i.test(ua)?CONFIG.playStoreUrl:CONFIG.appStoreUrl)}
const legal=()=>`<div class="legal"><a ${CONFIG.termsUrl?`href="${esc(CONFIG.termsUrl)}" target="_blank" rel="noopener"`:''}>Terms of Use</a><a ${CONFIG.privacyUrl?`href="${esc(CONFIG.privacyUrl)}" target="_blank" rel="noopener"`:''}>Privacy Policy</a>${CONFIG.subscriptionTermsUrl?`<a href="${esc(CONFIG.subscriptionTermsUrl)}" target="_blank" rel="noopener">Subscription terms</a>`:''}</div>`;

function viewed(){emit('screen_view',{index:S.i,name:SCREENS[S.i]});if(S.i===18)emit('paywall_view');if(S.i===IK_GET&&!S.completed){S.completed=true;emit('complete',{paid:S.paid})}}
function go(n,push=true){clearT();if(push&&S.i!==n)S.hist.push(S.i);S.i=n;render(true);viewed()}
function next(){go(S.i+1)}
function back(){clearT();let p=S.hist.pop();while(p&&SKIPBACK.includes(p))p=S.hist.pop();if(p){S.i=p;render(true);viewed()}}
function toast(m){const e=document.createElement('div');e.className='toast';e.textContent=m;app.appendChild(e);setTimeout(()=>e.remove(),2700)}

/* ---------- blocks ---------- */
function nav(){
  if(S.blocked||S.i===1||S.i===12||S.i===13||S.i>=18)return '';
  const k=QN.indexOf(S.i);
  const p=k<0?Math.round(QN.filter(x=>x<S.i).length/QN.length*100):Math.round((k+1)/QN.length*100);
  return `<div class="nav" style="height:auto;flex-direction:column;align-items:stretch;gap:6px;padding-top:4px"><div style="display:flex;align-items:center"><button class="iconbtn" data-a="back" aria-label="Back">${ic('back',22)}</button><div class="brand" style="flex:1">${ic('spark',16)} Starlyn</div><span class="stepn">${k<0?'':(k+1)+'/'+QN.length}</span></div><div class="prog" style="margin:0 8px"><span style="width:${p}%"></span></div></div>`;
}
const cta=(l,ok=true,a='next')=>`<button class="btn" data-a="${a}" ${ok?'':'disabled'}>${l}</button>`;
const opts=(f,o)=>`<div class="opts">${Object.entries(o).map(([k,[e,l]])=>`<button class="opt ${S[f]===k?'on':''}" data-a="pick" data-f="${f}" data-v="${k}" aria-pressed="${S[f]===k}"><span class="well">${e}</span><span class="lbl">${l}</span></button>`).join('')}</div>`;
const q=(h,b)=>`<div><h1 class="display sm">${h}</h1>${b?`<p class="lead" style="margin-top:8px">${b}</p>`:''}</div>`;
const otherBox=(of)=>`<div class="box otherbox"><input id="oth" data-f="${of}" maxlength="40" placeholder="Tell us in a few words" value="${esc(S[of])}" aria-label="Other"></div>`;
const sel=(grp,key,label,vals,cur)=>`<div class="box"><select data-${grp}="${key}" aria-label="${label}"><option value="">${label}</option>${vals.map(([v,l])=>`<option value="${v}" ${String(cur)===String(v)?'selected':''}>${l}</option>`).join('')}</select></div>`;
const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'].map((m,i)=>[i+1,m]);
const DAYS=Array.from({length:31},(_,i)=>[i+1,i+1]);
const dobRow=g=>{const ys=[];for(let y=new Date().getFullYear()-10;y>=1930;y--)ys.push([y,y]);const d=S[g];
  return `<div class="row3">${sel(g,'m','Month',MONTHS,d.m)}${sel(g,'d','Day',DAYS,d.d)}${sel(g,'y','Year',ys,d.y)}</div>`};
const skin=(a,l)=>`<button class="link" data-a="${a}">${l}</button>`;
const full=d=>d.m&&d.d&&d.y;
const age=d=>{const now=new Date();let a=now.getFullYear()-(+d.y);if(now.getMonth()+1<+d.m||(now.getMonth()+1===+d.m&&now.getDate()<+d.d))a--;return a};
const sunChip=()=>`<span class="badge fadein">${ic('sun',14)} ${esc(sun()||'Your Sun')}</span>`;
const bk=()=>`<div class="bk"><img src="${im('img/card-back.jpg')}" alt="" onerror="this.remove()"></div>`;
/* card face: art when present, glyph + name underneath as the fallback */
const face=c=>`<div class="tcard hasimg ${c.rev?'rev':''}"><img src="${cardImg(c.i)}" alt="" onerror="this.parentNode.classList.remove('hasimg');this.remove()"><span class="rn">${c.n}</span><span class="gl">${c.g}</span><b>${c.name}</b>${c.rev?'<i class="rvt">Reversed</i>':''}</div>`;
const cline=c=>c.rev?c.rline:c.line;
const miniSpread=()=>`<div class="minispread">${cardsNow().map(face).join('')}</div>`;

/* ---------- web paywall blocks ---------- */
const planOf=k=>CONFIG.plans[k];
const todayLine=()=>`${tok(planOf(S.plan).price)} today`;
const renewLine=k=>{const p=planOf(k);return `${tok(p.price)} today for your first week, then ${tok(p.renew)} every month until you cancel.`};
function planBlock(){const keys=Object.keys(CONFIG.plans);

const OKEY='ikf_offer_'+CONFIG.funnel;
const offerOpen=()=>{const o=CONFIG.offer;if(!o||!o.enabled||S.offerSeen)return false;try{if(sessionStorage.getItem(OKEY))return false}catch(e){}
  if(o.expiresMin&&S.offerEnd&&Date.now()>S.offerEnd)return false;return true};
function runOffer(){const o=CONFIG.offer;try{sessionStorage.setItem(OKEY,'1')}catch(e){}
  if(!o.expiresMin)return;if(!S.offerEnd)S.offerEnd=Date.now()+o.expiresMin*60000;
  const tick=()=>{const el=document.getElementById('otimer');if(!el)return clearInterval(window.__iv);const ms=S.offerEnd-Date.now();
    if(ms<=0){clearInterval(window.__iv);S.offerSeen=true;emit('offer_expired');go(20);return}
    const m=Math.floor(ms/60000),sec=Math.floor(ms/1000)%60;el.textContent=String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0')};
  tick();window.__iv=setInterval(tick,1000)}
const refundReal=()=>!isTok(CONFIG.refundDays);
const ratingReal=()=>{const R=CONFIG.rating;return !!(R&&R.score&&R.count&&!isTok(R.score)&&!isTok(R.count)&&(CONFIG.reviews||[]).some(r=>r&&r.text&&!isTok(r.text)&&!isTok(r.name)))};

const TOC=()=>[['Your cards, one line each',true],['Each card for “'+qShort()+'”',false],['The answer, in plain words',false],['What to do this week',false],['Your birth card guidance',false]];
function reading(){const cs=cardsNow(),P=POS(),fr=TFRAME[S.topic]||'Here';
  const up=cs.filter(c=>!c.rev).length,lean=up>cs.length/2?'open':up===cs.length/2?'mixed':'pause';
  const each=cs.map((c,k)=>`${P[k][0]} - ${c.name}${c.rev?' (reversed)':''}: ${c.rev?c.rline+' '+c.txt.split('.')[0]+' is the lesson.':c.txt}`).join(' ');
  const ans={open:'Mostly upright cards: the way forward is open. Act on the clearest card first.',mixed:'An even mix: part of this is ready, part needs time. Do the easy half now.',pause:'Mostly reversed cards: this asks for a pause. Fix what is blocked before you push.'}[lean];
  const key=cs[Math.min(1,cs.length-1)];
  const week=`${fr}: take one step from ${key.name}. ${key.rev?key.rline:key.line} Write one line about it each evening.`;
  const bc=BC();const birth=`${bc.name} is your birth card. ${bc.txt}`;
  const extra=(S.topic==='money'?' Not financial advice.':'');
  return [['Your cards, one line each',cs.map((c,k)=>P[k][0]+': '+c.name+(c.rev?' (reversed)':'')+'. '+cline(c)).join(' ')],['Each card for “'+qShort()+'”',each],['The answer, in plain words',ans+extra],['What to do this week',week],['Your birth card guidance',birth]]}

  <p class="lead">Readings are only for people 18 and older. Picked the wrong date?</p></div><div class="foot">${cta('Change my birth date',true,'agefix')}</div>`;
function backsFan(){return `<div class="fan" style="height:220px;padding-top:40px">${[0,1,2,3,4].map(i=>`<div class="fc" style="--r:${(i-2)*9}deg;--y:${Math.abs(i-2)*8}px;width:70px;height:112px;margin-left:-22px">${bk()}</div>`).join('')}</div>`}

/* ---------- shuffle ritual ---------- */
const shuffle=()=>{const a=CARDS.map((_,i)=>i);for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function doShuffle(){S.deck=shuffle();S.picks=[];S.held=true;answer('shuffle',true);const d=document.getElementById('deck');if(d&&!RM)d.classList.add('rifl');
  later(()=>{S.piles=true;render()},RM?0:900)}
function bindHold(v){const h=v.querySelector('#hold');if(!h)return;let p=0,iv=null;
  const stop=()=>{clearInterval(iv);iv=null;if(p<100){p=0;h.style.setProperty('--p',0);h.classList.remove('go');document.getElementById('deck')?.classList.remove('rifl')}};
  h.addEventListener('pointerdown',e=>{e.preventDefault();if(iv)return;h.classList.add('go');document.getElementById('deck')?.classList.add('rifl');
    iv=setInterval(()=>{p=Math.min(100,p+(RM?100:4));h.style.setProperty('--p',p);if(p>=100){clearInterval(iv);iv=null;doShuffle()}},60)});
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>h.addEventListener(ev,stop));
  later(()=>{const f=document.getElementById('tapf');if(f)f.hidden=false},3000)}

/* ---------- render ---------- */
function render(anim){
  const v=document.createElement('div');v.className='view'+(anim&&!RM?' in':'');
  v.innerHTML=S.blocked?u18View():nav()+V[S.i]();
  const old=app.querySelector('.view');if(old)old.replaceWith(v);else app.appendChild(v);
  if(S.blocked)return;
  if(S.i===12)bindHold(v);
  if(S.i===18)bindPaywall(v);
  
  const o=v.querySelector('#oth');if(o&&!o.value)o.focus();
}
function bindPaywall(v){
  const wp=v.querySelector('#wp'),st=v.querySelector('#sticky'),blocks=[...v.querySelectorAll('.pick')];
  if(!wp||!('IntersectionObserver' in window)){st&&st.classList.add('show');return}
  const vis=new Set();
  const io=new IntersectionObserver(es=>{es.forEach(e=>e.isIntersecting?vis.add(e.target):vis.delete(e.target));st.classList.toggle('show',!vis.size&&wp.scrollTop>40)},{root:wp,threshold:.25});
  blocks.forEach(b=>io.observe(b));
  wp.addEventListener('scroll',()=>{wp.classList.toggle('scrolled',wp.scrollTop>260);st.classList.toggle('show',!vis.size&&wp.scrollTop>40)},{passive:true});
}
app.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b||b.disabled)return;const a=b.dataset.a,v=b.dataset.v;
  switch(a){
    case 'agefix':S.blocked=false;try{sessionStorage.removeItem('ikf_age_block')}catch(e){}S.dob={m:'',d:'',y:''};S.dobErr='';go(IK_DOB,false);break;
    case 'next':if(S.i===1)emit('start');if(S.i===2&&S.topic==='other')answer('topic_other',true);next();break;
    case 'back':back();break;
    case 'pick':{const f=b.dataset.f;S[f]=v;answer(f,v);if(f==='topic'){S.sit='';S.q=''}
      if(v==='other'){render();break}
      app.querySelectorAll(`[data-f="${f}"]`).forEach(x=>{const on=x.dataset.v===v;x.classList.toggle('on',on);x.setAttribute('aria-pressed',on)});later(next,RM?0:280);break}
    case 'chip':S.q=v;S.qSrc='chip';S.qErr=false;{const ta=document.getElementById('qq');if(ta){ta.value=v;document.getElementById('qn').textContent=v.length}}app.querySelectorAll('.chips button').forEach(x=>x.classList.toggle('on',x.dataset.v===v));break;
    case 'ask':{const x=(S.q||'').trim();if(x.length<6){S.qErr=true;render();break}S.q=x;S.qErr=false;answer('question',S.qSrc==='chip'?'chip':'typed');next();break}
    case 'qskip':S.q='';S.qErr=false;answer('question','cards_choose');next();break;
    case 'dob':{if(!full(S.dob)){S.dobErr='Pick a real date.';render();break}
      const ad=new Date(+S.dob.y,+S.dob.m-1,+S.dob.d);if(ad.getMonth()!==+S.dob.m-1){S.dobErr='Pick a real date.';render();break}
      if(age(S.dob)<18){S.blocked=true;try{sessionStorage.setItem('ikf_age_block','1')}catch(e){}emit('age_block');render();break}
      S.dobErr='';answer('birth_card',BC().name);next();break}
    case 'name':S.name=(S.name||'').trim();answer('name_given',!!S.name);next();break;
    case 'nskip':S.name='';answer('skip_name',true);next();break;
    case 'spread':S.spread=v;S.picks=[];answer('spread',v);app.querySelectorAll('.spr button').forEach(x=>{const on=x.dataset.v===v;x.classList.toggle('on',on);x.setAttribute('aria-pressed',on)});break;
    case 'tapshuffle':doShuffle();break;
    case 'cut':{const k=+v;S.cut=k;answer('cut',k+1);const piles=[S.deck.slice(0,7),S.deck.slice(7,14),S.deck.slice(14)];S.deck=[...piles[k],...piles.filter((_,j)=>j!==k).flat()];
      b.classList.add('on');later(next,RM?0:450);break}
    case 'draw':{const i=+v,n=N();if(S.picks.length>=n||S.picks.some(p=>p.i===i))break;const rev=Math.random()<.25;S.picks.push({i,rev});const k=S.picks.length-1,c=Object.assign({},CARDS[S.deck[i]],{rev});
      answer('card_'+(k+1),c.name+(rev?' (R)':''));b.classList.add('used');const sl=document.getElementById('sl'+k);if(sl)sl.innerHTML=face(c);
      document.getElementById('cnt').textContent=S.picks.length+' of '+n;
      if(S.picks.length===n){const cb=app.querySelector('.foot .btn[data-a="turn"]');if(cb)cb.disabled=false}break}
    case 'turn':if(S.picks.length===N())next();break;
    case 'ntime':answer('daily_time',S.ntime);next();break;
    case 'nnot':answer('daily_time','skip');next();break;
    case 'consent':S.consent=!S.consent;render();break;
    case 'email':{const x=(S.email||'').trim();if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(x)){S.emailErr='Enter a valid email address';render();document.getElementById('em')?.focus();break}S.email=x;S.emailErr='';emit('lead',{method:'email',marketingConsent:S.consent});next();break}
    case 'plan':{S.plan=v;emit('plan_select',{plan:v});
      if(S.i!==18){render();break}
      app.querySelectorAll('.wplan').forEach(x=>{const on=x.dataset.v===v;x.classList.toggle('on',on);x.setAttribute('aria-pressed',on);x.querySelector('.rd').innerHTML=on?ic('check',12,3):''});
      app.querySelectorAll('[data-renew]').forEach(x=>x.innerHTML=renewLine(v));app.querySelectorAll('[data-today]').forEach(x=>x.innerHTML=todayLine());
      document.getElementById('sumline').innerHTML=todayLine();document.querySelector('#sticky .sum span').textContent=planOf(v).name;break}
    case 'toplans':document.getElementById('plans1')?.scrollIntoView({block:'start'});break;
    case 'pay':checkout();break;
    case 'closepw':break;   /* hard paywall: no exit without purchase */
    case 'offerbuy':S.offerSeen=true;{const u=CONFIG.offer.checkoutUrl||'';emit('offer_accept',{price:CONFIG.offer.price,url:u});emit('checkout_click',{plan:'offer',url:u});if(u)try{const x=new URL(u,location.href);x.searchParams.set('plan','offer');PASS.forEach(k=>{const v=QS.get(k);if(v&&!x.searchParams.has(k))x.searchParams.set(k,v)});navTop(x.toString())}catch(e){}}break;
    case 'offerno':S.offerSeen=true;emit('offer_decline');go(20);break;
    case 'topw':go(18);break;
    case 'app':{const u=appLink();emit('app_handoff',{url:u});if(u)navTop(u);else toast('App link coming soon');break}
  }
});
app.addEventListener('change',e=>{const d=e.target.dataset;
  if(d.dob!==undefined){S.dob[d.dob]=e.target.value;S.dobErr='';render()}
  if(d.a2==='ntime'){S.ntime=e.target.value;const c=app.querySelector('.lockscr .clock');if(c)c.textContent=S.ntime+':00'}});
app.addEventListener('input',e=>{const f=e.target.dataset.f;if(!f)return;
  if(f==='email'){S.email=e.target.value;if(S.emailErr){S.emailErr='';e.target.closest('.box').classList.remove('bad');e.target.closest('.scr').querySelector('.err')?.remove()}}
  else if(f==='name'){S.name=e.target.value}
  else if(f==='q'){S.q=e.target.value;S.qSrc='typed';const n=document.getElementById('qn');if(n)n.textContent=S.q.length;app.querySelectorAll('.chips button').forEach(x=>x.classList.toggle('on',x.dataset.v===S.q))}
  else if(f==='topicOther'||f==='sitOther'){S[f]=e.target.value;const c=app.querySelector('.foot .btn[data-a="next"]');if(c)c.disabled=!e.target.value.trim()}});
app.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='em')app.querySelector('[data-a="email"]')?.click();if(e.key==='Enter'&&e.target.id==='nm')app.querySelector('[data-a="name"]')?.click();if(e.key==='Enter'&&e.target.id==='qq'){e.preventDefault();app.querySelector('[data-a="ask"]')?.click()}if(e.key==='Enter'&&e.target.id==='oth')app.querySelector('.foot .btn[data-a="next"]:not([disabled])')?.click()});

/* stars */
(function(){const cv=document.getElementById('stars'),cx=cv.getContext('2d');let w,h;const P=[];
  function size(){const r=app.getBoundingClientRect(),d=Math.min(2,devicePixelRatio||1);w=r.width;h=r.height;cv.width=w*d;cv.height=h*d;cx.setTransform(d,0,0,d,0,0)}
  size();addEventListener('resize',size);for(let i=0;i<70;i++)P.push({x:Math.random(),y:Math.random(),r:Math.random()*1.2+.2,p:Math.random()*6});
  (function f(now){cx.clearRect(0,0,w,h);for(const s of P){cx.globalAlpha=.25+.5*(.5+.5*Math.sin(now/1400+s.p));cx.fillStyle=s.r>1.1?'#E9C26B':'#F6F3EA';cx.beginPath();cx.arc(s.x*w,s.y*h,s.r,0,6.28);cx.fill()}if(!RM)requestAnimationFrame(f)})(0);
})();

/* host API */
window.IkFunnel=Object.assign(window.IkFunnel||{},{config:CONFIG,data:snapshot,
  completeOffer:()=>{S.pack=true;emit('offer_complete');go(IK_GET)},completePurchase:plan=>{if(plan&&CONFIG.plans[plan])S.plan=plan;S.paid=true;emit('purchase_complete',{plan:S.plan});go(IK_GET)}});
if(QS.get('paid')){S.paid=true;S.plan='1w';S.i=IK_GET}
function fillTo(n){Object.assign(S,{topic:S.topic||'love',sit:S.sit||'seeing',q:S.q||'What should I know about us?',feel:S.feel||'hope',dob:S.dob.m?S.dob:{m:'5',d:'14',y:'1994'},name:S.name||'Maya',email:S.email||'demo@example.com'});
  if(n>12&&!S.deck.length){S.deck=shuffle();S.piles=true;S.cut=0}if(n>13&&S.picks.length<N()){S.picks=Array.from({length:N()},(_,k)=>({i:k*2,rev:k===1}))}}
if(DEBUG){window.IkFunnel.go=n=>{clearT();fillTo(n);go(n)};const m=location.hash.match(/s=?([0-9]+)/);if(m&&V[+m[1]]){fillTo(+m[1]);S.i=+m[1]}}
emit('funnel_start',{referrer:(()=>{try{return document.referrer?new URL(document.referrer).hostname:''}catch(e){return ''}})()});
render();viewed();
