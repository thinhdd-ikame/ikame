<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B0920">
<meta name="robots" content="noindex">
<title>Nebula &middot; Astrocartography</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600&display=swap">
<style>
:root{
  color-scheme:dark;
  --ground:#05040C;
  --bg:#0B0920;--bg-elev:#130F2E;--surface:#171235;--surface-2:#221B4A;--border:#342A66;
  --t1:#F5F2FB;--t2:#B3AAD3;--t3:#7D74A0;
  --acc:#C3A3FF;--acc-dim:#8B5CF633;--btn-text:#fff;
  --grad:linear-gradient(100deg,#7B4DFF 0%,#B84BE3 55%,#EE5A9F 100%);
  --gold:#E9C26B;--rose:#F29BB8;--neg:#F29A8A;--pos:#7FD1A8;
  --serif:"Fraunces",Georgia,"Times New Roman",serif;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{height:100%}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--ground);color:var(--t1);font:15px/1.45 var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
a{color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.app{position:relative;width:100%;max-width:480px;height:100vh;height:100dvh;margin:0 auto;overflow:hidden;isolation:isolate;background:radial-gradient(ellipse 120% 60% at 50% 0%,#1a1240 0%,var(--bg) 60%)}
@media (min-width:520px){.app{border-inline:1px solid #2E2456}}
#stars{position:absolute;inset:0;width:100%;height:100%;z-index:0;display:block}
.stage{position:absolute;inset:0;z-index:1;overflow:hidden}
.view{position:absolute;inset:0;padding-top:calc(var(--sat) + 6px);display:flex;flex-direction:column}
.view.out{animation:vout .22s ease forwards;pointer-events:none}
.view.in{animation:vin .32s ease both}
@keyframes vout{to{opacity:0}}
@keyframes vin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.nav{height:48px;flex:none;display:flex;align-items:center;gap:10px;padding:0 12px;position:relative;z-index:3}
.iconbtn{width:44px;height:44px;border-radius:50%;border:none;background:transparent;display:grid;place-items:center;color:var(--t2);flex:none}
.iconbtn:hover{background:var(--surface)}
.prog{flex:1;height:4px;border-radius:2px;background:var(--surface-2);overflow:hidden}
.prog span{display:block;height:100%;background:var(--grad);border-radius:2px;transition:width .35s ease}
.navspacer{width:44px}
.scr{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 20px 12px;display:flex;flex-direction:column;gap:18px;position:relative;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.scr::-webkit-scrollbar{display:none}
.scr.center{justify-content:center}
.foot{flex:none;padding:10px 20px max(20px,calc(var(--sab) + 12px));display:flex;flex-direction:column;gap:8px;position:relative;z-index:2}
.note{font-size:12px;color:var(--t3);text-align:center;text-wrap:balance}
.note a{color:var(--t2);text-decoration:underline;text-decoration-color:var(--border);text-underline-offset:2px}
.sky{position:absolute;inset:0 0 auto 0;height:340px;z-index:0;pointer-events:none;background:radial-gradient(ellipse 80% 70% at 50% 0%,#4A2A8A55 0%,#2A1F5A33 45%,transparent 100%)}
.z{position:relative;z-index:1}
.display{font:600 30px/1.12 var(--serif);letter-spacing:-.01em;margin:0;text-wrap:balance}
.display.xl{font-size:36px}
.display.sm{font-size:26px}
.lead{color:var(--t2);margin:0;font-size:15px;text-wrap:pretty}
.eyebrow{font:600 12px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--acc)}
.badge{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:var(--acc-dim);color:var(--acc);font:500 13px/1 var(--sans)}
.tc{text-align:center}.tc .badge{align-self:center}
.btn{height:54px;border-radius:999px;border:none;background:var(--grad);color:var(--btn-text);font:600 16px/1 var(--sans);width:100%;display:flex;align-items:center;justify-content:center;gap:10px;transition:transform .12s ease,opacity .2s;flex:none;text-decoration:none}
.btn:active{transform:scale(.98)}
.btn[disabled]{background:var(--surface-2);color:var(--t3);cursor:not-allowed}
.btn.ghost{background:var(--surface);color:var(--t1);border:1px solid var(--border)}
.btn.light{background:var(--t1);color:#0B0920}
.btn.black{background:#000;color:#fff;border:1px solid #3a3a3a}
.btn:not([disabled]):not(.ghost):not(.light):not(.black){position:relative;overflow:hidden;box-shadow:0 8px 28px -10px #C048E0aa}
.btn:not([disabled]):not(.ghost):not(.light):not(.black)::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:0;background:linear-gradient(100deg,transparent,#ffffff55,transparent);transform:translateX(-150%) skewX(-20deg);animation:sheen 4.5s ease-in-out 1.2s infinite}
@keyframes sheen{0%{transform:translateX(-150%) skewX(-20deg)}28%,100%{transform:translateX(320%) skewX(-20deg)}}
.link{background:none;border:none;color:var(--t2);font-size:14px;padding:6px 10px;min-height:44px;text-align:center;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--border)}
.link:hover{color:var(--t1)}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:14px;padding:11px 14px;min-height:56px;border-radius:999px;background:var(--surface);border:1px solid var(--border);text-align:left;width:100%;transition:border-color .15s,background .15s}
.opt:hover{border-color:#4f4290}
.opt .well{width:36px;height:36px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;flex:none;font-size:18px;line-height:1;overflow:hidden}
.opt .lbl{flex:1;font-weight:500;font-size:16px;min-width:0}
.opt .chk{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--border);display:grid;place-items:center;flex:none;color:#fff}
.opt.on{border-color:transparent;background:var(--grad)}
.opt.on .well{background:#ffffff2e}
.opt.on .chk{background:#fff;border-color:#fff;color:#8B3FD0}
.opts.cards .opt{border-radius:18px;padding:14px}
.opts.cards .opt .well{box-shadow:0 0 16px #8B5CF655;background:radial-gradient(circle,#8B5CF640,var(--surface-2))}
.opts.cards .opt.on{background:linear-gradient(0deg,var(--acc-dim),var(--acc-dim)),var(--surface);border:1.5px solid #9D6BFF}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{display:flex;flex-direction:column;gap:7px}
.field label{font:500 13px/1 var(--sans);color:var(--t2)}
.box{height:54px;border-radius:14px;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;padding:0 14px;gap:10px;color:var(--t3);min-width:0}
.box.white{background:#F7F5FC;border-color:#F7F5FC;color:#6a6390}
.box.white input{color:#15102E}
.box.white input::placeholder{color:#8a84a8}
.box:focus-within{border-color:var(--acc)}
.box.bad{border-color:var(--neg)}
.box input,.box select{flex:1;min-width:0;width:100%;height:100%;background:transparent;border:none;outline:none;color:var(--t1);font:400 16px var(--sans)}
.box select{appearance:none;-webkit-appearance:none;cursor:pointer}
.box select option{background:var(--surface);color:var(--t1)}
.row3{display:grid;grid-template-columns:1.4fr 1fr 1.2fr;gap:8px}
.row3 .box{padding:0 10px}
.err{font-size:13px;color:var(--neg)}
.err button{color:var(--t1)}
.hint{font-size:13px;color:var(--t3)}
.results{border-radius:14px;background:var(--surface);border:1px solid var(--border);overflow:hidden}
.results button{display:flex;gap:10px;align-items:center;width:100%;min-height:48px;padding:10px 14px;background:none;border:none;border-top:1px solid var(--border);text-align:left;color:var(--t1)}
.results button:first-child{border-top:none}
.results button:hover{background:var(--surface-2)}
.results small{color:var(--t3)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:8px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--border);font-weight:500;font-size:14px}
.chip.on{background:var(--grad);border-color:transparent;color:#fff}
.chip.sm{font-size:12px;padding:5px 10px;min-height:0;color:var(--t2)}
.card{padding:14px;border-radius:18px;background:var(--surface);border:1px solid var(--border)}
.card h4{margin:0 0 3px;font-size:15px;font-weight:600}
.card p{margin:0;color:var(--t2);font-size:14px}
.card .sub{font-size:12px;color:var(--t3)}
.card.dash{border-style:dashed}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:12px;align-items:center}
.lockrow{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--border);color:var(--t2);font-size:14px}
.lockrow .l{margin-left:auto;color:var(--acc)}
.promise{display:flex;gap:14px;align-items:center;padding:13px 0;border-top:1px solid var(--border)}
.promise:first-child{border-top:none}
.promise .well,.iw{width:36px;height:36px;border-radius:50%;background:var(--acc-dim);color:var(--acc);display:grid;place-items:center;flex:none;font-size:17px}
.bigwell{width:84px;height:84px;border-radius:50%;background:radial-gradient(circle,#8B5CF655,transparent 70%),var(--surface);border:1px solid var(--border);display:grid;place-items:center;color:var(--acc);align-self:center;box-shadow:0 0 40px #8B5CF655}
.steps{display:flex;flex-direction:column;gap:13px}
.step .top{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--t2);margin-bottom:6px;gap:10px}
.step .top .pct{font-variant-numeric:tabular-nums;color:var(--t3);display:flex;gap:6px;align-items:center}
.step.done .top{color:var(--t1)}
.step.done .pct{color:var(--acc)}
.bar{height:4px;border-radius:2px;background:var(--surface-2);overflow:hidden}
.bar span{display:block;height:100%;background:var(--grad);width:0}
.dim{position:absolute;inset:0;background:#05040CCC;z-index:4}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:5;background:var(--bg-elev);border-radius:28px 28px 0 0;border-top:1px solid var(--border);padding:10px 20px max(24px,calc(var(--sab) + 14px));display:flex;flex-direction:column;gap:14px;animation:up .35s cubic-bezier(.2,.8,.2,1)}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--border);align-self:center}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.closex{position:absolute;top:calc(var(--sat) + 6px);right:10px;z-index:3;width:44px;height:44px;border-radius:50%;background:#0B0920AA;border:1px solid var(--border);display:grid;place-items:center;color:var(--t2)}
.checks{display:flex;flex-direction:column;gap:8px;font-size:14px;color:var(--t1)}
.checks div{display:flex;gap:10px;align-items:flex-start}
.checks svg{color:var(--acc);flex:none;margin-top:2px}
.plan{display:flex;align-items:center;gap:12px;padding:12px 14px;min-height:56px;border-radius:18px;border:1px solid var(--border);background:var(--surface);text-align:left;width:100%;position:relative}
.plan .radio{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--border);display:grid;place-items:center;flex:none;color:#fff}
.plan.on{border:1.5px solid #A778FF;background:linear-gradient(0deg,var(--acc-dim),var(--acc-dim)),var(--surface)}
.plan.on .radio{background:var(--grad);border-color:transparent}
.plan .pn{font-weight:600;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.plan .pp{font-size:13px;color:var(--t1);font-variant-numeric:tabular-nums;display:block;margin-top:2px}
.plan .ps{font-size:11px;color:var(--t3);display:block;margin-top:2px}
.save{font:600 10px/1 var(--sans);letter-spacing:.05em;background:var(--grad);color:#fff;padding:4px 7px;border-radius:6px}
.tok{font-variant-numeric:tabular-nums;white-space:nowrap}
.legal{display:flex;justify-content:center;gap:4px 14px;font-size:12px;color:var(--t3);flex-wrap:wrap}
.legal a,.legal span{display:inline-flex;align-items:center;min-height:44px;padding:0 4px;color:inherit;font-size:12px;text-decoration:underline;text-decoration-color:var(--border)}
.legal span{text-decoration:none}
.trust{font-size:12px;color:var(--t2);text-align:center;line-height:1.5}
.or{display:flex;align-items:center;gap:10px;color:var(--t3);font-size:12px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--border)}
.checkbox{display:flex;gap:10px;align-items:flex-start;background:none;border:none;text-align:left;color:var(--t2);font-size:13px;padding:10px 0;min-height:44px}
.checkbox .cb{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--border);flex:none;display:grid;place-items:center;color:#fff}
.checkbox.on .cb{background:var(--grad);border-color:transparent}
.toast{position:absolute;left:50%;top:calc(var(--sat) + 12px);transform:translateX(-50%);z-index:20;background:var(--t1);color:#0B0920;font-size:13px;font-weight:500;padding:9px 14px;border-radius:999px;max-width:calc(100% - 32px);width:max-content;text-align:center;animation:fade 2.6s ease forwards;box-shadow:0 8px 24px #0008}
@keyframes fade{0%{opacity:0;transform:translate(-50%,-6px)}10%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
.fadein{animation:fi .35s ease both}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.fseq>*{animation:fi .45s ease both}
.fseq>*:nth-child(2){animation-delay:.35s}.fseq>*:nth-child(3){animation-delay:.7s}.fseq>*:nth-child(4){animation-delay:1.05s}.fseq>*:nth-child(5){animation-delay:1.4s}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.55}}
.blurred{filter:blur(6px);user-select:none;-webkit-user-select:none}
.mock{width:210px;height:380px;border-radius:30px;border:6px solid #221c44;background:var(--bg);align-self:center;overflow:hidden;position:relative;box-shadow:0 20px 50px -10px #000,0 0 40px #8B5CF633;display:flex;flex-direction:column;gap:8px;padding:22px 10px 10px;flex:none}
.mock .mrow{padding:9px 10px;border-radius:12px;background:var(--surface);border:1px solid var(--border);font-size:11px;color:var(--t2)}
.mock .mrow b{display:block;color:var(--t1);font-size:12px;margin-bottom:2px}
.stores{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.store{display:flex;align-items:center;gap:7px;height:46px;padding:0 12px;border-radius:10px;background:#000;border:1px solid #444;font-size:11px;line-height:1.1;text-align:left;color:#fff}
.store b{display:block;font-size:13px}
.qr{display:flex;gap:10px;align-items:center;justify-content:center;font-size:11px;color:var(--t3)}
.qr img{width:72px;height:72px;background:#fff;border-radius:6px;padding:3px}
.tips{position:absolute;z-index:6;left:12px;right:12px;padding:12px 14px;border-radius:14px;background:var(--t1);color:#15102E;font-size:13px;box-shadow:0 10px 30px #000a;animation:fi .25s ease}
/* flat map */
.map{display:block;width:100%;height:auto;border-radius:16px;background:radial-gradient(ellipse at 50% 40%,#1a1446,#0e0b26);border:1px solid var(--border)}
.map .land{fill:#5C4F9A}
.map .ln{fill:none;stroke-width:2;stroke-linecap:round}
.map .ln.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:mdraw 1.6s ease forwards}
@keyframes mdraw{to{stroke-dashoffset:0}}
.map .pin{fill:#fff}
.map .ping{fill:none;stroke:#fff;transform-box:fill-box;transform-origin:center;animation:ping 2s ease-out infinite}
@keyframes ping{from{opacity:.9;transform:scale(.4)}to{opacity:0;transform:scale(2.4)}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition:none!important}
}

/* astrocartography: canvas globe hero + flat maps */
.globe{position:relative;display:grid;place-items:center;margin:0 auto;flex:none;touch-action:none}
.globe canvas{display:block}
.legend{display:flex;flex-wrap:wrap;gap:6px}
.legend span{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:5px 9px;border-radius:999px;background:var(--surface);border:1px solid var(--border);color:var(--t2)}
.legend i{width:14px;height:3px;border-radius:2px;display:block}
.mapwrap{position:relative;flex:none}
.maplabel{position:absolute;left:10px;top:8px;font:600 13px var(--serif);color:var(--t1);background:#0B0920aa;padding:3px 9px;border-radius:999px}
.map .ln.dim{opacity:.18}
.map .ln.grey{stroke:#8d86ad!important;opacity:.7}
.map .band{fill:none;stroke-linecap:butt;opacity:.16}
.map .hit{fill:none;stroke:transparent;stroke-width:14;cursor:pointer;pointer-events:stroke}
.map .reg{opacity:0;transition:opacity .3s}
.map .reg.on{opacity:1}
.map text{font:600 9px var(--sans);fill:#fff}
.map .pin-b{cursor:pointer}
.degs{display:grid;grid-template-columns:auto auto 1fr;gap:4px 10px;font-size:13px;font-variant-numeric:tabular-nums;align-items:center}
.degs b{font-weight:500}
.degs span{color:var(--t2)}
.degs i{width:18px;height:3px;border-radius:2px;display:block}
.scene{position:relative;height:108px;border-radius:18px;overflow:hidden;display:flex;align-items:flex-end;padding:10px 12px;text-align:left;border:1.5px solid transparent;width:100%;color:#fff}
.scene::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0000 30%,#0B0920dd)}
.scene span{position:relative;font-weight:600;font-size:15px;display:flex;gap:6px;align-items:center}
.scene .em{position:absolute;right:10px;top:8px;font-size:26px}
.scene.on{border-color:#C8A2FF;box-shadow:0 0 0 3px #8B5CF655}
.scene.city{background:linear-gradient(180deg,#5a3aa8 0%,#E07A9E 70%)}
.scene.city::after,.scene.mount::after,.scene.town::after,.scene.coast::after{content:"";position:absolute;left:0;right:0;bottom:0;height:62%}
.scene.city::after{background:linear-gradient(90deg,#1b1438 0 10%,#0000 10% 13%,#1b1438 13% 22%,#0000 22% 24%,#1b1438 24% 38%,#0000 38% 41%,#1b1438 41% 50%,#0000 50% 53%,#1b1438 53% 70%,#0000 70% 72%,#1b1438 72% 84%,#0000 84% 86%,#1b1438 86%);clip-path:polygon(0 40%,10% 40%,10% 10%,22% 10%,22% 55%,24% 55%,24% 0,38% 0,38% 30%,50% 30%,50% 45%,53% 45%,53% 15%,70% 15%,70% 50%,72% 50%,72% 25%,84% 25%,84% 60%,100% 60%,100% 100%,0 100%)}
.scene.coast{background:linear-gradient(180deg,#F7A76B,#E0679B 55%,#3b2a7a 56%,#2a2164)}
.scene.coast::after{height:30%;background:linear-gradient(180deg,#E9C26B55,#E9C26B00);clip-path:polygon(0 60%,100% 30%,100% 100%,0 100%)}
.scene.mount{background:linear-gradient(180deg,#6d7fd6,#b39ae8)}
.scene.mount::after{background:#2a2466;clip-path:polygon(0 100%,0 70%,22% 20%,38% 55%,58% 0,78% 50%,100% 25%,100% 100%)}
.scene.town{background:linear-gradient(180deg,#8fd0b0,#6aa0c8)}
.scene.town::after{height:45%;background:#274a4a;clip-path:polygon(0 100%,0 55%,10% 55%,15% 30%,20% 55%,34% 55%,34% 40%,42% 20%,50% 40%,50% 60%,66% 60%,72% 35%,78% 60%,100% 60%,100% 100%)}
.scene>*{z-index:1}
.post{position:absolute;width:86px;height:60px;border-radius:8px;background:linear-gradient(135deg,#2a2160,#3b2a7a);border:3px solid #F5F2FB22;display:grid;place-items:center;font-size:24px;opacity:.28}
.pp3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pp3 .card{padding:10px;text-align:center}
.pp3 .card b{display:block;font-size:13px}
.pp3 .card i{display:block;height:4px;border-radius:2px;margin:8px 0 6px}
.sc3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center}
.sc3 div{padding:8px 4px;border-radius:12px;background:var(--surface-2)}
.sc3 b{display:block;font:600 20px/1 var(--serif)}
.sc3 span{font-size:11px;color:var(--t2)}
.place3{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:16px;background:var(--surface);border:1px solid var(--border);width:100%;text-align:left}
.place3 .rk{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:600;flex:none;color:#0B0920}
.place3 b{display:block}
.place3 span{font-size:13px;color:var(--t2)}
/* AI image layer (SVG/CSS/canvas art stays underneath as the fallback) */

function starfield(){const cv=document.getElementById('stars'),cx=cv.getContext('2d');let w=0,h=0;const stars=[],shoot=[];let nextShoot=performance.now()+2500;

  if(n>12&&!S.felt&&!S.feltSkip)S.felt=bestFelt();if(n===19&&!feltMatch()){S.feltSkip=false;S.felt=bestFelt()}
  if(n>13&&!S.move)S.move='remote';if(n===22&&!movers())S.move='remote';if(n>14&&!S.setting)S.setting='coast';if(n>15&&!S.regions.length)S.regions=['eu'];

function kmTo(a,b,c,d){const r=RAD,x=Math.sin((c-a)*r/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin((d-b)*r/2)**2;return 12742*Math.asin(Math.sqrt(x))}
function locate(b){if(!navigator.geolocation){toast("Location isn't available. Search for your city instead.");return}
  b.disabled=true;navigator.geolocation.getCurrentPosition(p=>{if(S.i!==10)return;const la=p.coords.latitude,lo=p.coords.longitude;let best=null;
    for(const x of CITIES){const d=kmTo(la,lo,x[1],x[2]);if(!best||d<best.d)best={n:x[0],d}}
    emit('location',{allowed:true,matched:!!(best&&best.d<=300)});
    if(best&&best.d<=300){S.cur=best.n;S.curQ='';render()}else{b.disabled=false;toast("We couldn't match your city. Search for it instead.")}},
   er=>{if(S.i!==10)return;b.disabled=false;emit('location',{allowed:false,error:er&&er.code});toast("Couldn't get your location. Search for your city instead.")},

function saveMap(){const svg=document.querySelector('#rmap svg');if(!svg)return;const vb=svg.viewBox.baseVal,W=1440,H=Math.round(W*vb.height/vb.width),cl=svg.cloneNode(true);

function DERIVED(){const d=!!S.dob.m&&!!S.place,c=S.cur?city(S.cur):null,fm=d?feltMatch():null;return {goal_planet:S.goal?goalP():'',
