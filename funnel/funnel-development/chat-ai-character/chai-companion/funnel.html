<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#15101B">
<title>ChatChi: AI Roleplay Chat · Companion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600&display=swap">
<style>
[hidden]{display:none!important}
:root{
  color-scheme:dark;
  --ground:#0B0810;
  --bg:#15101B;--bg-elev:#1C1522;--surface:#221A28;--surface-2:#2D2334;--border:#3A2E42;
  --t1:#F7F1EE;--t2:#B9AEB8;--t3:#80748A;
  --pink:#B62CB5;--pink-hi:#DA5FD9;--pink-dim:#B62CB52E;--pink-deep:#261230;
  --grad-a:#9A2ACB;--grad-b:#D82F99;--grad:linear-gradient(135deg,var(--grad-a),var(--grad-b));
  --amber:#F2A95B;--amber-hi:#FFC47E;--amber-dim:#F2A95B26;--negative:#F0705F;--positive:#7FD1A8;
  --head:"Plus Jakarta Sans","Segoe UI",system-ui,sans-serif;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);background-image:radial-gradient(ellipse 60% 40% at 30% 0%,#240F2C 0%,transparent 70%),radial-gradient(ellipse 50% 30% at 80% 100%,#3A2415 0%,transparent 70%);color:var(--t1);font:15px/1.45 var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden;overscroll-behavior:none}
a{color:inherit}
a.btn,a.resrow{text-decoration:none}
a.link{display:flex;align-items:center;justify-content:center;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

.phone{container:app/inline-size;position:relative;width:100%;max-width:480px;height:100vh;height:100dvh;margin:0 auto;background:var(--bg);overflow:hidden;isolation:isolate;--top:calc(env(safe-area-inset-top,0px) + 46px)}
@media (min-width:520px){.phone{border-inline:1px solid #3A2E42}}
#amb{position:absolute;inset:0;width:100%;height:100%;z-index:0;display:block}
.stage{position:absolute;inset:0;z-index:1;overflow:hidden}
.view{position:absolute;inset:0;padding-top:var(--top);display:flex;flex-direction:column}
/* "Need help now?" sits in its own top strip on every screen */
.needhelp{position:absolute;z-index:40;top:calc(env(safe-area-inset-top,0px) + 7px);right:14px;border:1px solid #F2A95B66;background:#15101BCC;color:var(--amber-hi);font:600 12px/1 var(--sans);padding:0 12px;min-height:32px;border-radius:999px;display:flex;gap:5px;align-items:center;backdrop-filter:blur(6px)}
.needhelp::before{content:"";position:absolute;inset:-6px -4px}
.needhelp:hover{background:#2A1D22}
.view.out{animation:vout .22s ease forwards;pointer-events:none}
.view.in{animation:vin .32s ease both}
@keyframes vout{to{opacity:0}}
@keyframes vin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.nav{height:44px;flex:none;display:flex;align-items:center;gap:12px;padding:0 16px;position:relative;z-index:3}
.iconbtn{width:44px;height:44px;border-radius:50%;border:none;background:transparent;display:grid;place-items:center;color:var(--t2);flex:none}
.iconbtn:hover{background:#ffffff10}
.prog{flex:1;height:4px;border-radius:2px;background:#ffffff18;overflow:hidden}
.prog span{display:block;height:100%;background:var(--pink);border-radius:2px;transition:width .35s ease}
.navspacer{width:44px}
.scr{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 20px 12px;display:flex;flex-direction:column;gap:18px;position:relative;z-index:1;scrollbar-width:none}
.scr::-webkit-scrollbar{display:none}
.scr.center{justify-content:center}
.scr.ovf{-webkit-mask-image:linear-gradient(180deg,#000 calc(100% - 36px),transparent);mask-image:linear-gradient(180deg,#000 calc(100% - 36px),transparent)}
@media (max-height:700px){.pcards .pcard{height:100px}.scr>.hero3d[data-mode="land"]{height:246px!important}.scr>.hero3d[data-mode="land"] .hin{scale:.9}}
.foot{flex:none;padding:12px 20px max(20px,calc(env(safe-area-inset-bottom,0px) + 12px));display:flex;flex-direction:column;gap:10px;position:relative;z-index:2}
.foot .note,.note{font-size:12px;color:var(--t3);text-align:center;text-wrap:balance}

.h1{font:800 29px/1.12 var(--head);letter-spacing:-.02em;margin:0;text-wrap:balance}
.lead{color:var(--t2);margin:0;font-size:15px;text-wrap:pretty}
.badge{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:var(--amber-dim);color:var(--amber-hi);font:600 12px/1 var(--sans)}

.btn{height:54px;border-radius:999px;border:none;background:var(--pink);color:#fff;font:600 16px/1 var(--sans);width:100%;display:flex;align-items:center;justify-content:center;gap:10px;transition:transform .12s ease,opacity .2s;flex:none}
.btn:active{transform:scale(.98)}
.btn[disabled]{background:var(--surface-2);color:var(--t3);cursor:not-allowed}
.btn.ghost{background:var(--surface-2);color:var(--t1);border:1px solid var(--border)}
.btn.outline{background:transparent;color:var(--t2);border:1px solid var(--border)}
.btn.light{background:#fff;color:#15101B}
.btn.amber{background:var(--amber);color:#2A1608}
.btn.sm{height:46px;font-size:15px}
.btn:not([disabled]):not(.ghost):not(.light):not(.outline):not(.amber){position:relative;overflow:hidden;box-shadow:0 10px 30px -12px #B62CB5cc}
.btn:not([disabled]):not(.ghost):not(.light):not(.outline):not(.amber)::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:0;background:linear-gradient(100deg,transparent,#ffffff55,transparent);transform:translateX(-150%) skewX(-20deg);animation:sheen 4.5s ease-in-out 1.2s infinite}
@keyframes sheen{0%{transform:translateX(-150%) skewX(-20deg)}28%,100%{transform:translateX(320%) skewX(-20deg)}}
.link{background:none;border:none;color:var(--t2);font-size:14px;padding:6px;text-align:center;min-height:44px}
.link:hover{color:var(--t1)}
.link.pink{color:var(--pink-hi);font-weight:500}
.link.amber{color:var(--amber-hi);font-weight:500}

.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:14px;padding:13px 16px;border-radius:18px;background:#221A28E6;border:1px solid var(--border);text-align:left;width:100%;transition:border-color .15s,background .15s}
.opt:hover{border-color:#5A4764}
.opt .em{font-size:20px;width:26px;text-align:center;flex:none}
.opt .lbl{flex:1;font-weight:500;font-size:16px}
.opt .chk{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--border);display:grid;place-items:center;flex:none;color:#fff}
.opt.on{border-color:var(--pink);background:linear-gradient(0deg,var(--pink-dim),var(--pink-dim)),var(--surface)}
.opt.on .chk{background:var(--pink);border-color:var(--pink)}
.opt.radio .chk{border-radius:50%}
.opt.radio.on .chk{background:transparent;border:6px solid var(--pink)}

.chips{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gchip{display:flex;align-items:center;gap:10px;padding:14px;border-radius:16px;background:#221A28E6;border:1px solid var(--border);font-weight:500;text-align:left}
.gchip.on{border-color:var(--pink);background:linear-gradient(0deg,var(--pink-dim),var(--pink-dim)),var(--surface)}
.gchip .em{font-size:18px}
.gchip .ck{margin-left:auto;color:var(--pink-hi)}

.sticky{position:relative;padding:18px 16px 12px;border-radius:6px 6px 18px 6px;background:#F7D98B;color:#3A2A12;transform:rotate(-1deg);box-shadow:0 14px 28px -14px #000;display:flex;flex-direction:column;gap:6px}
.sticky .pin{position:absolute;top:-9px;left:50%;transform:translateX(-50%);color:var(--pink)}
.sticky label{font:700 13px var(--sans)}
.sticky input{background:transparent;border:none;border-bottom:1.5px dashed #3A2A1266;outline:none;font:500 16px var(--sans);color:#2A1C08;padding:6px 0}
.sticky input::placeholder{color:#3A2A1288}
.sticky small{font-size:12px;color:#5A4420}

.pcards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pcard{position:relative;height:122px;border-radius:20px;overflow:hidden;border:1.5px solid var(--border);background:var(--surface);padding:0;text-align:left}
.pcard .pa{position:absolute;inset:0}
.pcard .pa svg{width:100%;height:100%;display:block}
.pcard::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 25%,#15101Bee)}
.pcard span.pl{position:absolute;left:12px;right:10px;bottom:10px;z-index:1;font-weight:600;font-size:14px;line-height:1.25}
.pcard.on{border-color:var(--pink);box-shadow:0 0 0 3px var(--pink-dim)}
.pcard.other{height:auto!important;grid-column:1/-1;padding:14px}
.pcard.other::after{display:none}
.pcard.other span.pl{position:static}

.field{display:flex;flex-direction:column;gap:8px}
.field label,.flabel{font:500 13px/1 var(--sans);color:var(--t2)}
.box{height:56px;border-radius:14px;background:#221A28E6;border:1px solid var(--border);display:flex;align-items:center;padding:0 8px 0 16px;gap:10px;color:var(--t3)}
.box:focus-within{border-color:var(--pink)}
.box input{flex:1;min-width:0;height:100%;background:transparent;border:none;outline:none;color:var(--t1);font:400 16px var(--sans)}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{min-height:44px;padding:9px 15px;border-radius:999px;background:var(--surface-2);border:1px solid var(--border);color:var(--t2);font-weight:500;font-size:14px}
.pill.on{background:var(--pink-dim);border-color:var(--pink);color:var(--t1)}
.err{font-size:13px;color:var(--negative)}
.hint{font-size:13px;color:var(--t3)}

.years{height:128px;overflow-y:auto;scroll-snap-type:y mandatory;border-radius:18px;background:#221A28E6;border:1px solid var(--border);padding:42px 0;scrollbar-width:none;flex:none}
.years::-webkit-scrollbar{display:none}
.years button{display:block;width:100%;height:44px;border:none;background:none;scroll-snap-align:center;font:400 20px/44px var(--sans);color:var(--t3);font-variant-numeric:tabular-nums}
.years button:hover{color:var(--t2)}
.years button.on{color:var(--t1);font-weight:600;background:var(--surface-2)}

/* hero 3D: companion portrait card (the only 3D object) */
.hero3d{position:relative;perspective:900px;perspective-origin:50% 40%;margin:0 auto;flex:none;width:100%;transition:filter .8s ease,opacity .8s ease}
.hero3d.blur{filter:blur(5px);opacity:.7}
.hin{position:absolute;inset:0;transform-style:preserve-3d}
.hin.land{animation:hland 1.5s cubic-bezier(.2,.8,.2,1) both}
@keyframes hland{from{transform:scale(.75) rotateX(8deg) rotateY(-100deg)}to{transform:none}}
.hscene{position:absolute;inset:0;transform-style:preserve-3d;will-change:transform}
.hscene>*{position:absolute;left:50%;top:50%}
.hglow{border-radius:40px;background:radial-gradient(ellipse at 50% 45%,#F2A95B55,#B62CB533 45%,transparent 70%);filter:blur(16px)}
.hcard{border-radius:24px;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 30px 60px -20px #000,0 0 0 1px #ffffff1c;background:var(--surface)}
.hcard .hl{position:absolute;inset:0;opacity:0;transition:opacity .6s ease}
.hcard .hl.on{opacity:1}
.hcard .hl svg{width:100%;height:100%;display:block}
.hcard.plate::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 50%,#15101Bf0)}
.hplate{backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.hplate b{font:800 28px/1 var(--head);text-shadow:0 4px 18px #000}
.hplate .tags{display:flex;gap:6px;flex-wrap:wrap}
.hplate .tags span{font-size:12px;padding:5px 10px;border-radius:999px;background:#221A28CC;border:1px solid var(--border);color:var(--t2);font-weight:500}
.hbub{width:150px;padding:10px 12px;border-radius:16px 16px 16px 6px;background:#2D2334F2;border:1px solid #ffffff18;font-size:14px;line-height:1.3;box-shadow:0 14px 30px -12px #000;backface-visibility:hidden}
.hbub .typing{animation:tyout 1.8s steps(1) both}
.hbub .txt{display:block;animation:txin .4s ease 1.8s both}
@keyframes tyout{0%{opacity:1}100%{opacity:0;position:absolute}}
@keyframes txin{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.hnote{padding:7px 11px;border-radius:6px;background:#F7D98B;color:#3A2A12;font:600 12px/1.2 var(--sans);box-shadow:0 10px 20px -10px #000;white-space:nowrap;animation:txin .5s ease 2.6s both;backface-visibility:hidden}

/* chat */
.chat{position:absolute;inset:0;top:var(--top);display:flex;flex-direction:column}
.chead{flex:none;display:flex;align-items:center;gap:10px;padding:4px 8px 8px 16px;border-bottom:1px solid var(--border);position:relative;z-index:2;background:#15101BD9;backdrop-filter:blur(8px)}
.cav{position:relative;width:40px;height:40px;border-radius:50%;overflow:hidden;flex:none;display:block;border:1.5px solid #F2A95B66}
.cav svg{width:100%;height:100%;display:block}
/* AI-painted portraits (img/) sit over the inline SVG; a failed image removes itself and the SVG shows */
.avimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 26%;display:block;user-select:none;-webkit-user-drag:none}
.avimg.crop{object-position:50% 0;transform:scale(1.3);transform-origin:50% 42%}
.pcard .pa .avimg{object-position:50% 24%}
.chead .who{flex:1;min-width:0}
.chead .who b{display:block;font:700 17px/1.1 var(--head)}
.chead .who span{font-size:12.5px;color:var(--t2);display:inline-flex;gap:6px;align-items:center}
.flame{display:inline-flex;gap:4px;align-items:center;color:var(--amber-hi);font-weight:600;font-size:12px;padding:3px 8px;border-radius:999px;background:var(--amber-dim)}
.cbody{flex:1;position:relative;overflow:hidden;display:flex;flex-direction:column}
.disclose{position:relative;z-index:1;margin:10px 16px 0;padding:8px 12px;border-radius:12px;background:#221A28E6;color:var(--t2);font-size:11.5px;text-align:center;line-height:1.35;border:1px solid var(--border)}
.msgs{position:relative;z-index:1;flex:1;overflow-y:auto;padding:12px 16px;display:flex;flex-direction:column;gap:10px;scrollbar-width:none}
.msgs::-webkit-scrollbar{display:none}
.msgs .spacer{flex:1}
.bub{padding:11px 14px;border-radius:18px;max-width:84%;font-size:15px;line-height:1.4;animation:fi .3s ease}
.bub.c{align-self:flex-start;background:#2D2334F0;border-bottom-left-radius:6px}
.bub.u{align-self:flex-end;background:var(--pink);color:#fff;border-bottom-right-radius:6px}
.bub.sys{align-self:center;background:transparent;color:var(--t3);font-size:12px;padding:2px;text-align:center}
.memchip{align-self:flex-start;font-size:12px;color:var(--amber-hi);background:var(--amber-dim);border:1px solid #F2A95B44;border-radius:999px;padding:5px 10px;display:inline-flex;gap:6px;align-items:center;animation:fi .4s ease}
.dayhead{align-self:stretch;text-align:center;display:flex;flex-direction:column;gap:2px;padding:6px 0 4px}
.dayhead b{font:800 20px/1.2 var(--head)}
.dayhead small{color:var(--t2);font-size:13px}
.crcard{align-self:stretch;padding:14px;border-radius:16px;background:#1F1A24;border:1.5px solid var(--amber);display:flex;flex-direction:column;gap:8px;animation:fi .3s ease}
.crcard b{font-size:14px}
.crcard p{margin:0;font-size:13.5px;color:var(--t2)}
.crcard .row{display:flex;gap:8px;flex-wrap:wrap}
.crcard .row a{flex:1;min-width:120px;min-height:44px;display:flex;align-items:center;justify-content:center;text-align:center;text-decoration:none;border:none;border-radius:999px;padding:9px 12px;font-weight:600;font-size:13px;background:var(--amber);color:#2A1608}
.crcard .row a.g{background:var(--surface-2);color:var(--t1);border:1px solid var(--border)}
.typing{display:inline-flex;gap:4px;padding:3px 0}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--t3);animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{50%{opacity:.3}}
.ideas{position:relative;z-index:1;display:flex;flex-direction:column;gap:8px;padding:0 16px 10px}
.ideas .ih{font-size:12px;color:var(--t3);display:flex;gap:6px;align-items:center}
.ideas button{min-height:44px;padding:10px 14px;border-radius:14px;background:#221A28F0;border:1px solid var(--border);text-align:left;font-size:14px;color:var(--t2)}
.ideas button:hover{border-color:var(--pink);color:var(--t1)}
.ideas .two{display:flex;gap:8px}
.ideas .two button{flex:1;text-align:center}
.ideas button.yes{border-color:var(--pink);color:var(--t1);background:var(--pink-deep)}
.cfoot{flex:none;border-top:1px solid var(--border);padding:10px 14px max(14px,calc(env(safe-area-inset-bottom,0px) + 8px));display:flex;flex-direction:column;gap:8px;background:#15101BE6;position:relative;z-index:2}
.cchips{display:flex;gap:8px;align-items:center}
.cchips span{white-space:nowrap;padding:6px 11px;border-radius:999px;border:1px solid var(--border);background:var(--surface);font-size:12.5px;color:var(--t2);display:inline-flex;gap:6px;align-items:center}
.counter{font-size:12px;color:var(--t3);font-weight:500;font-variant-numeric:tabular-nums;margin-left:auto;white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
.counter.out{color:var(--negative)}
.composer{display:flex;gap:8px;align-items:center}
.composer .box{flex:1;height:48px;border-radius:999px;padding:0 16px}
.send{width:48px;height:48px;border-radius:50%;border:none;background:var(--pink);color:#fff;display:grid;place-items:center;flex:none}
.send[disabled]{background:var(--surface-2);color:var(--t3)}
.mtoast{position:absolute;z-index:6;top:calc(var(--top) + 64px);right:12px;left:12px;display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:14px;background:var(--surface);border:1px solid var(--amber);font-size:13px;box-shadow:0 12px 30px -10px #000;animation:mt 4.2s ease forwards}
.mtoast svg{color:var(--amber-hi);flex:none;margin-top:2px}
@keyframes mt{0%{opacity:0;transform:translateY(-8px)}8%,86%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-6px)}}
.limit{align-self:stretch;margin-top:4px;padding:18px 16px;border-radius:18px;border:1.5px solid var(--pink);background:#221A28F2;display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center;animation:fi .4s ease}
.limit.calm{border-color:var(--amber)}
.limit h3{margin:0;font:800 20px/1.2 var(--head)}
.limit p{margin:0;color:var(--t2);font-size:14px}
.limit .crown{color:var(--pink-hi)}
.limit.calm .crown{color:var(--amber-hi)}

/* journal */
.journal{border-radius:18px;background:linear-gradient(180deg,#FBF1E2,#F3E3CB);color:#3A2A1E;padding:16px;display:flex;flex-direction:column;gap:10px;box-shadow:0 24px 50px -20px #000;animation:jin .6s cubic-bezier(.2,.8,.2,1) both;background-image:repeating-linear-gradient(180deg,transparent 0 31px,#C9AE8A33 31px 32px),linear-gradient(180deg,#FBF1E2,#F3E3CB)}
@keyframes jin{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.journal .jtop{display:flex;justify-content:space-between;align-items:center;gap:8px}
.journal .jtop b{font:700 15px var(--head)}
.journal .flame{background:#F2A95B33;color:#A85A12}
.journal .mood{align-self:flex-start;font-size:13px;font-weight:600;padding:5px 10px;border-radius:999px;background:#B62CB51F;color:#9A1F4C}
.jitem{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:12px;background:#ffffffA6;border:1px solid #C9AE8A55;animation:fi .4s ease both}
.jitem p{margin:0;flex:1;font-size:14.5px;min-width:0}
.jitem button{border:none;background:none;color:#7A6452;width:40px;height:40px;border-radius:8px;display:grid;place-items:center;flex:none}
.jitem button:hover{background:#0000000f;color:#3A2A1E}
.jitem input{flex:1;min-width:0;border:none;border-bottom:1.5px solid #B62CB5;background:transparent;font:500 14.5px var(--sans);color:#2A1C10;outline:none;padding:3px 0}
.journal .jfoot{font-size:12px;color:#7A6452}
.jmini{align-self:center;width:230px;border-radius:14px;background:linear-gradient(180deg,#FBF1E2,#F3E3CB);color:#3A2A1E;padding:10px 12px;display:flex;flex-direction:column;gap:6px;box-shadow:0 18px 36px -16px #000;transform:rotate(-2deg)}
.jmini .jtop{display:flex;justify-content:space-between;align-items:center;font:700 13px var(--head)}
.jmini .flame{background:#F2A95B33;color:#A85A12;font-size:11px}
.jmini .jrow{font-size:12.5px;display:flex;gap:6px;align-items:center;color:#4A3828;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

function fillTo(n){
  if(n>1&&!S.year)S.year='1996';
  S.blocked=false;
  if(n>2&&!S.mood)S.mood='exhausting';
  if(n>3&&!S.topics.length&&!S.topicOn){S.topics=['work'];if(!S.note)S.note='interview Thursday'}
  if(n>5&&!S.name.trim())S.name='Maya';
  if(n>6&&!S.support)S.support='plan';
  if(n>7&&!S.pers)S.pers='calm';
  const reset=()=>{S.offer=false;S.follow=null;S.pause=false;S.memShown=false;S.mem=null;S.day=1};
  if(n===11){reset();S.turn=0;S.chat=day1(0);S.msgs=FREE;S.firstPick=''}
  if(n===12){reset();S.turn=1;S.firstPick=ideas(0)[0];S.chat=day1(0).concat({w:'u',x:S.firstPick});S.msgs=FREE-1}
  if(n>=13&&(!S.teaserDone||S.day===2&&n<18)){
    S.turn=2;S.firstPick=S.firstPick||ideas(0)[0];S.memShown=true;S.pause=false;S.day=1;S.teaserDone=true;S.gate=false;
    S.chat=day1(2);S.msgs=FREE-2;S.mem=null;
  }
  if(n>=13)S.sent=Math.max(S.sent,CONFIG.teaserMessages);
  if(n>=13&&!S.mem)buildMem();
  if(n>14&&S.notif===null)S.notif='Not now';
  if(n>15&&!S.email){S.email='maya@example.com';S.account='Email'}
  if(n>=25)S.premium=true;
  if(n===18&&S.day!==2)enterDay2();

}

/* sticky bottom CTA (price + Continue) + top mini CTA show whenever no plan-block CTA button is fully on screen,
   so the first view always has a price and a CTA (a plan block only peeking at the bottom edge does not count) */
function pwSetup(v){
  try{if(window.__pwio)window.__pwio.disconnect()}catch(e){}
  const pw=v&&v.querySelector('.pwl');if(!pw)return;
  const st=v.querySelector('.stick'),mini=v.querySelector('.pwbar .mini');
  if(!('IntersectionObserver' in window)){st&&st.classList.add('show');return}
  const seen=new Set();
  const upd=()=>{const on=seen.size===0;st&&st.classList.toggle('show',on);if(mini)mini.classList.toggle('show',on)};
  window.__pwio=new IntersectionObserver(es=>{es.forEach(e=>e.isIntersecting&&e.intersectionRatio>=0.98?seen.add(e.target):seen.delete(e.target));upd()},{root:pw,threshold:[0,0.5,0.98,1],rootMargin:`-${(pw.querySelector('.pwbar')||{}).offsetHeight||0}px 0px 0px 0px`});
  pw.querySelectorAll('.planblk .btn').forEach(el=>window.__pwio.observe(el));
}

/* chat engine */
function say(text){
  const out=!S.premium&&S.msgs<=0;
  if(S.typing||out||S.gate||(S.i>=13&&S.i<=16))return;
  if(chatLocked()){if(!S.premium)tasteForward();return}
  S.sent++;emit('chat_message',{count:S.sent,screen:S.i});
  if(isCrisis(text)){S.chat.push({w:'u',x:text});flagCrisis('typed in chat');S.chat.push({w:'cr'});S.pause=true;render();openOv('support');return}
  if(S.i===11){S.chat.push({w:'u',x:text});S.msgs--;S.turn=1;S.firstPick=text;go(12);return}
  if(S.i===12){if(S.turn>=CONFIG.teaserMessages&&!S.teaserDone)return;S.turn++}
  S.chat.push({w:'u',x:text});if(!S.premium)S.msgs--;
  if(S.i===12)render();else reply();
}
function reply(){
  S.typing=true;render();
  const at=S.i;
  later(()=>{
    S.typing=false;
    if(at===12){
      S.chat.push({w:'c',x:rep(S.turn-1)});
      if(!S.memShown){S.memShown=true;render();memToast()}else render();
      if((S.turn>=CONFIG.teaserMessages||tasteLeft()<=0)&&!S.teaserDone&&!S.pause)teaserEnd();
    }else{
      S.chat.push({w:'c',x:GEN[(S.chat.length)%GEN.length]});render();
      if(!S.premium&&S.msgs<=0&&(S.i===17||S.i===18))later(()=>go(19),1200);
    }
  },1300);
}
/* a locked taste chat (reopened after the taste) hands off forward again: typing bubble, then the memory page or the paywall */
function tasteForward(){if(S.gate||S.premium)return;S.gate=true;render();
  later(()=>{S.typing=true;render();later(()=>{S.typing=false;S.gate=false;go(tasteNext())},1100)},500)}
/* chat taste over: no more replies, a typing bubble, then the memory page -> check-in -> email -> paywall. Same for crisis-flagged users: no free chat; resources stay one tap away */
function teaserEnd(){
  S.teaserDone=true;S.gate=true;buildMem();render();emit('chat_teaser_end',{count:S.sent});
  later(()=>{S.typing=true;render();later(()=>{S.typing=false;S.gate=false;go(13)},1500)},900);
}

  const item=S.note.trim()||(S.firstPick?`you said “${strip(S.firstPick).slice(0,40)}”`:topicLow());

  cur().appendChild(el);setTimeout(()=>el.remove(),4300);
}

function runLoading(){
  let row=0,pct=0,sw=0;const pool=ranked();
  const h=cur().querySelector('.hero3d');
  const swap=k=>{if(!h||!h._h)return;const c=h._h.card;const off=c.querySelector('.hl:not(.on)'),on=c.querySelector('.hl.on');off.innerHTML=av(k);off.classList.add('on');on.classList.remove('on')};
  timer=setInterval(()=>{

    el.querySelector('.bar span').style.width=Math.min(pct,100)+'%';
    el.querySelector('.pct span').textContent=Math.min(pct,100)+'%';
    if(++sw%34===0&&row<3)swap(pool[(row+2)%pool.length]);
    if(pct>=100){el.classList.add('done');el.querySelector('.pct').innerHTML=`${ic('check',14,'var(--amber)',2.5)}<span>100%</span>`;row++;pct=0;

/* hero 3D: companion portrait card. float (hook), soft (loading, blurred + cross-fading), land (reveal). Pointer orbit on all. */
const HEROES=new Set();let loopOn=false;
function mountHero(el){
  if(el._h)return;
  const k=el.dataset.k,mode=el.dataset.mode,w=+el.dataset.w,h=+el.dataset.h,c=C[k];
  const dx=mode==='float'?-52:0;
  let extra='';
  if(mode==='float')extra=`<div class="hbub" style="transform:translate(-50%,-50%) translate3d(${w/2+22}px,${-h/2+36}px,70px)"><span class="typing"><i></i><i></i><i></i></span><span class="txt">Hey — how was today?</span></div>
    <div class="hnote" style="transform:translate(-50%,-50%) translate3d(${w/2+28}px,${h/2-30}px,46px) rotate(-3deg)">📌 Remembered: your big day</div>`;
  if(mode==='land')extra=`<div class="hplate" style="width:${w-32}px;transform:translate(-50%,-50%) translate3d(0,${h/2-44}px,42px)"><div class="tags"><span>${esc(PERS[c.p][0]+' '+PERS[c.p][1])}</span><span>${esc(PERSONA[c.pro]||'They')}/${c.pro==='he'?'him':c.pro==='she'?'her':'them'}</span></div></div>`;
  el.innerHTML=`<div class="hin ${mode==='land'?'land':''}"><div class="hscene"><div class="hglow" style="width:${w*1.2}px;height:${h*1.1}px;transform:translate(-50%,-50%) translateX(${dx}px) translateZ(-60px)"></div>
  <div class="hcard ${mode==='land'?'plate':''}" style="width:${w}px;height:${h}px;transform:translate(-50%,-50%) translateX(${dx}px)"><div class="hl on">${av(k)}</div><div class="hl"></div></div>${extra.replace(/translate3d\((-?\d+)px/g,(m,x)=>`translate3d(${+x+dx}px`)}</div></div>`;
  const o={el,mode,scene:el.querySelector('.hscene'),card:el.querySelector('.hcard'),t0:performance.now(),px:0,py:0,tx:0,ty:0};
  el._h=o;HEROES.add(o);
  el.addEventListener('pointermove',e=>{const r=el.getBoundingClientRect();o.tx=(e.clientX-r.left)/r.width-.5;o.ty=(e.clientY-r.top)/r.height-.5});
  el.addEventListener('pointerleave',()=>{o.tx=0;o.ty=0});
  if(RM)drawHero(o,o.t0+4000);
  else if(!loopOn){loopOn=true;requestAnimationFrame(heroFrame)}
}
function drawHero(o,now){
  const t=(now-o.t0)/1000;
  o.px+=(o.tx-o.px)*.08;o.py+=(o.ty-o.py)*.08;
  const amp=o.mode==='soft'?16:o.mode==='float'?10:6;
  const ry=Math.sin(t*(o.mode==='soft'?.9:.6))*amp+o.px*28,rx=Math.sin(t*.5)*3-4-o.py*16;
  o.scene.style.transform=`rotateX(${rx.toFixed(2)}deg) rotateY(${ry.toFixed(2)}deg)`;
}
function heroFrame(now){
  for(const h of HEROES){if(!h.el.isConnected){HEROES.delete(h);continue}drawHero(h,now)}
  if(HEROES.size)requestAnimationFrame(heroFrame);else loopOn=false;
}

/* ambient: slowly shifting dusk sky that leans toward the picked mood */
const PAL={def:[[30,20,36],[64,30,66],[118,62,58]],good:[[44,26,56],[110,46,84],[206,124,62]],okay:[[32,23,40],[72,38,74],[140,76,62]],exhausting:[[26,19,32],[56,32,62],[98,56,56]],rough:[[19,16,26],[40,26,50],[66,44,56]],hard:[[15,12,21],[30,22,40],[48,36,52]],other:[[30,20,36],[64,30,66],[118,62,58]]};
const AMB={base:1,boost:0,target:PAL.def};
(function(){
  const cv=document.getElementById('amb'),cx=cv.getContext('2d');let w=0,h=0;
  const col=PAL.def.map(c=>c.slice());const P=[];
  const spawn=(p,init)=>{p.x=Math.random();p.y=init?Math.random():1.08;p.r=1+Math.random()*2.2;p.a=.2+Math.random()*.4;p.s=.01+Math.random()*.02;p.ph=Math.random()*6.28;p.c=Math.random()<.6?'255,196,126':'218,95,217';return p};
  for(let i=0;i<26;i++)P.push(spawn({},true));
  function size(){const r=phone.getBoundingClientRect();const d=Math.min(2,devicePixelRatio||1);w=r.width;h=r.height;cv.width=w*d;cv.height=h*d;cx.setTransform(d,0,0,d,0,0)}
  size();addEventListener('resize',size);
  let last=performance.now();
  function frame(now){
    const dt=Math.min(50,now-last)/1000;last=now;AMB.boost*=Math.pow(.3,dt);
    const k=RM?1:Math.min(1,dt*1.2);
    for(let i=0;i<3;i++)for(let j=0;j<3;j++)col[i][j]+=(AMB.target[i][j]-col[i][j])*k;
    const drift=RM?0:Math.sin(now/9000);
    const rgb=(c,o=0)=>`rgb(${Math.round(c[0]+o)},${Math.round(c[1])},${Math.round(c[2]-o*.5)})`;
    const g=cx.createLinearGradient(0,0,0,h);g.addColorStop(0,rgb(col[0]));g.addColorStop(.55,rgb(col[1],drift*6));g.addColorStop(1,rgb(col[2],drift*10));
    cx.fillStyle=g;cx.fillRect(0,0,w,h);
    const s=cx.createRadialGradient(w*.5,h*1.04,0,w*.5,h*1.04,w*.95);s.addColorStop(0,'rgba(245,170,90,.28)');s.addColorStop(1,'rgba(245,170,90,0)');cx.fillStyle=s;cx.fillRect(0,0,w,h);
    cx.fillStyle='rgba(12,8,16,.38)';cx.fillRect(0,0,w,h);
    const sp=AMB.base+AMB.boost*5;
    for(const p of P){if(!RM){p.y-=p.s*sp*dt;if(p.y<-.05)spawn(p,false)}const x=(p.x+Math.sin(now/5000+p.ph)*.02)*w,y=p.y*h;
      cx.fillStyle=`rgba(${p.c},${(p.a*(.6+.4*Math.sin(now/900+p.ph))).toFixed(3)})`;cx.beginPath();cx.arc(x,y,p.r,0,6.283);cx.fill()}
    if(!RM)requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();

    case 'say':if(v==='✏️ Type your own'){document.getElementById('msg')?.focus();break}say(v);break;
    case 'send':{const m=document.getElementById('msg');if(m&&m.value.trim()){const x=m.value.trim();m.value='';say(x)}else m?.focus();break}
    case 'safe':S.pause=false;S.chat.push({w:'c',x:'Thank you for telling me. I’m glad you’re safe. We can keep going whenever you’re ready.'});render();if(!S.premium&&(S.i===11||S.i===12)&&tasteLeft()<=0&&!S.teaserDone)teaserEnd();break;
    case 'journal':toast(`${cnRaw()} remembers ${(S.mem||[]).length} thing${(S.mem||[]).length===1?'':'s'} · you can edit or delete each`);break;
    case 'plan':S.plan=v;syncPlan();emit('plan_select',{plan:v,price:CONFIG.plans[v].price});checkout(v);break;
    case 'restore':emit('restore_click');if(CONFIG.app.restoreUrl)navTop(CONFIG.app.restoreUrl);break;
    case 'buy':pwPlan();checkout(S.plan);break;
    case 'topl':{const el=cur()&&cur().querySelector('#plans1');if(el)el.scrollIntoView({behavior:RM?'auto':'smooth',block:'start'});break}
    case 'salebuy':{const k=SALEKEY[S.i];emit('sale_accept',{plan:k});checkout(k);break}
    case 'saleno':{const k=SALEKEY[S.i];emit('sale_decline',{plan:k});checkoutDeclined(k);break}
    case 'ckpay':{document.getElementById('demock')?.remove();window.IkFunnel.completePurchase(S.ckPlan);break}
    case 'ckclose':{document.getElementById('demock')?.remove();checkoutDeclined(S.ckPlan);break}
    case 'upbuy':emit('upsell_accept',{plan:'addon'});checkout('addon');break;
    case 'upno':emit('upsell_decline');go(GETAPP);break;
    case 'keepchat':go(gateTo(17));break;
    case 'closepw':emit('paywall_close',{placement:'onboarding',via:'close'});pwDeclined();break;
    case 'upgrade':S.sheet='pw';render();emit('paywall_view',{placement:'limit'});break;
    case 'closeq':S.sheet=null;emit('paywall_close',{placement:'limit',via:'close'});if(S.premium)render();else pwDeclined();break;
    case 'midnight':emit('come_back_midnight');if(!S.premium){go(PAYWALL);break}toast(`Your ${FREE} messages come back at midnight`);break;
    case 'openapp':openApp();break;
  }
});
phone.addEventListener('input',e=>{
  const f=e.target.dataset.f;if(!f)return;
  if(f.startsWith('mem:')){S.mem[+f.slice(4)].x=e.target.value;return}
  S[f]=e.target.value;
  if(f==='moodOther'){const b=document.getElementById('moodgo');if(b)b.disabled=!S.moodOther.trim()}
  if(f==='topicOther'){const ok=S.topics.length||S.topicOther.trim();cur().querySelector('.foot .btn').disabled=!ok;const h=document.getElementById('hint3');if(h)h.hidden=!!ok}
  if(f==='name'&&S.err){S.err='';const er=cur().querySelector('.err');if(er)er.remove()}
  if(f==='ntime'){render();return}
  if(f==='draft'||f==='renameDraft'||f==='email')return;
  renderPanel();
});
phone.addEventListener('change',e=>{if(e.target.dataset.f==='ntime'){S.ntime=e.target.value;render()}});
phone.addEventListener('keydown',e=>{if(e.key!=='Enter'||e.target.tagName!=='INPUT')return;
  const id=e.target.id;const sel=id==='msg'?'[data-a="send"]':id==='mo1'?'#moodgo':id==='rn'?'[data-a="renameok"]':id==='em'?'[data-a="emailgo"]':id&&id.startsWith('me')?'[data-a="memok"]':'.foot .btn';
  const b=cur().querySelector(sel);b&&!b.disabled&&b.click()});

/* Host API: the page embedding this funnel can complete a purchase or read the picks. */
window.IkFunnel=Object.assign(window.IkFunnel||{},{
  config:CONFIG,data:snapshot,
  completePurchase:(plan)=>{const k=plan&&CONFIG.plans[plan]?plan:S.plan;if(k==='addon'){S.addon=true;S.plan=S.mainPlan||CONFIG.defaultPlan}else{S.plan=k;S.mainPlan=k}AFTER=k==='addon'||(CONFIG.plans[k]&&CONFIG.plans[k].oneTime)?26:25;S.ltSeen=true;S.premium=true;S.sheet=null;S.teaserDone=true;S.gate=false;emit('purchase_complete',{plan:k});go(AFTER)}
});
if(DEBUG)window.IkFunnel.go=n=>{clearT();fillTo(n);go(n)};
if(DEBUG){const m=location.hash.match(/s=?([0-9]+)/);if(m&&V[+m[1]]){let n=+m[1];fillTo(n);S.i=n}}
else if(!(S.i===1&&loadSpot())){const d1=loadDay1();if(d1){Object.assign(S,d1,{i:18,completed:true,teaserDone:true,sent:Math.max(S.sent,CONFIG.teaserMessages)});enterDay2();emit('day2_return')}}
window.IkFunnel.back=back;
if(ageBlocked()&&!DEBUG){S.i=1;S.blocked=true}
{let ref='';try{ref=document.referrer?new URL(document.referrer).hostname:''}catch(e){}emit('funnel_start',{referrer:ref})}
render();
viewed();
if(S.i===1&&S.blocked)crisisShown('age_block');
</script>
