<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A0911">
<title>ChatChi: AI Roleplay Chat · AI Girlfriend</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap">
<style>
:root{
  color-scheme:dark;
  --ground:#06050B;
  --bg:#0A0911;--bg-elev:#12101B;--surface:#17151F;--surface-2:#221F2D;--border:#2D293B;
  --t1:#F4F2F8;--t2:#A7A2B7;--t3:#6F6A82;
  --pink:#B62CB5;--pink-hi:#DA5FD9;--pink-dim:#B62CB52E;--pink-deep:#261230;
  --grad-a:#9A2ACB;--grad-b:#D82F99;--grad:linear-gradient(135deg,var(--grad-a),var(--grad-b));
  --amber:#F5B83D;--violet:#9B7BFF;--negative:#F0705F;--positive:#7FD1A8;
  --head:"Plus Jakarta Sans","Segoe UI",system-ui,sans-serif;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);background-image:radial-gradient(ellipse 60% 40% at 30% 0%,#240F2C 0%,transparent 70%);color:var(--t1);font:15px/1.45 var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--pink-hi);outline-offset:2px}

.phone{container:app/inline-size;position:relative;width:100%;max-width:480px;height:100vh;height:100dvh;margin:0 auto;background:var(--bg);overflow:hidden;isolation:isolate;--top:calc(env(safe-area-inset-top,0px) + 8px)}
@media (min-width:520px){.phone{border-inline:1px solid #2A2536}}
#amb{position:absolute;inset:0;width:100%;height:100%;z-index:0;display:block}
.stage{position:absolute;inset:0;z-index:1;overflow:hidden}
.view{position:absolute;inset:0;padding-top:var(--top);display:flex;flex-direction:column}
.view.out{animation:vout .22s ease forwards;pointer-events:none}
.view.in{animation:vin .32s ease both}
@keyframes vout{to{opacity:0}}
@keyframes vin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.nav{height:44px;flex:none;display:flex;align-items:center;gap:12px;padding:0 16px;position:relative;z-index:3}
.iconbtn{width:44px;height:44px;border-radius:50%;border:none;background:transparent;display:grid;place-items:center;color:var(--t2)}
.iconbtn:hover{background:var(--surface)}
.prog{flex:1;height:4px;border-radius:2px;background:var(--surface-2);overflow:hidden}
.prog span{display:block;height:100%;background:var(--pink);border-radius:2px;transition:width .35s ease}
.navspacer{width:44px}
.scr{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 20px 12px;display:flex;flex-direction:column;gap:16px;position:relative;z-index:1;scrollbar-width:none}
.scr::-webkit-scrollbar{display:none}
.scr.center{justify-content:center}
.foot{flex:none;padding:12px 20px max(20px,calc(env(safe-area-inset-bottom,0px) + 12px));display:flex;flex-direction:column;gap:10px;position:relative;z-index:2}
.foot .note{font-size:12px;color:var(--t3);text-align:center;text-wrap:balance}

.h1{font:800 28px/1.12 var(--head);letter-spacing:-.02em;margin:0;text-wrap:balance}
.h1.xl{font-size:31px}
.lead{color:var(--t2);margin:0;font-size:15px;text-wrap:pretty}
.badge{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:var(--pink-dim);color:var(--pink-hi);font:600 12px/1 var(--sans)}

.btn{height:54px;border-radius:999px;border:none;background:var(--pink);color:#fff;font:600 16px/1 var(--sans);width:100%;display:flex;align-items:center;justify-content:center;gap:10px;transition:transform .12s ease,opacity .2s;flex:none}
.btn:active{transform:scale(.98)}
.btn[disabled]{background:var(--surface-2);color:var(--t3);cursor:not-allowed}
.btn.ghost{background:var(--surface-2);color:var(--t1);border:1px solid var(--border)}
.btn.outline{background:transparent;color:var(--t2);border:1px solid var(--border)}
.btn.light{background:#fff;color:#0A0911}
.btn:not([disabled]):not(.ghost):not(.light):not(.outline){position:relative;overflow:hidden;box-shadow:0 10px 30px -12px #B62CB5cc}
.btn:not([disabled]):not(.ghost):not(.light):not(.outline)::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:0;background:linear-gradient(100deg,transparent,#ffffff55,transparent);transform:translateX(-150%) skewX(-20deg);animation:sheen 4.5s ease-in-out 1.2s infinite}
@keyframes sheen{0%{transform:translateX(-150%) skewX(-20deg)}28%,100%{transform:translateX(320%) skewX(-20deg)}}
.link{background:none;border:none;color:var(--t2);font-size:14px;padding:6px;text-align:center;min-height:44px}
.link:hover{color:var(--t1)}
.link.pink{color:var(--pink-hi);font-weight:500}
.link.tiny{font-size:12px;color:var(--t3);text-decoration:underline dotted}

.opts{display:flex;flex-direction:column;gap:9px}
.opts.g2{display:grid;grid-template-columns:1fr 1fr}
.opt{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:16px;background:var(--surface);border:1px solid var(--border);text-align:left;width:100%;transition:border-color .15s,background .15s}
.opt:hover{border-color:#47405c}
.opt .em{font-size:19px;width:24px;text-align:center;flex:none}
.opt .lbl{flex:1;font-weight:500;font-size:15.5px}
.opt .sw{width:16px;height:16px;border-radius:50%;flex:none;box-shadow:0 0 0 2px #ffffff22}
.opt.on{border-color:var(--pink);background:linear-gradient(0deg,var(--pink-dim),var(--pink-dim)),var(--surface)}
.opt.full{grid-column:1/-1}

.field{display:flex;flex-direction:column;gap:8px}
.field label,.flabel{font:500 13px/1 var(--sans);color:var(--t2)}
.box{height:54px;border-radius:14px;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;padding:0 8px 0 16px;gap:10px;color:var(--t3)}
.box:focus-within{border-color:var(--pink)}
.box input{flex:1;min-width:0;height:100%;background:transparent;border:none;outline:none;color:var(--t1);font:400 16px var(--sans)}
.shuf{width:44px;height:44px;border-radius:10px;border:none;background:var(--surface-2);color:var(--pink-hi);display:grid;place-items:center;flex:none}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{min-height:44px;padding:10px 15px;border-radius:999px;background:var(--surface-2);border:1px solid var(--border);color:var(--t2);font-weight:500;font-size:14.5px}
.pill.on{background:var(--pink-dim);border-color:var(--pink);color:var(--t1)}
.err{font-size:13px;color:var(--negative)}
.hint{font-size:13px;color:var(--t3)}

.years{height:140px;flex:none;overflow-y:auto;scroll-snap-type:y mandatory;border-radius:18px;background:var(--surface);border:1px solid var(--border);padding:48px 0;scrollbar-width:none}
.years::-webkit-scrollbar{display:none}
.years button{display:block;width:100%;height:44px;border:none;background:none;scroll-snap-align:center;font:400 20px/44px var(--sans);color:var(--t3);font-variant-numeric:tabular-nums}
.years button:hover{color:var(--t2)}
.years button.on{color:var(--t1);font-weight:600;background:var(--surface-2)}

/* hero 3D: the live preview card of her (the only 3D object) */
.hero3d{position:relative;perspective:900px;perspective-origin:50% 40%;margin:0 auto;flex:none;animation:hfade .4s ease both}
.hin{position:absolute;inset:0;transform-style:preserve-3d}
.hin.land{animation:hland 1.6s cubic-bezier(.2,.8,.2,1) both}
@keyframes hland{from{transform:scale(.72) rotateX(10deg) rotateY(-110deg)}to{transform:none}}
@keyframes hfade{from{opacity:0}}
.hscene{position:absolute;inset:0;transform-style:preserve-3d;will-change:transform}
.hscene>*{position:absolute;left:50%;top:50%}
.hglow{border-radius:40px;background:radial-gradient(ellipse at 50% 40%,#B62CB566,transparent 70%);filter:blur(16px)}
.hcard{border-radius:22px;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 30px 60px -20px #000,0 0 0 1px #ffffff18;background:#16141e}
.hcard svg{width:100%;height:100%;display:block;position:absolute;inset:0}
.hcard .hcol{position:absolute;inset:0;clip-path:inset(100% 0 0 0);transition:clip-path .15s linear}
.hcard.shade::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 50%,#0A0911f2);z-index:1}
.hplate{backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;gap:7px;pointer-events:none}
.hplate b{font:800 30px/1 var(--head);text-shadow:0 4px 18px #000}
.hplate .tags{display:flex;gap:6px;flex-wrap:wrap}
.hplate .tags span{font-size:11.5px;padding:5px 9px;border-radius:999px;background:#17151FCC;border:1px solid var(--border);color:var(--t2);font-weight:500}
.hh{width:0;height:0}
.hh i{position:absolute;left:-8px;top:-8px;color:var(--pink-hi);animation:hrise 3.6s ease-in infinite;filter:drop-shadow(0 0 6px #DA5FD9aa)}
@keyframes hrise{0%{transform:translateY(20px) scale(.6);opacity:0}20%{opacity:1}100%{transform:translateY(-90px) scale(1);opacity:0}}
.sk path,.sk ellipse,.sk circle{stroke-dasharray:520;stroke-dashoffset:520;animation:draw 2.8s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
/* AI-painted portraits (img/) sit over the inline SVG; a failed image removes itself and the SVG shows */
.pimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 20%;display:block;user-select:none;-webkit-user-drag:none}
.pimg.crop{object-position:50% 0;transform:scale(1.6);transform-origin:50% 30%}
.pimg.sketch{filter:grayscale(1) contrast(1.25) brightness(.55)}
.pimg.swap{animation:swap .45s ease}
@keyframes swap{from{opacity:0;transform:scale(1.04)}}
.qmark{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--t3);font-size:12px;z-index:2;padding:10px}
.qmark b{display:block;font:800 40px/1 var(--head);color:var(--pink-hi);margin-bottom:6px}
.qmark>div{padding:10px 10px 9px;border-radius:14px;background:#0A0911e6;border:1px solid var(--border);color:var(--t2);font-weight:600;line-height:1.25;box-shadow:0 8px 20px -8px #000}
.ov{position:absolute;left:7px;right:7px;bottom:7px;display:flex;flex-wrap:wrap;gap:4px;z-index:3}
.ov span{font-size:10px;line-height:1;padding:4px 6px;border-radius:999px;background:#0A0911cc;border:1px solid #ffffff22;color:var(--t1);font-weight:600;display:inline-flex;gap:4px;align-items:center;white-space:nowrap}
.ov .dot{width:8px;height:8px;border-radius:50%;display:inline-block;box-shadow:0 0 0 1px #fff6}
.ribbon{position:absolute;top:8px;left:8px;z-index:3;font-size:10.5px;padding:4px 8px;border-radius:999px;background:var(--pink);color:#fff;font-weight:600}
.big .ov span{font-size:11.5px;padding:5px 8px}
.hero3d.mini .ov,.hero3d.mini .ribbon{display:none}
.big .ribbon{font-size:12px;padding:5px 10px;top:12px;left:12px}

/* builder preview row */
.pvrow{display:flex;gap:14px;align-items:center;flex:none;padding:10px;border-radius:22px;background:#17151Fb3;border:1px solid var(--border)}
.pvrow .hero3d{margin:0}
.spec{flex:1;min-width:0;display:grid;grid-template-columns:auto 1fr;gap:6px 10px;font-size:12.5px;margin:0;align-content:center}
.spec dt{color:var(--t3)}
.spec dd{margin:0;color:var(--t1);font-weight:500;overflow-wrap:anywhere}
.spec dd.mt{color:var(--t3);font-weight:400}
.spec .nm{grid-column:1/-1;font:800 18px/1.1 var(--head);margin-bottom:2px;color:var(--t1)}
.spec .tl{grid-column:1/-1;font-size:12px;color:var(--pink-hi);font-weight:600}
.trio{display:flex;justify-content:center;gap:8px;font-size:12px;color:var(--t3)}
.trio b{color:var(--positive);font-weight:600}
.trio i{font-style:normal;color:var(--t1)}

/* sliders */
.sl{display:flex;flex-direction:column;gap:6px;padding:12px 14px;border-radius:16px;background:var(--surface);border:1px solid var(--border)}
.sl .top{display:flex;justify-content:space-between;font-weight:600;font-size:14.5px}
.sl .top span{color:var(--pink-hi);font-variant-numeric:tabular-nums}
.sl .ends{display:flex;justify-content:space-between;font-size:11.5px;color:var(--t3)}
.sl input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:3px;background:linear-gradient(90deg,var(--pink) 0 var(--p,50%),var(--surface-2) var(--p,50%) 100%);outline:none;height:44px;padding:19px 0;background-clip:content-box;margin:-6px 0}
.sl input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:#fff;border:3px solid var(--pink);box-shadow:0 2px 10px #0008;cursor:grab}
.sl input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:#fff;border:3px solid var(--pink);cursor:grab}

/* style + scene cards */
.lcs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lc{height:96px;border-radius:18px;background:var(--surface);border:1.5px solid var(--border);display:flex;flex-direction:column;justify-content:space-between;padding:12px 14px;text-align:left;font-weight:600}
.lc .vg{font-size:28px;line-height:1}
.lc.on{border-color:var(--pink);background:linear-gradient(0deg,var(--pink-dim),var(--pink-dim)),var(--surface)}
.mcs{display:flex;flex-direction:column;gap:9px}
.mc{height:66px;border-radius:18px;border:1.5px solid var(--border);display:flex;align-items:center;gap:14px;padding:0 16px;font-weight:600;font-size:16px;position:relative;overflow:hidden;text-align:left;width:100%}
.mc.on{border-color:var(--pink);box-shadow:0 0 0 3px var(--pink-dim)}
.eyes{display:flex;justify-content:space-between;gap:6px}
.eye{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 2px;border-radius:16px;background:var(--surface);border:1.5px solid var(--border);font-size:13px;font-weight:500}
.eye i{width:34px;height:34px;border-radius:50%;display:block;box-shadow:inset 0 0 0 6px #00000030,0 0 0 2px #ffffff18;position:relative}
.eye i::after{content:"";position:absolute;inset:12px;border-radius:50%;background:#0A0911}
.eye.on{border-color:var(--pink);background:linear-gradient(0deg,var(--pink-dim),var(--pink-dim)),var(--surface)}

/* chat */
.chat{position:absolute;inset:0;top:var(--top);display:flex;flex-direction:column}
.chead{flex:none;display:flex;align-items:center;gap:10px;padding:4px 8px 8px 16px;border-bottom:1px solid var(--border);position:relative;z-index:2;background:var(--bg)}
.chead .who{flex:1;min-width:0}
.chead .who b{display:block;font:700 17px/1.1 var(--head)}
.chead .who span{font-size:12.5px;color:var(--positive)}
.av{position:relative;border-radius:50%;overflow:hidden;flex:none;display:block;background:#16141e}
.av svg{width:100%;height:100%;display:block;position:absolute;inset:0}
.cbody{flex:1;position:relative;overflow:hidden;display:flex;flex-direction:column}
.cbg{position:absolute;inset:0;z-index:0;background:var(--scene);opacity:.5}
.cbg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,var(--bg) 0%,transparent 30%,transparent 55%,var(--bg) 100%)}
.disclose{position:relative;z-index:1;margin:10px 16px 0;padding:8px 12px;border-radius:12px;background:#17151FE6;color:var(--t3);font-size:11.5px;text-align:center;line-height:1.35}
.msgs{position:relative;z-index:1;flex:1;overflow-y:auto;padding:12px 16px;display:flex;flex-direction:column;gap:10px;scrollbar-width:none}
.msgs::-webkit-scrollbar{display:none}
.msgs .spacer{flex:1}
.bub{padding:11px 14px;border-radius:18px;max-width:82%;font-size:15px;line-height:1.4;animation:fi .3s ease}
.bub.c{align-self:flex-start;background:var(--surface-2);border-bottom-left-radius:6px}
.bub.u{align-self:flex-end;background:var(--pink);color:#fff;border-bottom-right-radius:6px}
.bub.sys{align-self:center;background:transparent;color:var(--t3);font-size:12px;padding:2px;text-align:center}
.typing{display:inline-flex;gap:4px;padding:3px 0}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--t3);animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{50%{opacity:.3}}
.ideas{position:relative;z-index:1;display:flex;flex-direction:column;gap:8px;padding:0 16px 10px}
.ideas .ih{font-size:12px;color:var(--t3);display:flex;gap:6px;align-items:center}
.ideas button:not(.btn){min-height:44px;padding:11px 14px;border-radius:14px;background:#17151FE6;border:1px solid var(--border);text-align:left;font-size:14px;color:var(--t2)}
.ideas button:not(.btn):hover{border-color:var(--pink);color:var(--t1)}
.cfoot{flex:none;border-top:1px solid var(--border);padding:10px 14px max(14px,calc(env(safe-area-inset-bottom,0px) + 8px));display:flex;flex-direction:column;gap:8px;background:var(--bg);position:relative;z-index:2}
.cchips{display:flex;gap:8px}
.cchips span{white-space:nowrap;padding:7px 12px;border-radius:999px;border:1px solid var(--border);background:var(--surface);font-size:13px;color:var(--t2);display:inline-flex;gap:6px;align-items:center}
.counter{font-size:12px;color:var(--t3);font-weight:500;font-variant-numeric:tabular-nums}
.counter.out{color:var(--negative)}
.composer{display:flex;gap:8px;align-items:center}
.composer .box{flex:1;height:48px;border-radius:999px;padding:0 16px}
.send{width:48px;height:48px;border-radius:50%;border:none;background:var(--pink);color:#fff;display:grid;place-items:center;flex:none}
.send[disabled]{background:var(--surface-2);color:var(--t3)}
.mtoast{position:absolute;z-index:6;top:calc(var(--top) + 64px);right:12px;left:12px;display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:14px;background:var(--surface);border:1px solid var(--pink);font-size:13px;box-shadow:0 12px 30px -10px #000;animation:mt 3.6s ease forwards}
.mtoast svg{color:var(--pink-hi);flex:none}
@keyframes mt{0%{opacity:0;transform:translateY(-8px)}8%,85%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-6px)}}
.limit{align-self:stretch;margin-top:4px;padding:18px 16px;border-radius:18px;border:1.5px solid var(--pink);background:#17151FF2;display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center;animation:fi .4s ease}
.limit h3{margin:0;font:800 20px/1.2 var(--head)}
.limit p{margin:0;color:var(--t2);font-size:14px}
.limit .crown{color:var(--pink-hi)}

/* loading */
.steps{display:flex;flex-direction:column;gap:13px;position:relative}
.step .top{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--t2);margin-bottom:7px;gap:10px}
.step .pct{font-variant-numeric:tabular-nums;color:var(--t3);display:flex;gap:6px;align-items:center}
.step.done .top{color:var(--t1)}
.step.done .pct{color:var(--pink-hi)}
.bar{height:5px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.bar span{display:block;height:100%;background:var(--pink);width:0}
.floattags{height:28px;position:relative;flex:none}
.floattags span{position:absolute;left:50%;top:0;max-width:46%;overflow:hidden;text-overflow:ellipsis;font-size:12px;padding:5px 10px;border-radius:999px;background:var(--pink-dim);color:var(--pink-hi);font-weight:600;animation:tagup 2.4s ease infinite;opacity:0;white-space:nowrap}
@keyframes tagup{0%{opacity:0;transform:translate(var(--x),16px)}25%,70%{opacity:1}100%{opacity:0;transform:translate(var(--x),-14px)}}
.iq{position:absolute;left:-4px;right:-4px;bottom:-8px;z-index:4;padding:16px;border-radius:20px;background:var(--bg-elev);border:1.5px solid var(--pink);box-shadow:0 -10px 40px -8px #000;display:flex;flex-direction:column;gap:12px;animation:up2 .35s cubic-bezier(.2,.8,.2,1)}
.iq b{font:700 17px/1.25 var(--head)}
.iq .row{display:flex;gap:10px}
.iq .row .btn{height:48px;flex:1;width:auto}
@keyframes up2{from{transform:translateY(30px);opacity:0}}

/* profile card */
.prof{display:flex;flex-direction:column;gap:12px;padding:14px;border-radius:20px;background:var(--surface);border:1px solid var(--border)}
.prof .chips{display:flex;flex-wrap:wrap;gap:6px}
.prof .chips span{font-size:12px;padding:5px 9px;border-radius:999px;background:var(--surface-2);border:1px solid var(--border);color:var(--t2);font-weight:500}
.tb{display:grid;grid-template-columns:96px 1fr 34px;gap:8px;align-items:center;font-size:12.5px;color:var(--t2)}
.tb .bar{height:6px}
.tb .bar span{transition:width 1s ease}
.tb em{font-style:normal;color:var(--t1);text-align:right;font-variant-numeric:tabular-nums}

  ${r('Hair',[hairLabel(),hs].filter(Boolean).map(esc).join(' · '))}${r('Eyes',S.eye?EYES[S.eye][1]:'')}${r('Look',esc(lookLabel()))}${r('Age',S.age?AGES[S.age][1]:'')}${r('Details',S.det.map(d=>DET[d][1]).join(', '))}`};

function snapshot(){
  return {screen:S.i,screenName:SCREENS[S.i],variant:S.v,
    hair:S.hair||null,hairResolved:S.hair?hk():null,herAge:S.age||null,hairStyle:S.hstyle||null,eyes:S.eye||null,style:S.look||null,styleResolved:S.look?lkk():null,details:S.det.slice(),
    goal:S.goal||null,personality:{warmth:S.warm,playfulness:S.play,flirtiness:S.flirt,talkativeness:S.talk},scene:S.scene||null,sceneResolved:S.scene?sk():null,emoji:S.emoji||null,
    messagesSent:S.sent,messagesLeft:S.premium?null:Math.max(0,S.msgs),
    account:S.account,hasEmail:!!S.email&&S.account==='Email',plan:S.plan,paidPlan:S.paidPlan||null,addon:!!S.addon,premium:S.premium,notifications:S.notif,notifTime:S.notif?S.ntime:null};
}
function emit(name,detail){
  let data={};try{data=snapshot()}catch(e){}
  const d=Object.assign({},detail||{},{data});
  try{window.dispatchEvent(new CustomEvent('ikfunnel:'+name,{detail:d}))}catch(e){}
  try{window.parent.postMessage({source:'ikame-funnel',funnel:CONFIG.slug,event:name,detail:d},'*')}catch(e){}
  const flat=Object.assign({funnel:CONFIG.slug},data,detail||{});
  try{if(typeof window.fbq==='function')window.fbq('trackCustom',name,flat)}catch(e){}
  try{if(window.ttq&&typeof window.ttq.track==='function')window.ttq.track(name,flat)}catch(e){}
  if(DEBUG)try{console.log('[ikfunnel] '+name+' '+JSON.stringify(d))}catch(e){}
}

function passParams(u){PASS.forEach(k=>{const v=QS.get(k);if(v&&!u.searchParams.has(k))u.searchParams.set(k,v)})}
function navTop(href){try{window.top.location.href=href}catch(e){try{window.open(href,'_top')}catch(_){location.href=href}}}
function checkout(plan){
  const p=CONFIG.plans[plan],url=CONFIG.checkoutUrl[plan]||'';
  emit('checkout_click',{plan,price:p.price,url});
  if(!url){demoCheckout(plan);return}
  let u;try{u=new URL(url,location.href)}catch(e){return}
  u.searchParams.set('plan',plan);
  passParams(u);navTop(u.toString());
}
function appUrl(){const ua=navigator.userAgent||'';return CONFIG.app.deepLink||(/android/i.test(ua)?CONFIG.app.androidUrl:CONFIG.app.iosUrl)}
/* "Open the app": Android -> web2app (Adjust link, opens the store/app), iOS and desktop -> web2web (ChatChi web app).
   {{email}} = the email given in the funnel, {{user.id}} = FunnelFox profile id (?fpid / ff-user cookie), utm_* and fbclid = the landing query (kept from the first screen). */
const IKF_ATTR_KEY='ikf_attr_'+CONFIG.slug;
(function(){try{const q=new URLSearchParams(location.search),o=JSON.parse(sessionStorage.getItem(IKF_ATTR_KEY)||'{}');['utm_source','utm_medium','utm_campaign','utm_content','utm_term','fbclid','fpid'].forEach(k=>{const v=q.get(k);if(v)o[k]=v});sessionStorage.setItem(IKF_ATTR_KEY,JSON.stringify(o))}catch(e){}})();
function attrVal(k){let o={};try{o=JSON.parse(sessionStorage.getItem(IKF_ATTR_KEY)||'{}')}catch(e){}if(o[k])return o[k];try{for(const st of [sessionStorage,localStorage])for(let i=0;i<st.length;i++){const n=st.key(i);if(n&&n.indexOf('ff_variables_query_state_')===0){const v=JSON.parse(st.getItem(n)||'{}');if(v&&v[k])return String(v[k])}}}catch(e){}return ''}
function ffUserId(){const q=new URLSearchParams(location.search).get('fpid')||attrVal('fpid');if(q)return q;const m=document.cookie.match(/(?:^|;\s*)ff-user=([^;]+)/);return m?decodeURIComponent(m[1]):''}
function userEmail(){let e=(typeof S!=='undefined'&&S&&S.email)||'';try{const F=window.fox;if(!e&&F&&F.inputs&&F.inputs.getEmail){const r=F.inputs.getEmail();e=typeof r==='string'?r:(r&&r.value)||''}}catch(x){}return String(e||'').trim()}
function fillLink(t){const v={email:userEmail(),'user.id':ffUserId(),utm_medium:attrVal('utm_medium'),utm_campaign:attrVal('utm_campaign'),utm_content:attrVal('utm_content'),utm_source:attrVal('utm_source'),fbclid:attrVal('fbclid')};return String(t||'').replace(/\{\{\s*([\w.]+)\s*\}\}/g,(m,k)=>encodeURIComponent(v[k]||''))}
function openApp(){const android=/android/i.test(navigator.userAgent||'');const u=fillLink(android?CONFIG.app.web2app:CONFIG.app.web2web);emit('app_handoff',{url:u,target:android?'web2app':'web2web'});if(u)navTop(u)}

function viewed(){
  emit('screen_view',{index:S.i,name:SCREENS[S.i]});

  if(SALEKEY[S.i])emit('sale_view',{plan:SALEKEY[S.i]});

}
function go(n,push=true){clearT();if(push&&S.i!==n)S.hist.push(S.i);S.i=n;S.err='';S.err2='';S.sheet=null;render(true);viewed()}

  herLines(0).forEach(x=>out.push({w:'c',x}));out.push({w:'u',x:strip(sc.i0[0])});
  herLines(1).forEach(x=>out.push({w:'c',x}));out.push({w:'u',x:sc.i1[0]});
  herLines(2).forEach(x=>out.push({w:'c',x}));return out;
}

  if(n>=17)S.teaserDone=true;

  if(n>17&&!S.account)S.account=S.email?'Email':'Guest';

}

function pwWire(){const v=cur();const box=v&&v.querySelector('.lps');if(!box||box._w)return;box._w=1;
  const st=v.querySelector('#lpstick'),mini=v.querySelector('.lpmini'),blocks=[...v.querySelectorAll('[data-pblock]')],ctas=blocks.map(b=>b.querySelector('[data-a="buy"]')),vis=new Set();
  const upd=()=>{const show=!vis.size;st.classList.toggle('show',show);st.setAttribute('aria-hidden',!show);st.querySelector('.btn').tabIndex=show?0:-1;
    const p1=blocks[0].getBoundingClientRect(),br=box.getBoundingClientRect();const past=p1.bottom<br.top+60;mini.classList.toggle('show',past);mini.tabIndex=past?0:-1};
  if('IntersectionObserver' in window){const io=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting)vis.add(e.target);else vis.delete(e.target)});upd()},{root:box,threshold:1,rootMargin:'-64px 0px 0px 0px'});ctas.forEach(b=>io.observe(b))}
  box.addEventListener('scroll',upd,{passive:true});upd()}

/* chat engine (scripted, deterministic) */
function say(text){
  text=strip(text);
  if(S.typing||(!S.premium&&S.msgs<=0))return;
  if(!S.premium&&S.i!==16)return;   // hard paywall: a free user only ever chats in the 2-message taste
  if(S.i===16&&(S.gate||S.turn>=CONFIG.teaserMessages||!S.chat.length))return;
  S.sent++;emit('chat_message',{count:S.sent,screen:S.i});
  const inp=document.getElementById('msg');if(inp)inp.value='';
  S.chat.push({w:'u',x:text});if(!S.premium)S.msgs--;
  if(S.i===16){S.picks.push(text);S.turn++}
  saveState();render();reply();
}
function reply(){
  const lastU=[...S.chat].reverse().find(m=>m.w==='u');
  const slow=lastU&&/slow\s*down/i.test(lastU.x);
  S.typing=true;render();
  const at=S.i;
  later(()=>{
    S.typing=false;
    if(at===16){
      const lines=slow?[SLOW]:herLines(S.turn);
      S.chat.push({w:'c',x:lines[0]});if(lines[1])S.typing=true;render();
      if(lines[1])later(()=>{S.typing=false;S.chat.push({w:'c',x:lines[1]});render()},1100);
      if(S.turn===2)memToast();
      if(S.turn>=CONFIG.teaserMessages)teaserEnd(lines[1]?1100:0);
    }else{
      S.chat.push({w:'c',x:slow?SLOW:GEN[S.chat.length%GEN.length]});render();
      if(at===19&&S.notif===null)later(()=>{if(S.i===19)go(20)},1300);
      else if(!S.premium&&S.msgs<=0&&S.i===19)later(()=>go(21),1200);
    }
  },1200);
}
function memToast(){
  const sc=SCENES[sk()];const pick=S.picks[1]||'';const i=sc.i1.indexOf(pick);
  const what=i>=0?sc.m1[i]:`you said “${pick.slice(0,30)}${pick.length>30?'…':''}”`;
  S.mems=[what];renderPanel();
  const el=document.createElement('div');el.className='mtoast';
  el.innerHTML=`${ic('book',18)}<span><b>${esc(gfn())} will remember that.</b><br><span style="color:var(--t2)">📓 ${esc(what)}</span></span>`;
  cur().appendChild(el);setTimeout(()=>el.remove(),3700);
}
/* the 2-message taste is used: no more input, she "types" ~1.5 s, then the email gate (17), then the paywall */
function teaserEnd(wait){
  if(S.premium||S.teaserDone)return;
  S.teaserDone=true;S.gate=true;emit('chat_teaser_end',{count:S.sent});saveState();render();
  later(()=>{if(S.i!==16)return;S.typing=true;render();later(()=>{S.typing=false;S.gate=false;go(17)},1500)},wait+1300);
}
/* chat taste re-entered with no timers running (FunnelFox restores the state after a reload / re-entry):
   finish her pending reply, or hand off to the email gate, instead of leaving a locked chat */
function resume16(){
  if(S.i!==16||S.typing||timers.length||S.premium||!S.chat.length)return;
  if(S.chat[S.chat.length-1].w==='u')reply();
  else if(S.turn>=CONFIG.teaserMessages){S.teaserDone=true;S.gate=true;render();later(()=>{if(S.i===16){S.gate=false;go(17)}},1500)}
}

function runLoading(){
  LD={row:0,pct:0,asked:!!S.emoji};
  const col=()=>cur()&&cur().querySelector('.hcol');
  const tick=()=>{
    if(!LD)return;
    LD.pct+=3;const el=document.getElementById('st'+LD.row);if(!el){clearInterval(timer);return}
    if(LD.row===1&&LD.pct>=78&&!LD.asked){LD.pct=78;paint(el);clearInterval(timer);askInline();return}
    paint(el);
    if(LD.pct>=100){el.classList.add('done');el.querySelector('.pct').innerHTML=`${ic('check',14,'currentColor',2.5)}<span>100%</span>`;LD.row++;LD.pct=0;
      if(LD.row>3){clearInterval(timer);AMB.boost=1.5;timer=setTimeout(()=>go(15),1600)}}
  };
  const paint=el=>{const p=Math.min(LD.pct,100);el.querySelector('.bar span').style.width=p+'%';el.querySelector('.pct span').textContent=p+'%';const c=col();if(c)c.style.clipPath=`inset(${(100-(LD.row*100+p)/4).toFixed(1)}% 0 0 0)`};
  LD.resume=()=>{clearInterval(timer);timer=setInterval(tick,40)};
  LD.resume();
}

/* hero 3D: her preview card — float (hook, builder), sketch→colour (loader), land (profile); pointer orbit */
const HEROES=new Set();let loopOn=false;
function mountHero(el){
  if(el._h)return;
  const mode=el.dataset.mode,w=+el.dataset.w,h=+el.dataset.h;
  let hearts='';
  if(mode==='land')for(let i=0;i<6;i++){const x=-w/2+30+i*(w-60)/5,y=-h/2+40+(i%3)*50;hearts+=`<div class="hh" style="transform:translate3d(${x}px,${y}px,${60+(i%3)*18}px)"><i style="animation-delay:${i*.55}s">${heartF(12+(i%3)*3)}</i></div>`}
  const inner=mode==='hook'?faceSVG()+`<img class="pimg" src="${imgs('img/gf-red.jpg')}" alt="" decoding="async" draggable="false" onerror="this.remove()">`:cardInner(mode);
  const plate=mode==='land'?`<div class="hplate" style="width:${w-28}px;transform:translate(-50%,-50%) translate3d(0,${h/2-54}px,42px)"><b>${esc(gfn())}</b><div class="tags"><span>${S.age?AGES[S.age][1]:'25-29'}</span><span>${esc(traitLine().split(' · ')[0])}</span></div></div>`:'';
  el.innerHTML=`<div class="hin ${mode==='land'?'land':''}"><div class="hscene"><div class="hglow" style="width:${w*1.1}px;height:${h*1.05}px;transform:translate(-50%,-50%) translateZ(-60px)"></div>
  <div class="hcard ${mode==='land'?'shade':''} ${mode==='big'?'big':''}" style="width:${w}px;height:${h}px;transform:translate(-50%,-50%)">${inner}</div>${plate}${hearts}</div></div>`;
  const o={el,mode,scene:el.querySelector('.hscene'),t0:performance.now(),px:0,py:0,tx:0,ty:0};
  el._h=o;HEROES.add(o);
  el.addEventListener('pointermove',e=>{const r=el.getBoundingClientRect();o.tx=(e.clientX-r.left)/r.width-.5;o.ty=(e.clientY-r.top)/r.height-.5});
  el.addEventListener('pointerleave',()=>{o.tx=0;o.ty=0});
  if(RM){drawHero(o,o.t0+5000);return}
  if(!loopOn){loopOn=true;requestAnimationFrame(frame3d)}
}
function drawHero(o,now){
  const t=(now-o.t0)/1000;
  o.px+=(o.tx-o.px)*.08;o.py+=(o.ty-o.py)*.08;
  let ry,rx;
  if(o.mode==='hook'){ry=14+Math.sin(t*.6)*9+o.px*26;rx=Math.sin(t*.5)*3-o.py*16}
  else if(o.mode==='sketch'){ry=Math.sin(t*.9)*16+o.px*20;rx=-6+Math.sin(t*.7)*4-o.py*12}
  else if(o.mode==='live'){ry=Math.sin(t*.7)*10+o.px*30;rx=Math.sin(t*.5)*3-o.py*18}
  else{ry=Math.sin(t*.6)*7+o.px*26;rx=Math.sin(t*.5)*3-o.py*16}
  o.scene.style.transform=`rotateX(${rx.toFixed(2)}deg) rotateY(${ry.toFixed(2)}deg)`;
}
function frame3d(now){
  for(const h of HEROES){if(!h.el.isConnected){HEROES.delete(h);continue}drawHero(h,now)}
  if(HEROES.size)requestAnimationFrame(frame3d);else loopOn=false;
}

/* ambient: soft drifting bokeh */
const AMB={base:1,boost:0};
(function(){
  const cv=document.getElementById('amb'),cx=cv.getContext('2d');let w=0,h=0;const P=[];
  const cols=['182,44,181','218,95,217','155,123,255','120,60,160'];
  const spawn=(p,init)=>{p.x=Math.random();p.y=init?Math.random():1.1;p.r=12+Math.random()*50;p.c=cols[Math.floor(Math.random()*cols.length)];p.a=.04+Math.random()*.08;p.s=.008+Math.random()*.02;p.ph=Math.random()*6.28;return p};
  for(let i=0;i<22;i++)P.push(spawn({},true));
  function size(){const r=phone.getBoundingClientRect();const d=Math.min(2,devicePixelRatio||1);w=r.width;h=r.height;cv.width=w*d;cv.height=h*d;cx.setTransform(d,0,0,d,0,0)}
  size();addEventListener('resize',size);
  let last=performance.now();
  function frame(now){
    const dt=Math.min(50,now-last)/1000;last=now;AMB.boost*=Math.pow(.3,dt);
    const sp=AMB.base+AMB.boost*6;cx.clearRect(0,0,w,h);
    const g=cx.createRadialGradient(w*.5,0,0,w*.5,0,w*.9);g.addColorStop(0,'rgba(182,44,181,.10)');g.addColorStop(1,'rgba(0,0,0,0)');cx.fillStyle=g;cx.fillRect(0,0,w,h);
    for(const p of P){p.y-=p.s*sp*dt;if(p.y<-.15)spawn(p,false);const x=(p.x+Math.sin(now/4000+p.ph)*.03)*w,y=p.y*h;
      const rg=cx.createRadialGradient(x,y,0,x,y,p.r);rg.addColorStop(0,`rgba(${p.c},${p.a})`);rg.addColorStop(1,`rgba(${p.c},0)`);cx.fillStyle=rg;cx.beginPath();cx.arc(x,y,p.r,0,6.283);cx.fill()}
    if(!RM)requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
