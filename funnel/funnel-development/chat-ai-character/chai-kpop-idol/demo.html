<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A0911">
<title>ChatChi: AI Roleplay Chat · Create Your Dream Idol</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600&display=swap">
<style>
:root{
  color-scheme:dark;
  --ground:#06050B;
  --bg:#0A0911;--bg-elev:#12101B;--surface:#17151F;--surface-2:#221F2D;--border:#2D293B;
  --t1:#F4F2F8;--t2:#A7A2B7;--t3:#6F6A82;
  --pink:#B62CB5;--pink-hi:#DA5FD9;--pink-dim:#B62CB52E;--pink-deep:#261230;
  --grad-a:#9A2ACB;--grad-b:#D82F99;--grad:linear-gradient(135deg,var(--grad-a),var(--grad-b));
  --amber:#F5B83D;--negative:#F0705F;--positive:#7FD1A8;
  --head:"Plus Jakarta Sans","Segoe UI",system-ui,sans-serif;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--t1);font:15px/1.45 var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--pink-hi);outline-offset:2px}

.phone{position:relative;width:100%;max-width:480px;height:100vh;height:100dvh;margin:0 auto;background:var(--bg);background-image:radial-gradient(ellipse 70% 35% at 50% 0%,#240F2C 0%,transparent 70%);overflow:hidden;isolation:isolate;--top:calc(env(safe-area-inset-top,0px) + 6px)}
@media (min-width:520px){.phone{border-inline:1px solid #2A2536}}
.view{position:absolute;inset:0;padding-top:var(--top);display:flex;flex-direction:column}
.view.in{animation:vin .3s ease both}
@keyframes vin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* Honey-style top bar: back · title · segmented progress */
.nav{flex:none;padding:0 12px;position:relative;z-index:3}
.nav .row{height:44px;display:flex;align-items:center}
.nav .ttl{flex:1;text-align:center;font:700 15px var(--head);margin-right:44px}
.iconbtn{width:44px;height:44px;border-radius:50%;border:none;background:transparent;display:grid;place-items:center;color:var(--t2)}
.segs{display:flex;gap:4px;padding:0 20px 6px}
.segs i{flex:1;height:4px;border-radius:2px;background:var(--surface-2)}
.segs i.on{background:var(--grad)}
.scr{flex:1;overflow-y:auto;overflow-x:hidden;padding:8px 16px 16px;display:flex;flex-direction:column;gap:14px;scrollbar-width:none}
.scr::-webkit-scrollbar{display:none}
.foot{flex:none;padding:10px 16px max(18px,calc(env(safe-area-inset-bottom,0px) + 10px));display:flex;flex-direction:column;gap:8px;position:relative;z-index:2;background:linear-gradient(180deg,transparent,var(--bg) 30%)}
.q{font:800 22px/1.2 var(--head);letter-spacing:-.01em;margin:4px 0 0;text-align:center;text-wrap:balance}
.sub{margin:-6px 0 0;text-align:center;color:var(--t2);font-size:13.5px}
.h1{font:800 30px/1.1 var(--head);letter-spacing:-.02em;margin:0;text-align:center;text-wrap:balance}
.gt{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}

.btn{height:54px;border-radius:14px;border:none;background:var(--pink);color:#fff;font:700 16px/1 var(--head);width:100%;display:flex;align-items:center;justify-content:center;gap:10px;flex:none;transition:transform .12s,opacity .2s;position:relative;overflow:hidden;box-shadow:0 10px 30px -12px #B62CB5cc}
.btn:active{transform:scale(.98)}
.btn[disabled]{background:var(--surface-2);color:var(--t3);box-shadow:none}
.btn:not([disabled])::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:0;background:linear-gradient(100deg,transparent,#ffffff45,transparent);transform:translateX(-150%) skewX(-20deg);animation:sheen 4.5s ease-in-out 1.2s infinite}
@keyframes sheen{0%{transform:translateX(-150%) skewX(-20deg)}28%,100%{transform:translateX(320%) skewX(-20deg)}}
.btn.ghost{background:var(--surface);border:1px solid var(--border);color:var(--t1);box-shadow:none;height:48px}
.btn.ghost::after{display:none}
.link{background:none;border:none;color:var(--t2);font-size:14px;min-height:44px}
.legal{font-size:13px;color:var(--t3);text-align:center;line-height:1.5}
.legal a,.wfoot a{display:inline-block;padding:12px 6px;margin:-12px -2px;color:#E7A8E6;font-size:13px;line-height:16px;text-decoration:underline;text-underline-offset:3px}
.hookfoot{padding-top:6px}
.hookfoot .legal{margin:0}

/* photo cards (Honey's core element) */
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{position:relative;border-radius:16px;overflow:hidden;border:2px solid var(--border);background:var(--surface);padding:0;aspect-ratio:3/3.4;display:block;text-align:left;transition:border-color .15s,box-shadow .2s,transform .12s}
.card.tall{aspect-ratio:3/4.1}
.card:active{transform:scale(.97)}
.card .ph{position:absolute;inset:0;display:grid;place-items:center;font-size:44px;background:var(--fb,linear-gradient(160deg,#2a1838,#0d0a18))}
.card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 22%}
.card .lb{position:absolute;left:0;right:0;bottom:0;padding:9px 10px;background:#0A0911e0;font:700 14px/1.2 var(--head);text-align:center;display:flex;align-items:center;justify-content:center;gap:8px;min-height:40px}
.card .ck{width:20px;height:20px;border-radius:6px;border:1.5px solid #ffffff55;flex:none;display:grid;place-items:center;position:absolute;right:9px;bottom:10px}
.card.multi .lb{justify-content:flex-start;padding-right:36px;text-align:left}
.card.on{border-color:transparent;box-shadow:0 0 0 2px var(--grad-b),0 0 24px -4px #B62CB5aa}
.card.on::before{content:"";position:absolute;inset:-2px;border-radius:16px;padding:2px;background:var(--grad);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;z-index:2;pointer-events:none}
.card.on .ck{background:var(--grad);border-color:transparent}
.ck svg{opacity:0;transition:opacity .15s}.on .ck svg{opacity:1}
.collage{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr}
.collage img{position:static;width:100%;height:100%}

.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:flex;align-items:center;gap:12px;padding:14px;border-radius:14px;background:var(--surface);border:1.5px solid var(--border);text-align:left;width:100%;min-height:54px}
.opt .em{font-size:19px;width:24px;text-align:center}
.opt .lbl{flex:1;font-weight:600}
.opt .ck{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--border);display:grid;place-items:center}
.opt.on{border-color:var(--pink);background:linear-gradient(0deg,var(--pink-dim),var(--pink-dim)),var(--surface)}
.opt.on .ck{background:var(--grad);border-color:transparent}
.box{height:50px;border-radius:14px;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;padding:0 14px}
.box input{flex:1;min-width:0;background:transparent;border:none;outline:none;color:var(--t1);font:400 16px var(--sans)}

/* sliders */
.sls{display:flex;flex-direction:column;gap:6px;padding:8px 14px;border-radius:18px;background:var(--surface);border:1px solid var(--border)}
.sl{padding:12px 0;border-top:1px solid var(--border)}
.sl:first-child{border-top:none}
.sl .top{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px}
.sl .top .gi{width:30px;height:30px;border-radius:9px;background:var(--pink-dim);display:grid;place-items:center}
.sl .top b{margin-left:auto;font:600 13px var(--sans);padding:4px 9px;border-radius:8px;background:var(--surface-2);border:1px solid var(--border);font-variant-numeric:tabular-nums}
.sl input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:44px;background:linear-gradient(90deg,var(--grad-a),var(--grad-b) var(--p,50%),var(--surface-2) var(--p,50%));background-clip:content-box;padding:19px 0;outline:none;margin:0}
.sl input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:#fff;border:3px solid var(--pink);box-shadow:0 2px 10px #0008}
.sl input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:#fff;border:3px solid var(--pink)}
.hint{font-size:12.5px;color:var(--t3);text-align:center}
.emwell{width:84px;height:84px;border-radius:50%;overflow:hidden;margin:6px auto 0;border:2px solid var(--pink);box-shadow:0 8px 32px #B62CB555;position:relative}
.emwell img{width:100%;height:100%;object-fit:cover}
.box.bad{border-color:#FF5C7A}
.emerr{font-size:13px;color:#FF7A93;margin:-6px 2px 0}

/* bridge */
.bridge{flex:1;position:relative;margin:0 -16px -16px;min-height:0}
.bridge img,.bridge .ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 15%}
.bridge .ph{display:grid;place-items:center;font-size:80px;background:linear-gradient(160deg,#2a1838,#0d0a18)}
.bridge::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,var(--bg) 0%,transparent 18%,transparent 70%,var(--bg) 100%)}

/* loader */
.ldimg{position:relative;flex:1;min-height:180px;margin:0 -16px;overflow:hidden}
.ldimg img,.ldimg .ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 20%;filter:blur(var(--bl,18px)) saturate(1.1);transform:scale(1.08);transition:filter .3s linear}
.ldimg .ph{display:block;background:radial-gradient(circle at 50% 35%,#6a2a6a,#0d0a18 70%)}
.ldimg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,var(--bg) 0%,transparent 25%,transparent 60%,var(--bg) 100%)}
.steps{display:flex;flex-direction:column;gap:12px;position:relative;z-index:1}
.step .top{display:flex;justify-content:space-between;font-size:14px;color:var(--t2);margin-bottom:6px}
.step.done .top{color:var(--t1)}
.step .top b{font-variant-numeric:tabular-nums;font-weight:600}
.step.done .top b{color:var(--pink-hi)}
.bar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.bar span{display:block;height:100%;background:var(--grad);width:0}
.iq{position:absolute;left:0;right:0;bottom:0;z-index:5;padding:20px 16px max(20px,calc(env(safe-area-inset-bottom,0px) + 12px));background:linear-gradient(180deg,transparent,var(--bg) 22%);display:flex;flex-direction:column;gap:14px;animation:up .35s cubic-bezier(.2,.8,.2,1)}
.iq b{font:800 20px/1.25 var(--head);text-align:center}
.iq .row{display:flex;gap:10px}
.iq .row .btn{flex:1}
@keyframes up{from{transform:translateY(40px);opacity:0}}

/* paywall (long scroll) */
.pw{position:absolute;inset:0;z-index:20;overflow-y:auto;scrollbar-width:none;background:var(--bg)}
.pw::-webkit-scrollbar{display:none}
.pwx{position:fixed;z-index:9;top:calc(var(--top) + 6px);width:36px;height:36px;border-radius:50%;background:#0A0911aa;border:1px solid #ffffff22;color:var(--t2);display:grid;place-items:center;margin-left:12px;backdrop-filter:blur(6px)}
.sec{padding:26px 16px 0}
.pwhero{position:relative;height:430px;overflow:hidden}
.pwhero img,.pwhero .ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 18%}
.pwhero .ph{display:block;background:radial-gradient(circle at 50% 35%,#6a2a6a,#0d0a18 70%)}
.pwhero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,var(--bg) 96%)}
.pwhero .txt{position:absolute;left:16px;right:16px;bottom:8px;z-index:1}
.pwhero .h1{text-align:left;font-size:34px}
.pwhero p{margin:6px 0 0;color:var(--t2)}
.plans{display:flex;flex-direction:column;gap:10px}
.plan{position:relative;padding:14px 16px;border-radius:16px;border:1.5px solid var(--border);background:var(--surface);text-align:left;display:grid;grid-template-columns:24px 1fr auto;gap:2px 12px;align-items:center;width:100%}
.plan .rd{width:22px;height:22px;border-radius:50%;border:2px solid var(--border);grid-row:1/3;display:grid;place-items:center}
.plan.on{border-color:var(--pink);background:var(--pink-deep);box-shadow:0 0 20px -8px #B62CB5}
.plan.on .rd{background:var(--grad);border-color:transparent}
.plan .pn{font:800 17px var(--head)}
.plan .pp{font:800 19px/1.1 var(--head);text-align:right}
.plan .pp small{font:500 11px var(--sans);color:var(--t2)}
.plan .rn{font-size:11.5px;color:var(--t2);grid-column:2/4}
.plan .bv{position:absolute;top:-10px;left:50%;transform:translateX(-50%);font:700 11px/1 var(--head);letter-spacing:.06em;background:var(--grad);color:#fff;padding:5px 12px;border-radius:999px;white-space:nowrap}
.ph2{font-family:ui-monospace,Consolas,monospace;font-size:.82em;font-weight:600;padding:1px 5px;border-radius:6px;border:1px dashed var(--amber);color:var(--amber);background:#F5B83D14;white-space:nowrap}
.fine{font-size:11.5px;color:var(--t3);text-align:center;margin-top:10px;line-height:1.45}
.h2{font:800 26px/1.15 var(--head);margin:0 0 14px;letter-spacing:-.01em}
.match{display:flex;gap:16px;align-items:center}
.ring{width:118px;height:118px;flex:none;border-radius:50%;background:conic-gradient(var(--grad-b) calc(var(--m)*1%),var(--grad-a) calc(var(--m)*1%),var(--surface-2) 0);display:grid;place-items:center;position:relative}
.ring::before{content:"";position:absolute;inset:8px;border-radius:50%;background:var(--bg)}
.ring span{position:relative;text-align:center;font:800 26px/1 var(--head)}
.ring small{display:block;font:500 12px var(--sans);color:var(--t2);margin-top:4px}
.traits{display:flex;flex-direction:column;gap:10px;font-weight:600}
.traits div{display:flex;gap:10px;align-items:center}
.gw{width:32px;height:32px;border-radius:10px;background:var(--grad);display:grid;place-items:center;color:#fff;flex:none}
.pcard{margin-top:16px;border-radius:20px;overflow:hidden;position:relative;aspect-ratio:3/3.6;border:1px solid var(--border)}
.pcard img,.pcard .ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 20%}
.pcard .ph{display:block;background:radial-gradient(circle at 50% 35%,#6a2a6a,#0d0a18 70%)}
.pcard .cap{position:absolute;left:0;right:0;bottom:0;padding:40px 14px 12px;background:linear-gradient(180deg,transparent,#0A0911f0);display:flex;justify-content:space-between;align-items:flex-end}
.pcard .cap b{font:800 24px var(--head)}
.pcard .cap small{font-size:11px;color:var(--t3)}
.bens{display:flex;flex-direction:column;gap:9px}
.ben{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--border)}
.ben b{display:block;font:700 15px var(--head)}
.ben small{color:var(--t2);font-size:12.5px}
.ben .tg{margin-left:auto;font:700 10px var(--sans);letter-spacing:.05em;padding:3px 7px;border-radius:6px;background:var(--pink-dim);color:var(--pink-hi)}
.stats{display:flex;flex-direction:column;gap:10px}
.stat{display:flex;gap:14px;align-items:center;padding:14px;border-radius:16px;background:var(--surface);border:1px solid var(--border);font-size:14px}
.stat .n{font:800 22px var(--head);flex:none;min-width:64px;text-align:center}
.mock{border-radius:26px;border:1px solid var(--border);background:var(--bg-elev);padding:12px;display:flex;flex-direction:column;gap:9px;position:relative;overflow:hidden}
.mock .hd{display:flex;gap:10px;align-items:center;padding-bottom:9px;border-bottom:1px solid var(--border)}
.mock .hd b{font:700 15px var(--head)}
.mock .hd small{display:block;color:var(--positive);font-size:11.5px}
.rev{padding:14px;border-radius:16px;background:var(--surface);border:1px solid var(--border);display:flex;flex-direction:column;gap:6px;font-size:13.5px;color:var(--t2)}
.rev .who{display:flex;gap:10px;align-items:center;color:var(--t1)}
.rev .who i{width:34px;height:34px;border-radius:50%;background:var(--grad);display:grid;place-items:center;font:700 12px var(--head);font-style:normal;color:#fff}
.rev .st{margin-left:auto;color:var(--amber);letter-spacing:2px;font-size:13px}
.guar{margin:26px 16px 0;padding:18px;border-radius:18px;border:1.5px solid var(--pink);background:var(--pink-deep);font-size:13.5px;color:var(--t2)}
.guar b{display:block;font:800 20px var(--head);color:var(--t1);margin-bottom:6px}
/* ===== web paywall: a long-scroll landing page (web2app), not an app sheet ===== */
.pw{scroll-behavior:smooth}
.pwbar{position:sticky;top:0;z-index:6;display:flex;align-items:center;gap:10px;padding:calc(var(--top) + 6px) 16px 10px;background:var(--bg);border-bottom:1px solid #ffffff12}
.pwbar .logo{flex:1;justify-content:flex-start;font-size:16px}
.pwbar .mini{height:36px;padding:0 14px;border-radius:999px;border:none;background:var(--grad);color:#fff;font:700 13px var(--head);opacity:0;transform:translateY(-4px);transition:opacity .25s,transform .25s;pointer-events:none;white-space:nowrap}
.pw.scrolled .pwbar .mini{opacity:1;transform:none;pointer-events:auto}
.pwbar .x{width:36px;height:36px;border-radius:50%;border:1px solid var(--border);background:transparent;color:var(--t2);display:grid;place-items:center;flex:none}
.eyebrow{display:block;font:700 11.5px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--pink-hi);margin-bottom:10px}
.wsec{padding:34px 18px 0}
.wsec .h2{margin-bottom:6px}
#plans1,#plans2{scroll-margin-top:34px}
.wlead{margin:0 0 18px;color:var(--t2);font-size:14.5px;line-height:1.5}
.pwhero{height:auto;aspect-ratio:4/4.3;max-height:min(470px,60vh)}
.pwhero .txt{bottom:14px;left:18px;right:18px}
.pwhero .eyebrow{margin-bottom:8px}
.pwhero p{font-size:15px}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:6px 18px 0}
.fact{padding:11px 12px;border-radius:14px;background:var(--surface);border:1px solid var(--border);font-size:11.5px;color:var(--t3);letter-spacing:.02em}
.fact b{display:block;margin-top:3px;color:var(--t1);font:700 14px/1.25 var(--head);letter-spacing:0}
.vibe{display:flex;flex-wrap:wrap;gap:6px;padding:10px 18px 0}
.vibe span{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:6px 10px;border-radius:999px;background:var(--pink-dim);color:#F3D6F3;border:1px solid #B62CB555}
.pick{border-radius:24px;padding:22px 14px 18px;background:radial-gradient(ellipse 90% 50% at 50% 0%,#B62CB524,transparent 70%),linear-gradient(180deg,#1C1826,#13111B);border:1px solid #B62CB55c;box-shadow:0 30px 60px -30px #000,0 0 0 4px #B62CB510}
.pick .hd{text-align:center;margin-bottom:18px}
.pick .hd .h2{margin:0;font-size:24px}
.pick .plans{gap:12px}
.plan{padding:16px 14px;gap:3px 12px;background:var(--bg-elev)}
.plan .pn{font-size:16px}
.plan .pp{grid-row:1/3;grid-column:3;font-size:18px}
.plan .pp small{display:block;margin-top:3px;font-size:11.5px;font-weight:500}
.plan .rn{grid-column:2;font-size:12px;line-height:1.35}
.plan .bv{left:14px;transform:none;top:-11px;font-size:10.5px;padding:5px 10px}
.plan.on{box-shadow:0 0 0 3px #B62CB526,0 0 24px -8px #B62CB5}
.today{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;padding:16px 4px 14px;color:var(--t2);border-bottom:1px dashed var(--border);margin-bottom:14px}
.today b{color:var(--t1);font:800 16px var(--head)}
.paybadges{display:flex;gap:5px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.paybadges span{height:24px;padding:0 7px;border-radius:6px;background:#F4F2F8;color:#0A0911;font:700 10px/24px var(--sans);white-space:nowrap;text-align:center;letter-spacing:.02em}
.secure{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;margin-top:12px;font-size:12.5px;color:var(--t2)}
.secure span{display:flex;gap:5px;align-items:center}
.secure svg{color:var(--positive)}
.pick .fine{margin:12px 2px 0}
.wben{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.wben>div{padding:14px;border-radius:18px;background:var(--surface);border:1px solid var(--border);display:flex;flex-direction:column;gap:4px;position:relative}
.wben .gw{margin-bottom:8px;width:36px;height:36px;border-radius:11px}
.wben b{font:700 15px/1.2 var(--head)}
.wben small{color:var(--t2);font-size:12.5px;line-height:1.4}
.wben .tg{position:absolute;top:12px;right:12px;font:700 9.5px var(--sans);letter-spacing:.06em;padding:3px 6px;border-radius:6px;background:var(--pink-dim);color:var(--pink-hi)}

@keyframes fade0{from{opacity:0}}

function emit(name,detail){
  let data={};try{data=snapshot()}catch(e){}
  const d=Object.assign({},detail||{},{data});
  try{window.dispatchEvent(new CustomEvent('ikfunnel:'+name,{detail:d}))}catch(e){}

   <div class="ochecks">${u.checks.map(x=>`<div>${ic('check',17,'currentColor',2.4)}<span>${esc(x)}</span></div>`).join('')}</div>
   ${cta(esc(u.cta),true,'upbuy')}
   <p class="ofine">${otok(u.note)}</p></div></div>
  <div class="sec" style="padding-bottom:max(28px,env(safe-area-inset-bottom,0px));text-align:center"><button class="link" style="width:100%" data-a="upno">${esc(u.decline)}</button>
   <div class="legal">${lnk('Terms of Use',CONFIG.legal.termsUrl)} · ${lnk('Privacy Policy',CONFIG.legal.privacyUrl)}</div></div></div>`};
V[GETAPP]=()=>`<div class="scr" style="gap:16px;padding-top:28px"><div class="emwell" style="width:96px;height:96px;flex:none">${im(refImg())}</div>
  <div style="text-align:center"><h1 class="h1" style="text-align:center;font-size:30px">You're in.<br><span class="gt">${esc(cshort())}</span> is waiting.</h1><p class="sub" style="margin-top:8px">Your story continues in the ChatChi app.</p>${S.addon?`<p class="sub" style="margin-top:6px;display:flex;gap:6px;align-items:center;justify-content:center">${ic('check',14,'currentColor',2.6)} ${esc(CONFIG.upsell.name)} added. Create them in the app.</p>`:''}</div>
  <div class="how" style="margin-top:4px">${[['Download ChatChi: AI Roleplay Chat','From the App Store or Google Play.'],[S.email?'Log in with '+esc(S.email.trim()):'Log in with your checkout email',S.email?'The email you gave us, where Plus is active.':'The one you paid with.'],['Open your story with '+esc(cshort()),'Your scenario and voice are already set.']].map(([x,y],i)=>`<div><i>${i+1}</i><div><b>${x}</b><span>${y}</span></div></div>`).join('')}</div></div>
  <div class="foot">${cta('Open the app',true,'openapp')}<div class="stores"><button class="store" data-a="openapp" aria-label="Download on the App Store"><img src="${BADGE.apple}" alt="Download on the App Store" draggable="false"></button><button class="store" data-a="openapp" aria-label="Get it on Google Play"><img src="${BADGE.play}" alt="Get it on Google Play" draggable="false"></button></div><button class="link" data-a="keepchat">Keep chatting here</button></div>`;
/* paid web chat (get_app "Keep chatting here"); a non-premium user is sent to the paywall by go() */
const GEN=["Ha. You always know what to say.","Wait, tell me more about that.","I'm not letting you change the subject.","Okay, that made me smile.","Stay a little longer?","My turn to ask something."];
V[CHAT]=()=>`<div class="chat"><div class="chead"><span class="av" style="width:40px;height:40px">${im(refImg())}</span><div style="flex:1"><b>${esc(cfull())}</b><small>● online</small></div></div>
  <div class="cbody"><div class="disclose">${esc(cshort())} is an AI character. Fictional, and depicted as an adult.</div>
   <div class="msgs" id="msgs"><div class="sp"></div><div class="bub sys">ChatChi Plus is on.</div>${S.chat.map(m=>`<div class="bub ${m.w}">${m.w==='c'?m.x:esc(m.x)}</div>`).join('')}${S.typing?'<div class="bub c new"><span class="typing"><i></i><i></i><i></i></span></div>':''}</div></div>
  <div class="cfoot"><button class="link" data-a="openapp" style="min-height:32px">${logo(16)} Open the ChatChi app</button>
   <div class="composer"><div class="box"><input id="msg" maxlength="300" placeholder="Message ${esc(cshort())}…"></div><button class="send" data-a="send" aria-label="Send">${ic('send',18)}</button></div></div></div>`;
SCREENS[UPSELL]='upsell_lifetime';SCREENS[GETAPP]='get_app';SCREENS[CHAT]='chat';
function say(text){if(S.typing||!S.premium)return;S.sent++;S.chat.push({w:'u',x:text});S.typing=true;render();persist();
  later(()=>{S.typing=false;S.chat.push({w:'c',x:GEN[S.sent%GEN.length]});render();persist()},1200)}
/* leaving a checkout without paying: CONFIG.declineFlow (FunnelFox's native checkout close does the same) */
function checkoutDeclined(plan){emit('checkout_decline',{plan});go(DECLINE(plan))}
function demoCheckout(plan){const p=CONFIG.plans[plan];S.ckPlan=plan;document.getElementById('demock')?.remove();
  const el=document.createElement('div');el.id='demock';el.setAttribute('role','dialog');el.setAttribute('aria-label','Checkout');
  el.innerHTML=`<div class="iqc"><b>Demo checkout</b><p style="margin:6px 0 14px">ChatChi Plus · ${esc(p.label)} · ${otok(p.price)}</p><div style="display:flex;flex-direction:column;gap:8px"><button class="btn" data-a="ckpay">Pay</button><button class="btn ghost" data-a="ckclose">Close without paying</button></div></div>`;
  phone.appendChild(el)}

const cur=()=>phone.querySelector('.view');
function render(anim){
  const v=document.createElement('div');v.className='view'+(anim&&!RM?' in':'');
  v.innerHTML=nav()+V[S.i]();
  const old=cur();if(old)old.replaceWith(v);else phone.appendChild(v);
  if(S.i===16)runLoad(RM?300:6500,17);
  if(S.i===18)runLoad(RM?300:4000,19);
  if(S.i===19&&S.voice<0&&anim)later(()=>{if(S.voice>=0||S.i!==19)return;S.voice=0;cur().querySelectorAll('.vrow')[0]?.classList.add('on');const b=cur().querySelector('.foot .btn');if(b)b.disabled=false;playVoice(0)},700);
  if(S.i===22)bindPw();
  if(S.i===9){const l=document.getElementById('wp');if(l){l.scrollTop=(S.cage-18)*50;let tt=0;l.addEventListener('scroll',()=>{clearTimeout(tt);tt=setTimeout(()=>{const a=Math.max(18,Math.min(80,Math.round(l.scrollTop/50)+18));S.cage=a;l.querySelectorAll('.it').forEach(x=>x.classList.toggle('on',+x.dataset.age===a))},90)},{passive:true})}}
  if(S.i===CHAT&&S.premium&&!S.chat.length){S.chat=[{w:'c',x:plotNow().msg}];render();return}
  const m=document.getElementById('msgs');if(m)m.scrollTop=m.scrollHeight;
}

function fillTo(n){
  if(n>1&&!S.ai)S.ai='yes';if(n>2&&!S.pref)S.pref='men';if(n>3&&!S.own)S.own='female';if(n>4&&!S.age)S.age='25-34';
  if(n>5&&!S.kind.length)S.kind=['comfort'];if(n>6&&!S.style)S.style='anime';if(n>7&&!S.ref)S.ref=refSet()[0].k;if(n>8&&!S.cname)S.cname='Julian - Prince';
  if(n>10&&!S.traits.length)S.traits=['💖 Kind','🛡️ Protective'];if(n>11&&!S.place)S.place='woods';if(n>12&&!S.mems.length)S.mems=['You grew up together'];
  if(n>14&&!S.uname)S.uname='Alex';if(n>15&&!S.myTr.length)S.myTr=['🧠 Smart'];if(n>17&&S.pick<0)S.pick=0;if(n>19&&S.voice<0)S.voice=0;
  if(n>20&&!S.email)S.email='demo@example.com';if(n>21){S.spun=true;S.disc=CONFIG.spinWin}if(n>=25)S.premium=true;
}

phone.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b||b.disabled)return;
  if(e.target.closest('a'))return;   // legal links open on their own
  const a=b.dataset.a,v=b.dataset.v,f=b.dataset.f;
  switch(a){
    case 'next':
      if(S.i===5)answer('chat_kind',S.kind.join(','));if(S.i===9)answer('char_age',S.cage);
      if(S.i===10)answer('traits',S.traits.map(strip).join(','));if(S.i===12)answer('memories',S.mems.length+S.memOwn.length);
      if(S.i===15)answer('background',count('myTr','myFacts','myOwn'));
      next();break;
    case 'back':back();break;
    case 'ai':S.ai=v;answer('ai_before',v);emit('age_confirm',{method:'legal_line'});next();break;
    case 'pick':S[f]=v;answer({pref:'prefers',own:'gender',age:'age',style:'style'}[f]||f,v);
      if(f==='pref'||f==='style')S.ref='';
      cur().querySelectorAll(`[data-f="${f}"]`).forEach(x=>x.classList.toggle('on',x.dataset.v===v));later(next,RM?0:300);break;
    case 'mpick':{const arr=S[f],i=arr.indexOf(v);if(i<0)arr.push(v);else arr.splice(i,1);
      b.classList.toggle('on',i<0);b.setAttribute('aria-pressed',i<0);const btn=cur().querySelector('.foot .btn');if(btn)btn.disabled=!arr.length;break}
    case 'ref':{S.ref=v;S.cname=b.dataset.n;answer('reference',v);cur().querySelectorAll('.rtile').forEach(x=>x.classList.toggle('on',x.dataset.v===v));later(next,RM?0:300);break}
    case 'cname':{if(!S.cname.trim()){S.emErr=`Give ${pr().him} a name first`;render();break}S.emErr='';next();break}
    case 'uname':{if(!S.uname.trim()){S.emErr=`Tell ${cshort()} your name`;render();break}S.emErr='';next();break}
    case 'chip':{const arr=S[f],i=arr.indexOf(v),max=+b.dataset.max;const own={mems:'memOwn',myFacts:'myOwn'}[f];
      const tot=arr.length+(own?S[own].length:0)+(f==='myTr'?S.myFacts.length+S.myOwn.length:f==='myFacts'?S.myTr.length:0);
      if(i<0&&tot>=max){toast(`Up to ${max}`);break}
      if(i<0)arr.push(v);else arr.splice(i,1);
      cur().querySelectorAll(`.chip[data-f="${f}"]`).forEach(x=>{if(x.dataset.v===v){x.classList.toggle('on',i<0);x.setAttribute('aria-pressed',i<0)}});
      b.closest('.mq')?.classList.add('hold');later(()=>b.closest('.mq')?.classList.remove('hold'),1500);
      const btn=cur().querySelector('.foot .btn');if(btn)btn.disabled=!(S.i===10?S.traits.length:S.i===12?count('mems','memOwn'):count('myTr','myFacts','myOwn'));break}
    case 'addown':{const inp=cur().querySelector(`input[data-f="draft_${f}"]`),x=(inp&&inp.value||'').trim();if(!x){inp?.focus();break}
      const max=f==='memOwn'?4:8,tot=f==='memOwn'?count('mems','memOwn'):count('myTr','myFacts','myOwn');if(tot>=max){toast(`Up to ${max}`);break}
      S[f].push(x);render();break}
    case 'unown':S[f].splice(+v,1);render();break;
    case 'place':S.place=v;answer('meet_place',v);cur().querySelectorAll('[data-a="place"]').forEach(x=>x.classList.toggle('on',x.dataset.v===v));b.closest('.mq')?.classList.add('hold');later(next,RM?0:350);break;
    case 'plotp':if(S.plot>0){S.plot--;render()}break;
    case 'plotn':if(S.plot<3){S.plot++;render()}break;
    case 'plotsel':S.pick=S.plot;answer('scenario',S.pick+1);next();break;
    case 'voice':{const k=+v;S.voice=k;cur().querySelectorAll('.vrow').forEach((x,j)=>x.classList.toggle('on',j===k));const btn=cur().querySelector('.foot .btn');if(btn)btn.disabled=false;playVoice(k);break}
    case 'vtab':if(vgOf()!==v){stopVoice();S.vg=v;S.voice=-1;render();answer('voice_tab',v)}break;
    case 'voicesel':answer('voice',vgOf()+'-'+(S.voice+1));next();break;
    case 'emailgo':{const x=S.email.trim();if(!EMRE.test(x)){S.emErr='Please enter a valid email';render();document.getElementById('em')?.focus();break}
      S.email=x;S.emErr='';emit('lead',{method:'email',placement:'pre_spin'});next();break}
    case 'spin':{if(S.spun)break;S.spun=true;S.disc=CONFIG.spinWin;emit('spin',{result:S.disc});const d=document.getElementById('disc');if(d)d.style.transform=`rotate(${spinTo()}deg)`;b.disabled=true;
      later(()=>{persist();render()},RM?50:4400);break}
    case 'claim':emit('discount_claim',{discount:S.disc});next();break;
    case 'plan':S.plan=v;paintPlan();emit('plan_select',{plan:v,price:CONFIG.plans[v].price});break;
    case 'agree':S.agree=!S.agree;S.agErr=false;{const r=cur(),l=r.querySelector('.agree');l.classList.toggle('on',S.agree);l.classList.remove('bad');b.setAttribute('aria-checked',S.agree);b.innerHTML=S.agree?ic('check',16,'#1a0f1c',3):'';r.querySelector('.agerr')?.remove()}break;
    case 'buy':{if(!S.agree){S.agErr=true;const r=cur(),l=r.querySelector('.agree');l.classList.add('bad');if(!r.querySelector('.agerr'))l.insertAdjacentHTML('afterend','<p class="agerr" role="alert">Please accept the terms to continue.</p>');l.scrollIntoView({behavior:RM?'auto':'smooth',block:'center'});break}checkout(visPlan());break}
    case 'ckpay':{document.getElementById('demock')?.remove();window.IkFunnel.completePurchase(S.ckPlan);break}
    case 'ckclose':{document.getElementById('demock')?.remove();checkoutDeclined(S.ckPlan);break}
    case 'upbuy':emit('upsell_accept',{plan:'addon'});checkout('addon');break;
    case 'upno':emit('upsell_decline');go(GETAPP);break;
    case 'keepchat':go(CHAT);break;
    case 'send':{const m=document.getElementById('msg');if(m&&m.value.trim())say(m.value.trim());else m?.focus();break}
    case 'openapp':openApp();break;
  }
});
phone.addEventListener('input',e=>{
  const f=e.target.dataset.f;if(!f||f.startsWith('draft_'))return;
  S[f]=e.target.value;const btn=cur().querySelector('.foot .btn');
  if(f==='email'){const ok=EMRE.test(S.email.trim());if(btn)btn.disabled=!S.email.trim();if(S.emErr&&ok){S.emErr='';cur().querySelector('.box')?.classList.remove('bad');cur().querySelector('.emerr')?.remove()}}
  if(f==='uname'&&btn)btn.disabled=!S.uname.trim();
});
phone.addEventListener('keydown',e=>{if(e.key!=='Enter')return;const id=e.target.id,f=e.target.dataset.f||'';
  if(id==='msg')cur().querySelector('[data-a="send"]')?.click();
  else if(id==='em'||id==='un'||id==='cn'){e.preventDefault();cur().querySelector('.foot .btn')?.click()}
  else if(f.startsWith('draft_')){e.preventDefault();cur().querySelector(`[data-a="addown"][data-f="${f.slice(6)}"]`)?.click()}});

/* Host API: the page embedding this funnel can complete a purchase or read the picks. */
window.IkFunnel=Object.assign(window.IkFunnel||{},{config:CONFIG,data:snapshot,
  completePurchase:(plan)=>{if(plan&&CONFIG.plans[plan])S.plan=plan;if(S.plan==='addon')S.addon=true;AFTER=CONFIG.plans[S.plan]&&CONFIG.plans[S.plan].oneTime?26:25;S.premium=true;emit('purchase_complete',{plan:S.plan});go(AFTER);later(()=>toast(S.plan==='addon'?CONFIG.upsell.name+' added.':'ChatChi Plus is on. Enjoy.'),1600)}});
if(DEBUG)window.IkFunnel.go=n=>{clearT();fillTo(n);go(n)};
if(DEBUG){const m=location.hash.match(/s=?([0-9]+)/);if(m&&V[+m[1]]){fillTo(+m[1]);S.i=+m[1]}}
/* standalone reload: resume the same screen and state */
if(typeof ffGo!=='function'&&!(DEBUG&&location.hash))try{const x=JSON.parse(sessionStorage.getItem(DKEY)||'null');if(x&&V[x.i])S=Object.assign(S,x,{typing:false})}catch(e){}
if(S.i===CHAT&&!S.premium)S.i=S.email?22:20;
{let ref='';try{ref=document.referrer?new URL(document.referrer).hostname:''}catch(e){}emit('funnel_start',{referrer:ref})}
render();viewed();
</script>
</body>
