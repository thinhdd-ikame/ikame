<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A0911">
<title>ChatChi: AI Roleplay Chat · Romance Stories</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600&family=Lora:ital,wght@0,500;0,600;1,400;1,500&display=swap">
<style>
:root{
  color-scheme:dark;
  --ground:#06050B;
  --bg:#0A0911;--bg-elev:#12101B;--surface:#17151F;--surface-2:#221F2D;--border:#2D293B;
  --t1:#F4F2F8;--t2:#A7A2B7;--t3:#6F6A82;
  --pink:#B62CB5;--pink-hi:#DA5FD9;--pink-dim:#B62CB52E;--pink-deep:#261230;
  --grad-a:#9A2ACB;--grad-b:#D82F99;--grad:linear-gradient(135deg,var(--grad-a),var(--grad-b));
  --amber:#F2B35B;--amber-dim:#F2B35B26;--cream:#F6E7CF;--negative:#F0705F;
  --head:"Plus Jakarta Sans","Segoe UI",system-ui,sans-serif;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --serif:"Lora",Georgia,"Times New Roman",serif;
  --paper:repeating-radial-gradient(circle at 20% 30%,#ffffff05 0 1px,transparent 1px 3px),repeating-radial-gradient(circle at 70% 60%,#F2B35B06 0 1px,transparent 1px 4px);
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);background-image:radial-gradient(ellipse 60% 40% at 30% 0%,#240F2C 0%,transparent 70%);color:var(--t1);font:15px/1.45 var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--pink-hi);outline-offset:2px}
svg{display:block}

.phone{container:app/inline-size;position:relative;width:100%;max-width:480px;height:100vh;height:100dvh;margin:0 auto;background:var(--bg);overflow:hidden;isolation:isolate}
@media (min-width:520px){.phone{border-inline:1px solid #2A2536}}
#amb{position:absolute;inset:0;width:100%;height:100%;z-index:0;display:block;pointer-events:none}
.stage{position:absolute;inset:0;z-index:1;overflow:hidden}
.view{position:absolute;inset:0;padding-top:calc(env(safe-area-inset-top,0px) + 8px);display:flex;flex-direction:column}
.view.paper{background-image:var(--paper)}
.view.out{animation:vout .22s ease forwards;pointer-events:none}
.view.in{animation:vin .32s ease both}
@keyframes vout{to{opacity:0}}
@keyframes vin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.nav{height:44px;flex:none;display:flex;align-items:center;gap:12px;padding:0 16px;position:relative;z-index:3}
.iconbtn{width:44px;height:44px;border-radius:50%;border:none;background:transparent;display:grid;place-items:center;color:var(--t2);flex:none}
.iconbtn:hover{background:var(--surface)}
.prog{flex:1;height:4px;border-radius:2px;background:var(--surface-2);overflow:hidden}
.prog span{display:block;height:100%;background:var(--pink);border-radius:2px;transition:width .35s ease}
.navspacer{width:44px}
.scr{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 20px 12px;display:flex;flex-direction:column;gap:16px;position:relative;z-index:1;scrollbar-width:none}
.scr::-webkit-scrollbar{display:none}
.scr.center{justify-content:center}
.foot{flex:none;padding:10px 20px max(20px,calc(env(safe-area-inset-bottom,0px) + 12px));display:flex;flex-direction:column;gap:10px;position:relative;z-index:2}
.foot .note,.note{font-size:12px;color:var(--t3);text-align:center;text-wrap:balance}

.h1{font:800 29px/1.12 var(--head);letter-spacing:-.02em;margin:0;text-wrap:balance}
.lead{color:var(--t2);margin:0;font-size:15px;text-wrap:pretty}
.badge{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:var(--pink-dim);color:var(--pink-hi);font:600 12px/1 var(--sans)}
.badge.amber{background:var(--amber-dim);color:var(--amber)}

.btn{height:54px;border-radius:999px;border:none;background:var(--pink);color:#fff;font:600 16px/1 var(--sans);width:100%;display:flex;align-items:center;justify-content:center;gap:10px;transition:transform .12s ease,opacity .2s;flex:none}
.btn:active{transform:scale(.98)}
.btn[disabled]{background:var(--surface-2);color:var(--t3);cursor:not-allowed}
.btn.ghost{background:var(--surface-2);color:var(--t1);border:1px solid var(--border)}
.btn.outline{background:transparent;color:var(--t2);border:1px solid var(--border)}
.btn.light{background:#fff;color:#0A0911}
.btn.main:not([disabled]){position:relative;overflow:hidden;box-shadow:0 10px 30px -12px #B62CB5cc}
.btn.main:not([disabled])::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:0;background:linear-gradient(100deg,transparent,#ffffff55,transparent);transform:translateX(-150%) skewX(-20deg);animation:sheen 4.5s ease-in-out 1.2s infinite}
@keyframes sheen{0%{transform:translateX(-150%) skewX(-20deg)}28%,100%{transform:translateX(320%) skewX(-20deg)}}
.link{background:none;border:none;color:var(--t2);font-size:14px;padding:6px;text-align:center;min-height:44px}
.link:hover{color:var(--t1)}
.link.pink{color:var(--pink-hi);font-weight:500}
.legal{display:flex;justify-content:center;gap:14px;font-size:12px;color:var(--t3)}
.legal a{color:inherit;text-decoration:none;min-height:44px;display:inline-flex;align-items:center;padding:0 4px}
.legal a[href]{text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--border)}
.note a{color:inherit}
.logo{display:flex;align-items:center;gap:8px;font:800 17px var(--head)}
.logo small{font:500 12px var(--sans);color:var(--amber);border:1px solid #F2B35B55;border-radius:999px;padding:3px 8px}

/* options */
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:18px;background:var(--surface);border:1px solid var(--border);text-align:left;width:100%;transition:border-color .15s,background .15s;position:relative;overflow:hidden}
.opt:hover{border-color:#47405c}
.opt .em{font-size:20px;width:26px;text-align:center;flex:none;position:relative}
.opt .lbl{flex:1;font-weight:500;font-size:16px;position:relative}
.opt.on{border-color:var(--pink);background:linear-gradient(0deg,var(--pink-dim),var(--pink-dim)),var(--surface)}
.opt.tall{min-height:92px}
.opt .sil{position:absolute;right:0;top:0;bottom:0;width:48%;opacity:.7;-webkit-mask-image:linear-gradient(90deg,transparent,#000 60%);mask-image:linear-gradient(90deg,transparent,#000 60%)}
.opt .sil svg{width:100%;height:100%;filter:blur(3px)}
.opt .sil.duo{display:flex;width:56%}.opt .sil.duo>span{position:relative;flex:1;overflow:hidden}.opt .sil.duo>span+span{margin-left:-26%;-webkit-mask-image:linear-gradient(90deg,transparent,#000 45%);mask-image:linear-gradient(90deg,transparent,#000 45%)}
.opt.tall.on{background:var(--pink)}
.opt.tall.on .lbl{color:#fff}
.field{display:flex;flex-direction:column;gap:8px}
.field label,.flabel{font:500 13px/1 var(--sans);color:var(--t2)}
.box{height:56px;border-radius:14px;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;padding:0 8px 0 16px;gap:10px;color:var(--t3)}
.box:focus-within{border-color:var(--pink)}
.box input,.box select{flex:1;min-width:0;height:100%;background:transparent;border:none;outline:none;color:var(--t1);font:400 16px var(--sans)}
.box select option{background:var(--surface);color:var(--t1)}
.shuf{width:44px;height:44px;border-radius:10px;border:none;background:var(--surface-2);color:var(--pink-hi);display:grid;place-items:center;flex:none}
.err{font-size:13px;color:var(--negative)}
.hint{font-size:13px;color:var(--t3)}
.fadein{animation:fi .3s ease}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.years{height:150px;overflow-y:auto;scroll-snap-type:y mandatory;border-radius:18px;background:var(--surface);border:1px solid var(--border);padding:53px 0;scrollbar-width:none;flex:none}
.years::-webkit-scrollbar{display:none}
.years button{display:block;width:100%;height:44px;border:none;background:none;scroll-snap-align:center;font:400 20px/44px var(--sans);color:var(--t3);font-variant-numeric:tabular-nums}
.years button:hover{color:var(--t2)}
.years button.on{color:var(--t1);font-weight:600;background:var(--surface-2)}

/* covers */
.cover{position:relative;overflow:hidden;border-radius:6px 12px 12px 6px;background:#1a1220;box-shadow:inset 6px 0 10px -6px #0009}
.cover>svg.art{position:absolute;inset:0;width:100%;height:100%}
img.pic{display:block;user-select:none;-webkit-user-drag:none}
.cover>img.art,.scene>img.art,.ccard>img.art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:inherit}
.cover>img.art.lead{top:16%;height:84%;object-position:50% 0;-webkit-mask-image:linear-gradient(180deg,transparent,#000 24%);mask-image:linear-gradient(180deg,transparent,#000 24%)}
.scene>img.art{object-position:50% 58%}
.av{position:relative}
.av img.face{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 0;transform:scale(1.9);transform-origin:50% 14%}
.opt .sil img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 18%;filter:blur(1.5px) brightness(.62) saturate(.75)}
.cover.ink>img.art{animation:inkart 3.2s ease .4s both}
.cover .cshade{position:absolute;inset:0;background:linear-gradient(180deg,#0A091199 0%,transparent 30%,transparent 50%,#0A0911ee 100%)}
.cover{container-type:inline-size}
.cover .cband{position:absolute;top:8%;left:0;right:0;white-space:nowrap;overflow:hidden;text-align:center;font:600 7.5px/1 var(--sans);letter-spacing:.22em;color:#F6E7CFaa;text-transform:uppercase}
.cover .ctitle{position:absolute;top:13%;left:8%;right:8%;text-align:center;font:600 18px/1.1 var(--serif);color:var(--cream);text-shadow:0 2px 12px #000;text-wrap:balance}
.cover .ctitle .l{display:inline-block}
.cover.ink .ctitle .l{animation:ink .5s ease both}
.cover.ink>svg.art,.cover.ink .por{animation:inkart 3.2s ease .4s both}
@keyframes ink{from{color:transparent;text-shadow:0 0 12px #F2B35B}to{}}
@keyframes inkart{from{opacity:0}to{opacity:1}}
.cover .por{position:absolute;left:50%;bottom:0;width:66%;transform:translateX(-50%)}
.cover .por svg{width:100%;height:auto}
.cover .ctags{position:absolute;left:8px;right:8px;bottom:9px;display:flex;gap:5px;justify-content:center;flex-wrap:wrap}
.cover .ctags span{font:600 10px/1 var(--sans);padding:5px 8px;border-radius:999px;background:#0A0911cc;border:1px solid #F2B35B55;color:var(--cream)}
@container (max-width:179px){.cover .cband .cb2{display:none}}
.tc .cover .cband .cb2{display:none}
@container (max-width:90px){.cover .cband{display:none}.cover .ctitle{top:auto;bottom:9%;font-size:11px}}
.cover .spine{position:absolute;left:0;top:0;bottom:0;width:5px;background:linear-gradient(90deg,#0006,transparent)}

.hookhero{position:relative;height:214px;flex:none}
.hookhero .side{position:absolute;top:22px;width:118px;height:165px;opacity:.8}
.hookhero .side.l{left:14px;transform:rotate(-11deg)}
.hookhero .side.r{right:14px;transform:rotate(11deg)}
.hookhero .book3d{position:absolute;left:50%;top:0;transform:translateX(-50%)}
.pulse{position:absolute;left:50%;bottom:4px;transform:translateX(-50%);display:flex;gap:3px;align-items:center;height:28px;padding:0 10px;border-radius:999px;background:#0A0911cc;border:1px solid #B62CB577;z-index:3}
.hookhero .book3d .ctags{display:none}
.pulse i{display:block;width:3px;border-radius:2px;background:var(--pink-hi);animation:wv 1s ease-in-out infinite}

/* 3D hero: the book */
.book3d{position:relative;perspective:900px;perspective-origin:50% 40%;flex:none;margin:0 auto}
.book3d.fadeup{animation:hfade .4s ease both}
@keyframes hfade{from{opacity:0}}
.bk-in{position:absolute;inset:0;transform-style:preserve-3d}
.bk-in.land{animation:hland 1.5s cubic-bezier(.2,.8,.2,1) both}
@keyframes hland{from{transform:scale(.72) rotateX(12deg) rotateY(-120deg)}to{transform:none}}
.bk{position:absolute;left:50%;top:50%;transform-style:preserve-3d;will-change:transform}
.bk>div{position:absolute;left:0;top:0}
.bk-back{background:linear-gradient(135deg,#3A1420,#1a0c14);border-radius:6px 12px 12px 6px;box-shadow:0 30px 50px -18px #000}
.bk-page{background:linear-gradient(90deg,#d9c6a4,#F6E7CF);border-radius:3px 10px 10px 3px}
.bk-spine{background:linear-gradient(90deg,#2a0f1a,#5a1e30,#2a0f1a);transform-origin:0 50%}
.bk-edge{background:repeating-linear-gradient(90deg,#e9dcc2 0 1px,#cdb994 1px 2px);transform-origin:0 50%}
.bk-inner{background:radial-gradient(circle at 50% 62%,#F2B35B55,transparent 55%),linear-gradient(180deg,#F6E7CF,#E6D2AE);border-radius:3px 10px 10px 3px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:#3a2418;text-align:center;padding:14px}
.bk-inner b{font:600 15px/1.2 var(--serif)}
.bk-inner i{font:italic 400 11px/1.3 var(--serif);color:#6b4a30}
.bk-front{transform-origin:0 50%;transition:transform .9s cubic-bezier(.5,.1,.3,1);backface-visibility:hidden;-webkit-backface-visibility:hidden}
.r9book{flex:none;position:relative;z-index:1}
.bk-front.open{transform:rotateY(-158deg)}
.bglow{position:absolute;left:50%;top:55%;width:120%;height:80%;transform:translate(-50%,-50%);background:radial-gradient(ellipse,#F2B35B38,transparent 65%);filter:blur(10px);pointer-events:none}

/* trope grid */
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tc{position:relative;height:132px;padding:0;border:1.5px solid var(--border);border-radius:8px 14px 14px 8px;background:var(--surface);overflow:hidden;text-align:left;transition:transform .25s ease,box-shadow .25s,border-color .2s}
.tc .cover{position:absolute;inset:0;border-radius:0}
.tc .cover .ctitle{top:auto;bottom:12px;font-size:16px}
.tc .em{position:absolute;top:8px;left:10px;font-size:18px;z-index:2}
.tc.on{border-color:var(--pink);transform:translateY(-6px);box-shadow:0 14px 26px -10px #B62CB5aa}
.tc.on::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,#ffffff40 50%,transparent 70%);animation:flick .6s ease both;z-index:3}
@keyframes flick{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.tc.ad{box-shadow:0 0 0 3px var(--amber-dim);border-color:#F2B35B88}
.tc.other{display:grid;place-items:center;border-style:dashed;background:var(--surface)}
.tc.other span{font-weight:600;color:var(--t2);display:flex;gap:8px;align-items:center}

/* voice rows */
.vrow{display:flex;flex-direction:column;gap:0;border-radius:18px;background:var(--surface);border:1px solid var(--border);overflow:hidden;transition:border-color .15s}
.vrow.on{border-color:var(--pink);background:linear-gradient(0deg,var(--pink-dim),var(--pink-dim)),var(--surface)}
.vrow .top{display:flex;align-items:center;gap:12px;padding:10px 10px 10px 16px}
.vrow .sel{flex:1;display:flex;align-items:center;gap:12px;background:none;border:none;text-align:left;padding:4px 0;min-width:0}
.vrow .sel .em{font-size:19px}
.vrow .sel .lbl{font-weight:500;font-size:16px;flex:1}
.play{width:44px;height:44px;border-radius:50%;border:none;background:var(--surface-2);color:var(--pink-hi);display:grid;place-items:center;flex:none}
.vrow.playing .play{background:var(--pink);color:#fff}
.wf{display:inline-flex;gap:2px;align-items:center;height:22px}
.wf i{display:block;width:3px;border-radius:2px;background:var(--t3)}
.playing .wf i,.wf.live i{background:var(--pink-hi);animation:wv .9s ease-in-out infinite}
@keyframes wv{0%,100%{transform:scaleY(.4)}50%{transform:scaleY(1)}}
.vcap{padding:0 16px 12px;font:italic 400 15px/1.35 var(--serif);color:var(--cream)}

/* candle cards */
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cc{height:150px;border-radius:18px;background:var(--surface);border:1.5px solid var(--border);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:10px;padding:12px 10px 14px;text-align:center}
.cc .lbl{font-weight:600;font-size:15px}
.cc.on{border-color:var(--pink);background:linear-gradient(0deg,var(--pink-dim),var(--pink-dim)),var(--surface)}
.cc .fl{transform-origin:50% 100%;animation:flame 1.6s ease-in-out infinite}
@keyframes flame{0%,100%{transform:scale(1,1)}50%{transform:scale(.92,1.08) skewX(2deg)}}

/* trust */
.promise{display:flex;gap:14px;align-items:center;padding:16px 0;border-top:1px solid var(--border)}
.promise:first-child{border-top:none}
.promise .well{width:40px;height:40px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;flex:none}
.bignum{font:800 50px/1 var(--head);letter-spacing:-.03em;color:var(--pink-hi)}
.ph{border:1.5px dashed var(--border);border-radius:16px;padding:14px;color:var(--t3);font-size:13px}
.stars{color:var(--amber);letter-spacing:3px;font-size:18px}

/* loading */
.steps{display:flex;flex-direction:column;gap:12px}
.step .top{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--t2);margin-bottom:6px;gap:10px}
.step .pct{font-variant-numeric:tabular-nums;color:var(--t3);display:flex;gap:6px;align-items:center}
.step.done .top{color:var(--t1)}
.step.done .pct{color:var(--pink-hi)}
.bar{height:4px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.bar span{display:block;height:100%;background:var(--pink);width:0;transition:width .12s linear}
.heaq{position:absolute;left:14px;right:14px;bottom:26px;z-index:5;padding:14px;border-radius:18px;background:var(--bg-elev);border:1px solid #F2B35B66;box-shadow:0 16px 40px -10px #000;display:flex;flex-direction:column;gap:10px;animation:up .35s cubic-bezier(.2,.8,.2,1)}
.heaq b{font:700 16px var(--head)}
.heaq .row{display:flex;gap:8px}
.heaq .row button{flex:1;min-height:44px;padding:11px 8px;border-radius:12px;border:1px solid var(--border);background:var(--surface);font-weight:500;font-size:14px}
.heaq .row button.on{border-color:var(--amber);background:var(--amber-dim)}

/* reveal */
.vpill{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 14px;border-radius:16px;background:var(--surface);border:1px solid var(--border)}
.vpill svg.ic{color:var(--amber)}
.vpill span{flex:1;font-weight:500;font-size:14px}
.vpill small{color:var(--t3);font-size:12px}
.vpill button{border:none;background:var(--surface-2);color:var(--pink-hi);padding:7px 12px;border-radius:999px;font-weight:600;font-size:13px;display:flex;gap:6px;align-items:center}
.alts{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap}
.alts .ol{font-size:12px;color:var(--t3)}
.alt{display:flex;gap:8px;align-items:center;min-height:44px;padding:4px 12px 4px 4px;border-radius:12px;background:var(--surface);border:1px solid var(--border);font-size:13px;font-weight:500}
.alt .cover{width:26px;height:36px;border-radius:2px 5px 5px 2px}
.alt .cover .ctitle,.alt .cover .cband{display:none}

/* chat */
.chat{position:absolute;inset:0;top:env(safe-area-inset-top,0px);display:flex;flex-direction:column}
.chead{flex:none;display:flex;align-items:center;gap:10px;padding:6px 8px 6px 16px;border-bottom:1px solid var(--border);position:relative;z-index:3;background:var(--bg)}
.av{width:38px;height:38px;border-radius:50%;overflow:hidden;flex:none;border:1.5px solid #F2B35B66}
.av svg{width:100%;height:100%}
.chead .who{flex:1;min-width:0}
.chead .who b{display:block;font:700 15px/1.2 var(--head);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chead .who span{display:block;font-size:12px;color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.disclose{flex:none;position:relative;z-index:2;padding:7px 14px;background:#17151F;color:var(--t3);font-size:11px;text-align:center;line-height:1.35;border-bottom:1px solid var(--border)}
.spath{flex:none;display:flex;align-items:center;gap:10px;padding:7px 16px;font-size:12px;color:var(--t2);background:var(--bg);border-bottom:1px solid var(--border)}
.spath b{color:var(--amber);font-weight:600;white-space:nowrap}
.spath .bar{flex:1}
.spath .bar span{background:linear-gradient(90deg,var(--amber),var(--pink));transition:width .8s ease}
.scene{flex:none;position:relative;height:128px;overflow:hidden}
.scene.big{height:150px}
.scene>svg.art{position:absolute;inset:0;width:100%;height:100%}
.scene::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,var(--bg))}
.scene .slabel{position:absolute;left:14px;top:10px;z-index:1;font:600 11px/1 var(--sans);letter-spacing:.06em;padding:5px 9px;border-radius:999px;background:#0A0911aa;color:var(--cream)}
.nbar{position:absolute;left:12px;right:12px;bottom:8px;z-index:2;display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:999px;background:#0A0911d9;border:1px solid #F2B35B44}
.nbar .pp{width:34px;height:34px;border-radius:50%;border:none;background:var(--amber);color:#1a1008;display:grid;place-items:center;flex:none}
.nbar .nlbl{flex:1;min-width:0;font-size:12px;color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nbar .sm{border:1px solid var(--border);background:var(--surface);color:var(--t2);border-radius:999px;padding:5px 9px;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:4px}
.nbar .wf i{background:var(--amber)}
.nbar .pp,.nbar .sm,.lockpill,.vpill button{position:relative}
.nbar .pp::before,.nbar .sm::before,.lockpill::before,.vpill button::before{content:"";position:absolute;inset:-10px -3px}
.nbar .sm{min-width:38px;min-height:32px;justify-content:center}.nbar .sm::before{inset:-6px -3px}.nbar .pp::before{inset:-5px}
.msgs{flex:1;overflow-y:auto;padding:10px 16px;display:flex;flex-direction:column;gap:9px;scrollbar-width:none;position:relative;z-index:1}
.msgs::-webkit-scrollbar{display:none}
.msgs .spacer{flex:1}
.bub{padding:10px 14px;border-radius:18px;max-width:84%;font-size:15px;line-height:1.4;animation:fi .3s ease}
.bub.c{align-self:flex-start;background:var(--surface-2);border-bottom-left-radius:6px}
.bub.u{align-self:flex-end;background:var(--pink);color:#fff;border-bottom-right-radius:6px}
.bub.n{align-self:stretch;max-width:none;background:none;border-left:2px solid #F2B35B77;border-radius:0;padding:2px 0 2px 12px;font:italic 400 15px/1.5 var(--serif);color:var(--t3);cursor:pointer}
.bub.n .w{transition:color .2s}
.bub.n .w.r{color:var(--cream)}
.bub.n .w.k{color:#1a1008;background:var(--amber);border-radius:3px;box-shadow:0 0 0 2px var(--amber)}
.bub.n.done{color:var(--cream)}
.bub.sys{align-self:center;background:transparent;color:var(--t3);font-size:12px;padding:2px;text-align:center}
.typing{display:inline-flex;gap:4px;padding:3px 0}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--t3);animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{50%{opacity:.3}}
.ideas{flex:none;display:flex;flex-direction:column;gap:6px;padding:0 16px 8px;position:relative;z-index:1}
.ideas .ih{font-size:12px;color:var(--t3);display:flex;gap:6px;align-items:center}
.ideas button{min-height:44px;padding:9px 13px;border-radius:14px;background:var(--surface);border:1px solid var(--border);text-align:left;font-size:14px;color:var(--t2)}
.ideas button:hover{border-color:var(--pink);color:var(--t1)}
.cfoot{flex:none;border-top:1px solid var(--border);padding:8px 14px max(14px,calc(env(safe-area-inset-bottom,0px) + 8px));display:flex;flex-direction:column;gap:7px;background:var(--bg);position:relative;z-index:2}
.frow{display:flex;justify-content:space-between;align-items:center;gap:8px}
.counter{font-size:12px;color:var(--t3);font-weight:500;font-variant-numeric:tabular-nums}
.counter.out{color:var(--negative)}
.lockpill{display:inline-flex;gap:6px;align-items:center;padding:5px 11px;border-radius:999px;border:1px solid #F2B35B66;background:var(--amber-dim);color:var(--amber);font-size:12px;font-weight:600}
.composer{display:flex;gap:8px;align-items:center}
.composer .box{flex:1;height:46px;border-radius:999px;padding:0 16px}
.send{width:46px;height:46px;border-radius:50%;border:none;background:var(--pink);color:#fff;display:grid;place-items:center;flex:none}
.send[disabled]{background:var(--surface-2);color:var(--t3)}
.mtoast{position:absolute;z-index:6;top:calc(env(safe-area-inset-top,0px) + 8px);right:12px;left:12px;display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:14px;background:var(--surface);border:1px solid var(--amber);font-size:13px;box-shadow:0 12px 30px -10px #000;animation:mt 3.8s ease forwards;transform-origin:90% 0}
.mtoast svg{color:var(--amber);flex:none}
@keyframes mt{0%{opacity:0;transform:translate(20px,-10px) scale(.6)}10%,85%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-6px)}}
.limit{align-self:stretch;margin-top:4px;padding:16px;border-radius:18px;border:1.5px solid var(--pink);background:#17151FF2;display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center;animation:fi .4s ease}
.limit h3{margin:0;font:800 20px/1.2 var(--head)}
.limit p{margin:0;color:var(--t2);font-size:14px}
.limit .crown{color:var(--pink-hi)}

/* cliffhanger */
.cliff{font:italic 400 19px/1.45 var(--serif);color:var(--cream);margin:0;text-wrap:pretty}
.flipw{width:150px;height:204px;perspective:900px;align-self:center;flex:none;border:none;background:none;padding:0}
.flip{position:relative;display:block;width:100%;height:100%;transform-style:preserve-3d;transition:transform 1s cubic-bezier(.3,1.25,.5,1)}
.flip.on{transform:rotateY(180deg)}
.flip .face{position:absolute;inset:0;border-radius:16px;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:1px solid var(--border)}
.flip .face.blank{background:var(--surface);display:grid;place-items:center;background-image:var(--paper)}
.flip .face.blank span{display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--t2);font-weight:600;font-size:13px}
.flip .face.rev{transform:rotateY(180deg);box-shadow:0 0 50px -6px #F2B35B99;border-color:#F2B35B99}
.ccard{position:relative;width:100%;height:100%;background:#1a1220}
.ccard>svg.art{position:absolute;inset:0;width:100%;height:100%}
.ccard::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 35%,#0A0911f0)}
.ccard .cn{position:absolute;top:10px;left:10px;z-index:1;font:600 10px/1 var(--sans);letter-spacing:.14em;color:var(--amber);text-transform:uppercase}
.ccard .ctt{position:absolute;left:10px;right:10px;bottom:12px;z-index:1;font:600 15px/1.2 var(--serif);color:var(--cream)}
.ccard .ctt small{display:block;font:500 10px var(--sans);color:var(--t2);margin-top:4px}
.gatecard .ccard .cn{top:7px;left:7px;font-size:7.5px;letter-spacing:.1em}.gatecard .ccard .ctt{left:7px;right:7px;bottom:7px;font-size:11px}.gatecard .ccard .ctt small{font-size:8px;margin-top:2px}
.push .thumb .ccard .cn,.push .thumb .ccard .ctt{display:none}
.mprog{padding:12px 14px;border-radius:16px;background:var(--surface);border:1px solid var(--border);display:flex;flex-direction:column;gap:8px}
.mprog .row{display:flex;justify-content:space-between;font-weight:600;font-size:14px;font-variant-numeric:tabular-nums}
.mprog .row span{color:var(--amber)}
.mprog .bar span{background:var(--amber);transition:width .8s ease}

/* sheets, paywall */
.dim{position:absolute;inset:0;background:#05040ACC;z-index:7}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:8;background:var(--bg-elev);border-radius:28px 28px 0 0;border-top:1px solid var(--border);padding:10px 20px max(24px,calc(env(safe-area-inset-bottom,0px) + 14px));display:flex;flex-direction:column;gap:12px;animation:up .35s cubic-bezier(.2,.8,.2,1)}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--border);align-self:center}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.push{display:flex;gap:10px;padding:12px;border-radius:18px;background:#ffffff12;border:1px solid #ffffff1a;align-items:center}
.push .thumb{width:32px;height:42px;border-radius:5px;overflow:hidden;flex:none}
.push small{color:var(--t2);display:block;font-size:12px}
.pw{position:absolute;inset:0;z-index:8;background:var(--bg);display:flex;flex-direction:column;padding-top:calc(env(safe-area-inset-top,0px) + 8px);animation:fi .3s ease;background-image:var(--paper)}
.pwtop{display:flex;justify-content:space-between;align-items:center;padding:4px 18px 0;flex:none;min-height:48px}
.closex{width:44px;height:44px;border-radius:50%;background:var(--surface-2);border:none;display:grid;place-items:center;color:var(--t2)}
.pwtop .link{font-size:13px}
.pwhero{width:92px;height:124px;align-self:center;border-radius:12px;overflow:hidden;box-shadow:0 0 40px -6px #F2B35B99;border:1px solid #F2B35B88;flex:none}
.benefits{display:flex;flex-direction:column;gap:10px}
.benefits div{display:flex;gap:12px;align-items:center;font-size:14px;font-weight:500}
.benefits svg{color:var(--pink-hi);flex:none}
.benefits svg *,.limit .crown *,.shuf svg *{stroke:url(#cgrad)}
svg .lg{fill:url(#cgrad-logo)}
.plans{display:flex;flex-direction:column;gap:12px;flex:none;margin-top:6px}
.plan{position:relative;padding:14px 16px;border-radius:18px;border:1.5px solid var(--border);background:var(--surface);text-align:left;display:grid;grid-template-columns:24px 1fr auto;gap:2px 12px;align-items:center;width:100%}
.plan .rd{width:22px;height:22px;border-radius:50%;border:2px solid var(--border);grid-row:1/3;display:grid;place-items:center}
.plan.on{border-color:var(--pink);background:var(--pink-deep);box-shadow:0 0 22px -8px #B62CB5}
.plan.on .rd{background:var(--grad);border-color:transparent}
.plan .pn{font:800 17px var(--head)}
.plan .pp{font:800 19px/1.1 var(--head);text-align:right;font-variant-numeric:tabular-nums}
.plan .pp small{font:500 11px var(--sans);color:var(--t2)}
.plan .rn{font-size:11.5px;color:var(--t2);grid-column:2/4}
.plan .bv{position:absolute;top:-10px;left:50%;transform:translateX(-50%);font:700 11px/1 var(--head);letter-spacing:.06em;background:var(--grad);color:#fff;padding:5px 12px;border-radius:999px;white-space:nowrap}
.h2{font:800 22px/1.2 var(--head);margin:10px 0 0;letter-spacing:-.01em}
.gt{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.gatecard{width:78px;height:106px;border-radius:10px;overflow:hidden;align-self:center;border:1px solid #F2B35B88;box-shadow:0 0 30px -4px #F2B35B77}
.block{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding:0 28px}
.block .ban{width:76px;height:76px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;color:var(--t3)}
.toast{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 12px);transform:translateX(-50%);z-index:20;background:var(--t1);color:#0A0911;font-size:13px;font-weight:500;padding:9px 14px;border-radius:999px;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis;animation:fade 2.8s ease forwards}
@keyframes fade{0%{opacity:0;transform:translate(-50%,-6px)}10%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}

.handoff{align-self:center;display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--t1);font-weight:600;font-size:14px}
@container app (max-width:374px){.h1{font-size:26px}.plan .pp{font-size:17px}.hookhero .side{width:100px!important}}
@media (max-height:700px){
  .hookhero{zoom:.66}
  .years{height:132px;padding:44px 0}
  .scene,.scene.big{height:84px}
  .disclose{padding:5px 12px}
  .ideas{gap:5px}.ideas button{min-height:38px;padding:7px 12px;font-size:13.5px}
  .ofr .scr{gap:10px!important}
  .ofr .h1{font-size:22px!important;margin-top:8px!important}
  .ofr .lead{font-size:13.5px!important;margin-top:4px!important}
  .ocard{padding:18px 14px 12px;gap:10px}
  .oprice{padding:9px}.oprice b{font-size:24px}
  .ochecks{gap:6px}.ochecks div{font-size:13.5px}
  .ofr .foot .legal a{min-height:32px}.ofr .foot .link{min-height:36px}
}
/* ---------- paywall: web landing page ---------- */
.pw.web{padding-top:0;display:block;background:var(--bg);background-image:none}
.pwscroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;overscroll-behavior:contain;background-image:var(--paper)}
.pwscroll::-webkit-scrollbar{display:none}
.pwbar{position:absolute;z-index:4;top:0;left:0;right:0;display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 8px) 14px 8px 18px;transition:background .25s,box-shadow .25s,border-color .25s;border-bottom:1px solid transparent}
.pwbar .logo{flex:1;font-size:16px;opacity:0;transition:opacity .25s}
.pwbar.solid{background:#0A0911e6;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom-color:var(--border)}
.pwbar.solid .logo{opacity:1}
.pwbar .closex{background:#0A0911aa;border:1px solid #ffffff22;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.pmini{height:36px;padding:0 16px;border-radius:999px;border:none;background:var(--grad);color:#fff;font:700 13px/1 var(--head);opacity:0;transform:translateY(-4px);pointer-events:none;transition:opacity .2s,transform .2s}
.pwbar.mini .pmini{opacity:1;transform:none;pointer-events:auto}
.phero{position:relative;height:clamp(380px,62vh,470px);overflow:hidden;background:#1a1220}
.phero .phbg,.phero .phbg svg{position:absolute;inset:0;width:100%;height:100%}
.phero>img.phimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 14%}
.phshade{position:absolute;inset:0;background:linear-gradient(180deg,#0A091199 0%,transparent 22%,transparent 42%,#0A0911d9 76%,var(--bg) 100%)}
.phtxt{position:absolute;left:20px;right:20px;bottom:6px;z-index:1;display:flex;flex-direction:column;gap:10px}
.phtxt .h1{font-size:33px;line-height:1.08;text-shadow:0 2px 18px #0009}
.phtxt .gt{background:linear-gradient(135deg,#E27BE1,#F59AC8);-webkit-background-clip:text;background-clip:text}
.phtxt p{margin:0;color:#DCD6E6;font-size:15px;text-wrap:pretty}
.peye{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;font:700 11.5px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--amber)}
.peye.am{padding:7px 11px;border-radius:999px;background:#0A0911b3;border:1px solid #F2B35B55;letter-spacing:.1em}
.pchips{display:flex;flex-wrap:wrap;gap:7px;padding:14px 20px 0}
.pchips span{display:inline-flex;align-items:center;gap:5px;font:600 12px/1 var(--sans);padding:7px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--border);color:var(--t1)}
.pchips svg{color:var(--pink-hi)}
.pherocta{padding:16px 20px 0}
.psec{padding:36px 20px 0;display:flex;flex-direction:column;gap:12px}
.psec.first{padding-top:30px}
.ph2{font:600 25px/1.18 var(--serif);letter-spacing:-.01em;margin:0 0 4px;text-wrap:balance}
.pblock{margin-top:6px;padding:20px 14px 16px;border-radius:24px;background:radial-gradient(ellipse at 50% 0%,#B62CB51f,transparent 60%),var(--bg-elev);border:1px solid var(--border);box-shadow:0 30px 60px -36px #000,0 0 0 1px #ffffff06 inset;display:flex;flex-direction:column;gap:12px}
.pblock .plans{margin-top:4px}
.pdue{display:flex;justify-content:space-between;align-items:baseline;padding:12px 4px 2px;border-top:1px dashed var(--border);font-size:14px;color:var(--t2)}
.pdue b{font:800 22px/1 var(--head);color:var(--t1);font-variant-numeric:tabular-nums}
.pays{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.pays span{font:700 10.5px/1 var(--sans);letter-spacing:.02em;padding:6px 8px;border-radius:6px;background:#fff;color:#14121c}
.psafe{display:flex;align-items:center;justify-content:center;gap:6px;font-size:12.5px;color:var(--t2)}
.psafe svg{color:var(--amber)}
.prenew{margin:0;font-size:12px;line-height:1.45;color:var(--t3);text-align:center;text-wrap:balance}
.pbens{display:grid;grid-template-columns:1fr;gap:10px}
.pbens>div{display:flex;gap:14px;align-items:center;padding:14px;border-radius:18px;background:var(--surface);border:1px solid var(--border)}
.pbens b{display:block;font:700 15px/1.25 var(--head)}
.pbens small{display:block;margin-top:3px;font-size:13px;color:var(--t2);line-height:1.35}
.pwell{width:40px;height:40px;border-radius:12px;background:var(--grad);display:grid;place-items:center;flex:none;box-shadow:0 8px 20px -8px #B62CB5}
.pstory{display:flex;gap:16px;align-items:center}
.pcov{flex:none;border-radius:6px 12px 12px 6px;box-shadow:0 0 36px -8px #F2B35B88,0 16px 30px -16px #000}
.ptoc{flex:1;min-width:0;display:flex;flex-direction:column;gap:12px}
.ptoc>div{display:flex;gap:10px;align-items:flex-start;color:var(--t3)}
.ptoc>div svg{flex:none;margin-top:2px}
.ptoc>div.on{color:var(--amber)}
.ptoc b{display:block;font:600 14px/1.3 var(--sans);color:var(--t1)}
.ptoc small{display:block;font-size:12.5px;color:var(--t2)}
.pcliff{margin:6px 0 0;padding:16px 18px;border-radius:18px;border-left:3px solid var(--amber);background:var(--surface);font:italic 500 15.5px/1.5 var(--serif);color:var(--cream)}
.pcliff small{display:block;margin-bottom:6px;font:700 11px/1 var(--sans);font-style:normal;letter-spacing:.14em;text-transform:uppercase;color:var(--amber)}
.psec .how{margin-top:4px}
.pfacts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pfacts>div{padding:16px 14px;border-radius:18px;background:var(--surface);border:1px solid var(--border);display:flex;flex-direction:column;gap:4px}
.pfacts b{font:800 30px/1 var(--head);align-self:flex-start}
.pfacts span{font-size:13px;color:var(--t2);line-height:1.3}
.preal{padding:14px;border-radius:18px;background:var(--surface);border:1px solid var(--border);font-size:14px}
.preal p{margin:8px 0 0}
.pnote{margin:2px 0 0;font-size:13.5px;color:var(--t2)}
.pfaq{display:flex;flex-direction:column;border-top:1px solid var(--border)}
.pfaq details{border-bottom:1px solid var(--border)}
.pfaq summary{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:54px;padding:12px 2px;cursor:pointer;font:600 15px/1.3 var(--sans)}
.pfaq summary::-webkit-details-marker{display:none}
.pchev{flex:none;color:var(--t3);transform:rotate(-90deg);transition:transform .2s}
.pfaq details[open] .pchev{transform:rotate(90deg)}
.pfaq p{margin:0 0 16px;padding-right:20px;color:var(--t2);font-size:14px;line-height:1.5}
.pfoot{margin-top:40px;padding:28px 20px calc(110px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--border);background:var(--ground);display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.pfoot .logo{font-size:15px}
.plinks{display:flex;flex-wrap:wrap;justify-content:center;gap:2px 14px;font-size:12.5px}
.plinks a{color:var(--t2);min-height:40px;display:inline-flex;align-items:center;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--border)}
.pfoot p{margin:0;font-size:11.5px;line-height:1.45;color:var(--t3);max-width:340px}
.pwsticky{position:absolute;z-index:5;left:0;right:0;bottom:0;display:flex;align-items:center;gap:14px;padding:12px 16px max(14px,calc(env(safe-area-inset-bottom,0px) + 10px));background:#0A0911f2;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--border);transform:translateY(105%);transition:transform .25s ease;box-shadow:0 -20px 40px -20px #000}
.pwsticky.on{transform:none}
.psel{flex:none;display:flex;flex-direction:column;gap:2px;min-width:0}
.psel b{font:800 15px/1.1 var(--head);white-space:nowrap}
.psel small{font-size:12px;color:var(--t2);white-space:nowrap}
.pwsticky .btn{flex:1;height:50px;width:auto}
@container app (max-width:374px){.phtxt .h1{font-size:28px}.ph2{font-size:23px}.psec{padding-left:16px;padding-right:16px}.pchips{padding-left:16px;padding-right:16px}.pblock{padding-left:12px;padding-right:12px}.pstory{gap:12px}.pcov .cover{width:80px!important;height:110px!important}.pays{gap:4px}.pays span{font-size:9.5px;padding:5px 6px}}
@media (max-height:700px){.phero{height:350px}.phtxt .h1{font-size:28px}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}
}

/* last-chance offer (shown once, after a paywall decline) */
.ofr .pwtop .logo{font-size:16px}

function speak(text,rateMul=1){

  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);const v=VSPEECH[vk()];u.rate=v.rate*rateMul;u.pitch=v.pitch;
    const vs=speechSynthesis.getVoices().filter(x=>/^en/i.test(x.lang));const want=gk()==='F'?/female|zira|aria|jenny|samantha|susan|hazel/i:/male|david|guy|mark|daniel|george|ryan/i;
    u.voice=vs.find(x=>want.test(x.name))||vs[0]||null;speechSynthesis.speak(u);return true}catch(e){return false}
}

function startNar(mi,onDone,withSound){

}

const BOOKS=new Set();
const book=(k,w,h,mode,ink=false)=>`<div class="book3d${mode==='land'?'':' fadeup'}" data-k="${k}" data-w="${w}" data-h="${h}" data-mode="${mode}" data-ink="${ink?1:''}" style="width:${w+40}px;height:${h+30}px"></div>`;
function mountBook(el){
  if(el._b)return;
  const k=el.dataset.k,w=+el.dataset.w,h=+el.dataset.h,mode=el.dataset.mode,ink=!!el.dataset.ink,T0=Math.round(w*.11);
  el.innerHTML=imgs(`<div class="bglow"></div><div class="bk-in${mode==='land'?' land':''}"><div class="bk" style="width:${w}px;height:${h}px;margin:${-h/2}px 0 0 ${-w/2}px">
   <div class="bk-back" style="width:${w}px;height:${h}px;transform:translateZ(${-T0}px)"></div>
   ${[.72,.45,.2].map(z=>`<div class="bk-page" style="width:${w-4}px;height:${h-6}px;top:3px;transform:translateZ(${-T0*z}px)"></div>`).join('')}
   <div class="bk-edge" style="width:${T0}px;height:${h-6}px;top:3px;left:${w-4}px;transform:rotateY(90deg)"></div>
   <div class="bk-inner" style="width:${w-4}px;height:${h-6}px;top:3px;transform:translateZ(-1px)"><b>Chapter 1</b><i>${esc(ST[k].scene)}</i>${candle(26)}</div>
   <div class="bk-spine" style="width:${T0}px;height:${h}px;transform:rotateY(90deg)"></div>
   <div class="bk-front${S.coverOpen&&mode==='land'?' open':''}" style="width:${w}px;height:${h}px">${coverHTML(k,{w,h,ink})}</div>
  </div></div>`);
  const o={el,mode,scene:el.querySelector('.bk'),front:el.querySelector('.bk-front'),t0:performance.now(),px:0,py:0,tx:0,ty:0,ang:0,settle:null};
  el._b=o;BOOKS.add(o);
  el.addEventListener('pointermove',e=>{const r=el.getBoundingClientRect();o.tx=(e.clientX-r.left)/r.width-.5;o.ty=(e.clientY-r.top)/r.height-.5});
  el.addEventListener('pointerleave',()=>{o.tx=0;o.ty=0});
  if(!BOOKS.loop){BOOKS.loop=true;BOOKS.last=0;requestAnimationFrame(bookFrame)}
  drawBook(o,RM?o.t0+4000:o.t0,0);
}
const ease=x=>1-Math.pow(1-x,3);
function drawBook(o,now,dt){
  const t=(now-o.t0)/1000;
  o.px+=(o.tx-o.px)*.08;o.py+=(o.ty-o.py)*.08;
  let ry,rx;
  if(o.mode==='spin'){
    if(o.settle){const k=Math.min(1,(now-o.settle.t0)/o.settle.dur);ry=o.settle.from+(o.settle.to-o.settle.from)*ease(k);rx=22*(1-ease(k))+4}
    else{o.ang+=160*dt/1000;ry=o.ang;rx=22}
  }else if(o.mode==='land'){ry=-12+Math.sin(t*.6)*6;rx=5+Math.sin(t*.5)*2}
  else{ry=-24+Math.sin(t*.6)*9;rx=8+Math.sin(t*.5)*3}
  ry+=o.px*30;rx-=o.py*16;
  o.scene.style.transform=`rotateX(${rx}deg) rotateY(${ry}deg)`;
}
function settleBook(o){let to=Math.ceil(o.ang/360)*360;if(to-o.ang<120)to+=360;o.settle={from:o.ang,to:to-12,t0:performance.now(),dur:900}}
function bookFrame(now){
  const dt=Math.min(50,now-(BOOKS.last||now));BOOKS.last=now;
  for(const o of BOOKS){if(!o.el.isConnected){BOOKS.delete(o);continue}drawBook(o,now,dt)}
  if(!RM&&BOOKS.size)requestAnimationFrame(bookFrame);else BOOKS.loop=false;
}

/* ---------- chat engine ---------- */
function say(text){
  if(S.typing||S.gate||(S.nar&&S.nar.on)||(!S.premium&&S.msgs<=0))return;
  if(teaseLock()||(S.i===11&&S.pend))return;   // hard paywall: no messages outside the 2-reply taste without Plus
  const n=S.i;S.sent++;emit('chat_message',{count:S.sent,screen:n});
  const inp=document.getElementById('msg');if(inp)inp.value='';
  if(n===10){S.chat.push({w:'u',x:text});S.msgs--;S.turn=1;S.firstPick=text;go(11);return}
  if(n===11){if(S.turn>=3)return;S.turn++;S.chat.push({w:'u',x:text});S.msgs--;gateSave();render();reply11();return}
  S.chat.push({w:'u',x:text});if(!S.premium)S.msgs--;render();replyGen();
}
function reply11(){
  S.typing=true;render();
  const s=T(),k=S.turn-1;
  later(()=>{
    S.typing=false;
    if(k<CONFIG.teaserMessages-1){
      S.chat.push({w:'c',x:s.rep[k]});
      if(!S.memShown){S.memShown=true;const i=s.ideas[0].indexOf(S.firstPick);S.mems.push(i>=0?s.mem[i]:`you said “${S.firstPick.slice(0,34)}${S.firstPick.length>34?'…':''}”`);render();memToast()}else render();
      S.pend=true;render();later(()=>{S.pend=false;S.chat.push({w:'n',x:s.mid[k]});startNar(S.chat.length-1,null,false)},700);
    }else{

    case 'closeq':S.sheet=null;emit('paywall_close',{placement:'limit',via:'close'});S.ltSeen=true;go(SALE_LT);break;
    case 'midnight':emit('come_back_midnight');go(payTo());break;   // unreachable for free users (hard paywall)
    case 'openapp':openApp();break;
  }
});
phone.addEventListener('input',e=>{
  const f=e.target.dataset.f;if(!f)return;
  S[f]=e.target.value;
  if(f==='tropeOther'){const bt=cur().querySelector('.foot .btn');if(bt)bt.disabled=!S.tropeOther.trim();const h=document.getElementById('tomatch');if(h)h.textContent=S.tropeOther.trim()?`Closest story: ${ST[matchTrope(S.tropeOther)].trope}`:'We match it to the nearest story.'}
  if(f==='email'&&S.emailErr){S.emailErr='';const er=cur().querySelector('.err');if(er)er.remove();e.target.setAttribute('aria-invalid','false')}
  if(f==='name'&&S.err){S.err='';const er=cur().querySelector('.err');if(er)er.remove()}
  if(f==='draft')return;
  renderPanel();
});
phone.addEventListener('change',e=>{if(e.target.dataset.f==='ntime'){S.ntime=e.target.value;renderPanel()}});
phone.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.tagName==='INPUT'){const b=e.target.id==='msg'?cur().querySelector('[data-a="send"]'):e.target.id==='em'?cur().querySelector('[data-a="emailgo"]'):cur().querySelector('.foot .btn');b&&!b.disabled&&b.click()}});

/* Host API: the page embedding this funnel can complete a purchase or read the picks. */
window.IkFunnel=Object.assign(window.IkFunnel||{},{
  config:CONFIG,data:snapshot,
  completePurchase:(plan)=>{if(plan==='addon'){S.addon=true;if(S.bought)S.plan=S.bought;AFTER=23;emit('purchase_complete',{plan:'addon'});go(AFTER);return}if(plan&&CONFIG.plans[plan])S.plan=plan;S.bought=S.plan;AFTER=CONFIG.plans[S.plan]&&CONFIG.plans[S.plan].oneTime?23:22;S.ltSeen=true;S.premium=true;S.pwSeen=true;S.sheet=null;S.lockTap=false;S.teaserDone=true;S.gate=false;emit('purchase_complete',{plan:S.plan});go(AFTER)}
});
if(DEBUG)window.IkFunnel.go=n=>{if(!V[n])return;clearT();fillTo(n);go(n)};   // unknown screens (e.g. the removed offer, 99) are ignored
if(DEBUG){const m=location.hash.match(/s=?([0-9]+)/);if(m&&V[+m[1]]){fillTo(+m[1]);S.i=+m[1]}}
if(!(DEBUG&&/s=?[0-9]+/.test(location.hash)))gateRestore();
if(ageBlocked()&&!DEBUG){S.i=1;S.blocked=true}
{let ref='';try{ref=document.referrer?new URL(document.referrer).hostname:''}catch(e){}emit('funnel_start',{referrer:ref})}
render();
viewed();
</script>
