<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A0911">
<title>ChatChi: AI Roleplay Chat · Book Boyfriend</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap">
<style>
:root{
  color-scheme:dark;
  --ground:#06050B;
  --bg:#0A0911;--bg-elev:#12101B;--surface:#17151F;--surface-2:#221F2D;--border:#2D293B;
  --t1:#F4F2F8;--t2:#A7A2B7;--t3:#6F6A82;
  --pink:#B62CB5;--pink-hi:#DA5FD9;--pink-dim:#B62CB52E;--pink-deep:#261230;
  --grad-a:#9A2ACB;--grad-b:#D82F99;--grad:linear-gradient(135deg,var(--grad-a),var(--grad-b));
  --amber:#F5B83D;--violet:#9B7BFF;--negative:#F0705F;--positive:#7FD1A8;
  --head:"Plus Jakarta Sans","Segoe UI",system-ui,sans-serif;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);background-image:radial-gradient(ellipse 60% 40% at 30% 0%,#240F2C 0%,transparent 70%);color:var(--t1);font:15px/1.45 var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--pink-hi);outline-offset:2px}

.phone{container:app/inline-size;position:relative;width:100%;max-width:480px;height:100vh;height:100dvh;margin:0 auto;background:var(--bg);overflow:hidden;isolation:isolate;--top:calc(env(safe-area-inset-top,0px) + 8px)}
@media (min-width:520px){.phone{border-inline:1px solid #2A2536}}
#amb{position:absolute;inset:0;width:100%;height:100%;z-index:0;display:block}
.stage{position:absolute;inset:0;z-index:1;overflow:hidden}
.view{position:absolute;inset:0;padding-top:var(--top);display:flex;flex-direction:column}
.view.out{animation:vout .22s ease forwards;pointer-events:none}
.view.in{animation:vin .32s ease both}
@keyframes vout{to{opacity:0}}
@keyframes vin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.nav{height:44px;flex:none;display:flex;align-items:center;gap:12px;padding:0 16px;position:relative;z-index:3}
.iconbtn{width:44px;height:44px;border-radius:50%;border:none;background:transparent;display:grid;place-items:center;color:var(--t2)}
.iconbtn:hover{background:var(--surface)}
.prog{flex:1;height:4px;border-radius:2px;background:var(--surface-2);overflow:hidden}
.prog span{display:block;height:100%;background:var(--pink);border-radius:2px;transition:width .35s ease}
.navspacer{width:44px}
.scr{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 20px 12px;display:flex;flex-direction:column;gap:18px;position:relative;z-index:1;scrollbar-width:none}
.scr::-webkit-scrollbar{display:none}
.scr.center{justify-content:center}
.foot{flex:none;padding:12px 20px max(20px,calc(env(safe-area-inset-bottom,0px) + 12px));display:flex;flex-direction:column;gap:10px;position:relative;z-index:2}
.foot .note{font-size:12px;color:var(--t3);text-align:center;text-wrap:balance}
.foot .note.legaln{font-size:13px;line-height:1.5}
.legaln a{color:var(--t2);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--t3);display:inline-block;padding:11px 0;margin:-11px 0}

.h1{font:800 30px/1.12 var(--head);letter-spacing:-.02em;margin:0;text-wrap:balance}
.h1.xl{font-size:32px}
.lead{color:var(--t2);margin:0;font-size:15px;text-wrap:pretty}
.badge{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:var(--pink-dim);color:var(--pink-hi);font:600 12px/1 var(--sans)}

.btn{height:54px;border-radius:999px;border:none;background:var(--pink);color:#fff;font:600 16px/1 var(--sans);width:100%;display:flex;align-items:center;justify-content:center;gap:10px;transition:transform .12s ease,opacity .2s;flex:none}
.btn:active{transform:scale(.98)}
.btn[disabled]{background:var(--surface-2);color:var(--t3);cursor:not-allowed}
.btn.ghost{background:var(--surface-2);color:var(--t1);border:1px solid var(--border)}
.btn.outline{background:transparent;color:var(--t2);border:1px solid var(--border)}
.btn.light{background:#fff;color:#0A0911}
.btn:not([disabled]):not(.ghost):not(.light):not(.outline){position:relative;overflow:hidden;box-shadow:0 10px 30px -12px #B62CB5cc}
.btn:not([disabled]):not(.ghost):not(.light):not(.outline)::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:0;background:linear-gradient(100deg,transparent,#ffffff55,transparent);transform:translateX(-150%) skewX(-20deg);animation:sheen 4.5s ease-in-out 1.2s infinite}
@keyframes sheen{0%{transform:translateX(-150%) skewX(-20deg)}28%,100%{transform:translateX(320%) skewX(-20deg)}}
.link{background:none;border:none;color:var(--t2);font-size:14px;padding:6px;text-align:center;min-height:44px}
.link:hover{color:var(--t1)}
.link.pink{color:var(--pink-hi);font-weight:500}
.link.tiny{font-size:12px;color:var(--t3);text-decoration:underline dotted}

.opt{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:18px;background:var(--surface);border:1px solid var(--border);text-align:left;width:100%;transition:border-color .15s,background .15s}
.opt:hover{border-color:#47405c}
.opt .em{font-size:20px;width:26px;text-align:center;flex:none}
.opt .lbl{flex:1;font-weight:500;font-size:16px}
.opt.on{border-color:var(--pink);background:linear-gradient(0deg,var(--pink-dim),var(--pink-dim)),var(--surface)}

.field{display:flex;flex-direction:column;gap:8px}
.field label,.flabel{font:500 13px/1 var(--sans);color:var(--t2)}
.box{height:56px;border-radius:14px;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;padding:0 8px 0 16px;gap:10px;color:var(--t3)}
.box:focus-within{border-color:var(--pink)}
.box input{flex:1;min-width:0;height:100%;background:transparent;border:none;outline:none;color:var(--t1);font:400 16px var(--sans)}
.shuf{width:44px;height:44px;border-radius:10px;border:none;background:var(--surface-2);color:var(--pink-hi);display:grid;place-items:center;flex:none}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{min-height:44px;padding:9px 16px;border-radius:999px;background:var(--surface-2);border:1px solid var(--border);color:var(--t2);font-weight:500;font-size:14px}
.pill.on{background:var(--pink-dim);border-color:var(--pink);color:var(--t1)}
.err{font-size:13px;color:var(--negative)}
.hint{font-size:13px;color:var(--t3)}

.years{position:relative;height:150px;flex:none;overflow-y:auto;scroll-snap-type:y mandatory;border-radius:18px;background:var(--surface);border:1px solid var(--border);padding:53px 0;scrollbar-width:none}
.years::-webkit-scrollbar{display:none}
.years button{display:block;width:100%;height:44px;border:none;background:none;scroll-snap-align:center;font:400 20px/44px var(--sans);color:var(--t3);font-variant-numeric:tabular-nums}
.years button:hover{color:var(--t2)}
.years button.on{color:var(--t1);font-weight:600;background:var(--surface-2)}

/* hero 3D: his portrait card (the only 3D object) */
.hero3d{position:relative;perspective:900px;perspective-origin:50% 40%;margin:0 auto;flex:none;animation:hfade .4s ease both}
.hin{position:absolute;inset:0;transform-style:preserve-3d}
.hin.land{animation:hland 1.6s cubic-bezier(.2,.8,.2,1) both}
@keyframes hland{from{transform:scale(.72) rotateX(10deg) rotateY(-110deg)}to{transform:none}}
@keyframes hfade{from{opacity:0}}
.hscene{position:absolute;inset:0;transform-style:preserve-3d;will-change:transform}
.hscene>*{position:absolute;left:50%;top:50%}
.hglow{border-radius:40px;background:radial-gradient(ellipse at 50% 40%,#B62CB566,transparent 70%);filter:blur(16px)}
.hcard{border-radius:24px;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 30px 60px -20px #000,0 0 0 1px #ffffff18;background:#16141e}
.hcard svg{width:100%;height:100%;display:block}
.hcard .hcol{position:absolute;inset:0;clip-path:inset(100% 0 0 0);transition:clip-path .15s linear}
.hcard.shade::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 50%,#0A0911f2)}
.hplate{backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.hplate b{font:800 30px/1 var(--head);text-shadow:0 4px 18px #000}
.hplate .tags{display:flex;gap:6px;flex-wrap:wrap}
.hplate .tags span{font-size:11.5px;padding:5px 9px;border-radius:999px;background:#17151FCC;border:1px solid var(--border);color:var(--t2);font-weight:500}
.hh{width:0;height:0}
.hh i{position:absolute;left:-8px;top:-8px;color:var(--pink-hi);animation:hrise 3.6s ease-in infinite;filter:drop-shadow(0 0 6px #DA5FD9aa)}
@keyframes hrise{0%{transform:translateY(20px) scale(.6);opacity:0}20%{opacity:1}100%{transform:translateY(-90px) scale(1);opacity:0}}
.sk path,.sk ellipse,.sk circle,.sk text{stroke-dasharray:520;stroke-dashoffset:520;animation:draw 2.8s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}

/* hook */
.herorow{position:relative;height:222px;flex:none}
.lock{position:absolute;right:4px;top:26px;width:160px;height:186px;border-radius:24px;background:linear-gradient(180deg,#26203a,#110e1a);border:1px solid #ffffff1f;box-shadow:0 20px 40px -14px #000;padding:14px 10px;display:flex;flex-direction:column;align-items:center;gap:2px}
.lock .lt{font:700 34px/1 var(--head);letter-spacing:-.02em}
.lock .ld{font-size:11px;color:var(--t2);margin-bottom:12px}
.lock .ln{display:flex;gap:8px;align-items:flex-start;width:100%;padding:8px;border-radius:14px;background:#ffffff1c;font-size:11.5px;line-height:1.3;animation:lnin .5s ease 1.1s both}
.lock .ln b{display:flex;justify-content:space-between;font-size:11px}
.lock .ln b small{color:var(--t3);font-weight:400}
@keyframes lnin{from{opacity:0;transform:translateY(-8px) scale(.96)}}
.logo{display:flex;align-items:center;gap:8px;font:800 17px var(--head)}

/* picks */
.archs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.arch{position:relative;height:164px;border-radius:20px;overflow:hidden;border:1.5px solid var(--border);background:var(--surface);padding:0;text-align:left}
.arch svg{position:absolute;inset:0;width:100%;height:100%}
.arch::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,#0A0911f0)}
.arch .al{position:absolute;left:10px;right:10px;bottom:9px;z-index:1;font-weight:600;font-size:13.5px;line-height:1.25}
.arch.on{border-color:var(--pink);box-shadow:0 0 0 3px var(--pink-dim)}
.arch .hp{position:absolute;top:10px;right:10px;z-index:2;color:var(--pink-hi);animation:hp .6s ease}
@keyframes hp{0%{transform:scale(.4);opacity:0}50%{transform:scale(1.35)}100%{transform:scale(1)}}
.arch.other{height:auto;grid-column:1/-1;padding:14px;display:flex;align-items:center;gap:10px}
.arch.other::after{display:none}
.arch.other .al{position:static}
.blurbg{position:absolute;inset:0;z-index:0;opacity:.2;filter:blur(20px);pointer-events:none}
.blurbg svg{width:100%;height:100%}
.vrow{display:flex;align-items:center;gap:8px;padding-right:8px;border-radius:18px;background:var(--surface);border:1px solid var(--border)}
.vrow.on{border-color:var(--pink);background:linear-gradient(0deg,var(--pink-dim),var(--pink-dim)),var(--surface)}
.vsel{flex:1;min-width:0;display:flex;align-items:center;gap:12px;background:none;border:none;padding:14px 4px 14px 16px;text-align:left}
.vsel .em{font-size:20px}
.vsel .lbl{flex:1;font-weight:500;font-size:16px}
.wave{display:inline-flex;gap:2px;align-items:center;height:22px;flex:none}
.wave i{display:block;width:3px;border-radius:2px;background:var(--t3);height:var(--h)}
.vrow.playing .wave i{background:var(--pink-hi);animation:wv .6s ease-in-out infinite alternate;animation-delay:var(--d)}
@keyframes wv{from{transform:scaleY(.35)}to{transform:scaleY(1.15)}}
.vplay{width:44px;height:44px;border-radius:50%;border:none;background:var(--pink-dim);color:var(--pink-hi);display:grid;place-items:center;flex:none}
.vcap{margin:-2px 6px 2px;padding:10px 14px;border-left:2px solid var(--pink);font-style:italic;color:var(--t1);font-size:15px;animation:fi .3s ease}
.vlist{display:flex;flex-direction:column;gap:10px}
.lcs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lc{height:112px;border-radius:20px;background:var(--surface);border:1.5px solid var(--border);display:flex;flex-direction:column;justify-content:space-between;padding:14px;text-align:left;font-weight:600}
.lc .vg{font-size:30px;line-height:1}
.lc.on{border-color:var(--pink);background:linear-gradient(0deg,var(--pink-dim),var(--pink-dim)),var(--surface)}
.mcs{display:flex;flex-direction:column;gap:10px}
.mc{height:70px;border-radius:18px;border:1.5px solid var(--border);background:var(--g);display:flex;align-items:center;gap:14px;padding:0 16px;font-weight:600;font-size:16px;position:relative;overflow:hidden;text-align:left;width:100%}
.mc .big{position:absolute;right:-4px;bottom:-16px;font-size:66px;opacity:.28}
.mc.on{border-color:var(--pink);box-shadow:0 0 0 3px var(--pink-dim)}

/* chat */
.chat{position:absolute;inset:0;top:var(--top);display:flex;flex-direction:column}
.chead{flex:none;display:flex;align-items:center;gap:10px;padding:4px 8px 8px 16px;border-bottom:1px solid var(--border);position:relative;z-index:2;background:var(--bg)}
.chead .who{flex:1;min-width:0}
.chead .who b{display:block;font:700 17px/1.1 var(--head)}
.chead .who span{font-size:13px;color:var(--pink-hi);display:inline-flex;gap:4px;align-items:center;font-variant-numeric:tabular-nums}
.chead .who span.bump{animation:bump .5s ease}
@keyframes bump{40%{transform:scale(1.25)}}
.av{position:relative;border-radius:50%;overflow:hidden;flex:none;display:block;background:#16141e}
.av svg{width:100%;height:100%;display:block}
/* AI-painted portraits (img/) sit over the inline SVG; a failed image removes itself and the SVG shows */
.pimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 22%;display:block;user-select:none;-webkit-user-drag:none}
.pimg.crop{object-position:50% 0;transform:scale(1.5);transform-origin:50% 36%}
.pimg.sketch{filter:grayscale(1) contrast(1.35) brightness(.8);opacity:.5}
.arch .pimg{object-position:50% 18%}
.cbody{flex:1;position:relative;overflow:hidden;display:flex;flex-direction:column}
.cbg{position:absolute;inset:0;z-index:0;background:var(--scene);opacity:.55}
.cbg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,var(--bg) 0%,transparent 30%,transparent 55%,var(--bg) 100%)}
.disclose{position:relative;z-index:1;margin:10px 16px 0;padding:8px 12px;border-radius:12px;background:#17151FE6;color:var(--t3);font-size:11.5px;text-align:center;line-height:1.35}
.msgs{position:relative;z-index:1;flex:1;overflow-y:auto;padding:12px 16px;display:flex;flex-direction:column;gap:10px;scrollbar-width:none}
.msgs::-webkit-scrollbar{display:none}
.msgs .spacer{flex:1}
.bub{padding:11px 14px;border-radius:18px;max-width:82%;font-size:15px;line-height:1.4;animation:fi .3s ease}
.bub.c{align-self:flex-start;background:var(--surface-2);border-bottom-left-radius:6px}
.bub.u{align-self:flex-end;background:var(--pink);color:#fff;border-bottom-right-radius:6px}
.bub.sys{align-self:center;background:transparent;color:var(--t3);font-size:12px;padding:2px;text-align:center}
.bub.rec{color:var(--t2);font-size:13px;display:flex;gap:6px;align-items:center}
.typing{display:inline-flex;gap:4px;padding:3px 0}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--t3);animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{50%{opacity:.3}}
.vnb{display:flex;align-items:center;gap:10px;padding:8px 14px 8px 8px}
.vnb .vplay{width:40px;height:40px;background:var(--pink);color:#fff}
.vt{font-size:12px;color:var(--t2);font-variant-numeric:tabular-nums}
.ideas{position:relative;z-index:1;display:flex;flex-direction:column;gap:8px;padding:0 16px 10px}
.ideas .ih{font-size:12px;color:var(--t3);display:flex;gap:6px;align-items:center}
.ideas button{min-height:44px;padding:11px 14px;border-radius:14px;background:#17151FE6;border:1px solid var(--border);text-align:left;font-size:14px;color:var(--t2)}
.ideas button:hover{border-color:var(--pink);color:var(--t1)}
.cfoot{flex:none;border-top:1px solid var(--border);padding:10px 14px max(14px,calc(env(safe-area-inset-bottom,0px) + 8px));display:flex;flex-direction:column;gap:8px;background:var(--bg);position:relative;z-index:2}
.cchips{display:flex;gap:8px}
.cchips span{white-space:nowrap;padding:7px 12px;border-radius:999px;border:1px solid var(--border);background:var(--surface);font-size:13px;color:var(--t2);display:inline-flex;gap:6px;align-items:center}
.counter{font-size:12px;color:var(--t3);font-weight:500;font-variant-numeric:tabular-nums}
.counter.out{color:var(--negative)}
.composer{display:flex;gap:8px;align-items:center}
.composer .box{flex:1;height:48px;border-radius:999px;padding:0 16px}
.send{width:48px;height:48px;border-radius:50%;border:none;background:var(--pink);color:#fff;display:grid;place-items:center;flex:none}
.send[disabled]{background:var(--surface-2);color:var(--t3)}
.mtoast{position:absolute;z-index:6;top:calc(var(--top) + 64px);right:12px;left:12px;display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:14px;background:var(--surface);border:1px solid var(--pink);font-size:13px;box-shadow:0 12px 30px -10px #000;animation:mt 3.6s ease forwards}
.mtoast svg{color:var(--pink-hi);flex:none}
@keyframes mt{0%{opacity:0;transform:translateY(-8px)}8%,85%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-6px)}}
.limit{align-self:stretch;margin-top:4px;padding:18px 16px;border-radius:18px;border:1.5px solid var(--pink);background:#17151FF2;display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center;animation:fi .4s ease}
.limit h3{margin:0;font:800 20px/1.2 var(--head)}
.limit p{margin:0;color:var(--t2);font-size:14px}
.limit .crown{color:var(--pink-hi)}

/* voice note moment */
.vnbig{display:flex;align-items:center;gap:12px;padding:14px;border-radius:22px;background:var(--surface-2);border:1px solid var(--border);box-shadow:0 0 50px -14px #DA5FD988}
.vnbig .vplay{width:54px;height:54px;background:var(--pink);color:#fff}
.vnbig .wave{flex:1;height:44px;justify-content:space-between}
.vnbig .wave i{width:3.5px}
.vnbig.playing .wave i{animation:wfill .2s linear forwards,wv .5s ease-in-out infinite alternate;animation-delay:var(--p),var(--d)}
@keyframes wfill{to{background:var(--pink-hi)}}
.vcap2{padding:14px 16px;border-radius:16px;background:var(--surface);border:1px solid var(--border);font-style:italic;font-size:16px;line-height:1.45}
.vcap2 small{display:block;font-style:normal;color:var(--t3);font-size:11px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px}
.mprog{padding:14px 16px;border-radius:16px;background:var(--surface);border:1px solid var(--border);display:flex;flex-direction:column;gap:8px}
.mprog .row{display:flex;justify-content:space-between;font-weight:600;font-size:14px;font-variant-numeric:tabular-nums}
.mprog .row span{color:var(--pink-hi);display:inline-flex;gap:4px;align-items:center}
.bar{height:5px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.bar span{display:block;height:100%;background:var(--pink);transition:width .8s ease}

/* loading */
.steps{display:flex;flex-direction:column;gap:14px}
.step .top{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--t2);margin-bottom:7px;gap:10px}
.step .pct{font-variant-numeric:tabular-nums;color:var(--t3);display:flex;gap:6px;align-items:center}
.step.done .top{color:var(--t1)}
.step.done .pct{color:var(--pink-hi)}
.step .bar span{width:0;transition:none}
.floattags{height:30px;position:relative;flex:none}
.floattags span{position:absolute;left:50%;top:0;max-width:60%;overflow:hidden;text-overflow:ellipsis;font-size:12px;padding:5px 10px;border-radius:999px;background:var(--pink-dim);color:var(--pink-hi);font-weight:600;animation:tagup 2.4s ease infinite;opacity:0;white-space:nowrap}
@keyframes tagup{0%{opacity:0;transform:translate(var(--x),16px)}25%,70%{opacity:1}100%{opacity:0;transform:translate(var(--x),-14px)}}

/* trust */

function say(text){
  text=strip(text);
  if(S.typing||S.gate||chatLocked())return;
  if(S.premium&&S.i!==16&&S.i!==17)return;
  if(S.i===10&&!S.chat.length)return;
  if(S.i===11&&(S.teaserDone||S.turn>=CONFIG.teaserMessages))return;
  S.sent++;emit('chat_message',{count:S.sent,screen:S.i});
  const inp=document.getElementById('msg');if(inp)inp.value='';
  if(S.i===10){if(!S.chat.length)return;S.chat.push({w:'u',x:text});S.msgs--;S.turn=1;S.picks=[text];go(11);return}
  if(S.i===11){if(S.teaserDone||S.turn>=CONFIG.teaserMessages)return;S.turn++;S.picks.push(text)}
  S.chat.push({w:'u',x:text});if(!S.premium)S.msgs--;render();if(S.i!==11)reply();
}
function reply(){
  const lastU=[...S.chat].reverse().find(m=>m.w==='u');

      if(!S.premium&&!S.teaserDone&&S.sent>=CONFIG.teaserMessages){S.teaserDone=true;S.gate=true;render();emit('chat_teaser_end',{count:S.sent});
        later(()=>{S.typing=true;render();later(()=>{S.typing=false;S.chat.push({w:'c',x:rep(2)});S.hearts++;render();bumpHearts();
          later(()=>{S.typing='rec';render();later(()=>{S.typing=false;S.chat.push({w:'vn'});S.vnotes=1;render();later(()=>{S.gate=false;go(12)},1200)},1500)},900)},1200)},800)}

  }else if(!old){const nv=document.createElement('div');nv.className='view cur';nv.innerHTML=html;stage.appendChild(nv)}
  else old.innerHTML=html;
  const v=cur();
  v.querySelectorAll('.hero3d').forEach(mountHero);
  AMB.base=n===8?3.5:1;
  if(n===8)runLoading();
  if(n===1){const y=document.getElementById('years');if(y){const on=y.querySelector('.on')||y.querySelector('[data-v="1998"]');if(on)y.scrollTop=on.offsetTop-y.clientHeight/2+on.clientHeight/2}}
  if(n===10&&!S.chat.length&&!S.typing){S.typing=true;v.querySelector('#msgs').insertAdjacentHTML('beforeend','<div class="bub c"><span class="typing"><i></i><i></i><i></i></span></div>');v.querySelectorAll('.ideas').forEach(e=>e.remove());later(()=>{S.typing=false;S.chat=[{w:'c',x:B().open[mk()]}];render()},1400)}
  if(n===11&&!S.typing&&!S.teaserDone&&S.turn>=1&&S.chat.length&&S.chat[S.chat.length-1].w==='u')reply();
  /* back into a taste chat after it ended: composer stays locked, hand off forward again (email / paywall) */
  if((n===10||n===11)&&!S.premium&&!S.gate&&(S.teaserDone||(n===10&&S.turn>=1))){clearTimeout(fwdT);const to=S.teaserDone?tasteNext():11;fwdT=setTimeout(()=>{if(S.i===n&&!S.premium)go(to,false)},1200)}
  if(v.querySelector('.pw.lp'))pwWire(v);
  scrollMsgs();
  const f=v.querySelector('#nm');if(f&&n===3)setTimeout(()=>{if(cur()===v){f.focus({preventScroll:true});const x=f.value;f.value='';f.value=x}},anim?300:0);
  renderPanel();
}

/* hero 3D: his portrait card — float (hook), sketch→colour (loader), land (reveal); pointer orbit */
const HEROES=new Set();let loopOn=false;
function mountHero(el){
  if(el._h)return;
  const k=el.dataset.k,mode=el.dataset.mode,w=+el.dataset.w,h=+el.dataset.h,c=C[k];
  let hearts='';
  if(mode==='land')for(let i=0;i<6;i++){const x=-w/2+30+i*(w-60)/5,y=-h/2+40+(i%3)*50;hearts+=`<div class="hh" style="transform:translate3d(${x}px,${y}px,${60+(i%3)*18}px)"><i style="animation-delay:${i*.55}s">${heartF(12+(i%3)*3)}</i></div>`}
  const card=mode==='sketch'?`${portrait(k,{sketch:true})}<div class="hcol">${portrait(k)}</div>`:portrait(k);
  const plate=mode==='land'?`<div class="hplate" style="width:${w-32}px;transform:translate(-50%,-50%) translate3d(0,${h/2-62}px,42px)"><b>${c.n}</b><div class="tags"><span>${esc(c.tag)}</span><span>${esc(LOVES[lk()][1])}</span></div></div>`:'';
  el.innerHTML=`<div class="hin ${mode==='land'?'land':''}"><div class="hscene"><div class="hglow" style="width:${w*1.1}px;height:${h*1.05}px;transform:translate(-50%,-50%) translateZ(-60px)"></div>
  <div class="hcard ${mode==='land'?'shade':''}" style="width:${w}px;height:${h}px;transform:translate(-50%,-50%)">${card}</div>${plate}${hearts}</div></div>`;
  const o={el,mode,scene:el.querySelector('.hscene'),t0:performance.now(),px:0,py:0,tx:0,ty:0};
  el._h=o;HEROES.add(o);
  el.addEventListener('pointermove',e=>{const r=el.getBoundingClientRect();o.tx=(e.clientX-r.left)/r.width-.5;o.ty=(e.clientY-r.top)/r.height-.5});
  el.addEventListener('pointerleave',()=>{o.tx=0;o.ty=0});
  if(RM){drawHero(o,o.t0+5000);return}
  if(!loopOn){loopOn=true;requestAnimationFrame(frame3d)}
}
function drawHero(o,now){
  const t=(now-o.t0)/1000;
  o.px+=(o.tx-o.px)*.08;o.py+=(o.ty-o.py)*.08;
  let ry,rx;
  if(o.mode==='float'){ry=14+Math.sin(t*.6)*9+o.px*26;rx=Math.sin(t*.5)*3-o.py*16}
  else if(o.mode==='sketch'){ry=Math.sin(t*.9)*16+o.px*20;rx=-6+Math.sin(t*.7)*4-o.py*12}
  else{ry=Math.sin(t*.6)*7+o.px*26;rx=Math.sin(t*.5)*3-o.py*16}
  o.scene.style.transform=`rotateX(${rx.toFixed(2)}deg) rotateY(${ry.toFixed(2)}deg)`;
}
function frame3d(now){
  for(const h of HEROES){if(!h.el.isConnected){HEROES.delete(h);continue}drawHero(h,now)}
  if(HEROES.size)requestAnimationFrame(frame3d);else loopOn=false;
}

/* ambient: soft drifting bokeh */
const AMB={base:1,boost:0};
(function(){
  const cv=document.getElementById('amb'),cx=cv.getContext('2d');let w=0,h=0;const P=[];
  const cols=['182,44,181','218,95,217','155,123,255','120,60,160'];
  const spawn=(p,init)=>{p.x=Math.random();p.y=init?Math.random():1.1;p.r=12+Math.random()*50;p.c=cols[Math.floor(Math.random()*cols.length)];p.a=.04+Math.random()*.08;p.s=.008+Math.random()*.02;p.ph=Math.random()*6.28;return p};
  for(let i=0;i<22;i++)P.push(spawn({},true));
  function size(){const r=phone.getBoundingClientRect();const d=Math.min(2,devicePixelRatio||1);w=r.width;h=r.height;cv.width=w*d;cv.height=h*d;cx.setTransform(d,0,0,d,0,0)}
  size();addEventListener('resize',size);
  let last=performance.now();
  function frame(now){
    const dt=Math.min(50,now-last)/1000;last=now;AMB.boost*=Math.pow(.3,dt);
    const sp=AMB.base+AMB.boost*6;cx.clearRect(0,0,w,h);
    const g=cx.createRadialGradient(w*.5,0,0,w*.5,0,w*.9);g.addColorStop(0,'rgba(182,44,181,.10)');g.addColorStop(1,'rgba(0,0,0,0)');cx.fillStyle=g;cx.fillRect(0,0,w,h);
    for(const p of P){p.y-=p.s*sp*dt;if(p.y<-.15)spawn(p,false);const x=(p.x+Math.sin(now/4000+p.ph)*.03)*w,y=p.y*h;
      const rg=cx.createRadialGradient(x,y,0,x,y,p.r);rg.addColorStop(0,`rgba(${p.c},${p.a})`);rg.addColorStop(1,`rgba(${p.c},0)`);cx.fillStyle=rg;cx.beginPath();cx.arc(x,y,p.r,0,6.283);cx.fill()}
    if(!RM)requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();

/* ---------- keyboard-safe layout: fit the app to the visual viewport while typing ---------- */
(function(){
  const vv=window.visualViewport;if(!vv)return;
  const typing=()=>{const a=document.activeElement;return a&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA'||a.tagName==='SELECT')&&phone.contains(a)};
  function fit(){
    if(typing()&&vv.height<window.innerHeight-60){phone.style.height=vv.height+'px';phone.style.transform=`translateY(${vv.offsetTop}px)`;scrollMsgs();const a=document.activeElement,sc=a&&a.closest('.scr');if(sc){const r=a.getBoundingClientRect(),sr=sc.getBoundingClientRect();if(r.bottom>sr.bottom)sc.scrollTop+=r.bottom-sr.bottom+12}}
    else{phone.style.height='';phone.style.transform=''}
  }
  vv.addEventListener('resize',fit);vv.addEventListener('scroll',fit);
  document.addEventListener('focusin',()=>setTimeout(fit,50));document.addEventListener('focusout',()=>setTimeout(fit,50));
})();

phone.addEventListener('click',e=>{

  switch(a){

    case 'shuffle':S.name=NAMES[(NAMES.indexOf(S.name)+1+Math.floor(Math.random()*3))%NAMES.length];S.err='';render();break;
    case 'name':if(!S.name.trim()){S.err='Add a name so he knows what to call you';render()}else{S.name=S.name.trim();answer('name','set');next()}break;
    case 'voice':S.voice=v;answer('voice',v);render();break;
    case 'play':{S.voice=v;S.playing=v;const ok=speak("You're late. I saved you a seat anyway.",v);render();if(!ok)toast('Captions only — no speech in this browser');clearTimeout(S._pt);S._pt=later(()=>{if(S.i===4){S.playing=null;render()}},3000);break}
    case 'love':S.love=v;render();if(v==='other')document.getElementById('lo1')?.focus();break;
    case 'meet':S.meet=v;S.chat=[];render();if(v==='other')document.getElementById('mo1')?.focus();break;
    case 'pick':S.archSel=v;S.archOther='';S.chat=[];S.turn=0;S.hearts=0;S.msgs=FREE;answer('archetype_alt',v);render(true);break;
    case 'preview':{const line=fillName(B().open[mk()]).replace(/&[a-z]+;/g,'');const ok=speak(line);toast(`${ok?'🔊':'▶'} “${line}”`);break}
    case 'startchat':answer('love_style',S.love);answer('meet_cute',S.meet);S.chat=[];S.turn=0;S.hearts=0;S.msgs=FREE;S.picks=[];S.mems=[];S.vnotes=0;go(10);break;
    case 'say':if(v==='✏️ Type your own'){document.getElementById('msg')?.focus();break}say(v);break;
    case 'send':{const m=document.getElementById('msg');if(m&&m.value.trim())say(m.value.trim());else m?.focus();break}
    case 'vn':{const ok=speak(vnCaption());toast(`${ok?'🔊':'▶'} “${vnCaption()}”`);break}
    case 'vnplay':{const el=document.getElementById('vnbig');if(el){el.classList.remove('playing');void el.offsetWidth;el.classList.add('playing')}const ok=speak(vnCaption());if(!ok)toast('Captions only — no speech in this browser');later(()=>{const x=document.getElementById('vnbig');if(x)x.classList.remove('playing')},8200);break}
    case 'ntime':S.ntime=v;render();break;
    case 'notif':S.notif=true;emit('notification_optin',{enabled:true,time:S.ntime});try{if('Notification' in window&&Notification.permission==='default')Notification.requestPermission()}catch(e){}next();break;
    case 'nonotif':S.notif=false;emit('notification_optin',{enabled:false});next();break;
    case 'emailgo':{const x=S.email.trim();if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(x)){S.signErr=x?'Enter a valid email':'Enter your email to continue';render();document.getElementById('em')?.focus();break}S.email=x;S.account='Email';S.signErr='';emit('lead',{method:'email'});next();break}
    case 'plan':S.plan=v;emit('plan_select',{plan:v,price:CONFIG.plans[v].price});if(cur()&&cur().querySelector('.pw.lp'))pwSync();else render();checkout(v);break;
    case 'pwjump':{const pw=cur()&&cur().querySelector('.pw.lp'),el=pw&&pw.querySelector('#pb1');if(el)pw.scrollTo({top:el.offsetTop-64,behavior:RM?'auto':'smooth'});break}
    case 'restore':emit('restore_click');if(CONFIG.app.restoreUrl)navTop(CONFIG.app.restoreUrl);break;
    case 'buy':checkout(S.plan);break;
    case 'closepw':case 'freeplan':emit('paywall_close',{placement:'onboarding',via:'close'});emit('sale_view',{plan:'lifetime'});go(SALE_LT);break;
    case 'salebuy':{const k=SALEKEY[S.i];emit('sale_accept',{plan:k});checkout(k);break}
    case 'saleno':{const k=SALEKEY[S.i];emit('sale_decline',{plan:k});checkoutDeclined(k);break}
    case 'ckpay':{document.getElementById('demock')?.remove();window.IkFunnel.completePurchase(S.ckPlan);break}
    case 'ckclose':{document.getElementById('demock')?.remove();checkoutDeclined(S.ckPlan);break}
    case 'upbuy':emit('upsell_accept',{plan:'addon'});checkout('addon');break;

    case 'midnight':emit('come_back_midnight');toast(`Your ${FREE} messages come back at midnight`);break;
    case 'openapp':openApp();break;
  }
});
