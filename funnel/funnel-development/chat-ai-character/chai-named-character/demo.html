<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A0911">
<title>ChatChi: AI Roleplay Chat · Named Character</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600&display=swap">
<style>
:root{
  color-scheme:dark;
  --ground:#06050B;
  --bg:#0A0911;--bg-elev:#12101B;--surface:#17151F;--surface-2:#221F2D;--border:#2D293B;
  --t1:#F4F2F8;--t2:#A7A2B7;--t3:#6F6A82;
  --pink:#B62CB5;--pink-hi:#DA5FD9;--pink-dim:#B62CB52E;--pink-deep:#261230;
  --grad-a:#9A2ACB;--grad-b:#D82F99;--grad:linear-gradient(135deg,var(--grad-a),var(--grad-b));
  --amber:#F5B83D;--negative:#F0705F;--positive:#7FD1A8;
  --head:"Plus Jakarta Sans","Segoe UI",system-ui,sans-serif;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--t1);font:15px/1.45 var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--pink-hi);outline-offset:2px}

.phone{position:relative;width:100%;max-width:480px;height:100vh;height:100dvh;margin:0 auto;background:var(--bg);background-image:radial-gradient(ellipse 70% 35% at 50% 0%,#240F2C 0%,transparent 70%);overflow:hidden;isolation:isolate;--top:calc(env(safe-area-inset-top,0px) + 6px)}
@media (min-width:520px){.phone{border-inline:1px solid #2A2536}}
.view{position:absolute;inset:0;padding-top:var(--top);display:flex;flex-direction:column}
.view.in{animation:vin .3s ease both}
@keyframes vin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* Honey-style top bar: back · title · segmented progress */
.nav{flex:none;padding:0 12px;position:relative;z-index:3}
.nav .row{height:44px;display:flex;align-items:center}
.nav .ttl{flex:1;text-align:center;font:700 15px var(--head);margin-right:44px}
.iconbtn{width:44px;height:44px;border-radius:50%;border:none;background:transparent;display:grid;place-items:center;color:var(--t2)}
.segs{display:flex;gap:4px;padding:0 20px 6px}
.segs i{flex:1;height:4px;border-radius:2px;background:var(--surface-2)}
.segs i.on{background:var(--grad)}
.scr{flex:1;overflow-y:auto;overflow-x:hidden;padding:8px 16px 16px;display:flex;flex-direction:column;gap:14px;scrollbar-width:none}
.scr::-webkit-scrollbar{display:none}
.foot{flex:none;padding:10px 16px max(18px,calc(env(safe-area-inset-bottom,0px) + 10px));display:flex;flex-direction:column;gap:8px;position:relative;z-index:2;background:linear-gradient(180deg,transparent,var(--bg) 30%)}
.q{font:800 22px/1.2 var(--head);letter-spacing:-.01em;margin:4px 0 0;text-align:center;text-wrap:balance}
.sub{margin:-6px 0 0;text-align:center;color:var(--t2);font-size:13.5px}
.h1{font:800 30px/1.1 var(--head);letter-spacing:-.02em;margin:0;text-align:center;text-wrap:balance}
.gt{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}

.btn{height:54px;border-radius:14px;border:none;background:var(--pink);color:#fff;font:700 16px/1 var(--head);width:100%;display:flex;align-items:center;justify-content:center;gap:10px;flex:none;transition:transform .12s,opacity .2s;position:relative;overflow:hidden;box-shadow:0 10px 30px -12px #B62CB5cc}
.btn:active{transform:scale(.98)}
.btn[disabled]{background:var(--surface-2);color:var(--t3);box-shadow:none}
.btn:not([disabled])::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:0;background:linear-gradient(100deg,transparent,#ffffff45,transparent);transform:translateX(-150%) skewX(-20deg);animation:sheen 4.5s ease-in-out 1.2s infinite}
@keyframes sheen{0%{transform:translateX(-150%) skewX(-20deg)}28%,100%{transform:translateX(320%) skewX(-20deg)}}
.btn.ghost{background:var(--surface);border:1px solid var(--border);color:var(--t1);box-shadow:none;height:48px}
.btn.ghost::after{display:none}
.link{background:none;border:none;color:var(--t2);font-size:14px;min-height:44px}
.legal{font-size:11.5px;color:var(--t3);text-align:center;line-height:1.5}
.legal a,.wfoot a{display:inline-flex;align-items:center;min-height:40px;padding:0 6px;font-size:13px;color:var(--pink-hi);text-decoration:underline;text-underline-offset:3px;vertical-align:middle}

/* photo cards (Honey's core element) */
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{position:relative;border-radius:16px;overflow:hidden;border:2px solid var(--border);background:var(--surface);padding:0;aspect-ratio:3/3.4;display:block;text-align:left;transition:border-color .15s,box-shadow .2s,transform .12s}
.card.tall{aspect-ratio:3/4.1}
.card:active{transform:scale(.97)}
.card .ph{position:absolute;inset:0;display:grid;place-items:center;font-size:44px;background:var(--fb,linear-gradient(160deg,#2a1838,#0d0a18))}
.card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 22%}
.card .lb{position:absolute;left:0;right:0;bottom:0;padding:9px 10px;background:#0A0911e0;font:700 14px/1.2 var(--head);text-align:center;display:flex;align-items:center;justify-content:center;gap:8px;min-height:40px}
.card .ck{width:20px;height:20px;border-radius:6px;border:1.5px solid #ffffff55;flex:none;display:grid;place-items:center;position:absolute;right:9px;bottom:10px}
.card.multi .lb{justify-content:flex-start;padding-right:36px;text-align:left}
.card.on{border-color:transparent;box-shadow:0 0 0 2px var(--grad-b),0 0 24px -4px #B62CB5aa}
.card.on::before{content:"";position:absolute;inset:-2px;border-radius:16px;padding:2px;background:var(--grad);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;z-index:2;pointer-events:none}
.card.on .ck{background:var(--grad);border-color:transparent}
.ck svg{opacity:0;transition:opacity .15s}.on .ck svg{opacity:1}
.collage{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr}
.collage img{position:static;width:100%;height:100%}

.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:flex;align-items:center;gap:12px;padding:14px;border-radius:14px;background:var(--surface);border:1.5px solid var(--border);text-align:left;width:100%;min-height:54px}
.opt .em{font-size:19px;width:24px;text-align:center}
.opt .lbl{flex:1;font-weight:600}
.opt .ck{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--border);display:grid;place-items:center}
.opt.on{border-color:var(--pink);background:linear-gradient(0deg,var(--pink-dim),var(--pink-dim)),var(--surface)}
.opt.on .ck{background:var(--grad);border-color:transparent}
.box{height:50px;border-radius:14px;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;padding:0 14px}
.box input{flex:1;min-width:0;background:transparent;border:none;outline:none;color:var(--t1);font:400 16px var(--sans)}

/* sliders */
.sls{display:flex;flex-direction:column;gap:6px;padding:8px 14px;border-radius:18px;background:var(--surface);border:1px solid var(--border)}
.sl{padding:12px 0;border-top:1px solid var(--border)}
.sl:first-child{border-top:none}
.sl .top{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px}
.sl .top .gi{width:30px;height:30px;border-radius:9px;background:var(--pink-dim);display:grid;place-items:center}
.sl .top b{margin-left:auto;font:600 13px var(--sans);padding:4px 9px;border-radius:8px;background:var(--surface-2);border:1px solid var(--border);font-variant-numeric:tabular-nums}
.sl input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:44px;background:linear-gradient(90deg,var(--grad-a),var(--grad-b) var(--p,50%),var(--surface-2) var(--p,50%));background-clip:content-box;padding:19px 0;outline:none;margin:0}
.sl input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:#fff;border:3px solid var(--pink);box-shadow:0 2px 10px #0008}
.sl input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:#fff;border:3px solid var(--pink)}
.hint{font-size:12.5px;color:var(--t3);text-align:center}

/* bridge */
.bridge{flex:1;position:relative;margin:0 -16px -16px;min-height:0}
.bridge img,.bridge .ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 15%}
.bridge .ph{display:grid;place-items:center;font-size:80px;background:linear-gradient(160deg,#2a1838,#0d0a18)}
.bridge::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,var(--bg) 0%,transparent 18%,transparent 70%,var(--bg) 100%)}

/* loader */
.ldimg{position:relative;flex:1;min-height:180px;margin:0 -16px;overflow:hidden}
.ldimg img,.ldimg .ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 20%;filter:blur(var(--bl,18px)) saturate(1.1);transform:scale(1.08);transition:filter .3s linear}
.ldimg .ph{display:block;background:radial-gradient(circle at 50% 35%,#6a2a6a,#0d0a18 70%)}
.ldimg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,var(--bg) 0%,transparent 25%,transparent 60%,var(--bg) 100%)}
.steps{display:flex;flex-direction:column;gap:12px;position:relative;z-index:1}
.step .top{display:flex;justify-content:space-between;font-size:14px;color:var(--t2);margin-bottom:6px}
.step.done .top{color:var(--t1)}
.step .top b{font-variant-numeric:tabular-nums;font-weight:600}
.step.done .top b{color:var(--pink-hi)}
.bar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.bar span{display:block;height:100%;background:var(--grad);width:0}
.iq{position:absolute;left:0;right:0;bottom:0;z-index:40;padding:20px 16px max(20px,calc(env(safe-area-inset-bottom,0px) + 12px));background:linear-gradient(180deg,transparent,var(--bg) 22%);display:flex;flex-direction:column;gap:14px;animation:up .35s cubic-bezier(.2,.8,.2,1)}
.iq b{display:block;font:800 20px/1.25 var(--head);text-align:center}
.iq .row{display:flex;gap:10px}
.iq .row .btn{flex:1}
@keyframes up{from{transform:translateY(40px);opacity:0}}
#demock{background:var(--bg-elev);border-top:1px solid var(--border);border-radius:22px 22px 0 0;box-shadow:0 0 0 100vmax #0009}   /* demo checkout: a solid sheet over a scrim, nothing behind it shows through */

/* paywall (long scroll) */
.pw{position:absolute;inset:0;z-index:10;overflow-y:auto;scrollbar-width:none;background:var(--bg)}
.pw::-webkit-scrollbar{display:none}
.pwx{position:fixed;z-index:9;top:calc(var(--top) + 6px);width:36px;height:36px;border-radius:50%;background:#0A0911aa;border:1px solid #ffffff22;color:var(--t2);display:grid;place-items:center;margin-left:12px;backdrop-filter:blur(6px)}
.sec{padding:26px 16px 0}
.pwhero{position:relative;height:430px;overflow:hidden}
.pwhero img,.pwhero .ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 18%}
.pwhero .ph{display:block;background:radial-gradient(circle at 50% 35%,#6a2a6a,#0d0a18 70%)}
.pwhero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,var(--bg) 96%)}
.pwhero .txt{position:absolute;left:16px;right:16px;bottom:8px;z-index:1}
.pwhero .h1{text-align:left;font-size:34px}
.pwhero p{margin:6px 0 0;color:var(--t2)}
.plans{display:flex;flex-direction:column;gap:10px}
.plan{position:relative;padding:14px 16px;border-radius:16px;border:1.5px solid var(--border);background:var(--surface);text-align:left;display:grid;grid-template-columns:24px 1fr auto;gap:2px 12px;align-items:center;width:100%}
.plan .rd{width:22px;height:22px;border-radius:50%;border:2px solid var(--border);grid-row:1/3;display:grid;place-items:center}
.plan.on{border-color:var(--pink);background:var(--pink-deep);box-shadow:0 0 20px -8px #B62CB5}
.plan.on .rd{background:var(--grad);border-color:transparent}
.plan .pn{font:800 17px var(--head)}
.plan .pp{font:800 19px/1.1 var(--head);text-align:right}
.plan .pp small{font:500 11px var(--sans);color:var(--t2)}
.plan .rn{font-size:11.5px;color:var(--t2);grid-column:2/4}
.plan .bv{position:absolute;top:-10px;left:50%;transform:translateX(-50%);font:700 11px/1 var(--head);letter-spacing:.06em;background:var(--grad);color:#fff;padding:5px 12px;border-radius:999px;white-space:nowrap}
.ph2{font-family:ui-monospace,Consolas,monospace;font-size:.82em;font-weight:600;padding:1px 5px;border-radius:6px;border:1px dashed var(--amber);color:var(--amber);background:#F5B83D14;white-space:nowrap}
.fine{font-size:11.5px;color:var(--t3);text-align:center;margin-top:10px;line-height:1.45}
.h2{font:800 26px/1.15 var(--head);margin:0 0 14px;letter-spacing:-.01em}
.match{display:flex;gap:16px;align-items:center}
.ring{width:118px;height:118px;flex:none;border-radius:50%;background:conic-gradient(var(--grad-b) calc(var(--m)*1%),var(--grad-a) calc(var(--m)*1%),var(--surface-2) 0);display:grid;place-items:center;position:relative}
.ring::before{content:"";position:absolute;inset:8px;border-radius:50%;background:var(--bg)}
.ring span{position:relative;text-align:center;font:800 26px/1 var(--head)}
.ring small{display:block;font:500 12px var(--sans);color:var(--t2);margin-top:4px}
.traits{display:flex;flex-direction:column;gap:10px;font-weight:600}
.traits div{display:flex;gap:10px;align-items:center}
.gw{width:32px;height:32px;border-radius:10px;background:var(--grad);display:grid;place-items:center;color:#fff;flex:none}
.pcard{margin-top:16px;border-radius:20px;overflow:hidden;position:relative;aspect-ratio:3/3.6;border:1px solid var(--border)}
.pcard img,.pcard .ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 20%}
.pcard .ph{display:block;background:radial-gradient(circle at 50% 35%,#6a2a6a,#0d0a18 70%)}
.pcard .cap{position:absolute;left:0;right:0;bottom:0;padding:40px 14px 12px;background:linear-gradient(180deg,transparent,#0A0911f0);display:flex;justify-content:space-between;align-items:flex-end}
.pcard .cap b{font:800 24px var(--head)}
.pcard .cap small{font-size:11px;color:var(--t3)}
.bens{display:flex;flex-direction:column;gap:9px}
.ben{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--border)}
.ben b{display:block;font:700 15px var(--head)}
.ben small{color:var(--t2);font-size:12.5px}
.ben .tg{margin-left:auto;font:700 10px var(--sans);letter-spacing:.05em;padding:3px 7px;border-radius:6px;background:var(--pink-dim);color:var(--pink-hi)}
.stats{display:flex;flex-direction:column;gap:10px}
.stat{display:flex;gap:14px;align-items:center;padding:14px;border-radius:16px;background:var(--surface);border:1px solid var(--border);font-size:14px}
.stat .n{font:800 22px var(--head);flex:none;min-width:64px;text-align:center}
.mock{border-radius:26px;border:1px solid var(--border);background:var(--bg-elev);padding:12px;display:flex;flex-direction:column;gap:9px;position:relative;overflow:hidden}
.mock .hd{display:flex;gap:10px;align-items:center;padding-bottom:9px;border-bottom:1px solid var(--border)}
.mock .hd b{font:700 15px var(--head)}
.mock .hd small{display:block;color:var(--positive);font-size:11.5px}
.rev{padding:14px;border-radius:16px;background:var(--surface);border:1px solid var(--border);display:flex;flex-direction:column;gap:6px;font-size:13.5px;color:var(--t2)}
.rev .who{display:flex;gap:10px;align-items:center;color:var(--t1)}
.rev .who i{width:34px;height:34px;border-radius:50%;background:var(--grad);display:grid;place-items:center;font:700 12px var(--head);font-style:normal;color:#fff}
.rev .st{margin-left:auto;color:var(--amber);letter-spacing:2px;font-size:13px}
.guar{margin:26px 16px 0;padding:18px;border-radius:18px;border:1.5px solid var(--pink);background:var(--pink-deep);font-size:13.5px;color:var(--t2)}
.guar b{display:block;font:800 20px var(--head);color:var(--t1);margin-bottom:6px}

/* chat */
.chat{position:absolute;inset:0;top:var(--top);display:flex;flex-direction:column}
.chead{flex:none;display:flex;align-items:center;gap:10px;padding:4px 12px 8px;border-bottom:1px solid var(--border);background:var(--bg);z-index:2}
.chead b{font:700 17px/1.1 var(--head);display:block}
.chead small{font-size:12px;color:var(--positive)}
.av{position:relative;border-radius:50%;overflow:hidden;flex:none;background:var(--grad);display:grid;place-items:center;font-size:18px}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 15%}
.cbody{flex:1;position:relative;overflow:hidden;display:flex;flex-direction:column}
.cbg{position:absolute;inset:0;background:var(--scene) center/cover no-repeat,linear-gradient(160deg,#2a1838,#0d0a18);opacity:.4}
.cbg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,var(--bg),transparent 30%,transparent 55%,var(--bg))}
.disclose{position:relative;z-index:1;margin:10px 16px 0;padding:8px 12px;border-radius:12px;background:#17151FE6;color:var(--t3);font-size:11.5px;text-align:center}
.msgs{position:relative;z-index:1;flex:1;overflow-y:auto;padding:12px 16px;display:flex;flex-direction:column;gap:10px;scrollbar-width:none}
.msgs .sp{flex:1}
.bub{padding:11px 14px;border-radius:18px;max-width:82%;font-size:15px;line-height:1.4;animation:fi .3s ease}
.bub.c{align-self:flex-start;background:var(--surface-2);border-bottom-left-radius:6px}
.bub.u{align-self:flex-end;background:var(--pink);color:#fff;border-bottom-right-radius:6px}
.bub.sys{align-self:center;background:none;color:var(--t3);font-size:12px;padding:2px}
.typing{display:inline-flex;gap:4px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--t3);animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{50%{opacity:.3}}
.ideas{position:relative;z-index:1;display:flex;flex-direction:column;gap:8px;padding:0 16px 10px}
.ideas button{min-height:44px;padding:11px 14px;border-radius:14px;background:#17151FE6;border:1px solid var(--border);text-align:left;font-size:14px;color:var(--t2)}
.cfoot{flex:none;border-top:1px solid var(--border);padding:10px 14px max(14px,calc(env(safe-area-inset-bottom,0px) + 8px));display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.counter{font-size:12px;color:var(--t3);font-variant-numeric:tabular-nums}
.counter.out{color:var(--negative)}
.composer{display:flex;gap:8px}
.composer .box{flex:1;border-radius:999px;height:48px}
.send{width:48px;height:48px;border-radius:50%;border:none;background:var(--pink);color:#fff;display:grid;place-items:center;flex:none}
.send[disabled]{background:var(--surface-2);color:var(--t3)}
.limit{padding:18px 16px;border-radius:18px;border:1.5px solid var(--pink);background:#17151FF2;display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center;animation:fi .4s ease}
.limit h3{margin:0;font:800 20px/1.2 var(--head)}
.limit p{margin:0;color:var(--t2);font-size:14px}
.limit .crown *{stroke:url(#cgrad)}
.toast{position:absolute;left:50%;top:calc(var(--top) + 6px);transform:translateX(-50%);z-index:20;background:var(--t1);color:#0A0911;font-size:13px;font-weight:500;padding:9px 14px;border-radius:999px;white-space:nowrap;animation:fade 2.8s ease forwards}
@keyframes fade{0%{opacity:0}10%,80%{opacity:1}100%{opacity:0}}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.gicon *{stroke:url(#cgrad)}
.logo{display:flex;align-items:center;justify-content:center;gap:8px;font:800 17px var(--head)}
svg .lg{fill:url(#cgrad-logo)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}

/* sale / lifetime / add-on cards (same web look as the paywall) */
.ofr .pwtop .logo{font-size:16px}
.oeye{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--pink-dim);color:var(--pink-hi);font:600 12px/1 var(--sans);letter-spacing:.02em}
.ocard{position:relative;margin-top:6px;padding:22px 16px 16px;border-radius:24px;border:1.5px solid var(--pink);background:radial-gradient(ellipse at 50% 0%,var(--pink-dim),transparent 65%),var(--surface);box-shadow:0 0 0 4px var(--pink-dim),0 30px 60px -30px #000;display:flex;flex-direction:column;gap:14px;flex:none}
.orow{display:flex;gap:12px;align-items:center}
.orow b{font:700 17px/1.2 var(--head)}

/* leaving a checkout without paying: go where CONFIG.declineFlow says (FunnelFox's native checkout close does the same) */
function checkoutDeclined(plan){emit('checkout_decline',{plan});const n=gate(DECLINE(plan));
  if(SALEKEY[n])emit('sale_view',{plan:SALEKEY[n]});go(n)}
/* demo-only checkout sheet when no checkout URL is configured (FunnelFox replaces checkout() with its native screen) */
function demoCheckout(plan){const p=CONFIG.plans[plan];S.ckPlan=plan;
  const el=document.createElement('div');el.className='iq';el.id='demock';
  el.innerHTML=`<div class="iqc"><b>Demo checkout</b><p style="margin:6px 0 14px;text-align:center;color:var(--t2)">${plan==='addon'?'ChatChi':'ChatChi Plus'} · ${esc(p.label)} · ${otok(p.price)}</p><div style="display:flex;flex-direction:column;gap:8px"><button class="btn" data-a="ckpay">Pay</button><button class="btn ghost" data-a="ckclose">Close without paying</button></div></div>`;
  phone.appendChild(el)}

function render(anim){
  /* hard paywall guard: a non-paying user never sees the chat (restore, debug, host navigation all land here) */
  if(freeChat(S.i)){S.i=PAYWALL;S.sheet=null;if(typeof ffGo==='function'&&typeof IKF_SID!=='undefined')setTimeout(()=>ffGo(IKF_SID[PAYWALL]),0)}
  /* back into a taste chat after the 2 replies: read-only, then forward to the questions again */
  if(TASTE.includes(S.i)&&S.teaserDone&&!S.ho&&!FWD){FWD=1;later(()=>{FWD=0;go(6,false)},RM?300:1200)}
  if([3,4,9,10,15].includes(S.i)){if(!S.shown[S.i]){S.shown[S.i]=true;S.typing=true;later(()=>{S.typing=false;render()},RM?0:(S.i===10?1300:900))}}
  const v=document.createElement('div');v.className='view'+(anim&&!RM?' in':'');
  v.innerHTML=V[S.i]();
  const old=cur();if(old)old.replaceWith(v);else phone.appendChild(v);
  if(S.blocked)phone.insertAdjacentHTML('beforeend',`<div class="blocked" id="blk"><h1 class="q">Sorry, ChatChi is for adults</h1><p class="sub">You must be 18 or older to continue.</p><button class="btn ghost" data-a="agereset" style="margin-top:6px">Change my birth date</button></div>`);
  else document.getElementById('blk')?.remove();
  if(S.i===11)runLoader();
  if(document.getElementById('pw'))pwSetup();
  const m=document.getElementById('msgs');if(m)m.scrollTop=m.scrollHeight;
}

function fillTo(n){
  if(n>2&&!S.year)S.year='1995';
  [3,4].forEach(k=>{if(n>k&&!S.r[k])S.r[k]=C.r[k-3][0]});
  if(n>6&&!S.name&&!S.skipName)S.skipName=true;
  if(n>7&&!S.i1)S.i1='books';if(n>8&&!S.i2)S.i2='home';
  if(n>12&&!S.email)S.email='demo@example.com';
  if(n>4)S.teaserDone=true;if(n>=13)S.shown[15]=true;
  if(n>=21)S.premium=true;
}
/* chat taste: CONFIG.teaserMessages replies (screens 3-4). After the last one: no input, the character types ~1.5s, then the questions */
function repDone(){const k=S.i-2;if(k<CONFIG.teaserMessages){next();return}
  S.teaserDone=true;S.ho=true;S.other=false;S.typing=true;emit('chat_teaser_end',{count:k});render();
  later(()=>{S.ho=false;go(6)},RM?300:1500)}
const sendBtn=()=>cur().querySelector('.send,[data-a="othersend"]');
phone.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b||b.disabled)return;
  const a=b.dataset.a,v=b.dataset.v;
  switch(a){
    case 'next':next();break;
    case 'back':back();break;
    case 'agereset':S.blocked=false;S.year='';S.month='';try{sessionStorage.removeItem('ikf_age_block')}catch(e){}emit('age_change');render(true);break;
    case 'age':{const now=new Date(),age=now.getFullYear()-(+S.year)-((now.getMonth()+1)<(+S.month)?1:0);
      if(!(age>=18)){S.blocked=true;try{sessionStorage.setItem('ikf_age_block','1')}catch(e){}emit('age_block');render();break}
      emit('age_confirm',{method:'birth_year'});next();break}
    case 'rep':S.r[S.i]=C.r[S.i-3][+v];answer('reply_'+(S.i-2),+v);b.classList.add('on');later(repDone,RM?0:260);break;
    case 'repother':S.other=!S.other;S.otherTxt='';render();cur().querySelector('#oth')?.focus();break;
    case 'othersend':{const x=S.otherTxt.trim();if(!x)break;S.r[S.i]=x;answer('reply_'+(S.i-2),'other');repDone();break}
    case 'namesend':{if(!S.name.trim())break;S.skipName=false;answer('name','given');next();break}
    case 'skipname':S.name='';S.skipName=true;answer('name','skipped');next();break;
    case 'int':{const f=S.i===7?'i1':'i2';S[f]=v;if(v!=='other')S[f+'o']='';render();if(v==='other')cur().querySelector('#intOther')?.focus();break}
    case 'intnext':{const f=S.i===7?'i1':'i2';answer(S.i===7?'interest_1':'interest_2',S[f]);next();break}
    case 'vplay':{const el=document.getElementById('voice');if(!el)break;S.vplay=!S.vplay;el.classList.toggle('play',S.vplay);emit('voice_play');
      clearTimeout(window.__vp);if(S.vplay)window.__vp=setTimeout(()=>{S.vplay=false;el.classList.remove('play')},8000);break}
    case 'email':{const x=(document.getElementById('email')?.value||S.email).trim();S.email=x;
      if(!x){S.emailErr='Add your email to see the reply';render();break}
      if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(x)){S.emailErr="That email doesn't look right";render();break}
      S.email=x;emit('lead',{placement:'email_gate'});emit('email_submit');go(13);break}
    case 'topl':document.getElementById('plans1')?.scrollIntoView({behavior:RM?'auto':'smooth',block:'start'});break;
    case 'plan':S.plan=v;emit('plan_select',{plan:v,price:CONFIG.plans[v].price});syncPlan();checkout(v);break;
    case 'buy':checkout(S.plan);break;
    case 'salebuy':{const k=SALEKEY[S.i];emit('sale_accept',{plan:k});checkout(k);break}
    case 'saleno':{const k=SALEKEY[S.i];emit('sale_decline',{plan:k});checkoutDeclined(k);break}
    case 'ckpay':{document.getElementById('demock')?.remove();window.IkFunnel.completePurchase(S.ckPlan);break}
    case 'ckclose':{document.getElementById('demock')?.remove();checkoutDeclined(S.ckPlan);break}
    case 'upbuy':emit('upsell_accept',{plan:'addon'});checkout('addon');break;
    case 'upno':emit('upsell_decline');go(GETAPP);break;
    case 'keepchat':go(15);break;   /* paid users only; gate() sends anyone else to the paywall */
    case 'say':say(v);break;
    /* paywall X -> sale_lifetime, every time; sale_lifetime No/X -> back to the paywall (CONFIG.declineFlow.lifetime). No free tier. */
    case 'closepw':emit('paywall_close',{placement:'onboarding',via:'close'});emit('sale_view',{plan:'lifetime'});go(SALE_LT);break;
    case 'send':{const m=document.getElementById('msg');if(m&&m.value.trim())say(m.value.trim());else m?.focus();break}
    case 'upgrade':S.sheet='pw';render();emit('paywall_view',{placement:'limit'});break;
    case 'closeq':S.sheet=null;emit('paywall_close',{placement:'limit',via:'close'});emit('sale_view',{plan:'lifetime'});go(SALE_LT);break;
    case 'midnight':go(PAYWALL);break;
    case 'openapp':openApp();break;
  }
});
phone.addEventListener('input',e=>{
  const id=e.target.id;
  if(id==='oth'){S.otherTxt=e.target.value;const s=cur().querySelector('[data-a="othersend"]');if(s)s.disabled=!S.otherTxt.trim()}
  else if(id==='nameIn'){S.name=e.target.value;const s=cur().querySelector('[data-a="namesend"]');if(s)s.disabled=!S.name.trim()}
  else if(id==='intOther'){const f=S.i===7?'i1o':'i2o';S[f]=e.target.value;const s=cur().querySelector('[data-a="intnext"]');if(s)s.disabled=!e.target.value.trim()}
  else if(id==='email'){S.email=e.target.value}
});
phone.addEventListener('change',e=>{if(e.target.id==='yr'||e.target.id==='mo'){if(e.target.id==='yr')S.year=e.target.value;else S.month=e.target.value;const s=cur().querySelector('[data-a="age"]');if(s)s.disabled=!(S.year&&S.month)}});
phone.addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;
  const id=e.target.id;
  const map={msg:'send',oth:'othersend',nameIn:'namesend',email:'email'};
  if(map[id])cur().querySelector(`[data-a="${map[id]}"]`)?.click();
});

/* Host API: the page embedding this funnel can complete a purchase or read the picks. */
window.IkFunnel=Object.assign(window.IkFunnel||{},{config:CONFIG,data:snapshot,
  /* one line: the FunnelFox build reads the landing screen from go(AFTER). The one-time add-on keeps the plan just bought (S.subPlan; the FunnelFox checkout sets S.plan='addon') and lands on get-app. */
  completePurchase:(plan)=>{const add=plan==='addon';if(add){S.addon=true;AFTER=GETAPP}else{if(plan&&CONFIG.plans[plan])S.plan=plan;S.subPlan=S.plan;AFTER=CONFIG.plans[S.plan]&&CONFIG.plans[S.plan].oneTime?GETAPP:UPSELL}S.premium=true;S.sheet=null;S.teaserDone=true;S.gate=false;emit('purchase_complete',{plan:add?'addon':S.plan});go(AFTER);later(()=>toast(add?CONFIG.upsell.name+' added.':'Unlimited chat is on. Enjoy.'),1600)}});
if(DEBUG)window.IkFunnel.go=n=>{clearT();fillTo(n);go(n)};
if(DEBUG){const m=location.hash.match(/s=?([0-9]+)/);if(m&&V[+m[1]]){fillTo(+m[1]);S.i=+m[1]}}
{let ref='';try{ref=document.referrer?new URL(document.referrer).hostname:''}catch(e){}emit('funnel_start',{referrer:ref})}
render();viewed();
</script>
