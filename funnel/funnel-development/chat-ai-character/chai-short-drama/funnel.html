<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A0911">
<title>ChatChi: AI Roleplay Chat · Short Drama</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600&display=swap">
<style>
:root{
  color-scheme:dark;
  --ground:#06050B;
  --bg:#0A0911;--bg-elev:#12101B;--surface:#17151F;--surface-2:#221F2D;--border:#2D293B;
  --t1:#F4F2F8;--t2:#A7A2B7;--t3:#6F6A82;
  --pink:#B62CB5;--pink-hi:#DA5FD9;--pink-dim:#B62CB52E;--pink-deep:#261230;
  --grad-a:#9A2ACB;--grad-b:#D82F99;--grad:linear-gradient(135deg,var(--grad-a),var(--grad-b));
  --amber:#F5B83D;--negative:#F0705F;--positive:#7FD1A8;
  --head:"Plus Jakarta Sans","Segoe UI",system-ui,sans-serif;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--t1);font:15px/1.45 var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--pink-hi);outline-offset:2px}

.phone{position:relative;width:100%;max-width:480px;height:100vh;height:100dvh;margin:0 auto;background:var(--bg);background-image:radial-gradient(ellipse 70% 35% at 50% 0%,#240F2C 0%,transparent 70%);overflow:hidden;isolation:isolate;--top:calc(env(safe-area-inset-top,0px) + 6px)}
@media (min-width:520px){.phone{border-inline:1px solid #2A2536}}
.view{position:absolute;inset:0;padding-top:var(--top);display:flex;flex-direction:column}
.view.in{animation:vin .3s ease both}
@keyframes vin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* Honey-style top bar: back · title · segmented progress */
.nav{flex:none;padding:0 12px;position:relative;z-index:3}
.nav .row{height:44px;display:flex;align-items:center}
.nav .ttl{flex:1;text-align:center;font:700 15px var(--head);margin-right:44px}
.iconbtn{width:44px;height:44px;border-radius:50%;border:none;background:transparent;display:grid;place-items:center;color:var(--t2)}
.segs{display:flex;gap:4px;padding:0 20px 6px}
.segs i{flex:1;height:4px;border-radius:2px;background:var(--surface-2)}
.segs i.on{background:var(--grad)}
.scr{flex:1;overflow-y:auto;overflow-x:hidden;padding:8px 16px 16px;display:flex;flex-direction:column;gap:14px;scrollbar-width:none}
.scr::-webkit-scrollbar{display:none}
.foot{flex:none;padding:10px 16px max(18px,calc(env(safe-area-inset-bottom,0px) + 10px));display:flex;flex-direction:column;gap:8px;position:relative;z-index:2;background:linear-gradient(180deg,transparent,var(--bg) 30%)}
.q{font:800 22px/1.2 var(--head);letter-spacing:-.01em;margin:4px 0 0;text-align:center;text-wrap:balance}
.sub{margin:-6px 0 0;text-align:center;color:var(--t2);font-size:13.5px}
.h1{font:800 30px/1.1 var(--head);letter-spacing:-.02em;margin:0;text-align:center;text-wrap:balance}
.gt{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}

.btn{height:54px;border-radius:14px;border:none;background:var(--pink);color:#fff;font:700 16px/1 var(--head);width:100%;display:flex;align-items:center;justify-content:center;gap:10px;flex:none;transition:transform .12s,opacity .2s;position:relative;overflow:hidden;box-shadow:0 10px 30px -12px #B62CB5cc}
.btn:active{transform:scale(.98)}
.btn[disabled]{background:var(--surface-2);color:var(--t3);box-shadow:none}
.btn:not([disabled])::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:0;background:linear-gradient(100deg,transparent,#ffffff45,transparent);transform:translateX(-150%) skewX(-20deg);animation:sheen 4.5s ease-in-out 1.2s infinite}
@keyframes sheen{0%{transform:translateX(-150%) skewX(-20deg)}28%,100%{transform:translateX(320%) skewX(-20deg)}}
.btn.ghost{background:var(--surface);border:1px solid var(--border);color:var(--t1);box-shadow:none;height:48px}
.btn.ghost::after{display:none}
.link{background:none;border:none;color:var(--t2);font-size:14px;min-height:44px}
.legal{font-size:11.5px;color:var(--t3);text-align:center;line-height:1.5}
.legal a{color:var(--t2);text-decoration:underline;text-underline-offset:2px}

/* photo cards (Honey's core element) */
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{position:relative;border-radius:16px;overflow:hidden;border:2px solid var(--border);background:var(--surface);padding:0;aspect-ratio:3/3.4;display:block;text-align:left;transition:border-color .15s,box-shadow .2s,transform .12s}
.card.tall{aspect-ratio:3/4.1}
.card:active{transform:scale(.97)}
.card .ph{position:absolute;inset:0;display:grid;place-items:center;font-size:44px;background:var(--fb,linear-gradient(160deg,#2a1838,#0d0a18))}
.card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 22%}
.card .lb{position:absolute;left:0;right:0;bottom:0;padding:9px 10px;background:#0A0911e0;font:700 14px/1.2 var(--head);text-align:center;display:flex;align-items:center;justify-content:center;gap:8px;min-height:40px}
.card .ck{width:20px;height:20px;border-radius:6px;border:1.5px solid #ffffff55;flex:none;display:grid;place-items:center;position:absolute;right:9px;bottom:10px}
.card.multi .lb{justify-content:flex-start;padding-right:36px;text-align:left}
.card.on{border-color:transparent;box-shadow:0 0 0 2px var(--grad-b),0 0 24px -4px #B62CB5aa}
.card.on::before{content:"";position:absolute;inset:-2px;border-radius:16px;padding:2px;background:var(--grad);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;z-index:2;pointer-events:none}
.card.on .ck{background:var(--grad);border-color:transparent}
.ck svg{opacity:0;transition:opacity .15s}.on .ck svg{opacity:1}
.collage{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr}
.collage img{position:static;width:100%;height:100%}

.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:flex;align-items:center;gap:12px;padding:14px;border-radius:14px;background:var(--surface);border:1.5px solid var(--border);text-align:left;width:100%;min-height:54px}
.opt .em{font-size:19px;width:24px;text-align:center}
.opt .lbl{flex:1;font-weight:600}
.opt .ck{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--border);display:grid;place-items:center}
.opt.on{border-color:var(--pink);background:linear-gradient(0deg,var(--pink-dim),var(--pink-dim)),var(--surface)}
.opt.on .ck{background:var(--grad);border-color:transparent}
.box{height:50px;border-radius:14px;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;padding:0 14px}
.box input{flex:1;min-width:0;background:transparent;border:none;outline:none;color:var(--t1);font:400 16px var(--sans)}

/* sliders */
.sls{display:flex;flex-direction:column;gap:6px;padding:8px 14px;border-radius:18px;background:var(--surface);border:1px solid var(--border)}
.sl{padding:12px 0;border-top:1px solid var(--border)}
.sl:first-child{border-top:none}
.sl .top{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px}
.sl .top .gi{width:30px;height:30px;border-radius:9px;background:var(--pink-dim);display:grid;place-items:center}
.sl .top b{margin-left:auto;font:600 13px var(--sans);padding:4px 9px;border-radius:8px;background:var(--surface-2);border:1px solid var(--border);font-variant-numeric:tabular-nums}
.sl input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:44px;background:linear-gradient(90deg,var(--grad-a),var(--grad-b) var(--p,50%),var(--surface-2) var(--p,50%));background-clip:content-box;padding:19px 0;outline:none;margin:0}
.sl input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:#fff;border:3px solid var(--pink);box-shadow:0 2px 10px #0008}
.sl input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:#fff;border:3px solid var(--pink)}
.hint{font-size:12.5px;color:var(--t3);text-align:center}

/* bridge */
.bridge{flex:1;position:relative;margin:0 -16px -16px;min-height:0}
.bridge img,.bridge .ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 15%}
.bridge .ph{display:grid;place-items:center;font-size:80px;background:linear-gradient(160deg,#2a1838,#0d0a18)}
.bridge::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,var(--bg) 0%,transparent 18%,transparent 70%,var(--bg) 100%)}

/* loader */
.ldimg{position:relative;flex:1;min-height:180px;margin:0 -16px;overflow:hidden}
.ldimg img,.ldimg .ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 20%;filter:blur(var(--bl,18px)) saturate(1.1);transform:scale(1.08);transition:filter .3s linear}
.ldimg .ph{display:block;background:radial-gradient(circle at 50% 35%,#6a2a6a,#0d0a18 70%)}
.ldimg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,var(--bg) 0%,transparent 25%,transparent 60%,var(--bg) 100%)}
.steps{display:flex;flex-direction:column;gap:12px;position:relative;z-index:1}
.step .top{display:flex;justify-content:space-between;font-size:14px;color:var(--t2);margin-bottom:6px}
.step.done .top{color:var(--t1)}
.step .top b{font-variant-numeric:tabular-nums;font-weight:600}
.step.done .top b{color:var(--pink-hi)}
.bar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.bar span{display:block;height:100%;background:var(--grad);width:0}
.iq{position:absolute;left:0;right:0;bottom:0;z-index:30;padding:20px 16px max(20px,calc(env(safe-area-inset-bottom,0px) + 12px));background:linear-gradient(180deg,transparent,var(--bg) 22%);display:flex;flex-direction:column;gap:14px;animation:up .35s cubic-bezier(.2,.8,.2,1)}
.iq b{font:800 20px/1.25 var(--head);text-align:center}
.iq .row{display:flex;gap:10px}
.iq .row .btn{flex:1}
@keyframes up{from{transform:translateY(40px);opacity:0}}

/* paywall (long scroll) */
.pw{position:absolute;inset:0;z-index:20;overflow-y:auto;scrollbar-width:none;background:var(--bg)}
.pw::-webkit-scrollbar{display:none}
.pwx{width:36px;height:36px;border-radius:50%;background:#ffffff0d;border:1px solid #ffffff22;color:var(--t2);display:grid;place-items:center;flex:none}
.sec{padding:26px 16px 0}
.pwhero{position:relative;height:430px;overflow:hidden}
.pwhero img,.pwhero .ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 18%}
.pwhero .ph{display:block;background:radial-gradient(circle at 50% 35%,#6a2a6a,#0d0a18 70%)}
.pwhero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,var(--bg) 96%)}
.pwhero .txt{position:absolute;left:16px;right:16px;bottom:8px;z-index:1}
.pwhero .h1{text-align:left;font-size:34px}
.pwhero p{margin:6px 0 0;color:var(--t2)}
.plans{display:flex;flex-direction:column;gap:10px}
.plan{position:relative;padding:14px 16px;border-radius:16px;border:1.5px solid var(--border);background:var(--surface);text-align:left;display:grid;grid-template-columns:24px 1fr auto;gap:2px 12px;align-items:center;width:100%}
.plan .rd{width:22px;height:22px;border-radius:50%;border:2px solid var(--border);grid-row:1/3;display:grid;place-items:center}
.plan.on{border-color:var(--pink);background:var(--pink-deep);box-shadow:0 0 20px -8px #B62CB5}
.plan.on .rd{background:var(--grad);border-color:transparent}
.plan .pn{font:800 17px var(--head)}
.plan .pp{font:800 19px/1.1 var(--head);text-align:right}
.plan .pp small{font:500 11px var(--sans);color:var(--t2)}
.plan .rn{font-size:11.5px;color:var(--t2);grid-column:2/4}
.plan .bv{position:absolute;top:-10px;left:50%;transform:translateX(-50%);font:700 11px/1 var(--head);letter-spacing:.06em;background:var(--grad);color:#fff;padding:5px 12px;border-radius:999px;white-space:nowrap}
.ph2{font-family:ui-monospace,Consolas,monospace;font-size:.82em;font-weight:600;padding:1px 5px;border-radius:6px;border:1px dashed var(--amber);color:var(--amber);background:#F5B83D14;white-space:nowrap}
.fine{font-size:11.5px;color:var(--t3);text-align:center;margin-top:10px;line-height:1.45}
.h2{font:800 26px/1.15 var(--head);margin:0 0 14px;letter-spacing:-.01em}
.match{display:flex;gap:16px;align-items:center}
.ring{width:118px;height:118px;flex:none;border-radius:50%;background:conic-gradient(var(--grad-b) calc(var(--m)*1%),var(--grad-a) calc(var(--m)*1%),var(--surface-2) 0);display:grid;place-items:center;position:relative}
.ring::before{content:"";position:absolute;inset:8px;border-radius:50%;background:var(--bg)}
.ring span{position:relative;text-align:center;font:800 26px/1 var(--head)}
.ring small{display:block;font:500 12px var(--sans);color:var(--t2);margin-top:4px}
.traits{display:flex;flex-direction:column;gap:10px;font-weight:600}
.traits div{display:flex;gap:10px;align-items:center}
.gw{width:32px;height:32px;border-radius:10px;background:var(--grad);display:grid;place-items:center;color:#fff;flex:none}
.pcard{margin-top:16px;border-radius:20px;overflow:hidden;position:relative;aspect-ratio:3/3.6;border:1px solid var(--border)}
.pcard img,.pcard .ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 20%}
.pcard .ph{display:block;background:radial-gradient(circle at 50% 35%,#6a2a6a,#0d0a18 70%)}
.pcard .cap{position:absolute;left:0;right:0;bottom:0;padding:40px 14px 12px;background:linear-gradient(180deg,transparent,#0A0911f0);display:flex;justify-content:space-between;align-items:flex-end}
.pcard .cap b{font:800 24px var(--head)}
.pcard .cap small{font-size:11px;color:var(--t3)}
.bens{display:flex;flex-direction:column;gap:9px}
.ben{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--border)}
.ben b{display:block;font:700 15px var(--head)}
.ben small{color:var(--t2);font-size:12.5px}
.ben .tg{margin-left:auto;font:700 10px var(--sans);letter-spacing:.05em;padding:3px 7px;border-radius:6px;background:var(--pink-dim);color:var(--pink-hi)}
.stats{display:flex;flex-direction:column;gap:10px}
.stat{display:flex;gap:14px;align-items:center;padding:14px;border-radius:16px;background:var(--surface);border:1px solid var(--border);font-size:14px}
.stat .n{font:800 22px var(--head);flex:none;min-width:64px;text-align:center}
.mock{border-radius:26px;border:1px solid var(--border);background:var(--bg-elev);padding:12px;display:flex;flex-direction:column;gap:9px;position:relative;overflow:hidden}
.mock .hd{display:flex;gap:10px;align-items:center;padding-bottom:9px;border-bottom:1px solid var(--border)}
.mock .hd b{font:700 15px var(--head)}
.mock .hd small{display:block;color:var(--positive);font-size:11.5px}
.rev{padding:14px;border-radius:16px;background:var(--surface);border:1px solid var(--border);display:flex;flex-direction:column;gap:6px;font-size:13.5px;color:var(--t2)}
.rev .who{display:flex;gap:10px;align-items:center;color:var(--t1)}
.rev .who i{width:34px;height:34px;border-radius:50%;background:var(--grad);display:grid;place-items:center;font:700 12px var(--head);font-style:normal;color:#fff}
.rev .st{margin-left:auto;color:var(--amber);letter-spacing:2px;font-size:13px}
.guar{margin:26px 16px 0;padding:18px;border-radius:18px;border:1.5px solid var(--pink);background:var(--pink-deep);font-size:13.5px;color:var(--t2)}
.guar b{display:block;font:800 20px var(--head);color:var(--t1);margin-bottom:6px}

/* ===== web paywall (2026-10-06): long-scroll landing page, not an app sheet ===== */
.pwwrap{position:absolute;inset:0;z-index:20;background:var(--bg)}
.pw{scroll-behavior:smooth}
.pwbar{position:sticky;top:0;z-index:7;display:flex;align-items:center;gap:10px;padding:calc(var(--top) + 6px) 14px 10px 16px;background:#0A0911e0;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid #ffffff10}
.pwbar .logo{flex:1;justify-content:flex-start;font-size:16px}
.pwbar .mini{height:36px;padding:0 14px;border-radius:999px;border:none;background:var(--grad);color:#fff;font:700 13px var(--head);opacity:0;transform:translateY(-4px);transition:opacity .25s,transform .25s;pointer-events:none;white-space:nowrap}
.pw.scrolled .pwbar .mini{opacity:1;transform:none;pointer-events:auto}
.eyebrow{display:block;font:700 11.5px/1.2 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--gacc,var(--pink-hi));margin-bottom:8px}
.wsec{padding:34px 16px 0}
.wsec.tight{padding-top:14px}
.wh2{font:800 25px/1.18 var(--head);letter-spacing:-.015em;margin:0 0 16px;text-wrap:balance}
.phero{position:relative;isolation:isolate;height:clamp(300px,52vh,420px);margin-top:calc(-1 * (var(--top) + 52px));overflow:hidden;background:var(--gbg)}
.phero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 25%}
.phero .gc{font-size:96px;opacity:.35;z-index:-1}
.phero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0A091199 0%,transparent 28%,transparent 42%,var(--bg) 97%)}
.pht{position:absolute;left:16px;right:16px;bottom:6px;z-index:1}
.pht .h1{text-align:left;font-size:31px;text-shadow:0 2px 18px #000a}
.pht p{margin:8px 0 0;color:var(--t2);font-size:14.5px}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fact{padding:10px 12px;border-radius:14px;background:var(--surface);border:1px solid var(--border);min-width:0}
.fact small{display:block;font-size:11.5px;color:var(--t3)}
.fact b{display:block;font:700 14px/1.3 var(--head);margin-top:2px;overflow-wrap:anywhere}
.pquote{display:flex;gap:10px;align-items:flex-start;margin-top:12px;padding:12px 14px;border-radius:16px;background:var(--surface-2);border-left:3px solid var(--gacc,var(--pink))}
.pquote .av2{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:16px;background:var(--gbg);border:1.5px solid var(--gacc);flex:none}
.pquote p{margin:0;font:italic 15px/1.4 Georgia,serif}
.pblock{padding:20px 14px 16px;border-radius:24px;background:linear-gradient(180deg,#1D1A28,#141220);border:1px solid #B62CB540;box-shadow:0 30px 60px -30px #000,0 0 0 1px #ffffff06 inset;display:flex;flex-direction:column;gap:12px;scroll-margin-top:70px}
.pbh{text-align:center}.pbh .wh2{margin:0 0 6px;font-size:22px}
.pblock .plans{gap:12px}
.plan .pn small{display:block;font:500 11.5px var(--sans);color:var(--t2);margin-top:3px}
.plan .rd{grid-column:1;grid-row:1}.plan .pn{grid-column:2;grid-row:1}
.plan .pp{display:flex;flex-direction:column;align-items:flex-end;grid-column:3;grid-row:1}
.plan .rn{grid-row:2}
.plan .pp small{margin-top:3px}
.plan .rn{padding-top:6px;margin-top:6px;border-top:1px dashed #ffffff14}
.plan .bv{left:auto;right:14px;transform:none}
.due{display:flex;justify-content:space-between;align-items:baseline;padding:4px 4px 0;font-size:14px;color:var(--t2)}
.due b{font:800 18px var(--head);color:var(--t1)}
.payb{display:flex;gap:5px;justify-content:center;flex-wrap:wrap}
.payb span{height:24px;min-width:38px;padding:0 7px;border-radius:6px;background:#F4F2F8;color:#14121c;font:700 10px/24px var(--sans);text-align:center;letter-spacing:.02em}
.secure{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--t2)}
.secure span{display:flex;gap:5px;align-items:center}.secure svg{color:var(--positive)}
.pblock .fine{margin:0}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tiles div{padding:14px 8px;border-radius:16px;background:var(--surface);border:1px solid var(--border);text-align:center;display:flex;flex-direction:column;gap:6px}
.tiles b{font:800 24px/1 var(--head)}
.tiles span{font-size:11.5px;color:var(--t2);line-height:1.35}
.wfoot{padding:34px 16px calc(env(safe-area-inset-bottom,0px) + 120px);display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center;font-size:11.5px;color:var(--t3);line-height:1.55;border-top:1px solid #ffffff0d;margin-top:34px}
.wfoot a{color:var(--t2)}

 .disclose{margin-top:6px;padding:6px 10px}
 .mchip{margin-top:6px}
}
/* QA fix 2026-10-07 */
/* legal + support links: real links, readable (13px), link colour + underline, >= 40px tap target */
.legal{font-size:13px}
.legal a,.wfoot a{display:inline-flex;align-items:center;min-height:40px;padding:0 6px;font-size:13px;color:#E58CE4;text-decoration:underline;text-underline-offset:3px}
.wfoot{font-size:13px;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 150px)}
/* sticky bottom CTA: solid bar, never see-through */
.pstick{background:#0A0911f5;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--border);padding-top:12px}
.pwbar{background:#0A0911f5}
.ofr .obar{background:var(--bg)}
/* lead portraits */
.avi{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:50%}
.qmark .av2,.pquote .av2{position:relative;overflow:hidden}
.pquote .av2{width:40px;height:40px}
.qmark .av2{width:34px;height:34px}
/* toast: stays on screen width, below the chat header */
.toast{top:calc(var(--top) + 64px);max-width:calc(100% - 32px);white-space:normal;text-align:center}
/* episode 2: same frame, visibly darker / colder grade (brief #6) */
.story.dk .bg img{filter:brightness(.62) saturate(.7) hue-rotate(-12deg) contrast(1.08)}
/* official-style store badges */
.stores{gap:10px}
.store{height:48px;min-width:150px;padding:0 14px 0 10px;border-radius:9px;background:#000;border:1px solid #A6A6A6;gap:8px;font:500 10px/1.05 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:#fff}
.store b{font:600 19px/1.05 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;letter-spacing:-.3px}
.store.gp span{font-size:9px;letter-spacing:.4px}
.store.gp b{font-size:17.5px;letter-spacing:0}
/* short phones: reply ideas wrap so every option stays visible (no hidden off-screen chip) */
@media (max-height:700px){
 .ideas{flex-wrap:wrap;overflow-x:visible}
 .ideas button{white-space:normal;flex:1 1 auto}
}
</style>

function say(text,idx){
  if(S.typing||S.gate||tasteLocked()||chatBlocked()||(!S.premium&&(S.msgs<=0||S.sent>=CONFIG.teaserMessages)))return;
  const n=turnN(),g=G();
  S.sent++;emit('chat_message',{count:S.sent});
  S.chat.push({w:'u',x:text.replace(/\{\{/g,'')});if(!S.premium)S.msgs--;
  const scripted=n!==null&&S.turn===n;
  if(scripted){S.picks[n]={idx,text};S.turn++;answer('reply_'+(n+1),idx)}
  S.typing=true;render();
  later(()=>{S.typing=false;
    S.chat.push({w:'c',x:scripted?g['r'+(n+1)][idx]:more()});render();
    if(!scripted)return;
    S.gate=true;render();
    /* taste over: no more replies, a typing bubble, then the paywall */
    if(n===1||(!S.premium&&!S.teaserDone&&S.sent>=CONFIG.teaserMessages)){S.teaserDone=true;emit('chat_teaser_end',{count:S.sent});
      later(()=>{S.typing=true;render();later(()=>{S.typing=false;S.gate=false;go(10)},1500)},900);return}
    later(()=>{S.gate=false;go(9)},1600)},1200);
}

  <div class="sec" style="padding-bottom:max(28px,env(safe-area-inset-bottom,0px));text-align:center"><button class="link" style="width:100%" data-a="saleno">No thanks</button>
   <div class="legal">${lnk('Terms of Use',CONFIG.legal.termsUrl)} · ${lnk('Privacy Policy',CONFIG.legal.privacyUrl)}</div>
   <p class="odis" style="margin-top:10px">${AIPILL()}</p></div></div>`}
const SALEKEY={15:'m1_sale',16:'m3_sale',17:'y12_sale',18:'lifetime'};
/* ---------- after purchase: one-time add-on upsell (subscribers only), then get the app ---------- */
const UPSELL=19,GETAPP=20;
V[UPSELL]=()=>{const p=CONFIG.plans.addon,u=CONFIG.upsell;
  return `<div class="pw ofr" role="dialog" aria-label="${esc(u.name)} add-on" style="${accStyle()}">
  <div class="obar"><div class="logo">${logo(22)} ChatChi</div><button class="obx" data-a="upno" aria-label="${esc(u.decline)}">${ic('x',16)}</button></div>
  <div class="sec" style="padding-top:6px;text-align:center"><span class="oeye">You're in · one more thing</span>
   <h1 class="h2" style="margin:14px 0 8px">${esc(u.title)}</h1>
   <p class="olead">${esc(u.lead)}</p></div>
  <div class="sec"><div class="ocard">
   <div class="orow">${othSD()}<div style="flex:1;min-width:0"><b>ChatChi · ${esc(u.name)}</b><div class="osub">One-time add-on · Plan: ${esc((CONFIG.plans[S.plan]||{}).label||'your plan')}</div></div></div>
   <div class="oprice"><b>${otok(p.price)}</b><span>paid once</span></div>
   <div class="ochecks">${u.checks.map(x=>`<div>${ic('check',17,'currentColor',2.4)}<span>${esc(x)}</span></div>`).join('')}</div>
   ${cta(esc(u.cta),true,'upbuy')}
   <p class="ofine">${esc(u.note)}</p></div></div>
  <div class="sec" style="padding-bottom:max(28px,env(safe-area-inset-bottom,0px));text-align:center"><button class="link" style="width:100%" data-a="upno">${esc(u.decline)}</button>
   <div class="legal">${lnk('Terms of Use',CONFIG.legal.termsUrl)} · ${lnk('Privacy Policy',CONFIG.legal.privacyUrl)}</div></div></div>`};
V[GETAPP]=()=>`<div class="scr" style="gap:16px;padding-top:28px;${accStyle()}"><div class="okwell">${ic('check',36,'#fff',2.6)}</div>
  <div style="text-align:center"><h1 class="h1" style="text-align:center;font-size:30px">You're in.<br><span class="gt">${lead()}</span> is waiting.</h1><p class="sub" style="margin-top:8px">${esc(G().t)} continues in the ChatChi app.</p>${S.addon?`<p class="sub addon-ok" style="margin-top:8px"><b>${esc(CONFIG.upsell.name)} added.</b> Create them in the app.</p>`:''}</div>
  <div class="how2" style="margin-top:4px">${[['Download ChatChi: AI Roleplay Chat','From the App Store or Google Play.'],[S.email?'Log in with '+esc(S.email):'Log in with your checkout email',S.email?'The email you saved your story with.':'The one you paid with.'],['Open your chat with '+lead(),'Episode 3 and Plus are already on.']].map(([x,y],i)=>`<div><i>${i+1}</i><div><b>${x}</b><span>${y}</span></div></div>`).join('')}</div></div>
  <div class="foot">${cta('Open the app',true,'openapp')}<div class="stores"><button class="store" data-a="openapp" aria-label="Download on the App Store">${APPLE_SVG}<span>Download on the<b>App Store</b></span></button><button class="store gp" data-a="openapp" aria-label="Get it on Google Play">${GPLAY_SVG}<span>GET IT ON<b>Google Play</b></span></button></div><button class="link" data-a="keepchat">Keep chatting here</button></div>`;
SCREENS[UPSELL]='upsell_lifetime';SCREENS[GETAPP]='get_app';
V[15]=()=>saleHTML('m1_sale');V[16]=()=>saleHTML('m3_sale');V[17]=()=>saleHTML('y12_sale');V[18]=()=>saleHTML('lifetime');
SCREENS[15]='sale_m1';SCREENS[16]='sale_m3';SCREENS[17]='sale_y12';SCREENS[18]='sale_lifetime';
/* leaving a checkout without paying: go where CONFIG.declineFlow says (FunnelFox's native checkout close does the same) */
function checkoutDeclined(plan){emit('checkout_decline',{plan});const n=DECLINE(plan);if(SALEKEY[n])emit('sale_view',{plan:SALEKEY[n]});go(n)}
/* demo-only checkout sheet when no checkout URL is configured (FunnelFox replaces checkout() with its native screen) */
function demoCheckout(plan){const p=CONFIG.plans[plan];S.ckPlan=plan;
  const el=document.createElement('div');el.className='iq';el.id='demock';
  el.innerHTML=`<div class="iqc"><b>Demo checkout</b><p style="margin:6px 0 14px">ChatChi Plus · ${esc(p.label)} · ${otok(p.price)}</p><div style="display:flex;flex-direction:column;gap:8px"><button class="btn" data-a="ckpay">Pay</button><button class="btn ghost" data-a="ckclose">Close without paying</button></div></div>`;
  phone.appendChild(el)}

function render(anim){
  /* hard paywall: a non-buyer never lands in the chat (any route, sessionStorage restore or debug jump) -> paywall */
  if(!S.blocked&&chatBlocked()){go(12,false);return}
  const v=document.createElement('div');v.className='view'+(anim&&!RM?' in':'');
  v.innerHTML=S.blocked?`<div class="blocked"><h1 class="h1">Sorry, ChatChi is for adults</h1><p class="sub">You must be 18 or older to continue.</p><button class="btn ghost" data-a="agereset" style="margin-top:6px">Change my birth date</button></div>`:nav()+V[S.i]();
  const old=cur();if(old)old.replaceWith(v);else phone.appendChild(v);
  /* FunnelFox build: keep sessionStorage in step with in-screen changes too (messages left, Ep 3 watched), not only on screen changes */
  try{if(typeof ikfSave==='function')ikfSave()}catch(e){}
  if(S.blocked)return;
  /* taste used: a step back into a taste chat shows the thread read-only and hands off forward again */
  if(tasteLocked()&&!S.typing&&!S.gate){S.gate=true;later(()=>{S.typing=true;render();later(()=>{S.typing=false;S.gate=false;if(tasteLocked())go(10)},1100)},700)}
  if(isStory()){if(anim||!S.rem)S.rem=4000;storySchedule()}
  if(S.i===8&&!S.chat.length&&!S.typing){S.typing=true;render();later(()=>{S.typing=false;S.chat=[{w:'c',x:G().open}];render()},1300);return}
  const m=document.getElementById('msgs');if(m)m.scrollTop=m.scrollHeight;
  pwBind();
}
let HOLD=0,HELD=false;
phone.addEventListener('pointerdown',e=>{if(e.target.closest('.stap')){HOLD=Date.now();HELD=false;storyPause()}});
const endHold=()=>{if(S.ps){HELD=Date.now()-HOLD>300;storyResume()}};
phone.addEventListener('pointerup',endHold);phone.addEventListener('pointercancel',endHold);
phone.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b||b.disabled)return;
  const a=b.dataset.a,v=b.dataset.v,f=b.dataset.f;
  switch(a){
    case 'next':
      if(S.i===4){answer('name_set',!!S.name.trim());S.name=S.name.trim()}
      next();break;
    case 'back':back();break;
    case 'agereset':S.blocked=false;S.year='';S.month='';try{sessionStorage.removeItem('ikf_age_block')}catch(e){}emit('age_change');go(2,false);break;
    case 'age':{const now=new Date(),age=THIS_YEAR-(+S.year)-((now.getMonth()+1)<(+S.month)?1:0);if(age<18){S.blocked=true;try{sessionStorage.setItem('ikf_age_block','1')}catch(e){}emit('age_block');render();break}try{sessionStorage.setItem('ikf_age_ok','1')}catch(e){}emit('age_confirm',{method:'month_year'});next();break}
    case 'pick':
      if(S.series!==v){S.chat=[];S.picks=[];S.turn=0}
      S.series=v;answer('series',v);
      cur().querySelectorAll('[data-f="series"]').forEach(x=>x.classList.toggle('on',x.dataset.v===v));
      later(next,RM?0:300);break;
    case 'shuffle':{S.name=NAMES[Math.floor(Math.random()*NAMES.length)];const i=document.getElementById('name');if(i)i.value=S.name;const bt=cur().querySelector('.foot .btn');if(bt)bt.disabled=false;const ne=document.getElementById('nerr');if(ne)ne.hidden=true;break}
    case 'nameskip':S.name='';answer('name_set',false);next();break;
    case 'sn':if(HELD){HELD=false;break}if(S.sl<2){S.sl++;S.rem=4000;S.ps=false;render()}else toast('Tap the button to continue');break;
    case 'sp':if(HELD){HELD=false;break}if(S.sl>0){S.sl--;S.rem=4000;S.ps=false;render()}break;
    case 'listen':toast('Demo only. Voice lines play in the app');break;
    case 'email':{const e=S.email.trim();if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(e)){S.emailErr='email';render();document.getElementById('email')?.focus();break}S.email=e;S.emailErr='';emit('lead',{method:'email'});go(12);break}
    case 'ep3done':{S.ep3done=true;clearT();if(S.chat.length<5)syncChat();S.chat.push({w:'c',x:G().a3});render();later(()=>toast('Unlimited chat is on. Enjoy.'),500);break}
    case 'plan':S.plan=v;emit('plan_select',{plan:v,price:CONFIG.plans[v].price});updPlan();checkout(v);break;
    case 'topl':document.getElementById('plans1')?.scrollIntoView({behavior:RM?'auto':'smooth',block:'start'});break;
    case 'buy':{const k=visPlan();S.plan=k;checkout(k);break}
    case 'salebuy':{const k=SALEKEY[S.i];emit('sale_accept',{plan:k});checkout(k);break}
    case 'saleno':{const k=SALEKEY[S.i];emit('sale_decline',{plan:k});checkoutDeclined(k);break}
    case 'ckpay':{document.getElementById('demock')?.remove();window.IkFunnel.completePurchase(S.ckPlan);break}
    case 'ckclose':{document.getElementById('demock')?.remove();checkoutDeclined(S.ckPlan);break}
    case 'upbuy':emit('upsell_accept',{plan:'addon'});checkout('addon');break;
    case 'upno':emit('upsell_decline');go(GETAPP);break;
    case 'keepchat':go(S.premium?14:12);break;
    /* hard paywall: closing it always opens the lifetime offer; its No thanks / X comes back here (declineFlow.lifetime) */
    case 'closepw':case 'freeplan':emit('paywall_close',{placement:'onboarding',via:'close'});emit('sale_view',{plan:'lifetime'});go(SALE_LT);break;
    case 'say':say(stripEmoji(b.dataset.v),+b.dataset.j||0);break;
    case 'send':{const m=document.getElementById('msg');if(m&&m.value.trim())say(m.value.trim(),1);else m?.focus();break}
    case 'upgrade':S.sheet='pw';render();emit('paywall_view',{placement:'limit'});break;
    case 'closeq':S.sheet=null;emit('paywall_close',{placement:'limit',via:'close'});if(S.premium)render();else{emit('sale_view',{plan:'lifetime'});go(SALE_LT)}break;
    case 'midnight':emit('come_back_midnight');toast(`Your ${FREE} messages come back at midnight`);break;
    case 'openapp':openApp();break;
  }
});
phone.addEventListener('input',e=>{
  const f=e.target.dataset.f;
  if(e.target.id==='msg'){const s=document.getElementById('sendb');if(s)s.disabled=!e.target.value.trim();return}
  if(!f)return;
  if(f==='year'||f==='month'){S[f]=e.target.value;const bt=cur().querySelector('.foot .btn');if(bt)bt.disabled=!(S.year&&S.month);return}
  S[f]=e.target.value;
  if(f==='name'){const bt=cur().querySelector('.foot .btn');if(bt)bt.disabled=!S.name.trim();const ne=document.getElementById('nerr');if(ne)ne.hidden=!!S.name.trim()}
});
phone.addEventListener('change',e=>{const f=e.target.dataset.f;if(f==='year'||f==='month'){S[f]=e.target.value;const bt=cur().querySelector('.foot .btn');if(bt)bt.disabled=!(S.year&&S.month)}});
phone.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='msg')cur().querySelector('[data-a="send"]')?.click()});

/* Host API: the page embedding this funnel can complete a purchase or read the picks. */
window.go=go;
window.IkFunnel=Object.assign(window.IkFunnel||{},{config:CONFIG,data:snapshot,
  /* plans.addon (post-purchase add-on) keeps the plan already bought and lands on get-app; lifetime lands on get-app; subscriptions go to the add-on upsell */
  completePurchase:(plan)=>{const add=plan==='addon';if(add)S.addon=true;else if(plan&&CONFIG.plans[plan])S.plan=plan;AFTER=add||(CONFIG.plans[S.plan]&&CONFIG.plans[S.plan].oneTime)?20:19;S.ltSeen=true;S.premium=true;S.sheet=null;S.ep3done=false;S.teaserDone=true;emit('purchase_complete',{plan:add?'addon':S.plan});go(AFTER)}});
if(DEBUG){const m=location.hash.match(/s=?([0-9]+)/);if(m&&V[+m[1]]){S.i=+m[1];if(S.i>=10)S.teaserDone=true;syncChat()}}
{let ref='';try{ref=document.referrer?new URL(document.referrer).hostname:''}catch(e){}emit('funnel_start',{referrer:ref})}
render();viewed();
</script>
