<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>Coursiv · Claude Skills Plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600&family=Fraunces:opsz,wght@9..144,600&display=swap">
<style>
:root{
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --head:"Plus Jakarta Sans","Inter",system-ui,sans-serif;
  --serif:"Fraunces",Georgia,"Times New Roman",serif;
  --ground:#EEF0F6;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);color:#141733;font:15px/1.45 var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid #3B30C4;outline-offset:2px}

/* ---------- app: brand tokens (light "career" theme), full-viewport mobile layout ---------- */
.app{
  --bg:#FFFFFF;--soft:#F5F6FB;--surface:#FFFFFF;--line:#E3E5EF;--line-2:#CDD1E1;
  --t1:#141733;--t2:#4B516C;--t3:#878DA6;
  --pri:#3B30C4;--pri-ink:#FFFFFF;--pri-soft:#EEEDFD;--pri-deep:#2A2296;
  --ok:#16A34A;--ok-soft:#E7F6EC;--ok-ink:#0F7A36;--err:#D23B3B;--calm:#EEF4FC;
  color-scheme:light;color:var(--t1);
  position:relative;width:100%;max-width:480px;height:100vh;height:100dvh;margin:0 auto;background:var(--bg);overflow:hidden;isolation:isolate
}
@media (min-width:520px){.app{border-inline:1px solid #D9DCE8}}
.stage{position:absolute;inset:0;z-index:1;overflow:hidden}
.view{position:absolute;inset:0;padding-top:calc(env(safe-area-inset-top,0px) + 8px);display:flex;flex-direction:column;background:var(--bg)}

/* simple screen change: fade + small slide only */
.view.out{animation:vout .22s ease forwards;pointer-events:none;z-index:0}
.view.in{animation:vin .32s ease both;z-index:1}
@keyframes vout{to{opacity:0}}
@keyframes vin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.nav{height:46px;flex:none;display:flex;align-items:center;gap:10px;padding:0 14px;position:relative;z-index:3}
.iconbtn{width:36px;height:36px;border-radius:50%;border:none;background:transparent;display:grid;place-items:center;color:var(--t2);flex:none}
.iconbtn:hover{background:var(--soft)}
.prog{flex:1;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.prog span{display:block;height:100%;background:var(--pri);border-radius:3px;transition:width .35s ease}
.pcount{font:600 12px/1 var(--sans);color:var(--t3);font-variant-numeric:tabular-nums;min-width:36px;text-align:right}
.navspacer{width:36px;flex:none}

.scr{flex:1;overflow-y:auto;overflow-x:hidden;padding:6px 20px 12px;display:flex;flex-direction:column;gap:18px;position:relative}
.scr.center{justify-content:center}
.scr::-webkit-scrollbar{width:0}
.foot{flex:none;padding:10px 20px max(20px,calc(env(safe-area-inset-bottom,0px) + 12px));display:flex;flex-direction:column;gap:10px;position:relative;z-index:2;background:var(--bg)}
.foot .note{font-size:12px;color:var(--t3);text-align:center;text-wrap:balance}

.display{font:800 29px/1.14 var(--head);letter-spacing:-.02em;margin:0;text-wrap:balance;color:var(--t1)}
.display.xl{font-size:33px}
.display.sm{font-size:25px}
.lead{color:var(--t2);margin:0;font-size:15px;text-wrap:pretty}
.eyebrow{font:700 11px/1 var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--pri)}
.pill{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;background:var(--pri-soft);color:var(--pri);font:600 12.5px/1 var(--sans)}
.hint{font-size:13px;color:var(--t3)}
.err{font-size:13px;color:var(--err);font-weight:500}
.err button{background:none;border:none;padding:0;color:var(--pri);text-decoration:underline;font-weight:600}
.ph{display:inline-block;border:1.5px dashed #9A93E8;background:#F4F3FF;color:var(--pri-deep);border-radius:6px;padding:0 5px;font-weight:600;white-space:nowrap}

.btn{height:54px;border-radius:14px;border:none;background:var(--pri);color:var(--pri-ink);font:700 16px/1 var(--head);width:100%;display:flex;align-items:center;justify-content:center;gap:10px;transition:transform .12s ease,background .2s;box-shadow:0 10px 24px -12px #3B30C4aa;position:relative;overflow:hidden}
.btn:hover{background:var(--pri-deep)}
.btn:active{transform:scale(.985)}
.btn[disabled]{background:#E4E6F0;color:#9CA1B8;cursor:not-allowed;box-shadow:none}
.btn:not([disabled])::after{content:"";position:absolute;top:0;bottom:0;width:36%;left:0;background:linear-gradient(100deg,transparent,#ffffff55,transparent);transform:translateX(-150%) skewX(-20deg);animation:sheen 5s ease-in-out 1.4s infinite}
@keyframes sheen{0%{transform:translateX(-150%) skewX(-20deg)}26%,100%{transform:translateX(330%) skewX(-20deg)}}
.btn.dark{background:#0E0F1A;box-shadow:none}
.btn.line{background:var(--surface);color:var(--t1);border:1.5px solid var(--line-2);box-shadow:none}
.btn.line::after,.btn.dark::after{display:none}
.link{background:none;border:none;color:var(--t2);font-size:14px;padding:6px;text-align:center;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line-2)}
.link:hover{color:var(--t1)}

/* options */
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:13px;padding:13px 15px;border-radius:14px;background:var(--surface);border:1.5px solid var(--line);text-align:left;width:100%;transition:border-color .15s,background .15s,color .15s;min-height:54px}
.opt:hover{border-color:var(--line-2)}
.opt .em{font-size:20px;width:26px;text-align:center;flex:none;line-height:1}
.opt .lbl{flex:1;font-weight:600;font-size:15.5px}
.opt .chk{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line-2);display:grid;place-items:center;flex:none;color:#fff}
.opt.on{border-color:var(--pri);background:var(--pri-soft)}
.opt.on .chk{background:var(--pri);border-color:var(--pri)}
.opts.fill .opt.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.opts.fill .opt.on .chk{background:#fff;border-color:#fff;color:var(--pri)}
.opts.muted .opt .em{filter:grayscale(1);opacity:.55;transition:filter .2s,opacity .2s}
.opts.muted .opt.on .em{filter:none;opacity:1}
.opts.calm .opt{background:var(--calm);border-color:#DCE7F7}
.opts.calm .opt.on{border-color:var(--pri);background:#E4EEFC}
.sig{display:flex;gap:3px;align-items:flex-end;height:18px;flex:none}
.sig i{width:4px;border-radius:1px;background:var(--line-2)}
.sig i.f{background:var(--pri)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:12px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);text-align:left;min-height:72px;position:relative}
.tile .em{font-size:20px;line-height:1}
.tile .lbl{font-weight:600;font-size:14px;line-height:1.2}
.tile.on{border-color:var(--pri);background:var(--pri-soft)}
.tile .badge{position:absolute;top:9px;right:9px;width:20px;height:20px;border-radius:50%;background:var(--pri);color:#fff;display:grid;place-items:center}
.utile{min-height:118px;justify-content:space-between;background:linear-gradient(160deg,#F7F8FD,#EFF1FA)}
.utile .tools{display:flex;gap:4px;flex-wrap:wrap}
.otherin{margin-top:-2px}

.field{display:flex;flex-direction:column;gap:7px}
.field label{font:600 13px/1 var(--sans);color:var(--t2)}
.box{height:54px;border-radius:14px;background:var(--surface);border:1.5px solid var(--line-2);display:flex;align-items:center;padding:0 14px;gap:10px;color:var(--t3);transition:border-color .15s,box-shadow .15s}
.box:focus-within{border-color:var(--pri);box-shadow:0 0 0 4px #3B30C422}
.box.bad{border-color:var(--err)}
.box input{flex:1;min-width:0;height:100%;background:transparent;border:none;outline:none;color:var(--t1);font:400 16px var(--sans)}
.box input::placeholder{color:#A3A8BE}
.cbx{display:flex;gap:10px;align-items:flex-start;background:none;border:none;padding:0;text-align:left;font-size:13.5px;color:var(--t2)}
.cbx .sq{width:20px;height:20px;border-radius:5px;border:1.5px solid var(--line-2);display:grid;place-items:center;flex:none;color:#fff;margin-top:1px;background:#fff}
.cbx.on .sq{background:var(--pri);border-color:var(--pri)}
.cbx a,.tlink{color:var(--pri);text-decoration:underline;font-weight:500;background:none;border:none;padding:0;font-size:inherit}

/* tool chips (lettered stand-ins for real logos) */
.tool{display:inline-flex;align-items:center;gap:5px;padding:4px 9px 4px 4px;border-radius:999px;background:#fff;border:1px solid var(--line);font:600 12px/1 var(--sans);color:var(--t1)}
.tool i{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;color:#fff;font:700 10px/1 var(--sans);font-style:normal}
.tool.mini{padding:3px;gap:0}
.toolrow{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}

/* screen 1 */
.wcards{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.wcard{display:flex;flex-direction:column;border-radius:20px;border:2px solid var(--line);background:var(--surface);overflow:hidden;padding:0;text-align:left;transition:border-color .15s,transform .15s}
.wcard:hover{border-color:var(--line-2)}
.wcard.on{border-color:var(--pri)}
.wcard .art{height:240px;display:grid;place-items:center;position:relative;overflow:hidden}
.wcard .art .big{font-size:64px;line-height:1;position:relative;z-index:1}
.wcard .art .desk{position:absolute;left:14%;right:14%;bottom:30px;height:8px;border-radius:4px;background:#00000014}
.wcard .art .win{position:absolute;top:18px;width:46px;height:56px;border-radius:6px;background:#ffffff99;border:2px solid #ffffffcc}
.wcard .cap{padding:12px 12px 14px;font:700 15px/1.25 var(--head);display:flex;gap:6px;align-items:flex-start}
.legalline{font-size:11.5px;color:var(--t3);text-align:center;text-wrap:balance}
.legalline button{display:inline;background:none;border:none;padding:0;color:var(--t2);text-decoration:underline;font-size:inherit}

/* screen 2 */
.bignum{font:800 64px/1 var(--head);color:var(--pri);letter-spacing:-.03em;text-align:center}
.bignum .ph{font-size:52px;padding:0 10px;border-radius:12px}
.strip{display:flex;justify-content:center;margin-top:auto;padding-top:8px}
.face{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-size:28px;border:3px solid #fff;margin-left:-12px;box-shadow:0 6px 14px -8px #0003}
.face:first-child{margin-left:0}

/* screen 7 staircase */
.stairs{position:relative;height:210px;display:flex;align-items:flex-end;gap:8px;padding:0 6px}
.stairs .st{flex:1;border-radius:10px 10px 4px 4px;background:#EEF0F7;display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px;font:600 11px/1.15 var(--sans);color:var(--t3);text-align:center;position:relative}
.stairs .st.me{background:var(--pri);color:#fff}
.stairs .st.me::before{content:"You";position:absolute;top:-28px;left:50%;transform:translateX(-50%);background:var(--t1);color:#fff;font:700 11px/1 var(--sans);padding:6px 9px;border-radius:999px}
.floatchip{position:absolute;display:inline-flex;gap:6px;align-items:center;padding:7px 11px;border-radius:999px;background:var(--ok-soft);color:var(--ok-ink);font:600 12px/1 var(--sans);box-shadow:0 8px 18px -12px #16A34A88;animation:bob 4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}

/* screen 11 quote */
.quote{padding:24px 22px 20px;border-radius:22px;background:linear-gradient(180deg,#F6F5FF,#FFFFFF);border:1.5px solid #E1DEFA;position:relative}
.quote .mk{font:800 72px/.6 var(--serif);color:var(--pri);opacity:.25;position:absolute;top:22px;left:16px}
.quote p{margin:18px 0 16px;font:600 20px/1.35 var(--serif);color:var(--t1);text-wrap:pretty}
.quote u{text-decoration:none;background:linear-gradient(var(--pri),var(--pri)) left bottom/0 3px no-repeat;animation:uline 1.2s ease .6s forwards;padding-bottom:1px}
@keyframes uline{to{background-size:100% 3px}}
.quote .who{display:flex;gap:10px;align-items:center;font-size:13px;color:var(--t2)}
.quote .who .av{width:38px;height:38px;border-radius:50%;background:#E4E6F0;display:grid;place-items:center;font:700 14px var(--head);color:var(--t2)}
.quote .who b{display:block;color:var(--t1);font-size:14px}

/* screen 13 */
.pace{display:flex;align-items:center;gap:14px;padding:16px;border-radius:16px;border:1.5px solid var(--line);background:var(--surface);text-align:left;width:100%}
.pace.on{border-color:var(--pri);background:var(--pri-soft)}
.pace .lbl{flex:1;font:700 17px/1.2 var(--head)}
.pace .lbl small{display:block;font:500 12.5px var(--sans);color:var(--t3);margin-top:3px}
.tag{font:700 10.5px/1 var(--sans);letter-spacing:.05em;background:var(--ok);color:#fff;padding:5px 7px;border-radius:6px;text-transform:uppercase}

/* screen 15 lesson */
.pbub{display:flex;gap:10px;align-items:flex-start;padding:14px;border-radius:18px 18px 18px 6px;background:var(--soft);border:1.5px solid var(--line);text-align:left;width:100%;font-size:15px;transition:transform .2s ease,border-color .15s}
.pbub:hover{border-color:var(--pri)}
.pbub .em{font-size:20px;line-height:1.1}
.squash .pbub{transform:scaleX(0)}
.reveal{display:grid;grid-template-columns:1fr 1fr;gap:9px;animation:unsq .32s ease both}
@keyframes unsq{from{transform:scaleX(0)}to{transform:none}}
.rcol{border-radius:16px;border:1.5px solid var(--line);background:var(--surface);padding:11px;display:flex;flex-direction:column;gap:8px;font-size:12.5px;position:relative}
.rcol.good{border-color:var(--ok);background:#FAFEFB}
.rcol .pr{color:var(--t2);font-size:12px;line-height:1.35}
.rcol .pr mark{background:#CFF1DA;color:var(--ok-ink);border-radius:3px;padding:0 2px}
.rcol .out{background:var(--soft);border-radius:10px;padding:8px;line-height:1.4;color:var(--t1)}
.rcol .out b{font:700 10px/1 var(--sans);letter-spacing:.06em;color:var(--t3);display:block;margin-bottom:5px}
.rcol .yp{position:absolute;top:-9px;right:10px;background:var(--t1);color:#fff;font:700 10px/1 var(--sans);padding:4px 7px;border-radius:999px}
.why{display:inline-flex;align-items:center;gap:6px;background:var(--ok-soft);color:var(--ok-ink);border-radius:999px;padding:8px 12px;font:600 13px/1.2 var(--sans);align-self:flex-start}
.close{font:700 16px/1.2 var(--head);color:var(--t1)}

/* proof */
.stars{display:flex;gap:3px;justify-content:center;color:#F4B400;font-size:22px}
.rv{padding:14px;border-radius:16px;border:1.5px dashed var(--line-2);background:var(--soft);display:flex;flex-direction:column;gap:8px}
.rv .rh{display:flex;gap:10px;align-items:center}
.rv .av{width:34px;height:34px;border-radius:50%;background:#E1E4EE;display:grid;place-items:center;color:var(--t3);font-size:15px;flex:none}
.rv p{margin:0;color:var(--t2);font-size:13.5px}
.rv small{color:var(--t3);font-size:11.5px}
.certmini{height:56px;border-radius:8px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;font:600 11px var(--serif);color:var(--t3)}

/* loading */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal span{aspect-ratio:1;border-radius:9px;background:#F1F2F8;border:1px solid var(--line);display:grid;place-items:center;font:700 11px/1 var(--sans);color:transparent;transition:background .25s,border-color .25s,transform .25s}
.cal span.on{background:#fff;border-color:var(--line-2);transform:scale(1.04)}
.cal span.on i{opacity:1;transform:scale(1)}
.cal span i{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;color:#fff;font:700 10px/1 var(--sans);font-style:normal;opacity:0;transform:scale(.4);transition:opacity .25s,transform .3s cubic-bezier(.3,1.6,.5,1)}
.cal span.ctile.on{background:var(--ok-soft);border-color:var(--ok)}
.steps{display:flex;flex-direction:column;gap:12px}
.step .top{display:flex;justify-content:space-between;align-items:center;font-size:13.5px;color:var(--t2);margin-bottom:6px;gap:10px}
.step .top .pct{font-variant-numeric:tabular-nums;color:var(--t3);display:flex;gap:5px;align-items:center;flex:none}
.step.done .top{color:var(--t1)}
.step.done .pct{color:var(--ok)}
.bar{height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.bar span{display:block;height:100%;background:var(--ok);width:0}

/* gate */
.blurcard{position:relative;border-radius:18px;overflow:hidden;border:1px solid var(--line)}
.blurcard .inner{filter:blur(5px);padding:16px;display:flex;flex-direction:column;gap:8px;user-select:none}
.blurcard .frost{position:absolute;inset:0;background:#ffffffa6;display:grid;place-items:center;color:var(--pri)}
.wk{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--soft);border:1px solid var(--line)}
.wk .n{width:34px;height:34px;border-radius:10px;background:var(--pri-soft);color:var(--pri);display:grid;place-items:center;font:800 12px/1 var(--head);flex:none}
.wk b{display:block;font-size:14px}
.wk span{font-size:12px;color:var(--t3)}
.wk .tl{margin-left:auto;display:flex;gap:3px;flex:none}
.wk.last .n{background:var(--ok-soft);color:var(--ok)}

/* summary */
.meter{position:relative;padding-top:34px}
.meter .track{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px}
.meter .track span{height:10px;border-radius:5px;background:#E6E8F2}
.meter .track span.on{background:var(--pri)}
.meter .labels{display:grid;grid-template-columns:1fr 1fr 1fr;font-size:12px;color:var(--t3);margin-top:8px;text-align:center}
.meter .labels span.on{color:var(--pri);font-weight:700}
.meter .mk{position:absolute;top:0;transform:translateX(-50%);background:var(--t1);color:#fff;font:700 11px/1 var(--sans);padding:6px 9px;border-radius:999px;white-space:nowrap;transition:left .6s ease}
.meter .mk::after{content:"";position:absolute;left:50%;bottom:-4px;width:8px;height:8px;background:var(--t1);transform:translateX(-50%) rotate(45deg)}
.srow{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.srow:first-child{border-top:none}
.srow .well{width:38px;height:38px;border-radius:12px;background:var(--pri-soft);display:grid;place-items:center;font-size:18px;flex:none}
.srow small{display:block;color:var(--t3);font-size:12px}
.srow b{font-size:15px}
.card{padding:4px 14px;border-radius:18px;border:1px solid var(--line);background:var(--surface)}

/* plan */
.ba{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ba > div{border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px;font-size:12.5px}
.ba h5{margin:0;font:700 12px/1 var(--sans);letter-spacing:.04em;text-transform:uppercase}
.ba .now{background:#F2F3F7;color:var(--t2)}
.ba .now h5{color:var(--t3)}
.ba .with{background:var(--ok-soft);color:var(--ok-ink)}
.ba .with h5{color:var(--ok)}
.ba div div{display:flex;gap:6px;align-items:flex-start}
.fine{font-size:11.5px;color:var(--t3);text-align:center}

/* features */
.feat{display:flex;gap:10px}
.feat .rows{flex:1;display:flex;flex-direction:column;gap:10px}
.feat .r{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;font-weight:500}
.feat .r .ck{width:20px;height:20px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;flex:none;margin-top:1px}
.mock{width:104px;height:196px;border-radius:20px;background:#0E0F1A;padding:5px;flex:none;transform:rotate(6deg);box-shadow:0 18px 30px -16px #0008;margin-top:6px}
.mock .in{width:100%;height:100%;border-radius:16px;background:#fff;padding:14px 8px 8px;display:flex;flex-direction:column;gap:6px;font-size:8.5px;overflow:hidden}
.mock .in b{font:800 10px/1.15 var(--head)}
.mock .bb{height:5px;border-radius:3px;background:var(--line)}
.mock .bb.p{background:var(--pri);width:40%}
.mock .ch{padding:5px;border-radius:6px;background:var(--soft);border:1px solid var(--line)}
.mock .ch.g{border-color:var(--ok);background:var(--ok-soft)}

/* paywall */
.minip{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:16px;background:linear-gradient(135deg,#3B30C4,#5A4FE0);color:#fff}
.minip .ic{width:40px;height:40px;border-radius:12px;background:#ffffff26;display:grid;place-items:center;font-size:20px;flex:none}
.minip small{display:block;opacity:.8;font-size:11.5px}
.minip b{font-size:14px}
.plan{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:16px;border:1.5px solid var(--line);background:var(--surface);text-align:left;width:100%;position:relative}
.plan.on{border:2px solid var(--pri);padding:13.5px;background:#FAFAFF}
.plan .radio{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line-2);display:grid;place-items:center;flex:none;color:#fff;margin-top:1px}
.plan.on .radio{background:var(--pri);border-color:var(--pri)}
.plan .pn{font:700 15.5px/1.2 var(--head);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.plan .pp{font-size:13.5px;color:var(--t1);margin-top:6px;line-height:1.6}
.plan .pd{font-size:11.5px;color:var(--t3);margin-top:3px}
.bdg{font:700 10px/1 var(--sans);letter-spacing:.05em;background:var(--pri);color:#fff;padding:4px 6px;border-radius:5px}
.bdg.g{background:var(--ok)}
.trust{font-size:12px;color:var(--t2);text-align:center;line-height:1.7}
.pays{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.pays span{font:700 11px/1 var(--sans);padding:6px 8px;border-radius:6px;border:1px solid var(--line);color:var(--t1);background:#fff}
.payline{font-size:12.5px;color:var(--t1);text-align:center;line-height:1.55;text-wrap:pretty}
.closex{width:36px;height:36px;border-radius:50%;border:none;background:var(--soft);display:grid;place-items:center;color:var(--t2);flex:none}
.dim{position:absolute;inset:0;background:#0D0F2266;z-index:4;animation:fi .25s ease}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:5;background:#fff;border-radius:26px 26px 0 0;padding:10px 20px 30px;display:flex;flex-direction:column;gap:14px;animation:up .32s cubic-bezier(.2,.8,.2,1)}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line-2);align-self:center}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}

/* receipt */
.receipt{border-radius:18px;border:1px solid var(--line);background:var(--soft);padding:16px;display:flex;flex-direction:column;gap:0;position:relative}
.receipt .rr{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px dashed var(--line-2);font-size:13.5px;line-height:1.5}
.receipt .rr:first-of-type{border-top:none}
.receipt .rr span:first-child{color:var(--t2)}
.receipt .rr span:last-child{text-align:right;font-weight:600}
.receipt h4{margin:0 0 6px;font:800 16px var(--head)}
.cardform{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cardform .box{height:48px}
.cardform .full{grid-column:1/-1}
.orline{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--t3)}
.orline::before,.orline::after{content:"";flex:1;height:1px;background:var(--line)}

/* welcome */
.okbig{width:76px;height:76px;border-radius:50%;background:var(--ok);display:grid;place-items:center;color:#fff;align-self:center;box-shadow:0 0 0 10px var(--ok-soft);animation:popin .5s cubic-bezier(.3,1.5,.5,1)}
@keyframes popin{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
.nsteps{display:flex;flex-direction:column;gap:8px}
.nsteps div{display:flex;gap:10px;align-items:center;font-size:14px}
.nsteps b{width:26px;height:26px;border-radius:50%;background:var(--pri-soft);color:var(--pri);display:grid;place-items:center;font:800 12px var(--head);flex:none}
.stores{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.store{height:48px;border-radius:12px;background:#0E0F1A;color:#fff;border:none;display:flex;align-items:center;justify-content:center;gap:8px;font-size:10px;line-height:1.1;text-align:left}
.store b{display:block;font:700 14px var(--head)}
.store .g{font-size:20px}
.d1{display:flex;gap:12px;align-items:center;padding:12px;border-radius:16px;background:var(--pri-soft);border:1px solid #DAD7FA}
.d1 .ic{width:44px;height:44px;border-radius:12px;background:var(--pri);color:#fff;display:grid;place-items:center;font-size:20px;flex:none}
.d1 small{color:var(--t3);display:block;font-size:12px}

.toast{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 58px);transform:translateX(-50%);z-index:9;background:#141733;color:#fff;font-size:13px;font-weight:500;padding:9px 14px;border-radius:999px;white-space:nowrap;animation:fade 2.6s ease forwards;box-shadow:0 10px 24px -10px #0006}
@keyframes fade{0%{opacity:0;transform:translate(-50%,-6px)}10%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
.fadein{animation:fi .35s ease both}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- HERO: 3D certificate of completion ---------- */
.cert{position:relative;perspective:900px;perspective-origin:50% 40%;margin:0 auto;flex:none}
.cscene{position:absolute;inset:0;transform-style:preserve-3d;will-change:transform}
.cscene>*{position:absolute}
.cfloor{left:6%;right:6%;top:12%;bottom:-6%;border-radius:20px;background:radial-gradient(ellipse at center,#1B1E4A55,transparent 68%);filter:blur(10px);transform:translateZ(-34px)}
.cpaper{inset:0;border-radius:12px;background:linear-gradient(115deg,#FFFFFF 0%,#FBFAF5 38%,#FFFFFF 50%,#F6F4EC 64%,#FFFFFF 100%);background-size:260% 100%;border:1px solid #E6E2D2;box-shadow:0 1px 0 #fff inset;transform:translateZ(0)}
.cedge{inset:0;border-radius:12px;background:#D9D4C0;transform:translateZ(-5px)}
.cframe{inset:6.5%;border:1.5px solid #3B30C4;border-radius:6px;box-shadow:0 0 0 3px #fff,0 0 0 4px #3B30C455;transform:translateZ(9px)}
.ctext{left:10%;right:10%;top:11%;display:flex;flex-direction:column;align-items:center;text-align:center;transform:translateZ(16px);color:#141733}
.ctext .e1{font:700 .72em/1 var(--sans);letter-spacing:.2em;color:#3B30C4}
.ctext .e2{font:800 1.05em/1.2 var(--head);margin-top:.55em}
.ctext .e3{font:500 .66em/1 var(--sans);color:#878DA6;margin-top:1.2em;letter-spacing:.06em;text-transform:uppercase}
.ctext .nm{font:600 2.05em/1.1 var(--serif);margin-top:.18em;min-width:62%;border-bottom:1px solid #CDD1E1;padding-bottom:.12em;min-height:1.3em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.ctext .nm.blank{color:transparent}
.ctext .tr{font:500 .7em/1.3 var(--sans);color:#4B516C;margin-top:.55em;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cfine{left:9%;right:36%;bottom:9%;text-align:center;font:500 .52em/1 var(--sans);color:#A3A8BE;transform:translateZ(12px)}
.cribbon{width:15%;height:22%;right:12%;bottom:4%;transform:translateZ(24px)}
.cribbon::before,.cribbon::after{content:"";position:absolute;top:0;width:44%;height:100%;background:#16A34A;clip-path:polygon(0 0,100% 0,100% 100%,50% 82%,0 100%)}
.cribbon::before{left:0;transform:rotate(12deg);background:#12913F}
.cribbon::after{right:0;transform:rotate(-12deg)}
.cseal{width:24%;right:7.5%;bottom:16%;aspect-ratio:1;transform:translateZ(36px)}
.cseal svg{display:block;width:100%;height:100%;filter:drop-shadow(0 4px 6px #0B0D2233)}
.cseal .draw{stroke-dasharray:1;stroke-dashoffset:1;animation:sdraw 1.4s ease .5s forwards}
@keyframes sdraw{to{stroke-dashoffset:0}}
.cseal .fillin{opacity:0;animation:fi2 .6s ease 1.5s forwards}
@keyframes fi2{to{opacity:1}}
.cstamp{left:11%;bottom:17%;padding:.35em .6em;border:2px solid #16A34A;border-radius:.5em;color:#12913F;font:800 .78em/1.15 var(--head);text-align:center;background:#16A34A0d;transform:translateZ(22px) rotate(-9deg)}
.cstamp small{display:block;font:700 .62em/1 var(--sans);letter-spacing:.14em}
.cstamp.drop{opacity:0;animation:stamp .5s cubic-bezier(.5,0,.6,1.4) 1.7s forwards}
@keyframes stamp{0%{opacity:0;transform:translateZ(110px) rotate(-22deg) scale(1.7)}70%{opacity:1}100%{opacity:1;transform:translateZ(22px) rotate(-9deg) scale(1)}}
.cert.faint{opacity:.42}

/* ---------- production: tap targets >=44px, narrow-screen safety ---------- */
.iconbtn,.closex{width:44px;height:44px}
.link{min-height:44px}
.cbx{min-height:44px;align-items:center}
.cki{min-height:44px}
.ibtn::before,.legalline button::after,.tlink::after,.sugg button::after,.err button::after{content:"";position:absolute;inset:-11px -4px}
.legalline button,.tlink,.sugg button,.err button{position:relative}
.ibtn::before{inset:-11px}
.scr,.foot{min-width:0}
.scr>*{max-width:100%}
@media (max-width:374px){.display{font-size:26px}.display.xl{font-size:29px}.scr{padding-inline:16px}.foot{padding-inline:16px}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition:none!important}
}
[hidden]{display:none!important}
.aff{font-size:11px;color:var(--t3);text-align:center;text-wrap:balance}

/* screen 1 photo strip (CSS stand-in for a laptop photo) */
.pstrip{margin-top:auto;height:112px;border-radius:20px;background:linear-gradient(170deg,#E5E8FF,#D3F1DE);position:relative;overflow:hidden;display:flex;align-items:flex-end;justify-content:center;gap:6px;padding-bottom:10px}
.pstrip .lap{width:118px;height:62px;border-radius:8px 8px 3px 3px;background:#2A2E4A;position:relative;box-shadow:0 10px 18px -12px #0006}
.pstrip .lap::after{content:"";position:absolute;left:-12px;right:-12px;bottom:-7px;height:7px;border-radius:0 0 6px 6px;background:#3B3F5E}
.pstrip .lap i{position:absolute;inset:7px;border-radius:4px;background:linear-gradient(180deg,#fff,#EEF0FA);display:flex;flex-direction:column;gap:4px;padding:6px}
.pstrip .lap i b{display:block;height:4px;border-radius:2px;background:#CDD1E1}
.pstrip .who{font-size:54px;line-height:1;margin-bottom:6px}
.pstrip .mug{font-size:22px;align-self:flex-end;margin-bottom:6px}

/* screen 5 tool tiles + screen 7 skill tiles */
.tw{position:relative}
.tw .tile{width:100%}
.ibtn{position:absolute;top:8px;right:8px;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line-2);background:#fff;color:var(--t2);font:700 11px/1 var(--serif);display:grid;place-items:center;z-index:2;padding:0}
.tw .tile.on~.ibtn{right:34px}
.tipb{position:absolute;left:6px;right:6px;top:calc(100% - 6px);z-index:6;background:var(--t1);color:#fff;font-size:12px;line-height:1.35;padding:8px 10px;border-radius:10px;box-shadow:0 10px 20px -10px #0008;animation:fi .2s ease}
.thumb{width:100%;height:40px;border-radius:8px;background:var(--soft);border:1px solid var(--line);position:relative;overflow:hidden}
.thumb i{position:absolute;display:block;border-radius:2px;background:var(--line-2)}
.thumb .p{background:var(--pri)}
.thumb .g{background:var(--ok)}
.thumb .y{background:#FCE38A}

/* screen 6 merge */
.merge{position:relative;height:150px;margin-top:26px}
.cw{position:absolute;top:18px;width:132px;height:104px;border-radius:14px;background:#fff;border:1.5px solid var(--line);box-shadow:0 12px 24px -16px #0004;padding:10px;display:flex;flex-direction:column;gap:6px}
.cw b{font:700 10px/1 var(--sans);color:var(--t3);letter-spacing:.05em}
.cw i{display:block;height:9px;border-radius:5px;background:var(--soft);border:1px solid var(--line)}
.cw i.me{align-self:flex-end;width:60%;background:var(--pri-soft);border-color:#DAD7FA}
.cw.l{left:calc(50% - 150px);animation:ml 1.3s cubic-bezier(.5,0,.3,1) .5s forwards}
.cw.r{left:calc(50% + 18px);animation:mr 1.3s cubic-bezier(.5,0,.3,1) .5s forwards}
.cw.m{left:calc(50% - 76px);width:152px;opacity:0;border-color:var(--pri);animation:mm .5s ease 1.6s forwards}
@keyframes ml{to{transform:translateX(84px);opacity:0}}
@keyframes mr{to{transform:translateX(-84px);opacity:0}}
@keyframes mm{to{opacity:1}}
.merge .floatchip{opacity:0;animation:rise .5s ease forwards,bob 4s ease-in-out 2.6s infinite}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* screens 11-12 check */
.qdots{display:flex;gap:5px;align-items:center;min-width:36px;justify-content:flex-end}
.qdots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.qdots i.f{background:var(--pri)}
.qdots span{font:600 12px/1 var(--sans);color:var(--t3);margin-left:4px}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .chk{background:var(--ok);border-color:var(--ok)}
.opt.wrong{border-color:#E7A1A1;background:#FDF3F3}
.opt[disabled]{cursor:default}
.fact{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:var(--ok-soft);color:var(--ok-ink);font-size:14px;font-weight:500;animation:fi .35s ease both}
.fact b{display:block;color:var(--t1);font:700 15px/1.2 var(--head);margin-bottom:3px}
.lpage{height:76px;display:flex;justify-content:center;align-items:center}
.lpage .pg{width:58px;height:74px;border-radius:6px;background:#fff;border:1.5px solid var(--line-2);position:relative;padding:8px 7px;display:flex;flex-direction:column;gap:4px;overflow:visible}
.lpage .pg i{display:block;height:3px;border-radius:2px;background:var(--line-2)}
.lpage .qb{position:absolute;right:-26px;top:4px;padding:4px 7px;border-radius:9px 9px 9px 2px;background:var(--pri);color:#fff;font:700 11px/1 var(--sans);animation:qdown 2.6s ease-in-out .4s infinite alternate}
@keyframes qdown{0%,15%{transform:translateY(0)}85%,100%{transform:translateY(50px)}}
.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.rchip{display:inline-flex;gap:6px;align-items:center;padding:7px 11px;border-radius:999px;font:600 12.5px/1 var(--sans)}
.rchip.y{background:var(--ok-soft);color:var(--ok-ink)}
.rchip.n{background:#FDF0F0;color:#B23030}
.rchip.s{background:var(--soft);color:var(--t3)}

/* screen 14 artifact lesson */
.req{display:flex;gap:10px;align-items:center;padding:14px;border-radius:16px;background:var(--surface);border:1.5px solid var(--line);text-align:left;width:100%;font-size:15px;font-weight:600;transition:border-color .15s}
.req:hover{border-color:var(--pri)}
.req .em{font-size:20px}
.req .sg{margin-left:auto;font:700 10px/1 var(--sans);letter-spacing:.04em;color:var(--pri);background:var(--pri-soft);padding:4px 6px;border-radius:5px;flex:none}
.chat{display:flex;flex-direction:column;gap:8px}
.bub{max-width:84%;padding:10px 12px;font-size:14px;line-height:1.4;border-radius:16px}
.bub.u{align-self:flex-end;background:var(--pri);color:#fff;border-bottom-right-radius:5px;min-height:38px}
.bub.a{align-self:flex-start;background:var(--soft);border:1px solid var(--line);border-bottom-left-radius:5px;display:flex;gap:8px}
.bub.a .av{width:22px;height:22px;border-radius:50%;background:#E4E6F0;color:var(--t2);font:700 9px/22px var(--sans);text-align:center;flex:none}
.caret::after{content:"";display:inline-block;width:2px;height:1em;background:currentColor;margin-left:2px;vertical-align:-2px;animation:blink .8s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.apanel{border-radius:18px;background:#fff;border:1px solid var(--line);box-shadow:0 -8px 30px -14px #1B1E4A55,0 2px 0 #fff inset;overflow:hidden}
.apanel.rise{animation:up .5s cubic-bezier(.2,.8,.2,1) both}
.apanel .ah{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--soft)}
.apanel .ah b{font:700 13.5px/1.2 var(--head);flex:1}
.apanel .ah span{font:700 9.5px/1 var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--pri);border:1.5px dashed #9A93E8;border-radius:5px;padding:4px 6px}
.apanel .ab{padding:12px}
.cki{display:flex;gap:10px;align-items:center;width:100%;background:none;border:none;padding:7px 2px;text-align:left;font-size:14px;border-bottom:1px dashed var(--line)}
.cki:last-child{border-bottom:none}
.cki .sq{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line-2);display:grid;place-items:center;color:#fff;flex:none;transition:background .2s,border-color .2s}
.cki.on .sq{background:var(--ok);border-color:var(--ok)}
.cki.on span:last-child{color:var(--t3);text-decoration:line-through}
.ckmeta{font-size:11.5px;color:var(--t3);margin-top:6px}
.bars{display:flex;align-items:flex-end;gap:10px;height:120px;padding:6px 4px 0;border-bottom:1.5px solid var(--line-2)}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;font:700 11px/1 var(--sans);color:var(--t2)}
.bars i{display:block;width:100%;border-radius:6px 6px 0 0;background:#B9B4F4;transform-origin:bottom;animation:grow .7s cubic-bezier(.2,.8,.2,1) both}
.bars div.top i{background:var(--pri)}
@keyframes grow{from{transform:scaleY(0)}to{transform:none}}
.blabels{display:flex;gap:10px;padding:6px 4px 0}
.blabels span{flex:1;text-align:center;font-size:11px;color:var(--t3)}
.onep h6{margin:0 0 3px;font:700 10.5px/1 var(--sans);letter-spacing:.07em;text-transform:uppercase;color:var(--pri)}
.onep h5{margin:0 0 10px;font:800 16px/1.2 var(--head)}
.onep p{margin:0 0 10px;font-size:13px;line-height:1.45;color:var(--t2)}
.onep > *{animation:fi .4s ease both}

/* screen 20 mock tweaks */
.mock .ap{height:36px;border-radius:6px;border:1px solid var(--line);background:#fff;padding:4px;display:flex;flex-direction:column;gap:3px}
.mock .ap i{display:block;height:4px;border-radius:2px;background:var(--line-2)}
.mock .ap i.g{background:var(--ok);width:60%}

/* typo suggestion */
.sugg{font-size:13px;color:var(--t2)}
.sugg button{background:none;border:none;padding:0;color:var(--pri);font-weight:600;text-decoration:underline;font-size:inherit}

/* cert tweaks for this brief: Coursiv green seal */
.ctext .e2{font-size:.98em}

/* AI-generated imagery (img/). Each <img> sits over the original CSS/emoji art and removes itself on error, so the art stays as fallback. */
.pimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:inherit;display:block;z-index:2}
.pstrip{height:150px}
.pstrip .pimg{object-position:50% 24%}
.pstrip::after{content:"";position:absolute;inset:0;z-index:3;border-radius:inherit;box-shadow:inset 0 0 0 1px #0000000f;pointer-events:none}
.photoband{height:150px;border-radius:20px;position:relative;overflow:hidden;flex:none;background:linear-gradient(170deg,#E5E8FF,#D3F1DE);display:grid;place-items:center;font-size:54px}
.photoband .pimg{object-position:50% 26%}
.rv .av{position:relative;overflow:hidden}
.faces{display:inline-flex;margin-right:2px}
.faces span{width:22px;height:22px;border-radius:50%;border:2px solid #fff;margin-left:-7px;position:relative;overflow:hidden;background:#DAD7FA;flex:none}

  <div class="pays"><span>Apple Pay</span><span>G Pay</span><span>VISA</span><span>Mastercard</span><span>AMEX</span></div></div>
  <div class="foot">${cta(`${ic('lock',16)} Pay securely`,true,'pay')}</div>`},

23:()=>`<div class="scr" style="gap:16px;padding-top:18px"><span class="okbig">${ic('check',38,'currentColor',3)}</span>
  <h1 class="display" style="text-align:center">${S.v==='A'?`Welcome aboard, ${nm()}!`:'Day 1 of Claude is ready'}</h1>
  <p class="lead" style="text-align:center;margin-top:-8px">${S.v==='A'?`Get the app and log in with ${esc(S.email||'your email')}.`:'Your first 15-minute Claude lesson is waiting.'}</p>
  <div class="d1"><span class="ic">${ic('play',18,'#fff',2.2)}</span><div><small>Up next in the app</small><b>Day 1 · ${esc(week1())}</b></div></div>
  <div class="nsteps"><div><b>1</b>Install the app</div><div><b>2</b>Tap the login link in your email</div><div><b>3</b>Start Day 1</div></div>
  <div class="stores"><button class="store" data-a="store" data-v="ios">${ic('apple',20,'#fff')}<span>Download on the<b>App Store</b></span></button><button class="store" data-a="store" data-v="android"><span class="g">▶</span><span>Get it on<b>Google Play</b></span></button></div>
  <p class="hint" style="text-align:center;margin:0">Receipt and cancel link sent to ${esc(S.email||'your email')}</p></div>
  <div class="foot">${cta('Get the app',true,'store')}</div>`
};

/* loading: 28 tiles + 4 rows, ~6s, then auto-advance */
function runLoading(){
  const t0=performance.now(),D=5600;let rv=0;
  const tiles=[...document.querySelectorAll('#cal span')];
  timer=setInterval(()=>{
    const v=cur();if(!v||S.i!==16){clearInterval(timer);return}
    const e=performance.now()-t0,k=Math.min(1,e/D);
    tiles.forEach((s,i)=>s.classList.toggle('on',i<Math.floor(k*28+.001)));
    for(let r=0;r<4;r++){const el=document.getElementById('st'+r);if(!el)continue;const p=Math.round(Math.max(0,Math.min(1,k*4-r))*100);
      el.querySelector('.bar span').style.width=p+'%';
      if(p>=100&&!el.classList.contains('done')){el.classList.add('done');el.querySelector('.pct').innerHTML=`${ic('check',14,'currentColor',2.6)}<span>100%</span>`}
      else if(p<100)el.querySelector('.pct span').textContent=p+'%'}
    const RL=CONFIG.reviews.loading,nr=Math.floor(e/2200)%Math.max(1,RL.length);if(nr!==rv&&RL[nr]){rv=nr;const c=document.getElementById('rrot');if(c){c.classList.remove('fadein');void c.offsetWidth;c.classList.add('fadein');c.querySelector('p').textContent=RL[nr].text;c.querySelector('small').textContent=`— ${RL[nr].by}`}}
    if(k>=1){clearInterval(timer);timer=setTimeout(()=>{if(S.i===16)go(17)},700)}
  },50);
}

function render(dir){
  const n=S.i;const html=nav()+V[n]();
  const old=cur();
  if(dir&&old&&!RM){
    old.classList.remove('cur');old.setAttribute('inert','');
    old.querySelectorAll('[id]').forEach(e=>e.removeAttribute('id'));
    old.classList.add('out');
    const nv=document.createElement('div');nv.className='view cur in';nv.innerHTML=html;stage.appendChild(nv);
    setTimeout(()=>old.remove(),240);
    setTimeout(()=>nv.classList.remove('in'),360);
  }else if(!old){const nv=document.createElement('div');nv.className='view cur';nv.innerHTML=html;stage.appendChild(nv)}
  else{stage.querySelectorAll('.view:not(.cur)').forEach(x=>x.remove());old.innerHTML=html}
  const v=cur();
  v.querySelectorAll('.cert').forEach(mountCert);
  if(n===16)runLoading();
  if(n===14&&S.art&&S.lph<4)runLesson();
  const f=v.querySelector('#nm,#em,#oth');
  if(f&&(dir||f.id==='oth')&&!('ontouchstart' in window)){setTimeout(()=>{if(cur()!==v||!f.isConnected)return;f.focus({preventScroll:true});const x=f.value;f.value='';f.value=x},dir?300:0)}
  renderPanel();
}

/* ---------- HERO: 3D certificate (the only 3D object in this demo) ---------- */
const HEROES=new Set();
const ease=x=>1-Math.pow(1-x,3);
function mountCert(el){
  if(el._c)return;
  const W=+el.dataset.w||280,H=Math.round(W*.68),mode=el.dataset.mode||'float',stamp=el.dataset.stamp==='1',blank=el.dataset.blank==='1';
  const name=blank?'':S.name.trim();
  el.style.width=W+'px';el.style.height=H+'px';
  const seal=`<svg viewBox="0 0 60 60" aria-hidden="true">
    <path class="fillin" d="${rosette(30,30,28,24,16)}" fill="#16A34A"/>
    <path class="draw" pathLength="1" d="${rosette(30,30,28,24,16)}" fill="none" stroke="#0F7A36" stroke-width="1.4"/>
    <circle class="fillin" cx="30" cy="30" r="18" fill="#fff"/>
    <circle class="draw" pathLength="1" cx="30" cy="30" r="15.5" fill="none" stroke="#16A34A" stroke-width="1.6"/>
    <path class="draw" pathLength="1" d="M22.5 30.5l5 5 10-11" fill="none" stroke="#16A34A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  el.innerHTML=`<div class="cscene" style="font-size:${(W/280*10).toFixed(2)}px">
    <div class="cfloor"></div><div class="cedge"></div><div class="cpaper"></div><div class="cframe"></div>
    <div class="ctext"><span class="e1">COURSIV CERTIFICATE OF COMPLETION</span><span class="e2">Claude Skills Track · 28 Days</span><span class="e3">Awarded to</span><span class="nm ${name?'':'blank'}">${name?esc(name):'&nbsp;'}</span><span class="tr">${blank?'Focus: your main use':'Focus: '+esc(useL())}</span></div>
    <div class="cfine">Issued by Coursiv · not an Anthropic certification</div>
    <div class="cribbon"></div><div class="cseal">${seal}</div>
    ${stamp?`<div class="cstamp ${mode==='land'?'drop':''}"><small>BY</small>${certDate()}</div>`:''}
  </div>`;
  const o={el,mode,scene:el.firstElementChild,paper:el.querySelector('.cpaper'),t0:performance.now(),px:0,py:0,tx:0,ty:0};
  el._c=o;HEROES.add(o);
  el.addEventListener('pointermove',e=>{const r=el.getBoundingClientRect();o.tx=(e.clientX-r.left)/r.width-.5;o.ty=(e.clientY-r.top)/r.height-.5});
  el.addEventListener('pointerleave',()=>{o.tx=0;o.ty=0});
  if(RM){drawCert(o,performance.now()+99999);return}
  if(!HEROES.loop){HEROES.loop=true;requestAnimationFrame(heroFrame)}
}
function rosette(cx,cy,R,r,n){let d='';for(let i=0;i<=n*2;i++){const a=Math.PI*i/n-Math.PI/2,rr=i%2?r:R;d+=(i?'L':'M')+(cx+rr*Math.cos(a)).toFixed(2)+' '+(cy+rr*Math.sin(a)).toFixed(2)+' '}return d+'Z'}
function drawCert(o,now){
  const t=(now-o.t0)/1000;
  o.px+=(o.tx-o.px)*.08;o.py+=(o.ty-o.py)*.08;
  let rx=14+Math.sin(t*.6)*4,ry=Math.sin(t*.45)*15,rz=Math.sin(t*.3)*1.2,s=1;
  if(RM){rx=12;ry=-14;rz=0}
  if(o.mode==='land'&&!RM){const k=ease(Math.min(1,t/1.6));rx=80*(1-k)+rx*k;ry=-24*(1-k)+ry*k;rz=-8*(1-k)+rz*k;s=.62+.38*k;o.el.style.opacity=Math.min(1,t/.35)}
  rx+=o.py*-24;ry+=o.px*32;
  /* never opacity/filter on .cscene (preserve-3d) — only the outer .cert fades */
  o.scene.style.transform=`scale(${s}) rotateX(${rx.toFixed(2)}deg) rotateY(${ry.toFixed(2)}deg) rotateZ(${rz.toFixed(2)}deg)`;
  o.paper.style.backgroundPosition=`${(50+ry*2.4).toFixed(1)}% 0`;
}
function heroFrame(now){
  for(const o of HEROES){if(!o.el.isConnected){HEROES.delete(o);continue}drawCert(o,now)}
  if(HEROES.size)requestAnimationFrame(heroFrame);else HEROES.loop=false;
}

function renderPanel(){}

/* ---------- events ---------- */
const tapNext=(scr)=>{render();setTimeout(()=>{if(S.i===scr)next()},260)};
phone.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b||b.disabled)return;
  const a=b.dataset.a,v=b.dataset.v;
  switch(a){
    case 'next':next();break;
    case 'back':back();break;
    case 'legal':{const url=CONFIG[LEGAL[v]]||'';emit('legal_click',{doc:v,url});openUrl(url);break}
    case 'exp':S.exp=v;S.c1='';S.c2='';tapNext(1);break;
    case 'use':S.use=v;render();break;
    case 'industry':S.industry=v;if(v==='other')render();else tapNext(4);break;
    case 'tool':if(v==='none')S.tools=S.tools.includes('none')?[]:['none'];else{const s=S.tools.filter(x=>x!=='none');S.tools=s.includes(v)?s.filter(x=>x!==v):[...s,v]}render();break;
    case 'skill':if(S.skills.includes(v)){S.skills=S.skills.filter(x=>x!==v);S.err=''}else if(S.skills.length<3){S.skills=[...S.skills,v];S.err=''}else S.err='Up to three — tap one to swap it out.';S.tip='';render();break;
    case 'tip':S.tip=S.tip===v?'':v;render();break;
    case 'cuse':S.cuse=v;render();break;
    case 'minutes':S.minutes=+v;render();break;
    case 'name':if(!S.name.trim()){S.err='Please enter your name to continue';render();document.getElementById('nm')?.focus()}else{S.name=S.name.trim();next()}break;
    case 'c1':if(!S.c1){S.c1=v;render()}break;
    case 'c2':if(!S.c2){S.c2=v;render()}break;
    case 'req':if(!S.art){S.art=v;S.lph=1;S.ticks=[];render()}break;
    case 'tick':{const i=+v;S.ticks=S.ticks.includes(i)?S.ticks.filter(x=>x!==i):[...S.ticks,i];syncTick(i);break}
    case 'email':{const em=S.email.trim();if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(em)){S.err='invalid';render();break}
      S.email=em;
      /* optional host hook: window.IkameFunnel.emailTaken(email) -> true | Promise<true> shows the "already has an account" error */
      const hook=window.IkameFunnel&&window.IkameFunnel.emailTaken;
      const proceed=taken=>{if(S.i!==17)return;if(taken){S.err='taken';render()}else{emit('lead',{marketingOptIn:S.tips});next()}};
      if(typeof hook==='function'){Promise.resolve().then(()=>hook(em)).then(proceed,()=>proceed(false))}else proceed(false);
      break}
    case 'sugg':S.email=typo(S.email)||S.email;S.err='';render();break;
    case 'login':emit('login_click',{url:CONFIG.loginUrl||''});openUrl(CONFIG.loginUrl);break;
    case 'tips':S.tips=!S.tips;render();break;
    case 'plan':if(S.plan!==v){S.plan=v;emit('plan_select',{plan:v,price:PLANS[v].today,renewPrice:PLANS[v].renew,period:PLANS[v].per})}render();break;
    case 'agree':S.agree=!S.agree;render();break;
    case 'buy':if(CONFIG.orderReview)go(22);else checkout();break;
    case 'dismiss':emit('paywall_close',{plan:S.plan,fallbackShown:S.fallback});if(!S.fallback){S.fallback=true;S.sheet='fallback';render()}else back();break;
    case 'offer':{const o=CONFIG.fallbackOffer;S.plan=o.plan;S.offer=true;S.sheet=null;emit('plan_select',{plan:o.plan,price:o.price,renewPrice:o.renewPrice,period:o.period,fallbackOffer:true});render();break}
    case 'nothanks':S.sheet=null;render();break;
    case 'pay':checkout();break;
    case 'store':{const ios=v?v==='ios':/iPhone|iPad|iPod|Macintosh/i.test(navigator.userAgent);const url=(ios?CONFIG.appStoreUrl:CONFIG.googlePlayUrl)||CONFIG.appStoreUrl||CONFIG.googlePlayUrl||'';emit('store_click',{store:ios?'app_store':'google_play',url});openUrl(url);break}
  }
});
phone.addEventListener('keydown',e=>{const c=e.target.closest&&e.target.closest('[role="checkbox"][data-a]');if(c&&e.target===c&&(e.key===' '||e.key==='Enter')){e.preventDefault();c.click()}});
phone.addEventListener('input',e=>{
  const f=e.target.dataset.f;if(!f)return;
  S[f]=e.target.value;
  if(S.err&&(f==='name'||f==='email')){S.err='';const bx=e.target.closest('.box');bx&&bx.classList.remove('bad');const er=bx&&bx.parentElement.querySelector('.err');er&&er.remove()}
  if(f==='email'){const sg=document.getElementById('sugg');if(sg)sg.innerHTML=suggHTML()}
  if(f==='name'){const c=cur().querySelector('.cert .nm');if(c){c.textContent=S.name.trim()||' ';c.classList.toggle('blank',!S.name.trim())}}
  const btn=cur().querySelector('.foot .btn.main');if(btn&&OK[S.i])btn.disabled=!ok(S.i);
});
phone.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.tagName==='INPUT'){const b=cur().querySelector('.foot .btn.main');b&&!b.disabled&&b.click()}});

/* host API: call completePurchase() after a successful checkout to show the welcome screen */
window.IkFunnel=window.IkameFunnel=Object.assign(window.IkameFunnel||{},{
  config:CONFIG,data:snapshot,
  completePurchase:plan=>{if(plan&&PLANS[plan])S.plan=plan;S.paid=true;S.sheet=null;go(23)}
});

/* deep link #s=N (and #a=check|chart|brief on 14) only with ?debug=1 */
if(DEBUG){const h=decodeURIComponent(location.hash);const m=h.match(/s=?([0-9]+)/);if(m&&V[+m[1]]){fillTo(+m[1]);S.i=+m[1]}
 const am=h.match(/a=(check|chart|brief)/);if(am&&S.i===14){S.art=am[1];S.lph=1}}
render();
emit('funnel_start',{variant:S.v,landing:location.pathname,referrer:document.referrer||null});
viewed();
