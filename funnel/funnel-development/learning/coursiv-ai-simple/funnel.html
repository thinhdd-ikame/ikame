<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>Coursiv · AI Made Simple</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600&display=swap">
<style>
[hidden]{display:none!important}
:root{
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --head:"Plus Jakarta Sans","Inter",system-ui,sans-serif;
  --serif:"Fraunces",Georgia,"Times New Roman",serif;
  --ground:#EEF0F6;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);color:#10132E;font:15px/1.45 var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid #3B30C4;outline-offset:2px}

/* ---------- app: brand tokens (older-audience override: >=18px body, >=56px taps, high contrast), full-viewport mobile layout ---------- */
.app{
  --bg:#FFFFFF;--soft:#F5F6FB;--surface:#FFFFFF;--line:#DADDEA;--line-2:#B9BED3;
  --t1:#10132E;--t2:#2F3450;--t3:#555B77;
  --pri:#3B30C4;--pri-ink:#FFFFFF;--pri-soft:#EEEDFD;--pri-deep:#2A2296;
  --ok:#16A34A;--ok-soft:#E7F6EC;--ok-ink:#0F6B31;--err:#C62F2F;--calm:#EEF4FC;
  color-scheme:light;color:var(--t1);
  position:relative;width:100%;max-width:480px;height:100vh;height:100dvh;margin:0 auto;background:var(--bg);overflow:hidden;isolation:isolate
}
@media (min-width:520px){.app{border-inline:1px solid #D9DCE8}}
.stage{position:absolute;inset:0;z-index:1;overflow:hidden}
.view{position:absolute;inset:0;padding-top:calc(env(safe-area-inset-top,0px) + 8px);display:flex;flex-direction:column;background:var(--bg)}
/* simple screen change: fade + small slide only */
.view.out{animation:vout .22s ease forwards;pointer-events:none;z-index:0}
.view.in{animation:vin .32s ease both;z-index:1}
@keyframes vout{to{opacity:0}}
@keyframes vin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.nav{height:48px;flex:none;display:flex;align-items:center;gap:10px;padding:0 14px;position:relative;z-index:3}
.iconbtn{width:44px;height:44px;border-radius:50%;border:none;background:transparent;display:grid;place-items:center;color:var(--t2);flex:none}
.iconbtn:hover{background:var(--soft)}
.prog{flex:1;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.prog span{display:block;height:100%;background:var(--pri);border-radius:4px;transition:width .35s ease}
.pcount{font:700 14px/1 var(--sans);color:var(--t2);font-variant-numeric:tabular-nums;min-width:40px;text-align:right}
.navspacer{width:44px;flex:none}

.scr{flex:1;overflow-y:auto;overflow-x:hidden;padding:6px 20px 12px;display:flex;flex-direction:column;gap:18px;position:relative}
.scr>*{flex-shrink:0}
.scr.center{justify-content:center}
.scr::-webkit-scrollbar{width:0}
.foot{flex:none;padding:10px 20px max(20px,calc(env(safe-area-inset-bottom,0px) + 12px));display:flex;flex-direction:column;gap:10px;position:relative;z-index:2;background:var(--bg)}
.foot .note{font-size:15px;color:var(--t2);text-align:center;text-wrap:balance}

.display{font:800 29px/1.15 var(--head);letter-spacing:-.02em;margin:0;text-wrap:balance;color:var(--t1)}
.display.sm{font-size:26px}
.lead{color:var(--t2);margin:0;font-size:18px;line-height:1.45;text-wrap:pretty}
.pill{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border-radius:999px;background:var(--pri-soft);color:var(--pri);font:700 13.5px/1 var(--sans)}
.hint{font-size:14.5px;color:var(--t3)}
.err{font-size:15px;color:var(--err);font-weight:600}
.err button{background:none;border:none;padding:0;color:var(--pri);text-decoration:underline;font-weight:700}
.ph{display:inline-block;border:1.5px dashed #9A93E8;background:#F4F3FF;color:var(--pri-deep);border-radius:6px;padding:0 5px;font-weight:700;white-space:nowrap}

.btn{min-height:58px;border-radius:16px;border:none;background:var(--pri);color:var(--pri-ink);font:700 18px/1 var(--head);width:100%;display:flex;align-items:center;justify-content:center;gap:10px;transition:transform .12s ease,background .2s;box-shadow:0 10px 24px -12px #3B30C4aa;position:relative;overflow:hidden}
.btn:hover{background:var(--pri-deep)}
.btn:active{transform:scale(.985)}
.btn[disabled]{background:#E4E6F0;color:#7A8099;cursor:not-allowed;box-shadow:none}
.btn:not([disabled])::after{content:"";position:absolute;top:0;bottom:0;width:36%;left:0;background:linear-gradient(100deg,transparent,#ffffff55,transparent);transform:translateX(-150%) skewX(-20deg);animation:sheen 5s ease-in-out 1.4s infinite}
@keyframes sheen{0%{transform:translateX(-150%) skewX(-20deg)}26%,100%{transform:translateX(330%) skewX(-20deg)}}
.btn.dark{background:#0E0F1A;box-shadow:none}
.btn.dark::after{display:none}
.link{background:none;border:none;color:var(--t2);font-size:16px;padding:8px;min-height:44px;text-align:center;text-decoration:underline;text-underline-offset:3px}
.link:hover{color:var(--t1)}

/* options (>=56px) */
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:13px;padding:14px 16px;border-radius:16px;background:var(--surface);border:2px solid var(--line);text-align:left;width:100%;transition:border-color .15s,background .15s,color .15s;min-height:60px}
.opt:hover{border-color:var(--line-2)}
.opt .em{font-size:22px;width:28px;text-align:center;flex:none;line-height:1}
.opt .lbl{flex:1;font-weight:600;font-size:18px}
.opt .chk{width:24px;height:24px;border-radius:50%;border:2px solid var(--line-2);display:grid;place-items:center;flex:none;color:#fff}
.opt.on{border-color:var(--pri);background:var(--pri-soft)}
.opt.on .chk{background:var(--pri);border-color:var(--pri)}
.opts.fill .opt.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.opts.fill .opt.on .chk{background:#fff;border-color:#fff;color:var(--pri)}
.opts.calm .opt{background:var(--calm);border-color:#D3E1F5}
.opts.calm .opt.on{border-color:var(--pri);background:#E1ECFC}
.opt.right{border-color:var(--ok);background:var(--ok-soft);color:var(--ok-ink)}
.opt.right .chk{background:var(--ok);border-color:var(--ok)}
.opt.wrong{border-color:var(--line-2);background:var(--soft)}
.opt[disabled]{cursor:default}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:14px;border-radius:16px;border:2px solid var(--line);background:var(--surface);text-align:left;min-height:104px;position:relative}
.tile .em{font-size:30px;line-height:1}
.tile .lbl{font-weight:700;font-size:17px;line-height:1.2}
.tile.on{border-color:var(--pri);background:var(--pri-soft)}
.tile .badge{position:absolute;top:10px;right:10px;width:24px;height:24px;border-radius:50%;background:var(--pri);color:#fff;display:grid;place-items:center}
.otherin{margin-top:-2px}

.field{display:flex;flex-direction:column;gap:8px}
.field label{font:700 15px/1 var(--sans);color:var(--t2)}
.box{height:62px;border-radius:16px;background:var(--surface);border:2px solid var(--line-2);display:flex;align-items:center;padding:0 16px;gap:10px;color:var(--t3);transition:border-color .15s,box-shadow .15s}
.box:focus-within{border-color:var(--pri);box-shadow:0 0 0 4px #3B30C422}
.box.bad{border-color:var(--err)}
.box input{flex:1;min-width:0;height:100%;background:transparent;border:none;outline:none;color:var(--t1);font:500 19px var(--sans)}
.box input::placeholder{color:#8A90A8}
.cbx{display:flex;gap:12px;align-items:flex-start;background:none;border:none;padding:4px 0;text-align:left;font-size:16px;color:var(--t2);min-height:44px}
.cbx .sq{width:24px;height:24px;border-radius:6px;border:2px solid var(--line-2);display:grid;place-items:center;flex:none;color:#fff;margin-top:1px;background:#fff}
.cbx.on .sq{background:var(--pri);border-color:var(--pri)}
.tlink{color:var(--pri);text-decoration:underline;font-weight:600;background:none;border:none;padding:0;font-size:inherit}
.sugg{font-size:16px;color:var(--t2)}
.sugg button{background:none;border:none;padding:0;color:var(--pri);font-weight:700;text-decoration:underline;font-size:inherit}
.legalline{font-size:13px;color:var(--t3);text-align:center;text-wrap:balance}
.legalline button{display:inline;background:none;border:none;padding:0;color:var(--t2);text-decoration:underline;font-size:inherit}

/* screen 1 photo */
.photo{height:176px;border-radius:22px;position:relative;overflow:hidden;background:linear-gradient(170deg,#FCEFE3,#F4DCC7);display:grid;place-items:center;flex:none}
.photo .win{position:absolute;top:16px;left:22px;width:70px;height:84px;border-radius:8px;background:#ffffffa8;border:3px solid #ffffffe0}
.photo .desk{position:absolute;left:0;right:0;bottom:0;height:44px;background:#C99A73}
.photo .who{font-size:84px;line-height:1;position:relative;z-index:1;margin-bottom:26px}
.photo .mug{position:absolute;right:70px;bottom:32px;font-size:34px;z-index:2}
.photo .cap{position:absolute;left:10px;bottom:8px;z-index:3;font:600 11px/1 var(--sans);color:#fff;background:#0006;padding:4px 7px;border-radius:6px}

/* myth tap */
.sq2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bigc{aspect-ratio:1;border-radius:22px;border:2px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font:800 22px/1 var(--head)}
.bigc .em{font-size:44px}
.bigc.on{border-color:var(--pri);background:var(--pri-soft)}
.bigc.right{border-color:var(--ok);background:var(--ok-soft);color:var(--ok-ink)}
.revealc{border-radius:20px;background:var(--ok-soft);border:2px solid #BFE6CC;padding:16px;display:flex;gap:14px;align-items:center;animation:slideup .35s ease both}
.revealc p{margin:0;font:700 18px/1.35 var(--head);color:var(--ok-ink)}
@keyframes slideup{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.minichat{width:92px;flex:none;border-radius:12px;background:#fff;border:1px solid #BFE6CC;padding:8px;display:flex;flex-direction:column;gap:6px;font-size:10px;color:var(--t2)}
.minichat .typ{border:1px solid var(--line);border-radius:8px;padding:5px;min-height:28px}
.minichat .typ span{border-right:1.5px solid var(--pri);animation:caret 1s steps(1) infinite}
@keyframes caret{50%{border-color:transparent}}

/* social */
.bignum{font:800 60px/1 var(--head);color:var(--pri);letter-spacing:-.03em;text-align:center}
.bignum .ph{font-size:48px;padding:0 10px;border-radius:12px}
.strip{display:flex;justify-content:center}
.face{width:74px;height:74px;border-radius:50%;display:grid;place-items:center;font-size:38px;border:3px solid #fff;margin-left:-12px;box-shadow:0 6px 14px -8px #0003}
.face:first-child{margin-left:0}
.stars{display:flex;gap:3px;justify-content:center;color:#E3A400;font-size:26px}

/* bridge 7 */
.lessonshot{border-radius:22px;border:2px solid var(--line);background:var(--soft);padding:16px;position:relative;display:flex;flex-direction:column;gap:12px}
.lessonshot .stp{align-self:flex-start;font:700 13px/1 var(--sans);background:var(--t1);color:#fff;padding:7px 10px;border-radius:999px}
.lessonshot .ins{font:700 18px/1.3 var(--head)}
.lessonshot .fake{border-radius:12px;background:#fff;border:1.5px solid var(--line-2);padding:12px;font-size:16px;color:var(--t2)}
.lessonshot .fbtn{align-self:flex-end;background:var(--pri);color:#fff;border-radius:12px;padding:12px 18px;font:700 16px/1 var(--head);position:relative}
.finger{position:absolute;right:26px;bottom:-12px;font-size:40px;animation:tap 1.6s ease-in-out infinite}
@keyframes tap{0%,100%{transform:translate(0,0)}50%{transform:translate(-4px,-8px) scale(.94)}}
.finger::before{content:"";position:absolute;left:-8px;top:-10px;width:30px;height:30px;border-radius:50%;border:3px solid #3B30C466;animation:ring 1.6s ease-out infinite}
@keyframes ring{0%{transform:scale(.4);opacity:1}100%{transform:scale(1.6);opacity:0}}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.gchip{display:inline-flex;gap:6px;align-items:center;padding:9px 13px;border-radius:999px;background:var(--ok-soft);color:var(--ok-ink);font:700 15px/1 var(--sans)}

/* quote */
.quote{padding:24px 22px 20px;border-radius:22px;background:linear-gradient(180deg,#F6F5FF,#FFFFFF);border:1.5px solid #E1DEFA;position:relative}
.quote .mk{font:800 72px/.6 var(--serif);color:var(--pri);opacity:.25;position:absolute;top:22px;left:16px}
.quote p{margin:18px 0 16px;font:600 21px/1.35 var(--serif);color:var(--t1);text-wrap:pretty}
.quote u{text-decoration:none;background:linear-gradient(var(--ok),var(--ok)) left bottom/0 3px no-repeat;animation:uline 1.2s ease .6s forwards;padding-bottom:1px}
@keyframes uline{to{background-size:100% 3px}}
.quote .who{display:flex;gap:10px;align-items:center;font-size:14px;color:var(--t2)}
.quote .who .av{width:40px;height:40px;border-radius:50%;background:#E4E6F0;display:grid;place-items:center;font:700 14px var(--head);color:var(--t2)}
.quote .who b{display:block;color:var(--t1);font-size:15px}

/* pace */
.pace{display:flex;align-items:center;gap:14px;padding:16px;border-radius:18px;border:2px solid var(--line);background:var(--surface);text-align:left;width:100%;min-height:78px}
.pace.on{border-color:var(--pri);background:var(--pri-soft)}
.pace .lbl{flex:1;font:700 19px/1.2 var(--head)}
.pace .lbl small{display:block;font:500 15px var(--sans);color:var(--t2);margin-top:4px}

/* habit tiles */
.htile{min-height:140px;align-items:center;justify-content:center;text-align:center}
.htile .em{font-size:46px}

/* safety check */
.qcard{border-radius:20px;background:var(--soft);border:1.5px solid var(--line);padding:14px;display:flex;flex-direction:column;gap:8px}
.bub{align-self:flex-start;max-width:88%;background:#fff;border:1.5px solid var(--line);border-radius:16px 16px 16px 6px;padding:12px 14px;font-size:17px}
.bub small{display:block;font:700 11px/1 var(--sans);letter-spacing:.06em;color:var(--t3);margin-bottom:6px}
.fact{border-radius:16px;background:var(--ok-soft);border:2px solid #BFE6CC;padding:14px;display:flex;flex-direction:column;gap:6px;animation:slideup .35s ease both}
.fact b{font:800 17px/1.2 var(--head);color:var(--ok-ink)}
.fact span{font-size:17px;color:var(--t1)}

/* lesson */
.pile{position:relative;height:128px;transition:height .5s ease;flex:none}
.stk{position:absolute;width:47%;padding:10px 11px;border-radius:4px;background:#FFE88A;box-shadow:0 6px 12px -8px #0006;font:500 14.5px/1.3 "Segoe Print","Comic Sans MS",var(--sans);color:#4A3B00;transition:transform .55s cubic-bezier(.5,0,.3,1),opacity .5s ease,left .55s ease,top .55s ease}
.stk:nth-child(1){left:0;top:4px;transform:rotate(-4deg)}
.stk:nth-child(2){left:52%;top:0;transform:rotate(3deg);background:#FFD9A0}
.stk:nth-child(3){left:3%;top:66px;transform:rotate(2deg);background:#FFF1B3}
.stk:nth-child(4){left:50%;top:62px;transform:rotate(-3deg);background:#FFE3B8}
.pile.merge{height:46px}
.pile.merge .stk{left:26%!important;top:0!important;opacity:.0;transform:scale(.5) rotate(0deg)!important}
.pile.merge::after{content:"4 messy notes → 1 clean report";position:absolute;inset:0;display:grid;place-items:center;font:700 15px var(--sans);color:var(--t2);animation:fi .4s ease .35s both}
.req{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:16px;border-radius:18px;border:2px solid var(--pri);background:var(--pri-soft);font:600 18px/1.35 var(--sans);color:var(--t1);min-height:64px;animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 #3B30C455}50%{box-shadow:0 0 0 8px #3B30C400}}
.req .em{font-size:24px;flex:none}
.req.sent{animation:none;background:#fff;border-color:var(--line-2);border-radius:18px 18px 6px 18px;cursor:default}
.req.sent .em{display:none}
.req.sent::before{content:"You";font:700 12px/1 var(--sans);color:#fff;background:var(--t1);padding:5px 8px;border-radius:999px;flex:none}
.demolabel{font:700 13px/1.3 var(--sans);color:var(--t2);text-align:center;background:var(--soft);border:1px dashed var(--line-2);border-radius:8px;padding:6px 8px}
.after{display:flex;flex-direction:column;gap:12px;animation:fi .35s ease both}
.tchip{align-self:flex-start;display:inline-flex;gap:8px;align-items:center;min-height:52px;padding:0 18px;border-radius:999px;border:2px solid var(--pri);background:#fff;color:var(--pri);font:700 17px/1 var(--head)}
.tchip.on{background:var(--pri);color:#fff}
.why{display:inline-flex;align-items:center;gap:6px;background:var(--ok-soft);color:var(--ok-ink);border-radius:999px;padding:10px 14px;font:700 15px/1.25 var(--sans);align-self:flex-start}

/* ---------- HERO: 3D document card (weekly report on 15, plan card on 20) ---------- */
.hero{position:relative;perspective:1000px;perspective-origin:50% 35%;margin:0 auto;flex:none}
.hscene{position:absolute;inset:0;transform-style:preserve-3d;will-change:transform}
.hscene>*{position:absolute}
.hfloor{left:8%;right:8%;top:14%;bottom:-8%;border-radius:20px;background:radial-gradient(ellipse at center,#1B1E4A50,transparent 68%);filter:blur(10px);transform:translateZ(-36px)}
.hedge{inset:0;border-radius:16px;background:#CDD1E1;transform:translateZ(-5px)}
.hpaper{inset:0;border-radius:16px;background:linear-gradient(115deg,#FFFFFF 0%,#F7F8FD 40%,#FFFFFF 52%,#F2F4FB 66%,#FFFFFF 100%);background-size:260% 100%;border:1.5px solid #DADDEA;transform:translateZ(0)}
.hbody{inset:0;padding:16px 18px;transform:translateZ(10px);display:flex;flex-direction:column;gap:8px;color:#10132E;overflow:hidden}
.htag{align-self:flex-start;font:700 11.5px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--pri);background:var(--pri-soft);padding:5px 8px;border-radius:6px}
.htitle{font:800 18px/1.25 var(--head)}
.hl{font-size:16px;line-height:1.35;display:flex;gap:8px}
.hl i{font-style:normal;color:var(--pri);font-weight:800;flex:none}
.hnext{font-size:16px;line-height:1.35;font-weight:600;border-top:1px dashed var(--line-2);padding-top:8px}
.ln{opacity:0;transform:translateY(5px);transition:opacity .35s ease,transform .35s ease}
.ln.on{opacity:1;transform:none}
.skel{position:absolute;left:18px;right:18px;top:52px;display:flex;flex-direction:column;gap:12px;transition:opacity .3s ease}
.skel i{display:block;height:12px;border-radius:6px;background:#EEF0F7}
.skel i:nth-child(1){width:70%;height:16px}.skel i:nth-child(3){width:86%}.skel i:nth-child(4){width:62%}
.skel b{font:600 14px var(--sans);color:var(--t3);margin-top:6px}
.hstamp{right:14px;bottom:14px;padding:.45em .7em;border:2.5px solid #16A34A;border-radius:.5em;color:#12813A;font:800 14px/1.15 var(--head);text-align:center;background:#F2FBF5;transform:translateZ(30px) rotate(-8deg)}
.hstamp small{display:block;font:700 10px/1 var(--sans);letter-spacing:.14em}
.hstamp.drop{animation:stamp .5s cubic-bezier(.5,0,.6,1.4) both}
.hstamp.drop.late{animation-delay:1.5s}
@keyframes stamp{0%{opacity:0;transform:translateZ(110px) rotate(-22deg) scale(1.7)}70%{opacity:1}100%{opacity:1;transform:translateZ(30px) rotate(-8deg) scale(1)}}

/* AI-generated imagery (img/). Each <img> sits over the original CSS/emoji art and removes itself on error, so the art stays as fallback. */
.pimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:inherit;display:block;z-index:2}
.photo .pimg{object-position:50% 24%}
.face{position:relative;overflow:hidden}
.tile .ill{width:100%;height:84px;border-radius:12px;position:relative;overflow:hidden;display:grid;place-items:center;background:#FFF3E6;font-size:30px;line-height:1;flex:none}
.tile.on .ill{box-shadow:0 0 0 2px var(--pri)}
.photoband{height:156px;border-radius:22px;position:relative;overflow:hidden;flex:none;background:linear-gradient(170deg,#FCEFE3,#F4DCC7);display:grid;place-items:center;font-size:64px}
.photoband .pimg{object-position:50% 26%}
.rv .av{position:relative;overflow:hidden}

/* faint flat certificate (name screen) */
.certflat{border-radius:14px;border:2px solid #DAD7FA;background:#FBFBFF;padding:18px;display:flex;flex-direction:column;align-items:center;gap:6px;opacity:.75;text-align:center}
.certflat .e1{font:700 11px/1 var(--sans);letter-spacing:.2em;color:var(--pri)}
.certflat .e2{font:800 16px/1.2 var(--head)}
.certflat .nm{font:600 28px/1.2 var(--serif);min-width:70%;border-bottom:1.5px solid var(--line-2);min-height:40px;color:var(--t1)}

/* proof */
.rv{padding:16px;border-radius:18px;border:2px dashed var(--line-2);background:var(--soft);display:flex;flex-direction:column;gap:8px}
.rv .rh{display:flex;gap:12px;align-items:center}
.rv .av{width:46px;height:46px;border-radius:50%;background:#E1E4EE;display:grid;place-items:center;color:var(--t3);font-size:20px;flex:none}
.rv p{margin:0;color:var(--t1);font-size:17px}
.rv small{color:var(--t3);font-size:13.5px}

/* loading */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal span{aspect-ratio:1;border-radius:9px;background:#F1F2F8;border:1px solid var(--line);display:grid;place-items:center;font:700 12px/1 var(--sans);color:transparent;transition:background .25s,border-color .25s,transform .25s,color .25s}
.cal span.on{background:var(--pri-soft);border-color:#C9C5F5;color:var(--pri);transform:scale(1.04)}
.cal span.ctile.on{background:var(--ok-soft);border-color:var(--ok)}
.steps{display:flex;flex-direction:column;gap:14px}
.step .top{display:flex;justify-content:space-between;align-items:center;font-size:16px;color:var(--t2);margin-bottom:7px;gap:10px}
.step .top .pct{font-variant-numeric:tabular-nums;color:var(--t3);display:flex;gap:5px;align-items:center;flex:none}
.step.done .top{color:var(--t1)}
.step.done .pct{color:var(--ok)}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar span{display:block;height:100%;background:var(--ok);width:0}

/* gate */
.blurcard{position:relative;border-radius:18px;overflow:hidden;border:1px solid var(--line)}
.blurcard .inner{filter:blur(5px);padding:16px;display:flex;flex-direction:column;gap:8px;user-select:none}
.blurcard .frost{position:absolute;inset:0;background:#ffffffa6;display:grid;place-items:center;color:var(--pri)}
.wk{display:flex;gap:12px;align-items:center;padding:12px;border-radius:14px;background:var(--soft);border:1px solid var(--line)}
.wk .n{width:40px;height:40px;border-radius:12px;background:var(--pri-soft);color:var(--pri);display:grid;place-items:center;font:800 13px/1 var(--head);flex:none}
.wk b{display:block;font-size:16.5px;line-height:1.25}
.wk span{font-size:14.5px;color:var(--t2)}
.wk.last .n{background:var(--ok-soft);color:var(--ok)}

/* summary */
.meter{position:relative;padding-top:36px}
.meter .track{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px}
.meter .track span{height:12px;border-radius:6px;background:#E6E8F2}
.meter .track span.on{background:var(--pri)}
.meter .labels{display:grid;grid-template-columns:1fr 1fr 1fr;font-size:13.5px;color:var(--t2);margin-top:8px;text-align:center;line-height:1.2}
.meter .labels span.on{color:var(--pri);font-weight:700}
.meter .mk{position:absolute;top:0;transform:translateX(-50%);background:var(--t1);color:#fff;font:700 12.5px/1 var(--sans);padding:7px 10px;border-radius:999px;white-space:nowrap}
.meter .mk::after{content:"";position:absolute;left:50%;bottom:-4px;width:8px;height:8px;background:var(--t1);transform:translateX(-50%) rotate(45deg)}
.srow{display:flex;gap:12px;align-items:center;padding:13px 0;border-top:1px solid var(--line)}
.srow:first-child{border-top:none}
.srow .well{width:44px;height:44px;border-radius:12px;background:var(--pri-soft);display:grid;place-items:center;font-size:20px;flex:none}
.srow small{display:block;color:var(--t2);font-size:14px}
.srow b{font-size:17.5px}
.card{padding:4px 14px;border-radius:18px;border:1px solid var(--line);background:var(--surface)}

/* plan */
.ba{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ba > div{border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px;font-size:15px}
.ba h5{margin:0;font:800 13px/1 var(--sans);letter-spacing:.04em;text-transform:uppercase}
.ba .now{background:#F0F1F6;color:var(--t2)}
.ba .with{background:var(--ok-soft);color:var(--ok-ink)}
.ba div div{display:flex;gap:6px;align-items:flex-start}
.fine{font-size:13.5px;color:var(--t3);text-align:center;margin:0}

/* features */
.feat{display:flex;gap:10px}
.feat .rows{flex:1;display:flex;flex-direction:column;gap:12px}
.feat .r{display:flex;gap:8px;align-items:flex-start;font-size:17px;font-weight:500;line-height:1.3}
.feat .r .ck{width:22px;height:22px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;flex:none;margin-top:1px}
.mock{width:108px;height:204px;border-radius:20px;background:#0E0F1A;padding:5px;flex:none;transform:rotate(6deg);box-shadow:0 18px 30px -16px #0008;margin-top:6px}
.mock .in{width:100%;height:100%;border-radius:16px;background:#fff;padding:14px 8px 8px;display:flex;flex-direction:column;gap:6px;font-size:9px;overflow:hidden;position:relative}
.mock .in b{font:800 11px/1.15 var(--head)}
.mock .stp{align-self:flex-start;background:var(--t1);color:#fff;border-radius:999px;padding:3px 6px;font-weight:700}
.mock .bx{border:1px solid var(--line-2);border-radius:6px;padding:5px;color:var(--t2)}
.mock .go{align-self:flex-end;background:var(--pri);color:#fff;border-radius:6px;padding:5px 8px;font-weight:700}
.mock .f{position:absolute;right:10px;bottom:34px;font-size:20px}

/* paywall */
.minip{display:flex;gap:12px;align-items:center;padding:14px;border-radius:16px;background:linear-gradient(135deg,#3B30C4,#5A4FE0);color:#fff}
.minip .ic{width:44px;height:44px;border-radius:12px;background:#ffffff26;display:grid;place-items:center;font-size:22px;flex:none}
.minip small{display:block;opacity:.9;font-size:14px}
.minip b{font-size:17px}
.plan{display:flex;gap:12px;align-items:flex-start;padding:16px;border-radius:18px;border:2px solid var(--line);background:var(--surface);text-align:left;width:100%;position:relative}
.plan.on{border:2.5px solid var(--pri);padding:15.5px;background:#FAFAFF}
.plan .radio{width:26px;height:26px;border-radius:50%;border:2px solid var(--line-2);display:grid;place-items:center;flex:none;color:#fff;margin-top:1px}
.plan.on .radio{background:var(--pri);border-color:var(--pri)}
.plan .pn{font:800 18px/1.2 var(--head);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.plan .pp{font-size:18px;color:var(--t1);margin-top:6px;line-height:1.6}
.plan .pd{font-size:14px;color:var(--t2);margin-top:3px}
.bdg{font:700 11px/1 var(--sans);letter-spacing:.05em;background:var(--pri);color:#fff;padding:5px 7px;border-radius:5px}
.bdg.g{background:var(--ok)}
.trust{font-size:15px;color:var(--t2);text-align:center;line-height:1.7}
.pays{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.pays span{font:700 12px/1 var(--sans);padding:7px 9px;border-radius:6px;border:1px solid var(--line);color:var(--t1);background:#fff}
.payline{font-size:16px;color:var(--t1);text-align:center;line-height:1.55;text-wrap:pretty}
.closex{width:44px;height:44px;border-radius:50%;border:none;background:var(--soft);display:grid;place-items:center;color:var(--t2);flex:none}
.dim{position:absolute;inset:0;background:#0D0F2266;z-index:4;animation:fi .25s ease}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:5;background:#fff;border-radius:26px 26px 0 0;padding:10px 20px 30px;display:flex;flex-direction:column;gap:14px;animation:up .32s cubic-bezier(.2,.8,.2,1)}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line-2);align-self:center}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}

/* receipt */
.receipt{border-radius:18px;border:1px solid var(--line);background:var(--soft);padding:16px;display:flex;flex-direction:column}
.receipt .rr{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px dashed var(--line-2);font-size:17px;line-height:1.5}
.receipt .rr:first-of-type{border-top:none}
.receipt .rr span:first-child{color:var(--t2)}
.receipt .rr span:last-child{text-align:right;font-weight:600}
.receipt h4{margin:0 0 6px;font:800 19px var(--head)}
.cardform{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cardform .full{grid-column:1/-1}
.orline{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--t2)}
.orline::before,.orline::after{content:"";flex:1;height:1px;background:var(--line)}

/* welcome */
.okbig{width:80px;height:80px;border-radius:50%;background:var(--ok);display:grid;place-items:center;color:#fff;align-self:center;box-shadow:0 0 0 10px var(--ok-soft);animation:popin .5s cubic-bezier(.3,1.5,.5,1);flex:none}
@keyframes popin{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
.nsteps{display:flex;flex-direction:column;gap:10px}
.nsteps div{display:flex;gap:12px;align-items:center;font-size:17.5px}
.nsteps b{width:34px;height:34px;border-radius:50%;background:var(--pri-soft);color:var(--pri);display:grid;place-items:center;font:800 15px var(--head);flex:none}
.stores{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.store{height:58px;border-radius:14px;background:#0E0F1A;color:#fff;border:none;display:flex;align-items:center;justify-content:center;gap:8px;font-size:11px;line-height:1.1;text-align:left}
.store b{display:block;font:700 16px var(--head)}
.store .g{font-size:20px}
.d1{display:flex;gap:12px;align-items:center;padding:14px;border-radius:16px;background:var(--pri-soft);border:1px solid #DAD7FA}
.d1 .ic{width:48px;height:48px;border-radius:12px;background:var(--pri);color:#fff;display:grid;place-items:center;flex:none}
.d1 small{color:var(--t2);display:block;font-size:14px}
.d1 b{font-size:17px}

.toast{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 58px);transform:translateX(-50%);z-index:9;background:#141733;color:#fff;font-size:14px;font-weight:500;padding:10px 15px;border-radius:999px;white-space:nowrap;animation:fade 2.6s ease forwards;box-shadow:0 10px 24px -10px #0006}
@keyframes fade{0%{opacity:0;transform:translate(-50%,-6px)}10%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
.fadein{animation:fi .35s ease both}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- production: tap targets, narrow-screen safety ---------- */
.link{min-height:44px}
.cbx{min-height:44px;align-items:center}
.legalline button::after,.tlink::after,.sugg button::after,.err button::after{content:"";position:absolute;inset:-11px -4px}
.legalline button,.tlink,.sugg button,.err button{position:relative}
.scr,.foot{min-width:0}
.scr>*{max-width:100%}
@media (max-width:374px){.display{font-size:27px}.display.xl{font-size:30px}.scr{padding-inline:16px}.foot{padding-inline:16px}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition:none!important}
}
/* ---------- last-chance offer (once, on paywall close) ---------- */
.owrap{gap:16px;padding-top:4px;padding-bottom:26px}
.obar{display:flex;align-items:center;justify-content:space-between;padding:4px 0 2px}
.obrand{display:inline-flex;align-items:center;gap:8px;font:800 16px/1 var(--head);color:var(--t1)}
.obrand i{width:26px;height:26px;border-radius:8px;background:var(--pri);color:#fff;display:grid;place-items:center;font:800 13px/1 var(--head);font-style:normal}
.ohead{display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center}
.ohead .display{font-size:27px}
.ohead .eyebrow{font:700 11px/1 var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--pri)}
.otimer{display:inline-flex;gap:8px;padding:8px 14px;border-radius:999px;background:var(--soft);border:1px solid var(--line);font-size:13px;color:var(--t2)}
.otimer b{color:var(--pri);font-variant-numeric:tabular-nums}
.ocard{position:relative;display:flex;flex-direction:column;gap:14px;padding:22px 16px 16px;border-radius:22px;border:2px solid var(--pri);background:linear-gradient(180deg,#F7F6FF,#fff 40%);box-shadow:0 0 0 5px var(--pri-soft),0 24px 44px -26px #3B30C466}
.obadge{position:absolute;top:-12px;left:50%;transform:translateX(-50%);padding:6px 12px;border-radius:999px;background:var(--pri);color:#fff;font:700 11px/1 var(--sans);letter-spacing:.06em;white-space:nowrap}
.obadge .ph{background:transparent;color:#fff;border-color:#ffffffaa}
.oname{display:flex;flex-direction:column;gap:3px;text-align:center}
.oname b{font:800 18px/1.2 var(--head)}.oname span{font-size:13px;color:var(--t2)}
.oprice{display:flex;align-items:baseline;justify-content:center;flex-wrap:wrap;gap:10px;padding:14px;border-radius:14px;background:var(--soft);border:1px solid var(--line)}
.oprice s,.oprice s .ph{color:var(--t3);font-size:14px;text-decoration:line-through;text-decoration-thickness:1.5px}.oprice b{font:800 26px/1 var(--head);color:var(--pri)}.oprice>span{color:var(--t2);font-size:13px}
.ochecks{display:flex;flex-direction:column;gap:9px}
.ochecks div{display:flex;gap:10px;align-items:flex-start;font-size:14.5px;color:var(--t1)}
.ochecks .ck{width:20px;height:20px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;flex:none;margin-top:1px}
.ocard .pays span{font:700 10.5px/1 var(--sans);padding:5px 7px;border-radius:6px;border:1px solid var(--line);color:var(--t2);background:#fff}
.ocard .fine{margin:0}
</style>

<body>

<script>
/* =====================================================================
   CONFIG — edit before launch.
   Every value in [square brackets] or <angle brackets> is a TODO placeholder
   from the brief (funnel-content.md). Placeholders render with a dashed
   outline so an unfilled value is easy to spot. Fill with ikame's real,
   verified numbers only.
   ===================================================================== */
const CONFIG={
  slug:'coursiv-ai-simple',
  brand:'Coursiv',
  plans:{
    '1w': {name:'1-week plan', price:'[1-week intro price]',  /* TODO */ renewPrice:'[regular 1-week price]',  /* TODO */ period:'week',     days:7,  badge:''},
    '4w': {name:'4-week plan', price:'[4-week intro price]',  /* TODO */ renewPrice:'[regular 4-week price]',  /* TODO */ period:'4 weeks',  days:28, badge:'MOST POPULAR'},   /* badge only if true */
    '12w':{name:'12-week plan',price:'[12-week intro price]', /* TODO */ renewPrice:'[regular 12-week price]', /* TODO */ period:'12 weeks', days:84, badge:'BEST VALUE', perDay:'[per-day price]' /* TODO */}
  },
  defaultPlan:'4w',
  /* Last-chance offer: shown once per session when the paywall is closed without paying (close X or back).
     Real terms only: price / renews stay placeholders until the growth team sets them, and checkout must charge exactly these.
     compareAt = the plan it undercuts (that plan's real intro price is struck). period = how often it renews.
     expiresMin: null = no timer. A number = a real deadline: when it ends the offer is withdrawn for this session. */
  offer:{enabled:true,name:'4-week plan',price:'{{offer_price}}',renews:'{{offer_renew_price}}',period:'4 weeks',compareAt:'4w',badge:'{{offer_badge}}',checkoutUrl:'',expiresMin:null},
  /* Checkout URL per plan. '' = no navigation, only the checkout_click event is emitted. */
  checkoutUrl:{'1w':'','4w':'','12w':''},
  /* true: paywall CTA -> order review (brief screen 24) -> "Pay securely" = checkout.
     false: paywall CTA goes straight to checkout. */
  orderReview:true,
  termsUrl:'',             /* TODO */
  privacyUrl:'',           /* TODO */
  subscriptionTermsUrl:'', /* TODO */
  refundPolicyUrl:'',      /* TODO */
  loginUrl:'',             /* TODO: "log in instead?" link */
  appStoreUrl:'',          /* TODO */
  googlePlayUrl:'',        /* TODO */
  supportEmail:'[support@example.com]', /* TODO */
  /* Welcome screen help line "Stuck? Reply to our email. A real person helps." — brief: only if support is staffed. */
  supportStaffed:false,    /* TODO: true only if a real person answers */
  stats:{
    learners:'[N]',             /* TODO: verified learner count */
    rating:'[X]',               /* TODO: verified rating */
    reviewPlatform:'[review platform]', /* TODO */
    asOf:'<month year>',        /* TODO */
    refundDays:'[N]'            /* TODO: refund window in days */
  },
  /* TODO: real, attributed, dated reviews only (ease / saved time; no raise or promotion claims).
     proofHeadlineB: variant B headline is a verbatim review quote — only if a real review says it. */
  reviews:{
    proofHeadlineB:'"Easier than I expected"',
    cards:[
      {name:'Real first name · age range',meta:'Job · store · date',text:'“Real, attributed, dated review about ease or saved time goes here.”'},
      {name:'Real first name · age range',meta:'Job · store · date',text:'“Real, attributed, dated review about ease or saved time goes here.”'}
    ],
    loading:[{text:'“Real, attributed, dated ikame review goes here.”',by:'Reviewer name · source · date'},{text:'“Real, attributed, dated ikame review goes here.”',by:'Reviewer name · source · date'}]
  },
  /* Where postMessage events may go. '*' works in any FunnelFox embed; set the parent origin to lock it down. */
  parentOrigin:'*'
};

const IC={
  check:'<path d="M20 6 9 17l-5-5"/>',
  x:'<path d="M18 6 6 18M6 6l12 12"/>',
  back:'<path d="m15 18-6-6 6-6"/>',
  lock:'<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
  mail:'<rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/>',
  user:'<circle cx="12" cy="8" r="5"/><path d="M20 21a8 8 0 0 0-16 0"/>',
  flag:'<path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><path d="M4 22v-7"/>',
  apple:'<path d="M12 20.94c1.5 0 2.75 1.06 4 1.06 3 0 6-8 6-12.22A4.91 4.91 0 0 0 17 5c-2.22 0-4 1.44-5 2-1-.56-2.78-2-5-2a4.9 4.9 0 0 0-5 4.78C2 14 5 22 8 22c1.25 0 2.5-1.06 4-1.06Z"/><path d="M10 2c1 .5 2 2 2 5"/>',
  card:'<rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/>',
  play:'<path d="m6 3 14 9-14 9V3z"/>'
};
const ic=(n,s=20,c='currentColor',w=1.9)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[n]}</svg>`;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* unfilled CONFIG placeholders ([..] / <..>) render outlined; real values render as plain text */
const isTodo=s=>/^\s*([\[<]|\{\{)/.test(String(s));

/* pixels never receive the raw email */
function pixelSafe(d){const o={};for(const[k,v]of Object.entries(d)){if(k==='data'){for(const[dk,dv]of Object.entries(v)){if(dk==='email')o.has_email=!!dv;else o[dk]=Array.isArray(dv)?dv.join(', '):dv}}else if(k!=='email')o[k]=v}return o}
function emit(name,detail){
  const d=Object.assign({funnel:CONFIG.slug},detail||{},{data:snapshot()});
  try{window.dispatchEvent(new CustomEvent('ikfunnel:'+name,{detail:d}))}catch(e){}
  try{window.parent.postMessage({source:'ikame-funnel',funnel:CONFIG.slug,event:name,detail:d},CONFIG.parentOrigin||'*')}catch(e){}
  const px=pixelSafe(d);
  try{if(typeof window.fbq==='function')window.fbq('trackCustom',name,px)}catch(e){}
  try{if(window.ttq&&typeof window.ttq.track==='function')window.ttq.track(name,px)}catch(e){}
}

function viewed(){

function openUrl(url){if(!url)return false;try{window.open(url,'_blank','noopener')}catch(e){}return true}
const LEGAL={terms:'termsUrl',privacy:'privacyUrl',subscription:'subscriptionTermsUrl',refund:'refundPolicyUrl'};
function checkout(){
  const plan=S.plan,P=PLANS[plan],url=(CONFIG.checkoutUrl||{})[plan]||'';
  emit('checkout_click',{plan,price:P.today,renewPrice:P.renew,period:P.per,url});
  if(!url)return;
  let u;try{u=new URL(url,location.href)}catch(e){return}
  u.searchParams.set('plan',plan);
  if(S.email)u.searchParams.set('email',S.email);
  QS.forEach((v,k)=>{if(/^utm_/i.test(k)&&!u.searchParams.has(k))u.searchParams.set(k,v)});
  try{window.top.location.href=u.toString()}catch(e){location.href=u.toString()}
}

function go(n,push=true){stopAll();const dir=n<S.i?'b':'f';if(dir==='f')emitAnswers(S.i);if(push&&S.i!==n)S.hist.push(S.i);S.i=n;S.err='';S.sheet=null;render(dir);viewed()}
function next(){go(S.i+1)}
function back(){stopAll();const p=S.hist.pop();if(p){S.i=p;S.err='';S.sheet=null;render('b');viewed()}}
function toast(msg){const el=document.createElement('div');el.className='toast';el.textContent=msg;phone.appendChild(el);setTimeout(()=>el.remove(),2700)}

function fillTo(n){
  if(n>1&&!S.hook)S.hook='little';
  if(n>2&&!S.myth)S.myth='no';
  if(n>4&&!S.job)S.job='office';
  if(n>5&&!S.chores.length)S.chores=['report','email'];
  if(n>6&&!S.comfort)S.comfort='help';
  if(n>8&&!S.worry)S.worry='behind';
  if(n>10&&!S.goal)S.goal='time';
  if(n>12&&!S.slot)S.slot='coffee';
  if(n>13&&!S.name.trim())S.name='Linda';
  if(n>14&&!S.check)S.check='double';

  if(n>22&&!S.agree)S.agree=true;
}

const suggest=em=>{const m=em.trim().match(/^([^\s@]+)@([^\s@]+)$/);if(!m)return '';const fix=TYPO[m[2].toLowerCase()];return fix?`${m[1]}@${fix}`:''};

/* ---------- last-chance offer (once per session, on paywall close) ---------- */
const PW_N=22,OFFER_N=23;
const OKEY='ikf_offer_'+CONFIG.slug;
const offerOpen=()=>{const o=CONFIG.offer;if(!o||!o.enabled||S.offerSeen)return false;try{if(sessionStorage.getItem(OKEY))return false}catch(e){}
  if(o.expiresMin&&S.offerEnd&&Date.now()>S.offerEnd)return false;return true};
function runOffer(){const o=CONFIG.offer;try{sessionStorage.setItem(OKEY,'1')}catch(e){}
  clearInterval(window.__oiv);if(!o.expiresMin)return;if(!S.offerEnd)S.offerEnd=Date.now()+o.expiresMin*60000;
  const tick=()=>{const el=document.getElementById('otimer');if(!el||S.i!==OFFER_N)return clearInterval(window.__oiv);const ms=S.offerEnd-Date.now();
    if(ms<=0){clearInterval(window.__oiv);S.offerSeen=true;emit('offer_expired');offerExit();return}
    el.textContent=String(Math.floor(ms/60000)).padStart(2,'0')+':'+String(Math.floor(ms/1000)%60).padStart(2,'0')};
  tick();window.__oiv=setInterval(tick,1000)}
/* leaving the offer without buying = the paywall's existing close path: back to the screen before the paywall */
function offerExit(){clearInterval(window.__oiv);let p=S.hist.pop();while(p>=PW_N&&S.hist.length)p=S.hist.pop();go(p&&p<PW_N?p:PW_N-1,false)}
function offerCheckout(){const o=CONFIG.offer,url=o.checkoutUrl||'';

  if(!url)return;let u;try{u=new URL(url,location.href)}catch(e){return}
  u.searchParams.set('plan','offer');if(S.email)u.searchParams.set('email',S.email);
  QS.forEach((v,k)=>{if(/^utm_/i.test(k)&&!u.searchParams.has(k))u.searchParams.set(k,v)});
  try{window.top.location.href=u.toString()}catch(e){location.href=u.toString()}}

/* loading: 28 tiles + 4 rows, ~6s, then auto-advance */
function runLoading(){
  const t0=performance.now(),D=5600;let rv=0;
  const tiles=[...document.querySelectorAll('#cal span')];
  timer=setInterval(()=>{
    if(!cur()||S.i!==17){clearInterval(timer);return}
    const e=performance.now()-t0,k=Math.min(1,e/D);
    tiles.forEach((s,i)=>s.classList.toggle('on',i<Math.floor(k*28+.001)));
    for(let r=0;r<4;r++){const el=document.getElementById('st'+r);if(!el)continue;const p=Math.round(Math.max(0,Math.min(1,k*4-r))*100);
      el.querySelector('.bar span').style.width=p+'%';
      if(p>=100&&!el.classList.contains('done')){el.classList.add('done');el.querySelector('.pct').innerHTML=`${ic('check',16,'currentColor',2.6)}<span>100%</span>`}
      else if(p<100)el.querySelector('.pct span').textContent=p+'%'}
    const RL=CONFIG.reviews.loading,nr=Math.floor(e/2200)%Math.max(1,RL.length);if(nr!==rv&&RL[nr]){rv=nr;const c=document.getElementById('rrot');if(c){c.classList.remove('fadein');void c.offsetWidth;c.classList.add('fadein');c.querySelector('p').textContent=RL[nr].text;c.querySelector('small').textContent=`— ${RL[nr].by}`}}
    if(k>=1){clearInterval(timer);timer=setTimeout(()=>{if(S.i===17)go(18)},700)}
  },50);
}

/* micro-lesson: type request → notes merge → report writes line by line */
function runLesson(){
  const v=cur();if(!v||S.stage)return;
  const F=FMT[lessonKind()];S.stage=1;
  const req=v.querySelector('#req'),txt=v.querySelector('#reqtxt');
  req.classList.add('sent');req.disabled=true;v.querySelector('#reqhint').hidden=true;
  const alive=()=>S.i===15&&cur()===v;
  const lines=[...v.querySelectorAll('.hero .ln')],skel=v.querySelector('.hero .skel'),stamp=v.querySelector('.hero .hstamp');
  const finish=()=>{if(!alive())return;S.stage=3;lines.forEach(l=>l.classList.add('on'));if(skel)skel.hidden=true;v.querySelector('#pile').classList.add('merge');
    if(stamp){stamp.hidden=false;stamp.classList.add('drop')}
    v.querySelector('#after').hidden=false;const b=v.querySelector('.foot .btn.main');if(b)b.disabled=false;renderPanel()};
  if(RM){txt.textContent=`"${F.req}"`;finish();return}
  const full=`"${F.req}"`;let i=0;txt.textContent='';
  timer=setInterval(()=>{i+=2;txt.textContent=full.slice(0,i);if(i>=full.length){clearInterval(timer);timer=null;
    S.stage=2;v.querySelector('#pile').classList.add('merge');
    later(()=>{if(skel)skel.style.opacity=0},350);
    lines.forEach((l,k)=>later(()=>{if(alive())l.classList.add('on')},600+k*420));
    later(finish,600+lines.length*420+250)}},28);
}

function render(dir){
  const n=S.i;const html=nav()+V[n]();
  const old=cur();
  if(dir&&old&&!RM){
    old.classList.remove('cur');old.setAttribute('inert','');
    old.querySelectorAll('[id]').forEach(e=>e.removeAttribute('id'));
    old.classList.add('out');
    const nv=document.createElement('div');nv.className='view cur in';nv.innerHTML=html;stage.appendChild(nv);
    setTimeout(()=>old.remove(),240);
    setTimeout(()=>nv.classList.remove('in'),360);
  }else if(!old){const nv=document.createElement('div');nv.className='view cur';nv.innerHTML=html;stage.appendChild(nv)}
  else{stage.querySelectorAll('.view:not(.cur)').forEach(x=>x.remove());old.innerHTML=html}
  const v=cur();
  v.querySelectorAll('.hero').forEach(mountHero);
  if(n===17)runLoading();
  const f=v.querySelector('#nm,#em,#oth');
  if(f&&(dir||f.id==='oth')&&!('ontouchstart' in window)){setTimeout(()=>{if(cur()!==v||!f.isConnected)return;f.focus({preventScroll:true});const x=f.value;f.value='';f.value=x},dir?300:0)}
  if(n===OFFER_N)runOffer();
  renderPanel();
}

  const o={el,mode,scene:el.firstElementChild,paper:el.querySelector('.hpaper'),t0:performance.now(),px:0,py:0,tx:0,ty:0};
  el._c=o;HEROES.add(o);
  el.addEventListener('pointermove',e=>{const r=el.getBoundingClientRect();o.tx=(e.clientX-r.left)/r.width-.5;o.ty=(e.clientY-r.top)/r.height-.5});
  el.addEventListener('pointerleave',()=>{o.tx=0;o.ty=0});
  if(RM){drawHero(o,performance.now()+99999);return}
  if(!HEROES.loop){HEROES.loop=true;requestAnimationFrame(heroFrame)}
}
function drawHero(o,now){
  const t=(now-o.t0)/1000;
  o.px+=(o.tx-o.px)*.08;o.py+=(o.ty-o.py)*.08;
  let rx=9+Math.sin(t*.6)*3,ry=Math.sin(t*.45)*10,rz=Math.sin(t*.3)*.8,s=1;
  if(RM){rx=8;ry=-8;rz=0}
  if(o.mode==='land'&&!RM){const k=ease(Math.min(1,t/1.6));rx=78*(1-k)+rx*k;ry=-22*(1-k)+ry*k;rz=-8*(1-k)+rz*k;s=.62+.38*k;o.el.style.opacity=Math.min(1,t/.35)}
  rx+=o.py*-18;ry+=o.px*24;
  /* never opacity/filter on .hscene (preserve-3d) — only the outer .hero fades */
  o.scene.style.transform=`scale(${s}) rotateX(${rx.toFixed(2)}deg) rotateY(${ry.toFixed(2)}deg) rotateZ(${rz.toFixed(2)}deg)`;
  o.paper.style.backgroundPosition=`${(50+ry*2.4).toFixed(1)}% 0`;
}
function heroFrame(now){
  for(const o of HEROES){if(!o.el.isConnected){HEROES.delete(o);continue}drawHero(o,now)}
  if(HEROES.size)requestAnimationFrame(heroFrame);else HEROES.loop=false;
}

const tapNext=(scr)=>{render();setTimeout(()=>{if(S.i===scr)next()},260)};
phone.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b||b.disabled)return;
  const a=b.dataset.a,v=b.dataset.v;
  switch(a){
    case 'next':next();break;
    case 'back':back();break;
    case 'legal':{const url=CONFIG[LEGAL[v]]||'';emit('legal_click',{doc:v,url});openUrl(url);break}
    case 'hook':S.hook=v;tapNext(1);break;
    case 'myth':if(!S.myth){S.myth=v;render()}break;
    case 'job':S.job=v;render();break;
    case 'chore':if(S.chores.includes(v)){S.chores=S.chores.filter(x=>x!==v);S.err=''}else if(S.chores.length<2){S.chores=[...S.chores,v];S.err=''}else S.err='Up to two — tap one to swap it out.';render();break;
    case 'comfort':S.comfort=v;tapNext(6);break;
    case 'worry':S.worry=v;render();break;
    case 'goal':S.goal=v;render();break;
    case 'minutes':S.minutes=+v;render();break;
    case 'slot':S.slot=v;tapNext(12);break;
    case 'name':if(!S.name.trim()){S.err='Please enter your name to continue';render();document.getElementById('nm')?.focus()}else{S.name=S.name.trim();next()}break;
    case 'check':if(!S.check){S.check=v;render()}break;
    case 'req':runLesson();break;
    case 'friendly':{S.friendly=!S.friendly;const F=FMT[lessonKind()],D=lessonData(),vv=cur();
      const ti=vv.querySelector('#htitle'),nx=vv.querySelector('#hnext');
      if(ti)ti.textContent=S.friendly?F.friendly:F.title();if(nx)nx.textContent=F.next+D.x+(S.friendly?' Thanks so much!':'');
      b.classList.toggle('on',S.friendly);b.setAttribute('aria-pressed',S.friendly);b.textContent=S.friendly?'✓ Friendlier':'😊 Make it friendlier';break}
    case 'email':{const em=S.email.trim();if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(em)){S.err='invalid';render();break}
      S.email=em;
      /* optional host hook: window.IkameFunnel.emailTaken(email) -> true | Promise<true> shows the "already has an account" error */
      const hook=window.IkameFunnel&&window.IkameFunnel.emailTaken;
      const proceed=taken=>{if(S.i!==18)return;if(taken){S.err='taken';render()}else{emit('lead',{marketingOptIn:S.tips});next()}};
      if(typeof hook==='function'){Promise.resolve().then(()=>hook(em)).then(proceed,()=>proceed(false))}else proceed(false);
      break}
    case 'usesugg':S.email=v;S.err='';render();break;
    case 'login':emit('login_click',{url:CONFIG.loginUrl||''});openUrl(CONFIG.loginUrl);break;
    case 'tips':S.tips=!S.tips;render();break;
    case 'plan':if(S.plan!==v){S.plan=v;emit('plan_select',{plan:v,price:PLANS[v].today,renewPrice:PLANS[v].renew,period:PLANS[v].per})}render();break;
    case 'agree':S.agree=!S.agree;render();break;
    case 'buy':if(CONFIG.orderReview)go(24);else checkout();break;
    case 'howcancel':S.sheet='cancel';emit('cancel_info_view');render();break;
    case 'dismiss':if(S.sheet){S.sheet=null;render()}else{const show=offerOpen();emit('paywall_close',{plan:S.plan,offerShown:show});if(show)go(OFFER_N);else back()}break;
    case 'offerbuy':S.offerSeen=true;S.offer=true;clearInterval(window.__oiv);offerCheckout();break;
    case 'offerno':S.offerSeen=true;emit('offer_decline',{price:CONFIG.offer.price});offerExit();break;
    case 'nothanks':S.sheet=null;render();break;
    case 'pay':checkout();break;
    case 'store':{const ios=v?v==='ios':/iPhone|iPad|iPod|Macintosh/i.test(navigator.userAgent);const url=(ios?CONFIG.appStoreUrl:CONFIG.googlePlayUrl)||CONFIG.appStoreUrl||CONFIG.googlePlayUrl||'';emit('store_click',{store:ios?'app_store':'google_play',url});openUrl(url);break}
  }
});
