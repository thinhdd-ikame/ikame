<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>Coursiv · Build Apps with AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
[hidden]{display:none!important}
:root{
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --head:"Plus Jakarta Sans","Inter",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --ground:#EEF0F6;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);color:#141733;font:15px/1.45 var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid #3B30C4;outline-offset:2px}

/* ---------- shell: app brand tokens, full-viewport mobile layout (.app is the in-lesson mini app) ---------- */
.shell{
  --bg:#FFFFFF;--soft:#F5F6FB;--surface:#FFFFFF;--line:#E3E5EF;--line-2:#CDD1E1;
  --t1:#141733;--t2:#4B516C;--t3:#878DA6;
  --pri:#3B30C4;--pri-ink:#FFFFFF;--pri-soft:#EEEDFD;--pri-deep:#2A2296;
  --ok:#16A34A;--ok-soft:#E7F6EC;--ok-ink:#0F7A36;--err:#D23B3B;--calm:#EEF4FC;
  --pane:#0F1222;
  color-scheme:light;color:var(--t1);
  position:relative;width:100%;max-width:480px;height:100vh;height:100dvh;margin:0 auto;background:var(--bg);overflow:hidden;isolation:isolate
}
@media (min-width:520px){.shell{border-inline:1px solid #D9DCE8}}
.stage{position:absolute;inset:0;z-index:1;overflow:hidden}
.view{position:absolute;inset:0;padding-top:calc(env(safe-area-inset-top,0px) + 8px);display:flex;flex-direction:column;background:var(--bg)}

.view.out{animation:vout .22s ease forwards;pointer-events:none;z-index:0}
.view.in{animation:vin .32s ease both;z-index:1}
@keyframes vout{to{opacity:0}}
@keyframes vin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.nav{height:46px;flex:none;display:flex;align-items:center;gap:10px;padding:0 14px;position:relative;z-index:3}
.iconbtn{width:36px;height:36px;border-radius:50%;border:none;background:transparent;display:grid;place-items:center;color:var(--t2);flex:none}
.iconbtn:hover{background:var(--soft)}
.prog{flex:1;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.prog span{display:block;height:100%;background:var(--pri);border-radius:3px;transition:width .35s ease}
.pcount{font:600 12px/1 var(--sans);color:var(--t3);font-variant-numeric:tabular-nums;min-width:36px;text-align:right}
.qdots{display:flex;gap:5px;align-items:center}
.qdots i{width:8px;height:8px;border-radius:50%;background:var(--line-2)}
.qdots i.f{background:var(--pri)}
.navspacer{width:36px;flex:none}

.scr{flex:1;overflow-y:auto;overflow-x:hidden;padding:6px 20px 12px;display:flex;flex-direction:column;gap:18px;position:relative}
.scr.center{justify-content:center}
.scr::-webkit-scrollbar{width:0}
.foot{flex:none;padding:10px 20px max(20px,calc(env(safe-area-inset-bottom,0px) + 12px));display:flex;flex-direction:column;gap:10px;position:relative;z-index:2;background:var(--bg)}
.foot .note{font-size:12px;color:var(--t3);text-align:center;text-wrap:balance}

.display{font:800 29px/1.14 var(--head);letter-spacing:-.02em;margin:0;text-wrap:balance;color:var(--t1)}
.display.sm{font-size:25px}
.lead{color:var(--t2);margin:0;font-size:15px;text-wrap:pretty}
.pill{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;background:var(--pri-soft);color:var(--pri);font:600 12.5px/1 var(--sans)}
.hint{font-size:13px;color:var(--t3)}
.err{font-size:13px;color:var(--err);font-weight:500}
.err button{background:none;border:none;padding:0;color:var(--pri);text-decoration:underline;font-weight:600}
.ph{display:inline-block;border:1.5px dashed #9A93E8;background:#F4F3FF;color:var(--pri-deep);border-radius:6px;padding:0 5px;font-weight:600;white-space:nowrap}

.btn{height:54px;border-radius:14px;border:none;background:var(--pri);color:var(--pri-ink);font:700 16px/1 var(--head);width:100%;display:flex;align-items:center;justify-content:center;gap:10px;transition:transform .12s ease,background .2s;box-shadow:0 10px 24px -12px #3B30C4aa;position:relative;overflow:hidden}
.btn:hover{background:var(--pri-deep)}
.btn:active{transform:scale(.985)}
.btn[disabled]{background:#E4E6F0;color:#9CA1B8;cursor:not-allowed;box-shadow:none}
.btn:not([disabled])::after{content:"";position:absolute;top:0;bottom:0;width:36%;left:0;background:linear-gradient(100deg,transparent,#ffffff55,transparent);transform:translateX(-150%) skewX(-20deg);animation:sheen 5s ease-in-out 1.4s infinite}
@keyframes sheen{0%{transform:translateX(-150%) skewX(-20deg)}26%,100%{transform:translateX(330%) skewX(-20deg)}}
.btn.dark{background:#0E0F1A;box-shadow:none}
.btn.line{background:var(--surface);color:var(--t1);border:1.5px solid var(--line-2);box-shadow:none}
.btn.line::after,.btn.dark::after{display:none}
.btn.go{letter-spacing:.06em}
.link{background:none;border:none;color:var(--t2);font-size:14px;padding:6px;text-align:center;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line-2)}
.link:hover{color:var(--t1)}

/* options */
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:13px;padding:13px 15px;border-radius:14px;background:var(--surface);border:1.5px solid var(--line);text-align:left;width:100%;transition:border-color .15s,background .15s,color .15s;min-height:54px}
.opt:hover{border-color:var(--line-2)}
.opt .em{font-size:20px;width:26px;text-align:center;flex:none;line-height:1}
.opt .lbl{flex:1;font-weight:600;font-size:15.5px}
.opt .chk{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line-2);display:grid;place-items:center;flex:none;color:#fff}
.opt.on{border-color:var(--pri);background:var(--pri-soft)}
.opt.on .chk{background:var(--pri);border-color:var(--pri)}
.opts.fill .opt.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.opts.fill .opt.on .chk{background:#fff;border-color:#fff;color:var(--pri)}
.opts.muted .opt .em{filter:grayscale(1);opacity:.55;transition:filter .2s,opacity .2s}
.opts.muted .opt.on .em{filter:none;opacity:1}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .chk{background:var(--ok);border-color:var(--ok)}
.opt.wrong{border-color:var(--line-2);background:var(--soft);color:var(--t3)}
.opts.locked .opt{cursor:default}
.sig{display:flex;gap:3px;align-items:flex-end;height:18px;flex:none}
.sig i{width:4px;border-radius:1px;background:var(--line-2)}
.sig i.f{background:var(--pri)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:12px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);text-align:left;min-height:78px;position:relative}
.tile .em{font-size:22px;line-height:1}
.tile .lbl{font-weight:600;font-size:14px;line-height:1.2}
.tile.on{border-color:var(--pri);background:var(--pri-soft)}
.tile .badge{position:absolute;top:9px;right:9px;width:20px;height:20px;border-radius:50%;background:var(--pri);color:#fff;display:grid;place-items:center}
.otherin{margin-top:-2px}

.field{display:flex;flex-direction:column;gap:7px}
.field label{font:600 13px/1 var(--sans);color:var(--t2)}
.box{height:54px;border-radius:14px;background:var(--surface);border:1.5px solid var(--line-2);display:flex;align-items:center;padding:0 14px;gap:10px;color:var(--t3);transition:border-color .15s,box-shadow .15s}
.box:focus-within{border-color:var(--pri);box-shadow:0 0 0 4px #3B30C422}
.box.bad{border-color:var(--err)}
.box input{flex:1;min-width:0;height:100%;background:transparent;border:none;outline:none;color:var(--t1);font:400 16px var(--sans)}
.box input::placeholder{color:#A3A8BE}
.cbx{display:flex;gap:10px;align-items:flex-start;background:none;border:none;padding:0;text-align:left;font-size:13.5px;color:var(--t2)}
.cbx .sq{width:20px;height:20px;border-radius:5px;border:1.5px solid var(--line-2);display:grid;place-items:center;flex:none;color:#fff;margin-top:1px;background:#fff}
.cbx.on .sq{background:var(--pri);border-color:var(--pri)}
.tlink{color:var(--pri);text-decoration:underline;font-weight:500;background:none;border:none;padding:0;font-size:inherit}
.sugg{align-self:flex-start;background:var(--pri-soft);border:none;color:var(--pri);border-radius:999px;padding:6px 11px;font:600 12.5px/1 var(--sans)}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 12px;font:600 13px/1 var(--sans);color:var(--t1)}
.chip.on{border-color:var(--pri);background:var(--pri-soft);color:var(--pri)}
.monohint{font:500 11.5px/1.3 var(--mono);color:var(--t3)}

/* flat mini phones (not the hero) */
.fm{width:64px;height:120px;border-radius:14px;background:#0E0F1A;padding:4px;display:block;flex:none;position:relative}
.fms{display:flex;flex-direction:column;gap:4px;height:100%;border-radius:10px;background:#fff;padding:12px 6px 6px;font-size:7px;line-height:1.2;overflow:hidden;color:#141733;text-align:left}
.fms b{font:800 8px/1.1 var(--head)}
.fb{height:5px;border-radius:3px;background:#E3E5EF;display:block;flex:none}
.fb.p{background:#3B30C4}.fb.g{background:#16A34A}
.fr{display:flex;gap:3px;align-items:center;padding:3px;border-radius:4px;background:#F5F6FB;border:1px solid #E3E5EF}
.fr i{width:6px;height:6px;border-radius:2px;border:1px solid #CDD1E1;flex:none}
.fr.g i{background:#16A34A;border-color:#16A34A}
.fm.xs{width:34px;height:62px;border-radius:9px;padding:2px}
.fm.xs .fms{border-radius:7px;padding:7px 3px 3px;gap:3px}
.fm.xs .fb{height:4px}

/* screen 1 */
.bcards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bcard{display:flex;flex-direction:column;border-radius:18px;border:2px solid var(--line);background:var(--surface);overflow:hidden;padding:0;text-align:left;transition:border-color .15s}
.bcard:hover{border-color:var(--line-2)}
.bcard.on{border-color:var(--pri)}
.bcard .art{height:136px;display:grid;place-items:center;position:relative}
.bcard .cap{padding:9px 11px 11px;font:700 14px/1.2 var(--head);display:flex;gap:6px}
.legalline{font-size:11.5px;color:var(--t3);text-align:center;text-wrap:balance}
.legalline button{display:inline;background:none;border:none;padding:0;color:var(--t2);text-decoration:underline;font-size:inherit}

/* screen 2 */
.split{display:grid;grid-template-columns:1fr 26px 132px;align-items:center;gap:6px;padding:14px;border-radius:20px;background:var(--soft);border:1px solid var(--line);position:relative;overflow:hidden}
.split .say{font:600 16px/1.35 var(--head);color:var(--t1)}
.split .arr{color:var(--pri);font-size:20px;text-align:center}
.codestrip{position:absolute;right:0;top:0;bottom:0;width:150px;background:var(--pane);opacity:.9;overflow:hidden;font:500 8.5px/1.6 var(--mono);color:#7B80A8;padding:6px 8px}
.codestrip div{animation:scrollup 9s linear infinite;white-space:pre}
@keyframes scrollup{to{transform:translateY(-50%)}}
.bchip{align-self:center;display:inline-flex;gap:6px;align-items:center;padding:8px 13px;border-radius:999px;background:var(--ok-soft);color:var(--ok-ink);font:600 13px/1 var(--sans)}

/* bridge 6 */
.strip3{display:grid;grid-template-columns:1fr 18px 1fr 18px 1fr;align-items:center;gap:4px}
.strip3 .s{border-radius:14px;padding:12px 6px;text-align:center;font:600 12px/1.25 var(--sans);display:flex;flex-direction:column;gap:6px;align-items:center}
.strip3 .s .ic2{font-size:22px}
.strip3 .s1{background:var(--pri-soft);color:var(--pri-deep)}
.strip3 .s2{background:var(--pane);color:#C9CDF2;font-family:var(--mono)}
.strip3 .s3{background:var(--ok-soft);color:var(--ok-ink)}
.strip3 .ar{color:var(--t3);text-align:center}
.struck{align-self:center;font:600 15px/1.2 var(--sans);color:var(--t3);text-decoration:line-through;text-decoration-color:#D23B3B99;text-decoration-thickness:2px;background:var(--soft);padding:8px 14px;border-radius:999px}
.honest{display:flex;gap:8px;align-items:flex-start;padding:11px 13px;border-radius:12px;background:#FFF8E6;color:#7A5A00;font-size:13px}

/* 9 device, 10 style, 11 pace */
.dev{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:16px;border:1.5px solid var(--line);background:var(--surface);text-align:left;width:100%}
.dev.on{border-color:var(--pri);background:var(--pri-soft)}
.dev .ill{font-size:30px;width:44px;text-align:center;flex:none}
.dev .lbl{flex:1;font:700 16px/1.2 var(--head)}
.dev .lbl small{display:block;font:500 12.5px/1.35 var(--sans);color:var(--t3);margin-top:4px}
.styles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stc{display:flex;flex-direction:column;align-items:center;gap:12px;padding:20px 12px;border-radius:18px;border:2px solid var(--line);background:var(--surface);min-height:220px;justify-content:center;text-align:center}
.stc.on{border-color:var(--pri);background:var(--pri-soft)}
.stc .ill{font-size:40px;display:flex;gap:4px}
.stc .lbl{font:700 16px/1.25 var(--head)}
.pace{display:flex;align-items:center;gap:14px;padding:16px;border-radius:16px;border:1.5px solid var(--line);background:var(--surface);text-align:left;width:100%}
.pace.on{border-color:var(--pri);background:var(--pri-soft)}
.pace .lbl{flex:1;font:700 17px/1.2 var(--head)}
.pace .lbl small{display:block;font:500 12.5px var(--sans);color:var(--t3);margin-top:3px}

/* checks 13/14 */
.errbanner{display:flex;gap:8px;align-items:center;padding:10px 12px;border-radius:12px;background:#FDECEC;border:1px solid #F5C2C2;color:#A12626;font:500 11.5px/1.35 var(--mono)}
.fact{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:var(--ok-soft);color:var(--ok-ink);font:500 14px/1.4 var(--sans);animation:fi .35s ease both}
.fact b{display:block;font:700 14px/1.2 var(--head);margin-bottom:3px}
.twoprev{display:grid;grid-template-columns:1fr 1fr;gap:10px;animation:fi .35s ease both}
.twoprev>div{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--t2);text-align:center}

/* lesson 15 */
.pbox{border:1.5px solid var(--line-2);border-radius:14px;background:#fff;display:flex;flex-direction:column;gap:6px;padding:10px 12px}
.pbox:focus-within{border-color:var(--pri);box-shadow:0 0 0 4px #3B30C422}
.pbox .pl{font:700 10.5px/1 var(--sans);letter-spacing:.08em;color:var(--t3);display:flex;justify-content:space-between}
.pbox .pl button{border:none;background:none;color:var(--pri);font:600 12px var(--sans);padding:0;letter-spacing:0}
.pbox input{border:none;outline:none;font:500 15.5px/1.3 var(--sans);color:var(--t1);background:transparent;padding:0;width:100%}
.pbox input[disabled]{color:var(--t1);-webkit-text-fill-color:var(--t1);opacity:1}
.code{background:var(--pane);border-radius:14px;padding:10px 12px;font:500 10.5px/1.6 var(--mono);color:#C9CDF2;height:170px;overflow:hidden;position:relative;flex:none}
.code .ln{white-space:pre;overflow:hidden;text-overflow:ellipsis;animation:fi .18s ease both}
.code.done{height:78px}
.code .bar2{position:absolute;left:0;right:0;bottom:0;padding:5px 12px;background:#0B0D1A;color:#4ADE80;font:600 10.5px/1.4 var(--mono);display:flex;justify-content:space-between}
.code .cur2::after{content:"▍";color:#958EFF;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.kk{color:#FF9EC0}.ks{color:#9BE7A8}.kc{color:#7B80A8}.kt{color:#8FC7FF}
.emptyprev{height:120px;border-radius:14px;border:1.5px dashed var(--line-2);display:grid;place-items:center;color:var(--t3);font-size:13px;text-align:center;padding:10px}
.built{display:grid;grid-template-columns:172px 1fr;gap:20px;align-items:start}
.tweaks{display:flex;flex-direction:column;gap:8px;padding-top:8px}
.tweak{display:flex;gap:8px;align-items:center;padding:10px 11px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font:600 13px/1.2 var(--sans);text-align:left}
.tweak.on{border-color:var(--ok);background:var(--ok-soft);color:var(--ok-ink)}
.tweak .tg2{margin-left:auto;font-size:11px;color:var(--t3)}
.tweak.on .tg2{color:var(--ok)}
.why{display:inline-flex;align-items:center;gap:6px;background:var(--ok-soft);color:var(--ok-ink);border-radius:12px;padding:8px 11px;font:600 12.5px/1.3 var(--sans);animation:fi .35s ease both}
.demolabel{font-size:11px;color:var(--t3);line-height:1.35}
.day1{font:700 15px/1.2 var(--head);color:var(--t1)}

/* mini-app (inside the hero phone) — em-based so it scales with the hero */
.app{position:absolute;inset:0;padding:3em 1.1em 1.1em;display:flex;flex-direction:column;gap:.7em;background:#F7F8FC;color:#141733;font:400 1em/1.3 var(--sans);transition:background .35s,color .35s;text-align:left}
.app.dark{background:#12131F;color:#ECEDF7}
.app h6{margin:0;font:800 1.6em/1.1 var(--head);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.app .sub{font-size:1em;color:#878DA6;display:flex;justify-content:space-between;align-items:center}
.app .streak{background:#FFF1DE;color:#B45F00;border-radius:1em;padding:.2em .6em;font-weight:700}
.app.dark .streak{background:#3A2A12;color:#FFB45C}
.app .row{display:flex;align-items:center;gap:.6em;padding:.7em .75em;border-radius:.9em;background:#fff;border:1px solid #E3E5EF;font:600 1.15em/1.2 var(--sans);text-align:left;width:100%;color:inherit;transition:background .3s,border-color .3s}
.app.dark .row{background:#1D1F33;border-color:#2C3053}
.app .row .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.app .bx{width:1.35em;height:1.35em;border-radius:.4em;border:1.5px solid #CDD1E1;display:grid;place-items:center;flex:none;font-size:.85em;color:#fff;line-height:1}
.app .row.on .bx{background:#16A34A;border-color:#16A34A}
.app .row.on .nm{text-decoration:line-through;opacity:.55}
.app .vote{margin-left:auto;background:#EEEDFD;color:#3B30C4;border:none;border-radius:.6em;padding:.3em .55em;font:700 .9em/1 var(--sans);flex:none}
.app.dark .vote{background:#2B2860;color:#B9B4FF}
.app .stp{display:flex;gap:.3em;align-items:center;flex:none;font-size:.9em}
.app .stp button{width:1.7em;height:1.7em;border-radius:50%;border:1px solid #CDD1E1;background:transparent;color:inherit;font:700 1em/1 var(--sans);padding:0;display:grid;place-items:center}
.app .stp span{min-width:1.2em;text-align:center;font-variant-numeric:tabular-nums}
.app .pr2{font-size:.8em;color:#878DA6;display:block;font-weight:500}
.app .add{border:1.5px dashed #CDD1E1;background:transparent;color:#3B30C4;border-radius:.9em;padding:.6em;font:700 1.05em/1 var(--sans)}
.app.dark .add{border-color:#3A3E66;color:#B9B4FF}
.app .tot{margin-top:auto;padding:.8em .9em;border-radius:.9em;background:#3B30C4;color:#fff;font:700 1.15em/1.2 var(--head);display:flex;justify-content:space-between;align-items:center;gap:.5em;animation:fi .35s ease both}
.app .tot small{font:500 .75em/1.2 var(--sans);opacity:.8;display:block}
.app .hb{padding:1.1em 1em;border-radius:1em;background:linear-gradient(135deg,#3B30C4,#6B61F0);color:#fff;display:flex;flex-direction:column;gap:.5em}
.app .hb h6{white-space:normal}
.app .hb button{align-self:flex-start;border:none;background:#fff;color:#3B30C4;border-radius:.7em;padding:.5em .8em;font:700 1em/1 var(--sans)}
.app .secs{display:grid;grid-template-columns:1fr 1fr;gap:.5em}

/* ---------- HERO: 3D phone preview of the user's app ---------- */
.hero{position:relative;perspective:820px;perspective-origin:50% 40%;margin:0 auto;flex:none}
.hscene{position:absolute;inset:0;transform-style:preserve-3d;will-change:transform}
.hscene>*{position:absolute}
.hshadow{left:4%;right:4%;top:14%;bottom:-6%;border-radius:40px;background:radial-gradient(ellipse at center,#1B1E4A66,transparent 70%);filter:blur(12px);transform:translateZ(-46px)}
.hback{inset:0;border-radius:2.9em;background:#2A2D44;transform:translateZ(-8px)}

.hscreen{inset:.6em;border-radius:2.35em;overflow:hidden;background:#fff;transform:translateZ(1.5px)}
.hnotch{top:1.25em;left:50%;width:30%;height:1.2em;margin-left:-15%;border-radius:1em;background:#0E0F1A;transform:translateZ(3px);pointer-events:none}
.hcard{pointer-events:none;white-space:nowrap;border-radius:1em;font:700 1.15em/1 var(--sans);padding:.6em .8em;box-shadow:0 10px 18px -10px #0B0D2266}
.hc1{top:-3%;right:-12%;background:#E7F6EC;color:#0F7A36;border:1px solid #BFE6CC}
.hc2{bottom:20%;left:-20%;background:#0F1222;color:#C9CDF2;font-family:var(--mono)}
.hc1.grey{background:#F5F6FB;color:#878DA6;border-color:#E3E5EF}
.hero.faint{opacity:.8}
.hero[data-mode="snap"] .hscreen{animation:fi2 .6s ease both}
@keyframes fi2{from{opacity:0}to{opacity:1}}
.hero.glow::before{content:"";position:absolute;left:50%;top:50%;width:150%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,#958EFF40 0%,#958EFF14 45%,transparent 70%);animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{transform:translate(-50%,-50%) scale(1.12);opacity:.7}}

/* proof */
.stars{display:flex;gap:3px;justify-content:center;color:#F4B400;font-size:22px}
.bignum{font:800 52px/1 var(--head);color:var(--pri);letter-spacing:-.03em;text-align:center}
.bignum .ph{font-size:44px;padding:0 10px;border-radius:12px}
.rv{padding:14px;border-radius:16px;border:1.5px dashed var(--line-2);background:var(--soft);display:flex;flex-direction:column;gap:8px}
.rv .rh{display:flex;gap:10px;align-items:center}
.rv .av{width:34px;height:34px;border-radius:50%;background:#E1E4EE;display:grid;place-items:center;color:var(--t3);font-size:15px;flex:none}
.rv p{margin:0;color:var(--t2);font-size:13.5px}
.rv small{color:var(--t3);font-size:11.5px}
.carousel{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -20px;padding:0 20px 4px}
.carousel::-webkit-scrollbar{height:0}
.pj{flex:none;width:150px;scroll-snap-align:start;border-radius:16px;border:1.5px dashed var(--line-2);background:var(--soft);padding:10px;display:flex;flex-direction:column;gap:8px}
.pj .shot{height:120px;border-radius:10px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;font:600 11px/1.3 var(--sans);color:var(--t3);text-align:center;padding:6px}

/* loading */
.steps{display:flex;flex-direction:column;gap:12px}

.bar{height:5px;border-radius:3px;background:var(--line);overflow:hidden}

/* gate */
.blurcard{position:relative;border-radius:18px;border:1px solid var(--line)}

/* summary */
.meter{position:relative;padding-top:34px}

.meter .track span.on{background:var(--pri)}
.meter .labels{display:grid;grid-template-columns:1fr 1fr 1fr;font-size:12px;color:var(--t3);margin-top:8px;text-align:center}
.meter .labels span.on{color:var(--pri);font-weight:700}
.meter .mk{position:absolute;top:0;transform:translateX(-50%);background:var(--t1);color:#fff;font:700 11px/1 var(--sans);padding:6px 9px;border-radius:999px;white-space:nowrap}
.meter .mk::after{content:"";position:absolute;left:50%;bottom:-4px;width:8px;height:8px;background:var(--t1);transform:translateX(-50%) rotate(45deg)}
.rchips{display:flex;gap:8px;justify-content:center}

/* plan */

/* features */
.feat{display:flex;gap:10px}
.feat .rows{flex:1;display:flex;flex-direction:column;gap:10px}
.feat .r{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;font-weight:500}
.feat .r .ck{width:20px;height:20px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;flex:none;margin-top:1px}
.mock{width:104px;height:196px;border-radius:20px;background:#0E0F1A;padding:5px;flex:none;transform:rotate(6deg);box-shadow:0 18px 30px -16px #0008;margin-top:6px}
.mock .in{width:100%;height:100%;border-radius:16px;background:#fff;padding:14px 7px 7px;display:flex;flex-direction:column;gap:5px;font-size:8.5px;overflow:hidden}
.mock .in b{font:800 10px/1.15 var(--head)}
.mock .cp{background:var(--pane);color:#9BE7A8;border-radius:6px;padding:5px;font:500 6.5px/1.5 var(--mono);white-space:pre;overflow:hidden}

/* paywall */
.minip{display:flex;gap:12px;align-items:center;padding:10px 14px;border-radius:16px;background:linear-gradient(135deg,#3B30C4,#5A4FE0);color:#fff}
.minip small{display:block;opacity:.8;font-size:11.5px}
.minip b{font-size:14px}
.plan{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:16px;border:1.5px solid var(--line);background:var(--surface);text-align:left;width:100%;position:relative}
.plan.on{border:2px solid var(--pri);padding:13.5px;background:#FAFAFF}
.plan .radio{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line-2);display:grid;place-items:center;flex:none;color:#fff;margin-top:1px}
.plan.on .radio{background:var(--pri);border-color:var(--pri)}
.plan .pn{font:700 15.5px/1.2 var(--head);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.plan .pp{font-size:13.5px;color:var(--t1);margin-top:6px;line-height:1.6}
.plan .pd{font-size:11.5px;color:var(--t3);margin-top:3px}
.bdg{font:700 10px/1 var(--sans);letter-spacing:.05em;background:var(--pri);color:#fff;padding:4px 6px;border-radius:5px}
.bdg.g{background:var(--ok)}
.trust{font-size:12px;color:var(--t2);text-align:center;line-height:1.7}
.pays{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.pays span{font:700 11px/1 var(--sans);padding:6px 8px;border-radius:6px;border:1px solid var(--line);color:var(--t1);background:#fff}
.payline{font-size:12.5px;color:var(--t1);text-align:center;line-height:1.55;text-wrap:pretty}
.closex{width:36px;height:36px;border-radius:50%;border:none;background:var(--soft);display:grid;place-items:center;color:var(--t2);flex:none}
.dim{position:absolute;inset:0;background:#0D0F2266;z-index:4;animation:fi .25s ease}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:5;background:#fff;border-radius:26px 26px 0 0;padding:10px 20px 30px;display:flex;flex-direction:column;gap:14px;animation:up .32s cubic-bezier(.2,.8,.2,1)}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line-2);align-self:center}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}

/* receipt */
.receipt{border-radius:18px;border:1px solid var(--line);background:var(--soft);padding:16px;display:flex;flex-direction:column}
.receipt .rr{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px dashed var(--line-2);font-size:13.5px;line-height:1.5}
.receipt .rr:first-of-type{border-top:none}
.receipt .rr span:first-child{color:var(--t2)}
.receipt .rr span:last-child{text-align:right;font-weight:600}
.receipt h4{margin:0 0 6px;font:800 16px var(--head)}
.cardform{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cardform .box{height:48px}
.cardform .full{grid-column:1/-1}
.orline{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--t3)}
.orline::before,.orline::after{content:"";flex:1;height:1px;background:var(--line)}

/* welcome */
.okbig{width:76px;height:76px;border-radius:50%;background:var(--ok);display:grid;place-items:center;color:#fff;align-self:center;box-shadow:0 0 0 10px var(--ok-soft);animation:popin .5s cubic-bezier(.3,1.5,.5,1);flex:none}
@keyframes popin{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
.nsteps{display:flex;flex-direction:column;gap:8px}
.nsteps div{display:flex;gap:10px;align-items:center;font-size:14px}
.nsteps b{width:26px;height:26px;border-radius:50%;background:var(--pri-soft);color:var(--pri);display:grid;place-items:center;font:800 12px var(--head);flex:none}
.stores{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.store{height:48px;border-radius:12px;background:#0E0F1A;color:#fff;border:none;display:flex;align-items:center;justify-content:center;gap:8px;font-size:10px;line-height:1.1;text-align:left}
.store b{display:block;font:700 14px var(--head)}
.store .g{font-size:20px}
.d1{display:flex;gap:12px;align-items:center;padding:12px;border-radius:16px;background:var(--pri-soft);border:1px solid #DAD7FA}
.d1 small{color:var(--t3);display:block;font-size:12px}

.fadein{animation:fi .35s ease both}

  return {idea,tpl,mode,tag,items,seed,title,sig:tpl+'|'+s};
}

function codeLines(m){
  const L=[`// ${m.title}: built from your one-line idea`,`import { useState } from 'react';`,``,`export default function App() {`];
  const cl=n=>n.replace(/'/g,'');
  if(m.tpl==='tracker'||(m.tpl==='list'&&m.mode!=='poll')){
    L.push(`  const [items, setItems] = useState([`,...m.items.map(([,n])=>`    { name: '${cl(n)}', done: false },`),`  ]);`,
      `  const toggle = (i) => setItems(items.map((it, j) =>`,`    j === i ? { ...it, done: !it.done } : it));`,`  return (`,`    <main className='app'>`,`      <h1>${cl(m.title)}</h1>`,`      {items.map((it, i) => (`,`        <Row key={i} onTap={() => toggle(i)} {...it} />`,`      ))}`);
  }else if(m.tpl==='list'){
    L.push(`  const [options, setOptions] = useState([`,...m.items.map(([,n])=>`    { name: '${cl(n)}', votes: 0 },`),`  ]);`,
      `  const vote = (i) => setOptions(options.map((o, j) =>`,`    j === i ? { ...o, votes: o.votes + 1 } : o));`,`  return (`,`    <main className='app'>`,`      <h1>${cl(m.title)}</h1>`,`      {options.map((o, i) => (`,`        <Option key={i} onVote={() => vote(i)} {...o} />`,`      ))}`);
  }else if(m.tpl==='calc'){
    L.push(`  const [lines, setLines] = useState([`,...m.items.map(([,n,p])=>`    { name: '${cl(n)}', price: ${p}, qty: 1 },`),`  ]);`,
      `  const bump = (i, d) => setLines(lines.map((l, j) =>`,`    j === i ? { ...l, qty: Math.max(0, l.qty + d) } : l));`,`  return (`,`    <main className='app'>`,`      <h1>${cl(m.title)}</h1>`,`      {lines.map((l, i) => (`,`        <Line key={i} onBump={(d) => bump(i, d)} {...l} />`,`      ))}`);
  }else{
    L.push(`  const [signups, setSignups] = useState(0);`,`  const sections = [`,...m.items.map(([,n])=>`    '${cl(n)}',`),`  ];`,`  return (`,`    <main className='site'>`,`      <Hero title='${cl(m.title)}' tagline='${cl(m.tag)}'`,`        onJoin={() => setSignups(signups + 1)} />`,`      {sections.map((s) => <Section key={s} name={s} />)}`);
  }
  L.push(`    </main>`,`  );`,`}`);
  return L;
}
function hl(line){
  if(!line)return '&nbsp;';
  if(/^\s*\/\//.test(line))return `<span class="kc">${esc(line)}</span>`;
  let h=esc(line).replace(/('[^']*')/g,'<span class="ks">$1</span>');
  h=h.replace(/\b(import|from|export|default|function|const|return)\b/g,'<span class="kk">$1</span>');
  h=h.replace(/(&lt;\/?)([A-Za-z]+)/g,'$1<span class="kt">$2</span>');
  return h;
}

/* ---------- last-chance offer (once per session, on paywall close) ---------- */
const PW_N=22,OFFER_N=23;
const OKEY='ikf_offer_'+CONFIG.slug;
const offerOpen=()=>{const o=CONFIG.offer;if(!o||!o.enabled||S.offerSeen)return false;try{if(sessionStorage.getItem(OKEY))return false}catch(e){}
  if(o.expiresMin&&S.offerEnd&&Date.now()>S.offerEnd)return false;return true};
function runOffer(){const o=CONFIG.offer;try{sessionStorage.setItem(OKEY,'1')}catch(e){}
  clearInterval(window.__oiv);if(!o.expiresMin)return;if(!S.offerEnd)S.offerEnd=Date.now()+o.expiresMin*60000;
  const tick=()=>{const el=document.getElementById('otimer');if(!el||S.i!==OFFER_N)return clearInterval(window.__oiv);const ms=S.offerEnd-Date.now();
    if(ms<=0){clearInterval(window.__oiv);S.offerSeen=true;emit('offer_expired');offerExit();return}
    el.textContent=String(Math.floor(ms/60000)).padStart(2,'0')+':'+String(Math.floor(ms/1000)%60).padStart(2,'0')};
  tick();window.__oiv=setInterval(tick,1000)}
/* leaving the offer without buying = the paywall's existing close path: back to the screen before the paywall */
function offerExit(){clearInterval(window.__oiv);let p=S.hist.pop();while(p>=PW_N&&S.hist.length)p=S.hist.pop();go(p&&p<PW_N?p:PW_N-1,false)}
function offerCheckout(){const o=CONFIG.offer,url=o.checkoutUrl||'';
  emit('offer_accept',{price:o.price,renewPrice:o.renews,period:o.period,url});
  emit('checkout_click',{plan:'offer',price:o.price,renewPrice:o.renews,period:o.period,url});
  if(!url)return;let u;try{u=new URL(url,location.href)}catch(e){return}
  u.searchParams.set('plan','offer');if(S.email)u.searchParams.set('email',S.email);
  QS.forEach((v,k)=>{if(/^utm_/i.test(k)&&!u.searchParams.has(k))u.searchParams.set(k,v)});

/* ---------- HERO: 3D phone preview of the user's app ---------- */
const HEROES=new Set();
const ease=x=>1-Math.pow(1-x,3);
function heroScreen(kind){

  if(kind==='demo')return miniApp(model(defaultIdea()),false);

function mountHero(el){
  if(el._h)return;
  const W=+el.dataset.w||160,H=Math.round(W*2.04),mode=el.dataset.mode||'float',kind=el.dataset.kind||'app',live=el.classList.contains('live');
  el.style.width=W+'px';el.style.height=H+'px';
  const c1=kind==='outline'?'<div class="hcard hc1 grey">v0.1</div>':kind==='demo'?'<div class="hcard hc1">✓ Live preview</div>':'<div class="hcard hc1">✓ Build passed</div>';
  el.innerHTML=`<div class="hscene" style="font-size:${(W/200*10).toFixed(2)}px">
    <div class="hshadow"></div><div class="hback"></div><div class="hbody"></div>
    <div class="hscreen">${heroScreen(kind)}</div><div class="hnotch"></div>
    ${c1}<div class="hcard hc2">&lt;/&gt;</div></div>`;
  const q=s=>el.querySelector(s);
  const o={el,mode,live,scene:el.firstElementChild,screen:q('.hscreen'),c1:q('.hc1'),c2:q('.hc2'),t0:performance.now(),px:0,py:0,tx:0,ty:0};
  el._h=o;HEROES.add(o);
  el.addEventListener('pointermove',e=>{const r=el.getBoundingClientRect();o.tx=(e.clientX-r.left)/r.width-.5;o.ty=(e.clientY-r.top)/r.height-.5});
  el.addEventListener('pointerleave',()=>{o.tx=0;o.ty=0});
  if(RM){drawHero(o,performance.now()+99999);return}
  if(!HEROES.loop){HEROES.loop=true;requestAnimationFrame(heroFrame)}
}
function drawHero(o,now){
  const t=(now-o.t0)/1000;
  o.px+=(o.tx-o.px)*.08;o.py+=(o.ty-o.py)*.08;
  const amp=o.live?.45:1;
  let rx=(8+Math.sin(t*.7)*3)*amp,ry=(-12+Math.sin(t*.5)*14)*amp,rz=Math.sin(t*.35)*.8*amp,s=1,spread=0;
  if(RM){rx=8;ry=-16;rz=0}
  else if(o.mode==='spin'){const k=ease(Math.min(1,t/4.4));ry=720*(1-k)+ry*k;rx=34*(1-k)+rx*k}
  else if(o.mode==='land'){const k=ease(Math.min(1,t/1.6));rx=80*(1-k)+rx*k;ry=-30*(1-k)+ry*k;rz=-8*(1-k)+rz*k;s=.6+.4*k;o.el.style.opacity=Math.min(1,t/.35)}
  else if(o.mode==='snap'){const k=ease(Math.min(1,t/1.1));spread=1-k;s=.86+.14*k;ry=ry-20*(1-k)}
  rx+=o.py*-22*amp;ry+=o.px*30*amp;
  /* never opacity/filter on .hscene (preserve-3d) — only the outer .hero or flat children */
  o.scene.style.transform=`scale(${s}) rotateX(${rx.toFixed(2)}deg) rotateY(${ry.toFixed(2)}deg) rotateZ(${rz.toFixed(2)}deg)`;
  o.c1.style.transform=`translate3d(${(spread*60).toFixed(1)}px,${(-spread*30).toFixed(1)}px,${(26+spread*140).toFixed(1)}px)`;
  o.c2.style.transform=`translate3d(${(-spread*60).toFixed(1)}px,${(spread*30).toFixed(1)}px,${(42+spread*160).toFixed(1)}px)`;
  o.screen.style.transform=`translateZ(${(1.5+spread*70).toFixed(1)}px)`;
}
function heroFrame(now){
  for(const o of HEROES){if(!o.el.isConnected){HEROES.delete(o);continue}drawHero(o,now)}
  if(HEROES.size)requestAnimationFrame(heroFrame);else HEROES.loop=false;
}

    case 'tips':S.tips=!S.tips;render();break;
    case 'plan':if(S.plan!==v){S.plan=v;emit('plan_select',{plan:v,price:PLANS[v].today,renewPrice:PLANS[v].renew,period:PLANS[v].per})}render();break;
    case 'agree':S.agree=!S.agree;render();break;
    case 'buy':if(CONFIG.orderReview)go(24);else checkout();break;
    case 'dismiss':{const show=offerOpen();emit('paywall_close',{plan:S.plan,offerShown:show});if(show)go(OFFER_N);else back()}break;
    case 'offerbuy':S.offerSeen=true;S.offer=true;clearInterval(window.__oiv);offerCheckout();break;
    case 'offerno':S.offerSeen=true;emit('offer_decline',{price:CONFIG.offer.price});offerExit();break;
    case 'nothanks':S.sheet=null;render();break;
    case 'pay':checkout();break;
    case 'store':{const ios=v?v==='ios':/iPhone|iPad|iPod|Macintosh/i.test(navigator.userAgent);const url=(ios?CONFIG.appStoreUrl:CONFIG.googlePlayUrl)||CONFIG.appStoreUrl||CONFIG.googlePlayUrl||'';emit('store_click',{store:ios?'app_store':'google_play',url});openUrl(url);break}
    case 'laptoplink':emit('laptop_link_request',{url:CONFIG.laptopSetupUrl||''});openUrl(CONFIG.laptopSetupUrl);break;
  }
});
phone.addEventListener('keydown',e=>{const c=e.target.closest&&e.target.closest('[role="checkbox"][data-a]');if(c&&e.target===c&&(e.key===' '||e.key==='Enter')){e.preventDefault();c.click()}});
phone.addEventListener('input',e=>{
  const f=e.target.dataset.f;if(!f)return;
  S[f]=e.target.value;
  if(S.err&&(f==='name'||f==='email'||f==='idea')){S.err='';const bx=e.target.closest('.box');bx&&bx.classList.remove('bad');const er=bx&&bx.parentElement.querySelector('.err');er&&er.remove()}
  if(f==='name'){const c=cur().querySelector('.hero .otitle');if(c)c.textContent=S.name.trim()?`${S.name.trim()}'s app`:'Your app'}
  if(f==='email'){const sb=cur().querySelector('#sugg');const sg=sugg(S.email);if(sb){sb.hidden=!sg;if(sg)sb.textContent=`Did you mean ${sg}?`}}
  if(f==='idea'&&S.i===8){cur().querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c.dataset.v===S.idea))}
  const btn=cur().querySelector('.foot .btn.main');if(btn&&OK[S.i])btn.disabled=!ok(S.i);
});
phone.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.tagName==='INPUT'){const b=cur().querySelector('.foot .btn.main');b&&!b.disabled&&b.click()}});

/* host API: call completePurchase() after a successful checkout to show the welcome screen */
window.IkFunnel=window.IkameFunnel=Object.assign(window.IkameFunnel||{},{
  config:CONFIG,data:snapshot,
  completePurchase:plan=>{if(plan&&PLANS[plan])S.plan=plan;if(plan==='offer')S.offer=true;S.offerSeen=true;S.paid=true;S.sheet=null;go(25)}
});

/* deep link #s=N (and #s=15built) only with ?debug=1 */
if(DEBUG){const h=decodeURIComponent(location.hash);const m=h.match(/s=?([0-9]+)/);if(m&&V[+m[1]]){const n=+m[1];fillTo(n);if(n===15&&/built/.test(h))S.lst=2;S.i=n}}
render();
emit('funnel_start',{variant:S.v,landing:location.pathname,referrer:document.referrer||null});
viewed();
</script>
