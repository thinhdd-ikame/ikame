<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A0911">
<title>ChatChi: AI Roleplay Chat · AI Roleplay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600&display=swap">
<style>
:root{
  color-scheme:dark;
  --ground:#06050B;
  --bg:#0A0911;--bg-elev:#12101B;--surface:#17151F;--surface-2:#221F2D;--border:#2D293B;
  --t1:#F4F2F8;--t2:#A7A2B7;--t3:#6F6A82;
  --pink:#B62CB5;--pink-hi:#DA5FD9;--pink-dim:#B62CB52E;--pink-deep:#261230;
  --grad-a:#9A2ACB;--grad-b:#D82F99;--grad:linear-gradient(135deg,var(--grad-a),var(--grad-b));
  --amber:#F5B83D;--negative:#F0705F;--positive:#7FD1A8;
  --head:"Plus Jakarta Sans","Segoe UI",system-ui,sans-serif;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--t1);font:15px/1.45 var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--pink-hi);outline-offset:2px}

.phone{position:relative;width:100%;max-width:480px;height:100vh;height:100dvh;margin:0 auto;background:var(--bg);background-image:radial-gradient(ellipse 70% 35% at 50% 0%,#240F2C 0%,transparent 70%);overflow:hidden;isolation:isolate;--top:calc(env(safe-area-inset-top,0px) + 6px)}
@media (min-width:520px){.phone{border-inline:1px solid #2A2536}}
.view{position:absolute;inset:0;padding-top:var(--top);display:flex;flex-direction:column}
.view.in{animation:vin .3s ease both}
@keyframes vin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* Honey-style top bar: back · title · segmented progress */
.nav{flex:none;padding:0 12px;position:relative;z-index:3}
.nav .row{height:44px;display:flex;align-items:center}
.nav .ttl{flex:1;text-align:center;font:700 15px var(--head);margin-right:44px}
.iconbtn{width:44px;height:44px;border-radius:50%;border:none;background:transparent;display:grid;place-items:center;color:var(--t2)}
.segs{display:flex;gap:4px;padding:0 20px 6px}
.segs i{flex:1;height:4px;border-radius:2px;background:var(--surface-2)}
.segs i.on{background:var(--grad)}
.scr{flex:1;overflow-y:auto;overflow-x:hidden;padding:8px 16px 16px;display:flex;flex-direction:column;gap:14px;scrollbar-width:none}
.scr::-webkit-scrollbar{display:none}
.foot{flex:none;padding:10px 16px max(18px,calc(env(safe-area-inset-bottom,0px) + 10px));display:flex;flex-direction:column;gap:8px;position:relative;z-index:2;background:linear-gradient(180deg,transparent,var(--bg) 30%)}
.q{font:800 22px/1.2 var(--head);letter-spacing:-.01em;margin:4px 0 0;text-align:center;text-wrap:balance}
.sub{margin:-6px 0 0;text-align:center;color:var(--t2);font-size:13.5px}
.h1{font:800 30px/1.1 var(--head);letter-spacing:-.02em;margin:0;text-align:center;text-wrap:balance}
.gt{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}

.btn{height:54px;border-radius:14px;border:none;background:var(--pink);color:#fff;font:700 16px/1 var(--head);width:100%;display:flex;align-items:center;justify-content:center;gap:10px;flex:none;transition:transform .12s,opacity .2s;position:relative;overflow:hidden;box-shadow:0 10px 30px -12px #B62CB5cc}
.btn:active{transform:scale(.98)}
.btn[disabled]{background:var(--surface-2);color:var(--t3);box-shadow:none}
.btn:not([disabled])::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:0;background:linear-gradient(100deg,transparent,#ffffff45,transparent);transform:translateX(-150%) skewX(-20deg);animation:sheen 4.5s ease-in-out 1.2s infinite}
@keyframes sheen{0%{transform:translateX(-150%) skewX(-20deg)}28%,100%{transform:translateX(320%) skewX(-20deg)}}
.btn.ghost{background:var(--surface);border:1px solid var(--border);color:var(--t1);box-shadow:none;height:48px}
.btn.ghost::after{display:none}
.link{background:none;border:none;color:var(--t2);font-size:14px;min-height:44px}
.legal{font-size:11.5px;color:var(--t3);text-align:center;line-height:1.5}
.legal a{color:var(--t2);text-decoration:underline;text-underline-offset:2px}

/* photo cards (Honey's core element) */
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{position:relative;border-radius:16px;overflow:hidden;border:2px solid var(--border);background:var(--surface);padding:0;aspect-ratio:3/3.4;display:block;text-align:left;transition:border-color .15s,box-shadow .2s,transform .12s}
.card.tall{aspect-ratio:3/4.1}
.card:active{transform:scale(.97)}
.card .ph{position:absolute;inset:0;display:grid;place-items:center;font-size:44px;background:var(--fb,linear-gradient(160deg,#2a1838,#0d0a18))}
.card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 22%}
.card .lb{position:absolute;left:0;right:0;bottom:0;padding:9px 10px;background:#0A0911e0;font:700 14px/1.2 var(--head);text-align:center;display:flex;align-items:center;justify-content:center;gap:8px;min-height:40px}
.card .ck{width:20px;height:20px;border-radius:6px;border:1.5px solid #ffffff55;flex:none;display:grid;place-items:center;position:absolute;right:9px;bottom:10px}
.card.multi .lb{justify-content:flex-start;padding-right:36px;text-align:left}
.card.on{border-color:transparent;box-shadow:0 0 0 2px var(--grad-b),0 0 24px -4px #B62CB5aa}
.card.on::before{content:"";position:absolute;inset:-2px;border-radius:16px;padding:2px;background:var(--grad);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;z-index:2;pointer-events:none}
.card.on .ck{background:var(--grad);border-color:transparent}
.ck svg{opacity:0;transition:opacity .15s}.on .ck svg{opacity:1}
.collage{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr}
.collage img{position:static;width:100%;height:100%}

.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:flex;align-items:center;gap:12px;padding:14px;border-radius:14px;background:var(--surface);border:1.5px solid var(--border);text-align:left;width:100%;min-height:54px}
.opt .em{font-size:19px;width:24px;text-align:center}
.opt .lbl{flex:1;font-weight:600}
.opt .ck{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--border);display:grid;place-items:center}
.opt.on{border-color:var(--pink);background:linear-gradient(0deg,var(--pink-dim),var(--pink-dim)),var(--surface)}
.opt.on .ck{background:var(--grad);border-color:transparent}
.box{height:50px;border-radius:14px;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;padding:0 14px}
.box input{flex:1;min-width:0;background:transparent;border:none;outline:none;color:var(--t1);font:400 16px var(--sans)}

/* sliders */
.sls{display:flex;flex-direction:column;gap:6px;padding:8px 14px;border-radius:18px;background:var(--surface);border:1px solid var(--border)}
.sl{padding:12px 0;border-top:1px solid var(--border)}
.sl:first-child{border-top:none}
.sl .top{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px}
.sl .top .gi{width:30px;height:30px;border-radius:9px;background:var(--pink-dim);display:grid;place-items:center}
.sl .top b{margin-left:auto;font:600 13px var(--sans);padding:4px 9px;border-radius:8px;background:var(--surface-2);border:1px solid var(--border);font-variant-numeric:tabular-nums}
.sl input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:44px;background:linear-gradient(90deg,var(--grad-a),var(--grad-b) var(--p,50%),var(--surface-2) var(--p,50%));background-clip:content-box;padding:19px 0;outline:none;margin:0}
.sl input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:#fff;border:3px solid var(--pink);box-shadow:0 2px 10px #0008}
.sl input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:#fff;border:3px solid var(--pink)}
.hint{font-size:12.5px;color:var(--t3);text-align:center}

/* bridge */
.bridge{flex:1;position:relative;margin:0 -16px -16px;min-height:0}
.bridge img,.bridge .ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 15%}
.bridge .ph{display:grid;place-items:center;font-size:80px;background:linear-gradient(160deg,#2a1838,#0d0a18)}
.bridge::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,var(--bg) 0%,transparent 18%,transparent 70%,var(--bg) 100%)}

/* loader */
.ldimg{position:relative;flex:1;min-height:180px;margin:0 -16px;overflow:hidden}
.ldimg img,.ldimg .ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 20%;filter:blur(var(--bl,18px)) saturate(1.1);transform:scale(1.08);transition:filter .3s linear}
.ldimg .ph{display:block;background:radial-gradient(circle at 50% 35%,#6a2a6a,#0d0a18 70%)}
.ldimg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,var(--bg) 0%,transparent 25%,transparent 60%,var(--bg) 100%)}
.steps{display:flex;flex-direction:column;gap:12px;position:relative;z-index:1}
.step .top{display:flex;justify-content:space-between;font-size:14px;color:var(--t2);margin-bottom:6px}
.step.done .top{color:var(--t1)}
.step .top b{font-variant-numeric:tabular-nums;font-weight:600}
.step.done .top b{color:var(--pink-hi)}
.bar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.bar span{display:block;height:100%;background:var(--grad);width:0}
.iq{position:absolute;left:0;right:0;bottom:0;z-index:5;padding:20px 16px max(20px,calc(env(safe-area-inset-bottom,0px) + 12px));background:linear-gradient(180deg,transparent,var(--bg) 22%);display:flex;flex-direction:column;gap:14px;animation:up .35s cubic-bezier(.2,.8,.2,1)}
.iq b{font:800 20px/1.25 var(--head);text-align:center}
.iq .row{display:flex;gap:10px}
.iq .row .btn{flex:1}
@keyframes up{from{transform:translateY(40px);opacity:0}}

/* paywall (long scroll) */
.pw{position:absolute;inset:0;overflow-y:auto;scrollbar-width:none;background:var(--bg)}
.pw::-webkit-scrollbar{display:none}
.pwx{position:fixed;z-index:9;top:calc(var(--top) + 6px);width:36px;height:36px;border-radius:50%;background:#0A0911aa;border:1px solid #ffffff22;color:var(--t2);display:grid;place-items:center;margin-left:12px;backdrop-filter:blur(6px)}
.sec{padding:26px 16px 0}
.pwhero{position:relative;height:430px;overflow:hidden}
.pwhero img,.pwhero .ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 18%}
.pwhero .ph{display:block;background:radial-gradient(circle at 50% 35%,#6a2a6a,#0d0a18 70%)}
.pwhero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,var(--bg) 96%)}
.pwhero .txt{position:absolute;left:16px;right:16px;bottom:8px;z-index:1}
.pwhero .h1{text-align:left;font-size:34px}
.pwhero p{margin:6px 0 0;color:var(--t2)}
.plans{display:flex;flex-direction:column;gap:10px}
.plan{position:relative;padding:14px 16px;border-radius:16px;border:1.5px solid var(--border);background:var(--surface);text-align:left;display:grid;grid-template-columns:24px 1fr auto;gap:2px 12px;align-items:center;width:100%}
.plan .rd{width:22px;height:22px;border-radius:50%;border:2px solid var(--border);grid-row:1/3;display:grid;place-items:center}
.plan.on{border-color:var(--pink);background:var(--pink-deep);box-shadow:0 0 20px -8px #B62CB5}
.plan.on .rd{background:var(--grad);border-color:transparent}
.plan .pn{font:800 17px var(--head)}
.plan .pp{font:800 19px/1.1 var(--head);text-align:right}
.plan .pp small{font:500 11px var(--sans);color:var(--t2)}
.plan .rn{font-size:11.5px;color:var(--t2);grid-column:2/4}
.plan .bv{position:absolute;top:-10px;left:50%;transform:translateX(-50%);font:700 11px/1 var(--head);letter-spacing:.06em;background:var(--grad);color:#fff;padding:5px 12px;border-radius:999px;white-space:nowrap}
.ph2{font-family:ui-monospace,Consolas,monospace;font-size:.82em;font-weight:600;padding:1px 5px;border-radius:6px;border:1px dashed var(--amber);color:var(--amber);background:#F5B83D14;white-space:nowrap}
.fine{font-size:11.5px;color:var(--t3);text-align:center;margin-top:10px;line-height:1.45}
.h2{font:800 26px/1.15 var(--head);margin:0 0 14px;letter-spacing:-.01em}
.match{display:flex;gap:16px;align-items:center}
.ring{width:118px;height:118px;flex:none;border-radius:50%;background:conic-gradient(var(--grad-b) calc(var(--m)*1%),var(--grad-a) calc(var(--m)*1%),var(--surface-2) 0);display:grid;place-items:center;position:relative}
.ring::before{content:"";position:absolute;inset:8px;border-radius:50%;background:var(--bg)}
.ring span{position:relative;text-align:center;font:800 26px/1 var(--head)}
.ring small{display:block;font:500 12px var(--sans);color:var(--t2);margin-top:4px}
.traits{display:flex;flex-direction:column;gap:10px;font-weight:600}
.traits div{display:flex;gap:10px;align-items:center}
.gw{width:32px;height:32px;border-radius:10px;background:var(--grad);display:grid;place-items:center;color:#fff;flex:none}
.pcard{margin-top:16px;border-radius:20px;overflow:hidden;position:relative;aspect-ratio:3/3.6;border:1px solid var(--border)}
.pcard img,.pcard .ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 20%}
.pcard .ph{display:block;background:radial-gradient(circle at 50% 35%,#6a2a6a,#0d0a18 70%)}
.pcard .cap{position:absolute;left:0;right:0;bottom:0;padding:40px 14px 12px;background:linear-gradient(180deg,transparent,#0A0911f0);display:flex;justify-content:space-between;align-items:flex-end}
.pcard .cap b{font:800 24px var(--head)}
.pcard .cap small{font-size:11px;color:var(--t3)}
.bens{display:flex;flex-direction:column;gap:9px}
.ben{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--border)}
.ben b{display:block;font:700 15px var(--head)}
.ben small{color:var(--t2);font-size:12.5px}
.ben .tg{margin-left:auto;font:700 10px var(--sans);letter-spacing:.05em;padding:3px 7px;border-radius:6px;background:var(--pink-dim);color:var(--pink-hi)}
.stats{display:flex;flex-direction:column;gap:10px}
.stat{display:flex;gap:14px;align-items:center;padding:14px;border-radius:16px;background:var(--surface);border:1px solid var(--border);font-size:14px}
.stat .n{font:800 22px var(--head);flex:none;min-width:64px;text-align:center}
.mock{border-radius:26px;border:1px solid var(--border);background:var(--bg-elev);padding:12px;display:flex;flex-direction:column;gap:9px;position:relative;overflow:hidden}
.mock .hd{display:flex;gap:10px;align-items:center;padding-bottom:9px;border-bottom:1px solid var(--border)}
.mock .hd b{font:700 15px var(--head)}
.mock .hd small{display:block;color:var(--positive);font-size:11.5px}
.rev{padding:14px;border-radius:16px;background:var(--surface);border:1px solid var(--border);display:flex;flex-direction:column;gap:6px;font-size:13.5px;color:var(--t2)}
.rev .who{display:flex;gap:10px;align-items:center;color:var(--t1)}
.rev .who i{width:34px;height:34px;border-radius:50%;background:var(--grad);display:grid;place-items:center;font:700 12px var(--head);font-style:normal;color:#fff}
.rev .st{margin-left:auto;color:var(--amber);letter-spacing:2px;font-size:13px}
.guar{margin:26px 16px 0;padding:18px;border-radius:18px;border:1.5px solid var(--pink);background:var(--pink-deep);font-size:13.5px;color:var(--t2)}
.guar b{display:block;font:800 20px var(--head);color:var(--t1);margin-bottom:6px}

/* chat */
.chat{position:absolute;inset:0;top:var(--top);display:flex;flex-direction:column}
.chead{flex:none;display:flex;align-items:center;gap:10px;padding:4px 12px 8px;border-bottom:1px solid var(--border);background:var(--bg);z-index:2}
.chead b{font:700 17px/1.1 var(--head);display:block}
.chead small{font-size:12px;color:var(--positive)}
.av{position:relative;border-radius:50%;overflow:hidden;flex:none;background:var(--grad);display:grid;place-items:center;font-size:18px}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 15%}
.cbody{flex:1;position:relative;overflow:hidden;display:flex;flex-direction:column}
.cbg{position:absolute;inset:0;background:var(--scene) center/cover no-repeat,linear-gradient(160deg,#2a1838,#0d0a18);opacity:.4}
.cbg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,var(--bg),transparent 30%,transparent 55%,var(--bg))}
.disclose{position:relative;z-index:1;margin:10px 16px 0;padding:8px 12px;border-radius:12px;background:#17151FE6;color:var(--t3);font-size:11.5px;text-align:center}
.msgs{position:relative;z-index:1;flex:1;overflow-y:auto;padding:12px 16px;display:flex;flex-direction:column;gap:10px;scrollbar-width:none}
.msgs .sp{flex:1}
.bub{padding:11px 14px;border-radius:18px;max-width:82%;font-size:15px;line-height:1.4;animation:fi .3s ease}
.bub.c{align-self:flex-start;background:var(--surface-2);border-bottom-left-radius:6px}
.bub.u{align-self:flex-end;background:var(--pink);color:#fff;border-bottom-right-radius:6px}
.bub.sys{align-self:center;background:none;color:var(--t3);font-size:12px;padding:2px}
.typing{display:inline-flex;gap:4px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--t3);animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{50%{opacity:.3}}
.ideas{position:relative;z-index:1;display:flex;flex-direction:column;gap:8px;padding:0 16px 10px}
.ideas button{min-height:44px;padding:11px 14px;border-radius:14px;background:#17151FE6;border:1px solid var(--border);text-align:left;font-size:14px;color:var(--t2)}
.cfoot{flex:none;border-top:1px solid var(--border);padding:10px 14px max(14px,calc(env(safe-area-inset-bottom,0px) + 8px));display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.counter{font-size:12px;color:var(--t3);font-variant-numeric:tabular-nums}
.counter.out{color:var(--negative)}
.composer{display:flex;gap:8px}
.composer .box{flex:1;border-radius:999px;height:48px}
.send{width:48px;height:48px;border-radius:50%;border:none;background:var(--pink);color:#fff;display:grid;place-items:center;flex:none}
.send[disabled]{background:var(--surface-2);color:var(--t3)}
.limit{padding:18px 16px;border-radius:18px;border:1.5px solid var(--pink);background:#17151FF2;display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center;animation:fi .4s ease}
.limit h3{margin:0;font:800 20px/1.2 var(--head)}
.limit p{margin:0;color:var(--t2);font-size:14px}
.limit .crown *{stroke:url(#cgrad)}
.toast{position:absolute;left:50%;top:calc(var(--top) + 6px);transform:translateX(-50%);z-index:20;background:var(--t1);color:#0A0911;font-size:13px;font-weight:500;padding:9px 14px;border-radius:999px;white-space:nowrap;animation:fade 2.8s ease forwards}
@keyframes fade{0%{opacity:0}10%,80%{opacity:1}100%{opacity:0}}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.gicon *{stroke:url(#cgrad)}
.logo{display:flex;align-items:center;justify-content:center;gap:8px;font:800 17px var(--head)}
svg .lg{fill:url(#cgrad-logo)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}

/* last-chance offer (shown once, after a paywall decline) */
.ofr .pwtop .logo{font-size:16px}
.oeye{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--pink-dim);color:var(--pink-hi);font:600 12px/1 var(--sans);letter-spacing:.02em}
.ocard{position:relative;margin-top:6px;padding:22px 16px 16px;border-radius:24px;border:1.5px solid var(--pink);background:radial-gradient(ellipse at 50% 0%,var(--pink-dim),transparent 65%),var(--surface);box-shadow:0 0 0 4px var(--pink-dim),0 30px 60px -30px #000;display:flex;flex-direction:column;gap:14px;flex:none}
.obadge{position:absolute;top:-12px;left:50%;transform:translateX(-50%);padding:6px 12px;border-radius:999px;background:var(--grad,var(--pink));color:#fff;font:700 11px/1 var(--sans);letter-spacing:.06em;white-space:nowrap}
.obadge .otk{color:#fff;border-color:#ffffffaa;background:transparent}
.orow{display:flex;gap:12px;align-items:center}
.orow b{font:700 17px/1.2 var(--head)}
.osub{font-size:12.5px;color:var(--t3);margin-top:3px}
.oth{width:58px;height:58px;border-radius:50%;overflow:hidden;flex:none;position:relative;display:block;box-shadow:0 0 0 2px var(--pink),0 0 24px var(--pink-dim)}
.oth>img,.oth .pimg{width:100%;height:100%;object-fit:cover;display:block}
.oth>.av,.oth>.cav{width:100%!important;height:100%!important}
.ocov{flex:none;display:block}
.oprice{display:flex;align-items:baseline;justify-content:center;gap:10px;padding:14px;border-radius:16px;background:var(--bg-elev);border:1px solid var(--border)}
.oprice s{color:var(--t3);font-size:14px}
.oprice s .otk{text-decoration:line-through;opacity:.75}
.oprice b{font:800 28px/1 var(--head);color:var(--t1)}
.oprice span{color:var(--t2);font-size:13px}
.ochecks{display:flex;flex-direction:column;gap:9px}
.ochecks div{display:flex;gap:10px;align-items:center;font-size:14.5px;font-weight:500}
.ochecks svg{color:var(--pink-hi);flex:none}
.ochecks svg *{stroke:url(#cgrad)}
.ofine{font-size:12px;color:var(--t3);text-align:center;line-height:1.45;margin:0}
.odis{font-size:11.5px;color:var(--t3);text-align:center;margin:0;line-height:1.4}
.otimer{display:inline-flex;gap:8px;margin-top:12px;padding:8px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--border);font-size:13px;color:var(--t2)}
.otimer b{color:var(--pink-hi);font-variant-numeric:tabular-nums}
.otk{font-family:ui-monospace,Consolas,monospace;font-size:.82em;font-weight:600;padding:1px 5px;border-radius:6px;border:1px dashed var(--amber);color:var(--amber);background:#F5B83D14;white-space:nowrap}
.ofr .obar{position:sticky;top:0;z-index:3;display:flex;justify-content:space-between;align-items:center;padding:calc(var(--top,8px) + 4px) 16px 10px;background:linear-gradient(180deg,var(--bg) 75%,transparent)}
.ofr .obx{width:36px;height:36px;border-radius:50%;background:var(--surface-2);border:1px solid var(--border);color:var(--t2);display:grid;place-items:center}
.ofr .olead{color:var(--t2);margin:0;font-size:14.5px;line-height:1.45}

/* chai-roleplay additions */
.fan{position:relative;height:250px;margin:6px 0 0}
.fan .fc{position:absolute;left:50%;top:10px;width:116px;height:176px;margin-left:-58px;border-radius:16px;overflow:hidden;border:2px solid var(--border);box-shadow:0 18px 40px -16px #000;transform-origin:50% 120%;display:grid;place-items:center;font-size:40px}
.fan .fc img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.fan .fc span{position:relative}
.gc{position:absolute;inset:0;display:grid;place-items:center;font-size:46px;background:var(--gbg)}
.card.gen{aspect-ratio:3/3.8}
.card.dash{border-style:dashed;background:transparent}
.card.dash .ph{background:transparent}
.card.wide{aspect-ratio:auto;height:112px;grid-column:1/-1}
.card.wide .lb{justify-content:space-between;padding:10px 14px;text-align:left;min-height:48px}
.cardsc{display:grid;grid-template-columns:1fr;gap:10px}
.comp{display:flex;gap:14px;align-items:center;padding:12px;border-radius:18px;border:2px solid var(--border);background:var(--surface);width:100%;text-align:left}
.comp.on{border-color:var(--pink);box-shadow:0 0 22px -6px #B62CB5aa}
.comp .pt{width:68px;height:68px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:30px;background:var(--gbg);border:2px solid var(--gacc)}
.comp b{font:800 17px var(--head);display:block}
.comp small{display:block;color:var(--t2);font-size:12.5px}
.comp i{display:block;color:var(--t1);font-size:13.5px;font-style:italic;margin-top:4px;font-family:Georgia,serif}
.sel{width:100%;height:54px;border-radius:14px;background:var(--surface);border:1px solid var(--border);color:var(--t1);font:600 17px var(--sans);padding:0 14px;appearance:none;-webkit-appearance:none}
.cover{position:relative;border-radius:22px;overflow:hidden;border:1px solid var(--border);aspect-ratio:3/3.9;background:var(--gbg);box-shadow:0 30px 60px -30px #000}
.cover .gc{position:absolute;inset:0;font-size:90px;opacity:.55}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cover::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 35%,#0A0911f2)}
.cover .ct{position:absolute;left:16px;right:16px;bottom:14px;z-index:1}
.cover .ct h2{font:700 30px/1.05 Georgia,serif;margin:0 0 8px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips span{font-size:11.5px;padding:5px 9px;border-radius:999px;background:#17151Fcc;border:1px solid var(--border)}
.cover .pill{position:absolute;top:12px;left:12px;z-index:1;font:600 11px var(--sans);padding:5px 10px;border-radius:999px;background:#0A0911cc;border:1px solid var(--border)}
.cover .cav{position:absolute;top:12px;right:12px;z-index:1;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-size:26px;background:var(--gbg);border:2px solid var(--gacc)}
.ribbon{position:relative;z-index:1;margin:8px 16px 0;font-size:11.5px;color:var(--t3);display:flex;align-items:center;gap:8px}
.ribbon .rb{flex:1;height:4px;border-radius:2px;background:var(--surface-2);overflow:hidden}
.ribbon .rb span{display:block;height:100%;background:var(--grad)}
.cbg{background:var(--scene) center/cover no-repeat,var(--gbg)}
.cbg.tn-playful{filter:saturate(1.3) brightness(1.15)}.cbg.tn-dark{filter:brightness(.7) contrast(1.1)}.cbg.tn-epic{filter:sepia(.25) saturate(1.2)}
.frozen{font:700 26px/1.3 Georgia,serif;text-align:center;text-wrap:balance;padding:6px 4px}
.scard{position:relative;height:120px;perspective:600px;margin:4px auto 0;width:200px}
.scard>div{position:absolute;inset:0;border-radius:16px;display:grid;place-items:center;backface-visibility:hidden;transition:transform 1.1s}
.scard .bk{background:var(--surface-2);border:1px dashed var(--border);color:var(--t3)}
.scard .fr{background:var(--gbg);border:2px solid var(--gacc);box-shadow:0 0 26px -6px var(--gacc);transform:rotateY(180deg);font-size:44px}
.scard.flip .bk{transform:rotateY(-180deg)}.scard.flip .fr{transform:rotateY(0)}
.err{color:var(--negative);font-size:13px;margin:-4px 2px 0}
.stick{position:sticky;bottom:0;z-index:6;padding:10px 16px max(14px,calc(env(safe-area-inset-bottom,0px) + 8px));background:linear-gradient(180deg,transparent,var(--bg) 26%);display:flex;flex-direction:column;gap:6px}
.stick .fine{margin:0}
.faq details{border:1px solid var(--border);border-radius:14px;background:var(--surface);padding:0 14px;margin-bottom:8px}
.faq summary{min-height:48px;display:flex;align-items:center;font:700 15px var(--head);cursor:pointer}
.faq p{margin:0 0 12px;color:var(--t2);font-size:13.5px}
.how{display:flex;flex-direction:column;gap:10px}
.how div{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--border)}
.how b{display:block;font:700 15px var(--head)}.how small{color:var(--t2);font-size:12.5px}
.how .nn{width:30px;height:30px;border-radius:50%;background:var(--grad);display:grid;place-items:center;font:800 14px var(--head);flex:none}
.brandbar{display:flex;justify-content:center;padding:calc(var(--top) + 10px) 0 6px}
.pwhero.cv{height:auto;padding:0 16px}
.blocked{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:30px;text-align:center}
</style>

  const d=Object.assign({},detail||{},{data});

  const flat=Object.assign({funnel:CONFIG.slug},data,detail||{});
  try{if(typeof window.fbq==='function')window.fbq('trackCustom',name,flat)}catch(e){}
  try{if(window.ttq&&typeof window.ttq.track==='function')window.ttq.track(name,flat)}catch(e){}
  if(DEBUG)try{console.log('[ikfunnel] '+name,d)}catch(e){}
}

function say(text,idx){
  if(S.typing||(!S.premium&&S.msgs<=0))return;
  const n=turnN(),g=G();
  text=stripEmoji(fill(text).replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"'));
  S.sent++;emit('chat_message',{count:S.sent});
  S.chat.push({w:'u',x:text.replace(/\{\{/g,'')});if(!S.premium)S.msgs--;
  const scripted=n!==null&&S.turn===n;
  if(scripted){S.picks[n]={idx,text};S.turn++;answer('action_'+(n+1),idx)}
  S.typing=true;render();
  later(()=>{S.typing=false;
    S.chat.push({w:'c',x:scripted?g['r'+(n+1)][idx]:MORE[S.sent%MORE.length]});render();
    if(scripted)later(()=>go(n===2?15:S.i+1),1500)},1200);
}

  <div class="opts">${Object.entries(ROLES).map(([k,[e,l]])=>`<button class="opt ${S.role===k?'on':''}" data-a="pick" data-f="role" data-v="${k}" aria-pressed="${S.role===k}"><span class="em">${e}</span><span class="lbl">${l}</span></button>`).join('')}${otherRow(S.role==='other')}</div>

  <div class="cards">${G().set.map(([e,l],j)=>`<button class="card wide ${S.set===String(j)?'on':''}" data-a="pick" data-f="set" data-v="${j}" aria-pressed="${S.set===String(j)}"><span class="gc" style="background:var(--gbg)">${e}</span>${im('img/genre-'+gk()+'.jpg').replace('<img ','<img style="object-position:'+[8,50,92][j]+'% 50%" ')}<span class="lb" style="font-family:Georgia,serif;font-size:17px"><span>${esc(l)}</span><span>${e}</span></span></button>`).join('')}</div></div>`,

  <div style="display:flex;gap:8px"><div class="box" style="flex:1"><input id="name" data-f="name" maxlength="20" placeholder="Your character name" value="${esc(S.name)}" aria-label="Character name"></div><button class="btn ghost" style="width:54px;height:50px" data-a="shuffle" aria-label="Shuffle name">${gic('dice',20)}</button></div>

  <p class="legal">${lnk('Terms',CONFIG.legal.termsUrl)} · ${lnk('Privacy',CONFIG.legal.privacyUrl)}</p></div>
  <div class="foot">${cta('Write my story')}</div>`,
10:()=>`<div class="scr" style="padding-top:18px;gap:16px;${accStyle()}"><h1 class="q" style="font-size:24px">${t('Writing <span class="gt">'+esc(nm())+'</span>’s scene…','Your story is taking shape…')}</h1>
  <div class="ldimg" id="ldimg"><span class="ph" style="background:var(--gbg)"></span>${gimg(gk())}</div>
  <div class="steps">${['Reading your genre and role…',"Casting your companion's voice…",'Building the opening scene…','Almost ready, curtain rising…'].map((l,j)=>`<div class="step" id="st${j}"><div class="top"><span>${l}</span><b>0%</b></div><div class="bar"><span></span></div></div>`).join('')}</div><div style="height:8px"></div></div>`,
11:()=>`<div class="scr">${q(t(esc(G().title),'Meet '+esc(compI()[0])+'.'),t('You are '+esc(roleL())+'. '+esc(compI()[0])+' plays opposite you.','Built from your genre, role and tone.'))}
  ${coverHTML()}<p class="legal">Illustration. ${esc(compI()[0])} is an AI character.</p></div>
  <div class="foot">${cta('Begin the scene')}</div>`,
12:()=>chatView(),13:()=>chatView(),14:()=>chatView(),
15:()=>`<div class="scr" style="${accStyle()};padding-top:24px">${q(t('The scene stops here.',esc(compI()[0])+' left something unsaid.'),t('Your next scene is written from your choices.','Pick up exactly where you left off.'))}
  <p class="frozen">${fill(G().cliff)}</p>
  <div class="scard ${S.flip?'flip':''}" id="scard"><div class="bk">…</div><div class="fr">${G().e}</div></div>
  <p class="hint">Scene card 1 saved to your story · Scene 1 of 12</p></div>
  <div class="foot">${cta('Save my story')}</div>`,
16:()=>`<div class="scr" style="padding-top:22px;${accStyle()}"><div class="logo">${logo()} ChatChi</div>${q(t('Save '+esc(G().title)+'.','Keep your place in the story.'),t('Add your email so the scene finds you.','Guest stories live only on this device.'))}
  <div class="box"><input id="email" data-f="email" type="email" inputmode="email" autocomplete="email" placeholder="Email" value="${esc(S.email)}" aria-label="Email"></div>
  ${S.emailErr==='email'?'<div class="err">That email doesn’t look right. Check it?</div>':''}
  <button class="btn ghost" data-a="social" data-v="apple">Continue with Apple</button><button class="btn ghost" data-a="social" data-v="google">Continue with Google</button>
  <p class="legal">By continuing you agree to the Terms and Privacy Policy. We only email about your story.<br>${lnk('Terms',CONFIG.legal.termsUrl)} | ${lnk('Privacy',CONFIG.legal.privacyUrl)}</p></div>
  <div class="foot">${cta('Continue',true,'email')}<button class="link" data-a="guest">Continue as guest</button></div>`,
17:()=>pwHTML('onb'),

/* loader: 4 rows, row 2 pauses at 50% for one inline question */
function runLoader(){
  const stops=[null,50,null,null];
  LD={row:0,pct:0,asked:false,t:0};
  const img=document.getElementById('ldimg');
  const tick=()=>{
    const el=document.getElementById('st'+LD.row);if(!el){clearInterval(LD.t);return}
    if(!LD.asked&&stops[LD.row]!==null&&LD.pct>=stops[LD.row]){clearInterval(LD.t);ask();return}
    LD.pct=Math.min(100,LD.pct+3);
    el.querySelector('.bar span').style.width=LD.pct+'%';el.querySelector('b').textContent=LD.pct+'%';
    if(img)img.style.setProperty('--bl',(18-(LD.row*100+LD.pct)/400*16).toFixed(1)+'px');
    if(LD.pct>=100){el.classList.add('done');LD.row++;LD.pct=0;if(LD.row>3){clearInterval(LD.t);later(()=>go(11),900)}}
  };
  LD.go=()=>{clearInterval(LD.t);LD.t=setInterval(tick,RM?5:45)};
  LD.go();
}
function ask(){
  cur().insertAdjacentHTML('beforeend',`<div class="iq" id="iq" role="dialog" aria-label="Quick question"><b>Should ${esc(compI()[0])} remember your choices?</b><div class="row"><button class="btn" data-a="iq" data-v="yes">Yes, remember</button><button class="btn ghost" style="height:54px" data-a="iq" data-v="no">Fresh each time</button></div></div>`);
}
const cur=()=>phone.querySelector('.view');

/* ---------- last-chance offer (fallback), shown ONCE per session ---------- */
const OFFER_ID=18,OFFER_FREE=19;
const OKEY='ikf_offer_'+CONFIG.slug;
const otok=s=>esc(s).replace(/\{\{[^}]+\}\}/g,m=>`<span class="otk">${m}</span>`);
const offerOpen=()=>{const o=CONFIG.offer;if(!o||!o.enabled||S.offerSeen)return false;try{if(sessionStorage.getItem(OKEY))return false}catch(e){}return true};
function openOffer(ret,placement){const o=CONFIG.offer;S.offerSeen=true;S.offerRet=ret;S.offerEnd=o.expiresMin?Date.now()+o.expiresMin*60000:0;try{sessionStorage.setItem(OKEY,'1')}catch(e){}
  go(OFFER_ID);emit('offer_view',{placement,price:o.price,compareAt:o.compareAt})}
function offerOr(ret,placement){if(offerOpen())openOffer(ret,placement);else go(ret)}
function offerLeave(){go(S.offerRet||OFFER_FREE)}
function offerTimer(){const o=CONFIG.offer;clearInterval(window.__oiv);if(!o.expiresMin||S.i!==OFFER_ID)return;if(!S.offerEnd)S.offerEnd=Date.now()+o.expiresMin*60000;
  const tick=()=>{const el=document.getElementById('otimer');if(S.i!==OFFER_ID||!el){clearInterval(window.__oiv);return}const ms=S.offerEnd-Date.now();
    if(ms<=0){clearInterval(window.__oiv);emit('offer_expired');offerLeave();return}
    el.textContent=String(Math.floor(ms/60000)).padStart(2,'0')+':'+String(Math.floor(ms/1000)%60).padStart(2,'0')};
  tick();window.__oiv=setInterval(tick,1000)}
V[OFFER_ID]=()=>{setTimeout(offerTimer,0);const o=CONFIG.offer,c=compI();
  const yes=['Finish this scene to its end','Chapter 2 of this story','Your story saved to your email'],no=['Unlimited chat','Other genres and stories','Companion memory beyond this story','Voice notes'];
  return `<div class="pw ofr" role="dialog" aria-label="One-time offer" style="${accStyle()}">
  <div class="obar"><div class="logo">${logo(22)} ChatChi</div><button class="obx" data-a="offerno" aria-label="No thanks">${ic('x',16)}</button></div>
  <div class="sec" style="padding-top:6px;text-align:center"><span class="oeye">One-time pass · shown once</span>
   <h1 class="h2" style="margin:14px 0 8px">${t('Finish this story, <span class="gt">once</span>','A smaller pass, <span class="gt">paid once</span>')}</h1>
   <p class="olead">${t(esc(c[0])+' is mid-sentence. Finish this scene and chapter 2.','No subscription. No renewal. Paid once.')}</p>
   ${o.expiresMin?`<div class="otimer">Offer ends in <b id="otimer">--:--</b></div>`:''}</div>
  <div class="sec"><div class="ocard">${o.badge?`<span class="obadge">${otok(o.badge)}</span>`:''}
   <div class="orow"><span class="oth" style="display:grid;place-items:center;font-size:26px;background:var(--gbg)">${c[1]}</span><div style="flex:1;min-width:0"><b>${esc(o.name)} · ${esc(G().title)}</b><div class="osub">With ${esc(c[0])}</div></div></div>
   <div class="oprice"><b>${otok(o.price)}</b><span>paid once</span></div>
   <div class="ochecks">${yes.map(x=>`<div>${ic('check',17,'currentColor',2.4)}<span>${x}</span></div>`).join('')}</div>
   <div style="font-size:12.5px;color:var(--t3);line-height:1.6"><b style="color:var(--t2)">Not included:</b> ${no.join(' · ')}</div>
   ${cta('Get the story pass',true,'offerbuy')}
   <p class="ofine">${otok(o.price)} once. No renewal, nothing to cancel. Unlimited chat needs ChatChi Plus.</p></div></div>
  <div class="sec" style="padding-bottom:max(28px,env(safe-area-inset-bottom,0px));text-align:center"><button class="link" style="width:100%" data-a="offerno">No thanks, continue free · ${FREE} messages a day</button>
   <div class="legal">${lnk('Terms of Use',CONFIG.legal.termsUrl)} · ${lnk('Privacy Policy',CONFIG.legal.privacyUrl)}</div>
   <p class="odis" style="margin-top:10px">${esc(c[0])} is an AI character. Fictional, and depicted as an adult.</p></div></div>`};

function render(anim){
  const v=document.createElement('div');v.className='view'+(anim&&!RM?' in':'');
  v.innerHTML=S.blocked?`<div class="blocked"><h1 class="h1">Sorry, ChatChi is for adults</h1><p class="sub">You must be 18 or older to continue.</p></div>`:nav()+V[S.i]();
  const old=cur();if(old)old.replaceWith(v);else phone.appendChild(v);
  if(S.blocked)return;
  if(S.i===10)runLoader();
  if(S.i===15&&!S.flip)later(()=>{S.flip=true;document.getElementById('scard')?.classList.add('flip')},700);
  if(S.i===12&&!S.chat.length&&!S.typing){S.typing=true;render();later(()=>{S.typing=false;S.chat=[{w:'c',x:G().open}];render()},1300);return}
  const m=document.getElementById('msgs');if(m)m.scrollTop=m.scrollHeight;
}

phone.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b||b.disabled)return;
  const a=b.dataset.a,v=b.dataset.v,f=b.dataset.f;
  switch(a){
    case 'next':
      if(S.i===8){answer('name_set',!!S.name.trim());S.name=S.name.trim()}
      next();break;
    case 'back':back();break;
    case 'age':{const now=new Date(),age=THIS_YEAR-(+S.year)-((now.getMonth()+1)<(+S.month)?1:0);if(age<18){S.blocked=true;try{sessionStorage.setItem('ikf_age_block','1')}catch(e){}emit('age_block');render();break}emit('age_confirm',{method:'year'});next();break}
    case 'pick':{
      S[f]=v;
      if(f==='genre'&&v==='other'){render();cur().querySelector('input[data-f="gOther"]')?.focus();break}
      if(f==='role'&&v==='other'){render();cur().querySelector('input[data-f="roleOther"]')?.focus();break}
      answer({genre:'genre',role:'role',set:'setting',comp:'companion',tone:'tone'}[f],v);
      if(f==='genre'){S.set='';S.comp=''}
      cur().querySelectorAll(`[data-f="${f}"]`).forEach(x=>x.classList.toggle('on',x.dataset.v===v));
      later(next,RM?0:300);break}
    case 'shuffle':{S.name=NAMES[Math.floor(Math.random()*NAMES.length)];const i=document.getElementById('name');if(i)i.value=S.name;const bt=cur().querySelector('.foot .btn');if(bt)bt.disabled=false;break}
    case 'nameskip':S.name=NAMES[Math.floor(Math.random()*NAMES.length)];answer('name_set',false);next();break;
    case 'iq':S.mem=v==='yes';answer('memory',v);document.getElementById('iq')?.remove();if(LD)LD.asked=true,LD.go();break;
    case 'email':{const ok=/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(S.email.trim());if(!ok){S.emailErr='email';const i=document.getElementById('email'),keep=S.email;render();const n=document.getElementById('email');if(n){n.focus()}break}S.emailErr='';emit('email_captured');next();break}
    case 'social':emit('social_signin',{provider:v});toast('Demo only. No sign-in made');next();break;
    case 'guest':emit('guest_continue');next();break;
    case 'plan':S.plan=v;emit('plan_select',{plan:v,price:CONFIG.plans[v].price});
      document.querySelectorAll('.plan').forEach(p=>{const on=p.dataset.v===v;p.classList.toggle('on',on);p.setAttribute('aria-pressed',on);p.querySelector('.rd').innerHTML=on?ic('check',12,'#fff',3.2):''});
      {const st=document.getElementById('stick');if(st)st.outerHTML=stickHTML()}break;
    case 'buy':checkout(S.plan);toast('Demo only. No charge made');break;
    case 'offerbuy':{const o=CONFIG.offer,u=o.checkoutUrl||'';emit('offer_accept',{price:o.price,url:u});emit('checkout_click',{plan:'offer',price:o.price,url:u});
      if(u)try{const x=new URL(u,location.href);x.searchParams.set('plan','offer');PASS.forEach(k=>{const q=QS.get(k);if(q&&!x.searchParams.has(k))x.searchParams.set(k,q)});navTop(x.toString())}catch(e){}
      else toast('Demo only. No charge made');break}
    case 'offerno':emit('offer_decline');offerLeave();break;
    case 'closepw':case 'freeplan':emit('paywall_close',{placement:'onboarding',via:a==='freeplan'?'continue_free':'close'});offerOr(19,'onboarding');break;
    case 'say':say(b.textContent,+b.dataset.j||0);break;
    case 'send':{const m=document.getElementById('msg');if(m&&m.value.trim())say(m.value.trim(),1);else m?.focus();break}
    case 'upgrade':S.sheet='pw';render();emit('paywall_view',{placement:'limit'});break;
    case 'closeq':S.sheet=null;emit('paywall_close',{placement:'limit',via:'close'});if(offerOpen())openOffer(19,'limit');else render();break;
    case 'midnight':emit('come_back_midnight');toast(`Your ${FREE} messages come back at midnight`);break;
    case 'openapp':openApp();break;
  }
});
phone.addEventListener('input',e=>{
  const f=e.target.dataset.f;
  if(e.target.id==='msg'){const s=document.getElementById('sendb');if(s)s.disabled=!e.target.value.trim();return}
  if(!f)return;
  if(f==='year'||f==='month'){S[f]=e.target.value;const bt=cur().querySelector('.foot .btn');if(bt)bt.disabled=!(S.year&&S.month);return}
  S[f]=e.target.value;
  if(['gOther','roleOther','name'].includes(f)){const bt=cur().querySelector('.foot .btn');if(bt)bt.disabled=!S[f].trim()}
});
phone.addEventListener('change',e=>{const f=e.target.dataset.f;if(f==='year'||f==='month'){S[f]=e.target.value;const bt=cur().querySelector('.foot .btn');if(bt)bt.disabled=!(S.year&&S.month)}});
phone.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='msg')cur().querySelector('[data-a="send"]')?.click()});

/* Host API: the page embedding this funnel can complete a purchase or read the picks. */
window.go=go;
window.IkFunnel=Object.assign(window.IkFunnel||{},{config:CONFIG,data:snapshot,
  completePurchase:(plan)=>{if(plan&&CONFIG.plans[plan])S.plan=plan;S.premium=true;S.sheet=null;emit('purchase_complete',{plan:S.plan});go(19);later(()=>toast('Unlimited chat is on. Enjoy.'),1600)}});
{let ref='';try{ref=document.referrer?new URL(document.referrer).hostname:''}catch(e){}emit('funnel_start',{referrer:ref})}
render();viewed();
</script>
